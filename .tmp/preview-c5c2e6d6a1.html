:root{
  --gold:#ffc247;
  --gold-1:#ffe9a8; --gold-2:#ffc247; --gold-3:#f59310;
  --ink:#12121c; --ink-2:#1c1c2b;
  --panel:rgba(22,22,34,.82); --panel-solid:#191926;
  --stroke:rgba(255,255,255,.10); --stroke-hi:rgba(255,255,255,.22);
  --txt:#f4f1ea; --txt-dim:#a8a29a;
  --good:#7ee081; --warn:#ffb347; --bad:#ff6b6b; --info:#6fc3ff;
  --token:#ffd66b;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-panel:0 10px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  --sh-pop:0 18px 50px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
#ui{font-family:var(--font);color:var(--txt);}
#ui *{pointer-events:none}
#ui .on{pointer-events:auto}

/* ---- layout helpers that flip correctly under RTL ---- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.fill{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}

/* Logical properties everywhere so a single rule serves both directions. */
.hud-tl{position:absolute;inset-block-start:18px;inset-inline-start:18px}
.hud-tr{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.hud-bl{position:absolute;inset-block-end:18px;inset-inline-start:18px}
.hud-br{position:absolute;inset-block-end:18px;inset-inline-end:18px}
.hud-tc{position:absolute;inset-block-start:14px;left:50%;transform:translateX(-50%)}

/* ---- surfaces ---- */
.panel{
  background:linear-gradient(180deg,rgba(40,40,58,.9),rgba(18,18,28,.92));
  border:1px solid var(--stroke); border-radius:var(--r-m);
  box-shadow:var(--sh-panel); backdrop-filter:blur(8px);
}
.panel-lift{background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(24,24,36,.96));
  border:1px solid var(--stroke-hi); border-radius:var(--r-l); box-shadow:var(--sh-pop)}

/* ---- type ---- */
.display{
  font-weight:900; letter-spacing:-.02em; line-height:.92;
  background:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.5));
  paint-order:stroke fill;
}
.display-white{background:linear-gradient(180deg,#fff 20%,#e8e2d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.rtl .label{letter-spacing:.04em}     /* Hebrew has no case; wide tracking hurts it */
.num{font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate}

/* ---- buttons ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:17px;color:#2a1c00;
  padding:14px 34px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 0 #a4620a, 0 12px 26px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4620a,0 6px 14px rgba(0,0,0,.45)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--stroke-hi);box-shadow:none;font-weight:700}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:3px solid var(--info);outline-offset:3px}

/* ---- misc ---- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1));transition:width .45s var(--ease)}
.rtl .bar>i{background:linear-gradient(270deg,var(--gold-2),var(--gold-1))}

.fade-in{animation:fadeIn .35s var(--ease) both}
.pop-in{animation:popIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .fade-in,.pop-in{animation:none}
  *{transition-duration:.01ms !important}

estions you are allowed per day"],why:"A model can only hold so much text at once. In a very long chat the older parts get pushed out \u2014 so it pays to restate what matters."}},{id:"prompt-what-is",tier:1,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05D4\u05E9\u05DD \u05E9\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \u05E9\u05D0\u05D9\u05EA\u05D5 \u05E2\u05D5\u05D1\u05D3\u05D9\u05DD","\u05D4\u05DB\u05E4\u05EA\u05D5\u05E8 \u05E9\u05E9\u05D5\u05DC\u05D7 \u05D0\u05EA \u05D4\u05D4\u05D5\u05D3\u05E2\u05D4","\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05D0\u05D5 \u05D4\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05BEAI"],why:"\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05D5\u05D0 \u05DB\u05DC \u05DE\u05D4 \u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05BEAI \u05DB\u05D3\u05D9 \u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD. \u05D6\u05D5 \u05E0\u05E7\u05D5\u05D3\u05EA \u05D4\u05D4\u05E9\u05E4\u05E2\u05D4 \u05D4\u05D2\u05D3\u05D5\u05DC\u05D4 \u05D1\u05D9\u05D5\u05EA\u05E8 \u2014 \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4 \u05DE\u05EA\u05D7\u05D9\u05DC\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8."},en:{q:"What is a prompt?",a:["The name of the model being used","The button that sends the message","The instruction or request written to the AI"],why:"A prompt is everything written to the AI to explain what is wanted. It is the biggest point of influence \u2014 the result starts with the prompt."}},{id:"prompt-better-one",tier:1,topic:"prompt",correct:1,he:{q:"\u05D0\u05D9\u05D6\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D9\u05D9\u05EA\u05DF \u05E1\u05D9\u05E4\u05D5\u05E8 \u05E7\u05E8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8 \u05DC\u05DE\u05D4 \u05E9\u05D3\u05DE\u05D9\u05D9\u05E0\u05D5?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D9\u05E4\u05D5\u05E8, \u05EA\u05D5\u05D3\u05D4 \u05E8\u05D1\u05D4!","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D9\u05E4\u05D5\u05E8 \ el between the example and the prompt","Shows exactly what format the answer should take","Makes the prompt longer without changing the result"],why:'It is hard to describe "a table like this" in words. One small example saves a paragraph of explanation, and the model copies the format.'}},{id:"prompt-short-answer",tier:2,topic:"prompt",correct:0,he:{q:"\u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D6\u05D5\u05E8 \u05DC\u05E7\u05D1\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4?",a:['\u05DC\u05D1\u05E7\u05E9 \u05DE\u05E8\u05D0\u05E9: "\u05D1\u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA \u05DC\u05DB\u05DC \u05D4\u05D9\u05D5\u05EA\u05E8"','\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05E7\u05E6\u05E8 \u05D1\u05D1\u05E7\u05E9\u05D4" \u05D1\u05DC\u05D9 \u05DE\u05E1\u05E4\u05E8',"\u05DC\u05E9\u05D0\u05D5\u05DC \u05E9\u05D0\u05DC\u05D4 \u05E7\u05E6\u05E8\u05D4 \u05D5\u05DC\u05E7\u05D5\u05D5\u05EA \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4"],why:'"\u05E7\u05E6\u05E8" \u05D6\u05D4 \u05D9\u05D7\u05E1\u05D9, \u05D5\u05DE\u05E1\u05E4\u05E8 \u05D6\u05D4 \u05DC\u05D0. \u05D2\u05D1\u05D5\u05DC \u05D1\u05E8\u05D5\u05E8 \u2014 \u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA, \u05D7\u05DE\u05D9\u05E9\u05D4 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD \u2014 \u05D4\u05D5\u05E4\u05DA \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05E2\u05D5\u05E8\u05E4\u05DC \u05DC\u05D4\u05D5\u05E8\u05D0\u05D4 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E2\u05DE\u05D5\u05D3 \u05D1\u05D4.'},en:{q:"What helps most to get a short answer?",a:['Asking up front: "three lines at most"','Writing "keep it short" with no number',"Asking a short question and hoping for a short answer"],why:'"Short" is relative; a number is not. A clear limit \u2014 three lines, five sentences \u2014 turns a vague wish into an instruction that can be followed.'}},{id:"prompt-role",tier:3,topic:"prompt",correct:2,he:{q:'\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D4 \u05EA\u05E4\u05E7\u05D9\u05D3 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8, \u05DB\u05DE\u05D5 "\u05D1\u05EA\u05D5\u05E8 \u05DE\u05D3\u05E8\u05D9\u05DA \u05D8\u05D9\u05D5\u05DC\u05D9\u05DD"?',a:["\u05D4\u05D5\u05E4\u05DA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05DE\u05D5\u05DE\u05D7\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9 \u05D1\u05EA\u05D7\u05D5\u05DD","\u05D2\u05D5\u05E8\u05DD \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D9\u05D5\u05EA\u05E8","\u05DE\u05DB\u05D5\u05D5\u05DF \u05D0\u05EA \u05E0\u05E7\u05D5\u05D3\u05EA \u05D4\u05DE\u05D1\u05D8 \u05D5\u05D0\u05EA \u05E1\u05D5\u05D2 \u05D4\u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05D9\u05E2\u05DC\u05D5 \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05EA\u05E4\u05E7\u05D9\u05D3 \u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E3 \u05DC\u05DE\u05D5\u05D3\u05DC \u05D9\u05D3\u05E2 \u05D7\u05D3\u05E9, \u05D0\u05D1\u05DC \u05D4\u05D5\u05D0 \u05D1\u05D5\u05D7\u05E8 \u05DE\u05D0\u05D9\u05D6\u05D5 \u05D6\u05D5\u05D5\u05D9\u05EA \u05DC\u05E2\u05E0\u05D5\u05EA. \u05DE\u05D3\u05E8\u05D9\u05DA \u05D8\u05D9\u05D5\u05DC\u05D9\u05DD \u05D9\u05D3\u05D1\u05E8 \u05E2\u05DC \u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05D5\u05E0\u05D5\u05E3, \u05D1\u05D9\u05D5\u05DC\u05D5\u05D2 \u05D9\u05D3\u05D1\u05E8 \u05E2\u05DC \u05D1\u05E2\u05DC\u05D9 \u05D7\u05D9\u05D9\u05DD."},en:{q:'What does a role like "as a hiking guide" do in a prompt?',a:["Turns the model into a real expert on the subject","Makes the answer longer","Steers the point of view and what the answer brings up"],why:"A role adds no new knowledge, but it picks the angle. A hiking guide talks trails and views; a biologist talks animals."}},{id:"prompt-break-steps",tier:3,topic:"prompt",correct:1,he:{q:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D2\u05D3\u05D5\u05DC \u05D5\u05DE\u05D5\u05E8\u05DB\u05D1, \u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC \u05D1\u05DE 3\u05DC\u05D9 \u05D4\u05BEAI"],why:"\u05D8\u05E7\u05E1\u05D8 \u05DE\u05E4\u05D5\u05E8\u05E7 \u05DC\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA: \u05DE\u05D9\u05DC\u05D4, \u05D7\u05E6\u05D9 \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05E1\u05D9\u05DE\u05DF \u05E4\u05D9\u05E1\u05D5\u05E7. \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05D5\u05DB\u05D5\u05EA\u05D1 \u05D1\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05D4\u05D0\u05DC\u05D4, \u05D5\u05DC\u05DB\u05DF \u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05D0\u05D5\u05EA\u05DF."},en:{q:"What are tokens?",a:["Coins that only exist inside games","Small chunks of text that the model counts","The model names of AI systems"],why:"Text is broken into small chunks: a word, half a word, or a punctuation mark. The model reads and writes in those chunks, so those are what get counted."}},{id:"tokens-long-costs",tier:1,topic:"tokens",correct:2,he:{q:'\u05DC\u05DE\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3 "\u05E2\u05D5\u05DC\u05D4" \u05D9\u05D5\u05EA\u05E8?',a:["\u05DB\u05D9 \u05D4\u05D9\u05D0 \u05E0\u05E9\u05DC\u05D7\u05EA \u05DC\u05DE\u05E7\u05D5\u05DD \u05E8\u05D7\u05D5\u05E7 \u05D9\u05D5\u05EA\u05E8","\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05EA\u05E2\u05E6\u05D1\u05DF \u05DE\u05D8\u05E7\u05E1\u05D8 \u05D0\u05E8\u05D5\u05DA","\u05DB\u05D9 \u05D9\u05E9 \u05D1\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD, \u05D5\u05DB\u05DC \u05D8\u05D5\u05E7\u05DF \u05D3\u05D5\u05E8\u05E9 \u05E2\u05D1\u05D5\u05D3\u05D4"],why:"\u05DC\u05DB\u05DC \u05D8\u05D5\u05E7\u05DF \u05D9\u05E9 \u05DE\u05D7\u05D9\u05E8 \u05E7\u05D8\u05DF \u05D1\u05D7\u05D9\u05E9\u05D5\u05D1. \u05D4\u05E8\u05D1\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u2014 \u05D4\u05E8\u05D1\u05D4 \u05D7\u05D9\u05E9\u05D5\u05D1, \u05D5\u05DC\u05DB\u05DF \u05D9\u05D5\u05EA\u05E8 \u05D6\u05DE\u05DF \u05D5\u05D9\u05D5\u05EA\u05E8 \u05E2\u05DC\u05D5\u05EA. \u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05D0\u05D5\u05E1\u05E4\u05D9\u05DD \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC."},en:{q:'Why does a very long prompt "cost" more?',a:["Because it is sent somewhere further away","Because the model gets annoyed by long text","Because it holds more tokens, and each token takes work"],why:"Every token costs a little computation. Many tokens means much computation \u2014 more time and more cost. Just like the tokens you collect on track."}},{id:"tokens-both-ways",tier:2,topic:"tokens",correct:0,he:{q:"\u05DE\u05D4 \u05E0\u05E1\u05E4\u05E8 \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05D2\u05DD \u05DE\u05D4 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD \u05D5\u05D2\u05DD \u05DE\u05D4 \u05E9\u05D7\u05D5\u05D6\u05E8 \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4","\u05E8\u05E7 \u05DE\u05D4 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD","\u05E8\u05E7 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05D7\u05D5\u05D6\u05E8\u05EA"],why:"\u05E9\u05E0\u05D9 \u05D4\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05E0\u05E1\u05E4\u05E8\u05D9\u05DD. \u05DC\u05DB\u05DF \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05DE\u05D1\u05E7\u05E9 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E2\u05E0\u05E7\u05D9\u05EA \u05D9\u05DB\u05D5\u05DC \u05DC\u05E2\u05DC\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E2\u05E6\u05DE\u05D5 \u2014 \u05D5\u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D4\u05D0\u05D5\u05E8\u05DA \u05E9\u05E6\u05E8\u05D9\u05DA."},en:{q:"What gets counted as tokens?",a:["Both what you send and what comes back","Only what you send","Only the answer that comes back"],why:"Both directions count. Asking for a giant answer can cost more than the question did \u2014 another reason to ask for the length you actually need."}},{id:"tokens-save-well",tier:2,topic:"tokens",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D7\u05D5\u05E1\u05DB\u05D9\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E4\u05D2\u05D5\u05E2 \u05D1\u05EA\u05D5\u05E6\u05D0\u05D4?",a:["\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D0\u05EA \u05DB\u05DC \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D9\u05DD \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D7\u05EA","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D1\u05E7\u05D9\u05E6\u05D5\u05E8\u05D9\u05DD \u05E9\u05E7\u05E9\u05D4 \u05DC\u05D4\u05D1\u05D9\u05DF","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05DE\u05D5\u05E7\u05D3, \u05D1\u05DC\u05D9 \u05D7\u05D6\u05E8\u05D5\u05EA \u05D5\u05D1\u05DC\u05D9 \u05DE\u05D9\u05DC\u05D5\u05D9"],why:'\u05D7\u05D9\u05E1\u05DB\u05D5\u05DF \u05D7\u05DB\u05DD \u05DE\u05D5\u05D7\u05E7 \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E3 \u2014 \u05E0\u05D9\u05DE\u05D5\u05E1\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D9\u05DD, \u05D7\u05D6\u05E8\u05D5\u05EA, "\u05DB\u05DE\u05D5 \u05E9\u05D0\u05DE\u05E8\u05EA\u05D9 \u05E7\u05D5\u05D3\u05DD". \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05E9\u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD \u05E0\u05E9\u05D0\u05E8\u05D9\u05DD \u05EA\u05DE\u05D9\u05D3.'},en:{q:"How do you save tokens without hurting the result?",a:["Delete every detail and leave one word","Write in abbreviations that are hard to follow","Write a focused prompt, no repeats and no filler"],why:'Smart saving cuts what adds nothing \u2014 long pleasantries, repeats, "as I said before". The details that explain what you want always stay.'}},{id:"tokens-worth-spending",tier:3,topic:"tokens",correct:1,he:{q:'\u05DE\u05EA\u05D9 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05E9\u05D5\u05D5\u05D4 "\u05DC\u05D1\u05D6\u05D1\u05D6" \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?',a:["\u05D0\u05E3 \u05E4\u05E2\u05DD \u2014 \u05E7\u05E6\u05E8 \u05EA\u05DE\u05D9\u05D3 \u05E2\u05D3\u05D9\u05E3","\u05DB\u05E9\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05D4\u05E7\u05E9\u05E8 \u05D0\u05D5 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05E9\u05D1\u05D0\u05DE\u05EA \u05DE\u05E9\u05E4\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05E9\u05E8\u05D5\u05E6\u05D9\u05DD \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D9\u05E7\u05D7 \u05D9\u05D5\u05EA\u05E8 \u05D6\u05DE\u05DF \u05DC\u05D7\u05E9\u05D5\u05D1"],why:"\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D4\u05DD \u05EA\u05E7\u05E6\u05D9\u05D1, \u05DC\u05D0 \u05E6\u05D9\u05D5\u05DF. \u05DE\u05E9\u05E4\u05D8 \u05D4\u05E7\u05E9\u05E8 \u05E9\u05D7\u05D5\u05E1\u05DA \u05E9\u05DC\u05D5\u05E9\u05D4 \u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05DB\u05D5\u05E9\u05DC\u05D9\u05DD \u05D4\u05D5\u05D0 \u05D4\u05E2\u05E1\u05E7\u05D4 \u05D4\u05DB\u05D9 \u05DE\u05E9\u05EA\u05DC\u05DE\u05EA \u05E9\u05D9\u05E9."},en:{q:'When is it actually worth "spending" tokens?',a:["Never \u2014 shorter is always better","When context or an example genuinely improves the answer","When you want the model to take longer thinking"],why:"Tokens are a budget, not a score. One sentence of context that saves three failed attempts is the best deal on the table."}},{id:"tokens-languages",tier:3,topic:"tokens",correct:0,he:{q:"\u05DE\u05E9\u05E4\u05D8 \u05E7\u05E6\u05E8 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05D5\u05DE\u05E9\u05E4\u05D8 \u05E7\u05E6\u05E8 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA \u2014 \u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF?",a:["\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D5\u05E0\u05D4 \u05D1\u05D9\u05DF \u05D4\u05E9\u05E4\u05D5\u05EA","\u05EA\u05DE\u05D9\u05D3 \u05D9\u05D5\u05E6\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D5 \u05DE\u05E1\u05E4\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD","\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05E1\u05E4\u05E8\u05D9\u05DD \u05DC\u05E4\u05D9 \u05DE\u05E1\u05E4\u05E8 \u05D4\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u05D1\u05DC\u05D1\u05D3"],why:"\u05D4\u05D7\u05DC\u05D5\u05E7\u05D4 \u05DC\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05DC\u05DE\u05D3\u05D4 \u05D1\u05E2\u05D9\u05E7\u05E8 \u05DE\u05D8\u05E7\u05E1\u05D8\u05D9\u05DD \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA, \u05D5\u05DC\u05DB\u05DF \u05E2\u05D1\u05E8\u05D9\u05EA \u05DE\u05EA\u05E4\u05E8\u05E7\u05EA \u05DC\u05E8\u05D5\u05D1 \u05DC\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8. \u05D0\u05D5\u05EA\u05D5 \u05E8\u05E2\u05D9\u05D5\u05DF, \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD."},en:{q:"A short Hebrew sentence and a short English one \u2014 what is true?",a:["The token count can differ between languages","It always comes out to exactly the same number","Tokens are counted purely by number of letters"],why:"Token splitting was learned mostly from English text, so Hebrew usually breaks into smaller pieces. Same idea, more tokens."}},{id:"iterate-try-again",tier:1,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D9\u05E6\u05D0\u05D4 \u05DC\u05D2\u05DE\u05E8\u05D9 \u05DC\u05D0 \u05DE\u05D4 \u05E9\u05E8\u05E6\u05D5. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E2\u05E9\u05D5\u05EA?",a:["\u05DC\u05D5\u05D5\u05EA\u05E8 \u05D5\u05DC\u05E2\u05E9\u05D5\u05EA \u05D0\u05EA \u05D6\u05D4 \u05DC\u05D1\u05D3","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05E9\u05D5\u05D1 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8","\u05DC\u05E9\u05E4\u05E8 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u2014 \u05D5\u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1"],why:"\u05E0\u05D9\u05E1\u05D9\u05D5\u05DF \u05E8\u05D0\u05E9\u05D5\u05DF \u05D4\u05D5\u05D0 \u05D8\u05D9\u05D5\u05D8\u05D4, \u05DC\u05D0 \u05D2\u05D6\u05E8 \u05D3\u05D9\u05DF. \u05DE\u05D9 \u05E9\u05DE\u05E9\u05E4\u05E8 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D5\u05DE\u05E0\u05E1\u05D4 \u05E9\u05D5\u05D1 \u05DE\u05E7\u05D1\u05DC \u05EA\u05D5\u05E6\u05D0\u05D5\u05EA \u05D8\u05D5\u05D1\u05D5\u05EA \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DE\u05DE\u05D9 \u05E9\u05DE\u05E0\u05E1\u05D4 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA."},en:{q:"The answer came out nothing like what you wanted. What is best?",a:["Give up and do it yourself","Send the exact same prompt again","Improve the prompt \u2014 and try again"],why:"A first try is a draft, not a verdict. People who sharpen the prompt and retry get far better results than people who ask once."}},{id:"iterate-keep-change",tier:2,topic:"iterate",correct:1,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05DE\u05E2\u05D8 \u05D8\u05D5\u05D1\u05D4. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D9\u05DC \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E2\u05DB\u05E9\u05D9\u05D5?",a:['\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05DC\u05D0 \u05D8\u05D5\u05D1" \u05D5\u05DC\u05D7\u05DB\u05D5\u05EA',"\u05DC\u05D4\u05D2\u05D9\u05D3 \u05DE\u05D4 \u05DC\u05E9\u05DE\u05D5\u05E8 \u05D5\u05DE\u05D4 \u05DC\u05E9\u05E0\u05D5\u05EA","\u05DC\u05E4\u05EA\u05D5\u05D7 \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D5\u05DC\u05D4\u05EA\u05D7\u05D9\u05DC \u05DE\u05D4\u05D4\u05EA\u05D7\u05DC\u05D4"],why:'"\u05DC\u05D0 \u05D8\u05D5\u05D1" \u05DE\u05E9\u05D0\u05D9\u05E8 \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05D7\u05E9. "\u05D4\u05E4\u05EA\u05D9\u05D7\u05D4 \u05DE\u05E6\u05D5\u05D9\u05E0\u05EA, \u05D4\u05E1\u05D5\u05E3 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D3\u05D9" \u05E0\u05D5\u05EA\u05DF \u05DC\u05D5 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E6\u05E8\u05D9\u05DA \u05DB\u05D3\u05D9 \u05DC\u05EA\u05E7\u05DF \u05E8\u05E7 \u05D0\u05EA \u05D4\u05D7\u05DC\u05E7 \u05D4\u05E9\u05D1\u05D5\u05E8.'},en:{q:"The answer is almost right. What is most effective to write now?",a:['Write "not good" and wait',"Say what to keep and what to change","Open a new chat and start over"],why:'"Not good" leaves the model guessing. "The opening is great, the ending is too long" gives it exactly what it needs to fix only the broken part.'}},{id:"iterate-one-change",tier:2,topic:"iterate",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E9\u05E0\u05D5\u05EA \u05D3\u05D1\u05E8 \u05D0\u05D7\u05D3 \u05D1\u05DB\u05DC \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF?",a:["\u05DB\u05D9 \u05DB\u05DB\u05D4 \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05D5\u05D0 \u05D6\u05D4 \u05E9\u05E2\u05D6\u05E8","\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05DE\u05E1\u05D5\u05D2\u05DC \u05DC\u05E7\u05DC\u05D5\u05D8 \u05E9\u05E0\u05D9 \u05E9\u05D9\u05E0\u05D5\u05D9\u05D9\u05DD","\u05DB\u05D9 \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF \u05E2\u05DD \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05D3 \u05E8\u05E5 \u05DE\u05D4\u05E8 \u05D9\u05D5\u05EA\u05E8"],why:"\u05DB\u05E9\u05E9\u05E0\u05D9 \u05D3\u05D1\u05E8\u05D9\u05DD \u05DE\u05E9\u05EA\u05E0\u05D9\u05DD \u05D9\u05D7\u05D3 \u05D5\u05DE\u05E9\u05D4\u05D5 \u05DE\u05E9\u05EA\u05E4\u05E8 \u2014 \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA \u05DE\u05D9 \u05D0\u05D7\u05E8\u05D0\u05D9. \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05D3 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u05D4\u05D5\u05E4\u05DA \u05E0\u05D9\u05D7\u05D5\u05E9 \u05DC\u05E0\u05D9\u05E1\u05D5\u05D9 \u05D0\u05DE\u05D9\u05EA\u05D9."},en:{q:"Why change one thing per attempt?",a:["So you know which change is the one that helped","Because the model cannot handle two changes","Because a one-change attempt runs faster"],why:"When two things change together and something improves, you cannot tell which did it. One change at a time turns guessing into a real experiment."}},{id:"iterate-fresh-chat",tier:3,topic:"iterate",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05EA\u05D7\u05D9\u05DC \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05EA\u05E7\u05DF?",a:["\u05D0\u05D7\u05E8\u05D9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D7\u05DE\u05E9 \u05D4\u05D5\u05D3\u05E2\u05D5\u05EA, \u05EA\u05DE\u05D9\u05D3","\u05DB\u05E9\u05D4\u05E9\u05D9\u05D7\u05D4 \u05DE\u05DC\u05D0\u05D4 \u05D1\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05D9\u05E9\u05E0\u05D9\u05DD \u05E9\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05DC\u05D7\u05D6\u05D5\u05E8","\u05D0\u05E3 \u05E4\u05E2\u05DD \u2014 \u05EA\u05DE\u05D9\u05D3 \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E9\u05D9\u05D7\u05D4"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D5\u05D0\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E9\u05D9\u05D7\u05D4, \u05DB\u05D5\u05DC\u05DC \u05D4\u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05E9\u05E0\u05DB\u05E9\u05DC\u05D5, \u05D5\u05DE\u05DE\u05E9\u05D9\u05DA \u05DC\u05D4\u05D9\u05D2\u05E8\u05E8 \u05D0\u05DC\u05D9\u05D4\u05DD. \u05E4\u05EA\u05D9\u05D7\u05D4 \u05E0\u05E7\u05D9\u05D9\u05D4 \u05E2\u05DD \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05DE\u05E9\u05D5\u05E4\u05E8 \u05E2\u05D5\u05E7\u05E4\u05EA \u05D0\u05EA \u05DB\u05DC \u05D4\u05E8\u05E2\u05E9 \u05D4\u05D6\u05D4."},en:{q:"When is a fresh chat better than more fixing?",a:["After exactly five messages, always","When the chat is full of old directions that keep coming back","Never \u2014 continuing the same chat is always better"],why:"The model sees the whole chat, failed attempts included, and keeps drifting back to them. A clean start with the improved prompt skips all that noise."}},{id:"mistakes-confident",tier:1,topic:"mistakes",correct:0,he:{q:"\u05D4\u05BEAI \u05E2\u05E0\u05D4 \u05D1\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05DE\u05DC\u05D0. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E1\u05DE\u05D5\u05DA \u05E2\u05DC \u05D6\u05D4?",a:["\u05DC\u05D0 \u05D1\u05D4\u05DB\u05E8\u05D7 \u2014 \u05D2\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D5\u05D7\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D2\u05D5\u05D9\u05D4","\u05DB\u05DF, \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05E2\u05D9\u05D3 \u05E9\u05D4\u05D9\u05D0 \u05E0\u05DB\u05D5\u05E0\u05D4","\u05DB\u05DF, \u05D0\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D5\u05DE\u05E4\u05D5\u05E8\u05D8\u05EA"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05DB\u05D5\u05EA\u05D1 \u05D4\u05DB\u05D5\u05DC \u05D1\u05D0\u05D5\u05EA\u05D5 \u05D8\u05D5\u05DF \u05D1\u05D8\u05D5\u05D7, \u05D2\u05DD \u05DB\u05E9\u05D4\u05D5\u05D0 \u05D8\u05D5\u05E2\u05D4. \u05D4\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D1\u05D8\u05E7\u05E1\u05D8 \u05D4\u05D5\u05D0 \u05E1\u05D2\u05E0\u05D5\u05DF \u05DB\u05EA\u05D9\u05D1\u05D4 \u2014 \u05DC\u05D0 \u05D4\u05D5\u05DB\u05D7\u05D4."},en:{q:"The AI answered with total confidence. Can you rely on it?",a:["Not necessarily \u2014 a very confident answer can still be wrong","Yes, confidence means it is correct","Yes, if the answer is long and detailed"],why:"The model writes everything in the same confident tone, including its mistakes. Confidence in the text is a writing style, not proof."}},{id:"mistakes-check-fact",tier:1,topic:"mistakes",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E2\u05D5\u05D1\u05D3\u05D4 \u05E9\u05D4\u05BEAI \u05E0\u05EA\u05DF?",a:["\u05E9\u05D5\u05D0\u05DC\u05D9\u05DD \u05D0\u05EA \u05D0\u05D5\u05EA\u05D5 AI \u05D0\u05DD \u05D4\u05D5\u05D0 \u05D1\u05D8\u05D5\u05D7","\u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05DB\u05DE\u05D4 \u05E4\u05E2\u05DE\u05D9\u05DD \u05D4\u05D5\u05D0 \u05D7\u05D6\u05E8 \u05E2\u05DC \u05D6\u05D4","\u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05DC\u05DE\u05E7\u05D5\u05E8 \u05D0\u05DE\u05D9\u05DF \u05E0\u05D5\u05E1\u05E3 \u05DE\u05D7\u05D5\u05E5 \u05DC\u05E9\u05D9\u05D7\u05D4"],why:'\u05DC\u05E9\u05D0\u05D5\u05DC \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC "\u05D0\u05EA\u05D4 \u05D1\u05D8\u05D5\u05D7?" \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC \u05E8\u05E7 \u05DE\u05D5\u05DC\u05D9\u05D3 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D5\u05D7\u05D4 \u05E2\u05D5\u05D3 \u05D9\u05D5\u05EA\u05E8. \u05D1\u05D3\u05D9\u05E7\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u05DE\u05D2\u05D9\u05E2\u05D4 \u05DE\u05DE\u05E7\u05D5\u05E8 \u05D0\u05D7\u05E8: \u05D0\u05EA\u05E8, \u05E1\u05E4\u05E8, \u05DE\u05D1\u05D5\u05D2\u05E8 \u05E9\u05D9\u05D5\u05D3\u05E2.'},en:{q:"How do you check a fact the AI gave you?",a:["Ask the same AI whether it is sure","Count how many times it repeated it","Compare it against a trustworthy source outside the chat"],why:'Asking a model "are you sure?" usually just produces an even surer answer. A real check comes from elsewhere: a site, a book, an adult who knows.'}},{id:"mistakes-hallucination",tier:2,topic:"mistakes",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D4\u05D6\u05D9\u05D4" \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC?',a:["\u05DB\u05E9\u05D4\u05D5\u05D0 \u05DE\u05E1\u05E8\u05D1 \u05DC\u05E2\u05E0\u05D5\u05EA \u05E2\u05DC \u05E9\u05D0\u05DC\u05D4","\u05DB\u05E9\u05D4\u05D5\u05D0 \u05DE\u05DE\u05E6\u05D9\u05D0 \u05E4\u05E8\u05D8 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05E0\u05DB\u05D5\u05DF \u05DC\u05D2\u05DE\u05E8\u05D9 \u05D0\u05D1\u05DC \u05D0\u05D9\u05E0\u05D5 \u05E0\u05DB\u05D5\u05DF","\u05DB\u05E9\u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4 \u05DC\u05D0\u05D8 \u05DE\u05D4\u05E8\u05D2\u05D9\u05DC"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05EA\u05DE\u05D9\u05D3 \u05DE\u05E0\u05E1\u05D4 \u05DC\u05D4\u05E9\u05DC\u05D9\u05DD \u05DE\u05E9\u05D4\u05D5 \u05E9\u05DE\u05EA\u05D0\u05D9\u05DD, \u05D2\u05DD \u05DB\u05E9\u05D0\u05D9\u05DF \u05DC\u05D5 \u05D0\u05EA \u05D4\u05DE\u05D9\u05D3\u05E2. \u05D0\u05D6 \u05E0\u05D5\u05DC\u05D3 \u05E4\u05E8\u05D8 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05DE\u05D5\u05E9\u05DC\u05DD \u05D5\u05E4\u05E9\u05D5\u05D8 \u05DC\u05D0 \u05E7\u05D9\u05D9\u05DD \u2014 \u05D5\u05DC\u05DB\u05DF \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD."},en:{q:'What is a model "hallucination"?',a:["When it refuses to answer a question","When it invents a detail that sounds completely right but is not","When it answers slower than usual"],why:"The model always tries to complete something that fits, even with no information. Out comes a detail that sounds perfect and simply does not exist \u2014 hence checking."}},{id:"mistakes-sources",tier:2,topic:"mistakes",correct:0,he:{q:"\u05D4\u05BEAI \u05E6\u05D9\u05E8\u05E3 \u05E7\u05D9\u05E9\u05D5\u05E8 \u05D0\u05D5 \u05E9\u05DD \u05E9\u05DC \u05E1\u05E4\u05E8. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05E4\u05D5\u05EA\u05D7\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E9\u05D4\u05DE\u05E7\u05D5\u05E8 \u05D1\u05D0\u05DE\u05EA \u05E7\u05D9\u05D9\u05DD \u05D5\u05DE\u05EA\u05D0\u05D9\u05DD","\u05DE\u05E2\u05EA\u05D9\u05E7\u05D9\u05DD \u05D9\u05E9\u05E8 \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4, \u05D6\u05D4 \u05E0\u05E8\u05D0\u05D4 \u05DE\u05E1\u05D5\u05D3\u05E8","\u05DE\u05E0\u05D9\u05D7\u05D9\u05DD \u05E9\u05D6\u05D4 \u05EA\u05E7\u05D9\u05DF \u05DB\u05D9 \u05D9\u05E9 \u05E9\u05DD \u05D5\u05EA\u05D0\u05E8\u05D9\u05DA"],why:"\u05E9\u05DE\u05D5\u05EA \u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05D4\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05D1\u05D5 \u05DE\u05D5\u05D3\u05DC \u05DE\u05DE\u05E6\u05D9\u05D0 \u05D1\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF. \u05DE\u05E7\u05D5\u05E8 \u05D0\u05DE\u05D9\u05EA\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E4\u05EA\u05D5\u05D7 \u2014 \u05D5\u05D6\u05D5 \u05D1\u05D3\u05D9\u05E7\u05D4 \u05E9\u05DC \u05D7\u05DE\u05E9 \u05E9\u05E0\u05D9\u05D5\u05EA."},en:{q:"The AI gave a link or a book title. What now?",a:["Open it and check the source really exists and fits","Copy it straight into the work, it looks tidy","Assume it is fine because it has a name and a date"],why:"Source names are exactly where a model invents confidently. A real source can be opened \u2014 that is a five-second check."}},{id:"mistakes-math",tier:3,topic:"mistakes",correct:2,he:{q:"\u05D1\u05D7\u05E9\u05D1\u05D5\u05DF \u05D0\u05D5 \u05D1\u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD, \u05DC\u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05E9\u05D5\u05D1 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05BEAI?",a:["\u05DB\u05D9 \u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05E2\u05D5\u05DC\u05D9\u05DD \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD","\u05DB\u05D9 \u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DC\u05D0 \u05DE\u05E1\u05D5\u05D2\u05DC \u05DC\u05D7\u05E9\u05D1 \u05D1\u05DB\u05DC\u05DC","\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05DE\u05E0\u05D7\u05E9 \u05D8\u05E7\u05E1\u05D8, \u05D5\u05D3\u05D9\u05D5\u05E7 \u05D1\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05D4\u05D5\u05D0 \u05DC\u05D0 \u05D4\u05D7\u05D5\u05D6\u05E7 \u05E9\u05DC\u05D5"],why:"\u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DE\u05E0\u05D7\u05E9 \u05DE\u05D4 \u05DE\u05EA\u05D0\u05D9\u05DD \u05DC\u05D1\u05D5\u05D0 \u05D0\u05D7\u05E8 \u05DB\u05DA \u2014 \u05D5\u05D6\u05D4 \u05DC\u05D0 \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8 \u05DB\u05DE\u05D5 \u05DC\u05D7\u05E9\u05D1. \u05D1\u05D7\u05D9\u05E9\u05D5\u05D1 \u05D0\u05E8\u05D5\u05DA \u05E9\u05D5\u05D5\u05D4 \u05EA\u05DE\u05D9\u05D3 \u05DC\u05D5\u05D5\u05D3\u05D0, \u05D0\u05D5 \u05DC\u05D1\u05E7\u05E9 \u05DE\u05DE\u05E0\u05D5 \u05DC\u05E4\u05E8\u05D8 \u05D0\u05EA \u05D4\u05E9\u05DC\u05D1\u05D9\u05DD."},en:{q:"With arithmetic or dates, why double-check the AI?",a:["Because numbers cost more tokens","Because a language model cannot calculate at all","Because it guesses text, and exact numbers are not its strength"],why:"A language model guesses what comes next \u2014 which is not the same as calculating. On a long computation, verify, or ask it to show the steps."}},{id:"vibe-what-is",tier:2,topic:"vibe",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D5\u05D9\u05D9\u05D1\u05BE\u05E7\u05D5\u05D3\u05D9\u05E0\u05D2"?',a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05E7\u05D5\u05D3 \u05DE\u05D5\u05DB\u05DF \u05DE\u05D4\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8 \u05D1\u05DC\u05D9 \u05DC\u05E9\u05E0\u05D5\u05EA","\u05DC\u05EA\u05D0\u05E8 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05DE\u05D4 \u05D4\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E6\u05E8\u05D9\u05DB\u05D4 \u05DC\u05E2\u05E9\u05D5\u05EA, \u05D5\u05DC\u05EA\u05EA \u05DC\u05BEAI \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3 \u05DC\u05D1\u05D3 \u05D5\u05DC\u05D1\u05E7\u05E9 \u05DE\u05BEAI \u05E8\u05E7 \u05DC\u05D7\u05E4\u05E9 \u05E9\u05D2\u05D9\u05D0\u05D5\u05EA"],why:"\u05D1\u05D5\u05D9\u05D9\u05D1\u05BE\u05E7\u05D5\u05D3\u05D9\u05E0\u05D2 \u05DE\u05EA\u05D0\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05E8\u05E2\u05D9\u05D5\u05DF \u05D1\u05E9\u05E4\u05D4 \u05E8\u05D2\u05D9\u05DC\u05D4, \u05D5\u05D4\u05BEAI \u05DB\u05D5\u05EA\u05D1 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3. \u05D4\u05EA\u05D9\u05D0\u05D5\u05E8 \u05D4\u05D5\u05D0 \u05D4\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D4\u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u2014 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D8\u05D5\u05D1."},en:{q:'What is "vibe coding"?',a:["Copying ready-made code off the internet unchanged","Describing what the software should do, and letting AI write the code","Writing the code yourself and only asking AI to hunt for bugs"],why:"In vibe coding you describe the idea in ordinary language and the AI writes the code. The description is the real work \u2014 exactly like a good prompt."}},{id:"vibe-start-project",tier:2,topic:"vibe",correct:2,he:{q:"\u05D1\u05D5\u05E0\u05D9\u05DD \u05DE\u05E9\u05D7\u05E7 \u05E2\u05DD AI. \u05D0\u05D9\u05DA \u05D4\u05DB\u05D9 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05D4\u05EA\u05D7\u05D9\u05DC?",a:['\u05DC\u05D1\u05E7\u05E9 "\u05DC\u05D1\u05E0\u05D5\u05EA \u05DE\u05E9\u05D7\u05E7 \u05DE\u05D2\u05E0\u05D9\u05D1" \u05D5\u05DC\u05D7\u05DB\u05D5\u05EA',"\u05DC\u05D1\u05E7\u05E9 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E7\u05D5\u05D3 \u05D1\u05D4\u05D5\u05D3\u05E2\u05D4 \u05E2\u05E0\u05E7\u05D9\u05EA \u05D0\u05D7\u05EA","\u05DC\u05EA\u05D0\u05E8 \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05D1\u05DE\u05E9\u05D7\u05E7, \u05D5\u05D0\u05D6 \u05DC\u05D1\u05E7\u05E9 \u05E9\u05DC\u05D1 \u05D0\u05D7\u05E8 \u05E9\u05DC\u05D1"],why:"\u05E7\u05D5\u05D3\u05DD \u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05DE\u05D4 \u05D4\u05DE\u05E9\u05D7\u05E7 \u05E2\u05D5\u05E9\u05D4 \u2014 \u05DE\u05D9 \u05D6\u05D6, \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05E9\u05DE\u05E0\u05E6\u05D7\u05D9\u05DD. \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D1\u05D5\u05E0\u05D9\u05DD \u05D7\u05DC\u05E7\u05BE\u05D7\u05DC\u05E7 \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05DB\u05DC \u05D7\u05DC\u05E7. \u05DB\u05DB\u05D4 \u05D9\u05D5\u05E6\u05D0 \u05DE\u05E9\u05D7\u05E7 \u05D5\u05DC\u05D0 \u05E2\u05E8\u05D9\u05DE\u05EA \u05E7\u05D5\u05D3."},en:{q:"Building a game with AI. What is the best way to start?",a:['Ask for "a cool game" and wait',"Ask for all the code in one giant message","Describe what happens in the game, then build step by step"],why:"First explain what the game does \u2014 who moves, what happens when you win. Then build piece by piece and test each one. That gets a game, not a pile of code."}},{id:"vibe-error",tier:3,topic:"vibe",correct:0,he:{q:"\u05D4\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1 \u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D6\u05D5\u05E8?",a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05EA \u05D4\u05D5\u05D3\u05E2\u05EA \u05D4\u05E9\u05D2\u05D9\u05D0\u05D4 \u05D5\u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05DE\u05D4 \u05E7\u05E8\u05D4 \u05D1\u05E4\u05D5\u05E2\u05DC",'\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3, \u05DC\u05EA\u05E7\u05DF"',"\u05DC\u05DE\u05D7\u05D5\u05E7 \u05D4\u05DB\u05D5\u05DC \u05D5\u05DC\u05D1\u05E7\u05E9 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05DE\u05D7\u05D3\u05E9 \u05DE\u05D0\u05E4\u05E1"],why:'\u05D4\u05D5\u05D3\u05E2\u05EA \u05D4\u05E9\u05D2\u05D9\u05D0\u05D4 \u05D4\u05D9\u05D0 \u05D4\u05E8\u05DE\u05D6 \u05D4\u05DB\u05D9 \u05E9\u05D5\u05D5\u05D4 \u05E9\u05D9\u05E9, \u05D5\u05D4\u05D9\u05D0 \u05E2\u05D5\u05DC\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05D5\u05D3\u05D3\u05D9\u05DD. "\u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3" \u05DE\u05D1\u05E7\u05E9 \u05DE\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05D7\u05E9 \u05D0\u05D9\u05E4\u05D4 \u05D4\u05D1\u05E2\u05D9\u05D4.'},en:{q:"The code the AI wrote does not work. What helps most?",a:["Paste the error message and describe what actually happened",'Write "broken, fix it"',"Delete everything and ask for a rewrite from scratch"],why:'The error message is the most valuable clue there is, and it costs a handful of tokens. "Broken" asks the model to guess where the problem is.'}},{id:"vibe-test-each",tier:3,topic:"vibe",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E9\u05D4\u05BEAI \u05E2\u05E9\u05D4?",a:["\u05DB\u05D9 \u05D4\u05BEAI \u05DC\u05D0 \u05D6\u05D5\u05DB\u05E8 \u05DE\u05D4 \u05DB\u05EA\u05D1 \u05DC\u05E4\u05E0\u05D9 \u05E8\u05D2\u05E2","\u05DB\u05D9 \u05E8\u05E7 \u05D4\u05E8\u05E6\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u05DE\u05E8\u05D0\u05D4 \u05D0\u05DD \u05D6\u05D4 \u05D1\u05D0\u05DE\u05EA \u05E2\u05D5\u05D1\u05D3","\u05DB\u05D9 \u05D1\u05D3\u05D9\u05E7\u05D4 \u05EA\u05DB\u05D5\u05E4\u05D4 \u05D7\u05D5\u05E1\u05DB\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05E7\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D9\u05E8\u05D0\u05D5\u05EA \u05DE\u05D5\u05E9\u05DC\u05DD \u05D5\u05DC\u05D4\u05EA\u05E4\u05D5\u05E6\u05E5 \u05D1\u05D4\u05E8\u05E6\u05D4 \u05D4\u05E8\u05D0\u05E9\u05D5\u05E0\u05D4. \u05D1\u05D3\u05D9\u05E7\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E7\u05D8\u05DF \u05DE\u05D0\u05EA\u05E8\u05EA \u05D0\u05EA \u05D4\u05EA\u05E7\u05DC\u05D4 \u05DB\u05E9\u05E2\u05D5\u05D3 \u05D1\u05E8\u05D5\u05E8 \u05DE\u05D4 \u05D2\u05E8\u05DD \u05DC\u05D4."},en:{q:"Why run and test every change the AI made?",a:["Because the AI does not remember what it just wrote","Because only actually running it shows whether it works","Because frequent testing saves tokens"],why:"Code can look perfect and blow up on the first run. Testing after each small change catches the break while it is still obvious what caused it."}},{id:"vibe-good-spec",tier:3,topic:"vibe",correct:2,he:{q:"\u05DE\u05D4 \u05DE\u05E1\u05DE\u05DF \u05EA\u05D9\u05D0\u05D5\u05E8 \u05D8\u05D5\u05D1 \u05E9\u05DC \u05E4\u05D9\u05E6\u05F3\u05E8 \u05DC\u05BEAI?",a:["\u05D4\u05D5\u05D0 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3 \u05D5\u05DE\u05DB\u05E1\u05D4 \u05D4\u05DB\u05D5\u05DC","\u05D4\u05D5\u05D0 \u05DE\u05DC\u05D0 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05D8\u05DB\u05E0\u05D9\u05D5\u05EA \u05DE\u05E8\u05E9\u05D9\u05DE\u05D5\u05EA","\u05DB\u05EA\u05D5\u05D1 \u05D1\u05D5 \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4, \u05DE\u05EA\u05D9 \u05D6\u05D4 \u05E7\u05D5\u05E8\u05D4, \u05D5\u05DE\u05D4 \u05E8\u05D5\u05D0\u05D9\u05DD \u05E2\u05DC \u05D4\u05DE\u05E1\u05DA"],why:'\u05EA\u05D9\u05D0\u05D5\u05E8 \u05D8\u05D5\u05D1 \u05D4\u05D5\u05D0 \u05DB\u05D6\u05D4 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D0\u05D7\u05E8\u05D9\u05D5. "\u05DB\u05E9\u05DC\u05D5\u05D7\u05E6\u05D9\u05DD \u05E8\u05D5\u05D5\u05D7 \u05D4\u05DB\u05D3\u05D5\u05E8 \u05E7\u05D5\u05E4\u05E5 \u05D5\u05E0\u05E9\u05DE\u05E2 \u05E6\u05DC\u05D9\u05DC" \u2014 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E8\u05D9\u05E5 \u05D5\u05DC\u05E8\u05D0\u05D5\u05EA \u05D0\u05DD \u05D6\u05D4 \u05E7\u05E8\u05D4.'},en:{q:"What marks a good feature description for an AI?",a:["It is very long and covers everything","It is packed with impressive technical words","It says what happens, when it happens, and what appears on screen"],why:'A good description is one you can check afterwards. "Press space, the ball jumps and a sound plays" \u2014 you can run it and see whether that happened.'}},{id:"ai-everyday",tier:1,topic:"whatai",correct:1,he:{q:"\u05D0\u05D9\u05E4\u05D4 \u05E4\u05D5\u05D2\u05E9\u05D9\u05DD AI \u05D1\u05D9\u05D5\u05DD \u05E8\u05D2\u05D9\u05DC?",a:["\u05E8\u05E7 \u05D1\u05DE\u05E2\u05D1\u05D3\u05D5\u05EA \u05E9\u05DC \u05DE\u05D3\u05E2\u05E0\u05D9\u05DD","\u05D1\u05EA\u05E8\u05D2\u05D5\u05DD, \u05D1\u05D4\u05DE\u05DC\u05E6\u05D5\u05EA \u05E1\u05E8\u05D8\u05D9\u05DD \u05D5\u05D1\u05E1\u05D9\u05E0\u05D5\u05DF \u05D3\u05D5\u05D0\u05E8 \u05D6\u05D1\u05DC","\u05E8\u05E7 \u05D1\u05DE\u05E9\u05D7\u05E7\u05D9 \u05DE\u05D7\u05E9\u05D1 \u05D7\u05D3\u05E9\u05D9\u05DD"],why:"AI \u05DB\u05D1\u05E8 \u05D9\u05D5\u05E9\u05D1 \u05D1\u05D4\u05DE\u05D5\u05DF \u05DE\u05E7\u05D5\u05DE\u05D5\u05EA \u05E9\u05D2\u05E8\u05EA\u05D9\u05D9\u05DD: \u05EA\u05E8\u05D2\u05D5\u05DD, \u05E0\u05D9\u05D5\u05D5\u05D8, \u05D4\u05DE\u05DC\u05E6\u05D5\u05EA \u05D5\u05E1\u05D9\u05E0\u05D5\u05DF \u05E1\u05E4\u05D0\u05DD. \u05E8\u05D5\u05D1 \u05D4\u05E4\u05E2\u05DE\u05D9\u05DD \u05D1\u05DB\u05DC\u05DC \u05DC\u05D0 \u05E9\u05DE\u05D9\u05DD \u05DC\u05D1 \u05E9\u05D4\u05D5\u05D0 \u05E9\u05DD."},en:{q:"Where do you meet AI on an ordinary day?",a:["Only in scientists' laboratories","In translation, film recommendations and spam filtering","Only in brand new video games"],why:"AI already sits in plenty of everyday places: translation, navigation, recommendations, spam filters. Most of the time nobody notices it is there."}},{id:"ai-not-magic",tier:1,topic:"whatai",correct:2,he:{q:"\u05D4\u05D0\u05DD AI \u05D4\u05D5\u05D0 \u05E1\u05D5\u05D2 \u05E9\u05DC \u05E7\u05E1\u05DD?",a:["\u05DB\u05DF, \u05D0\u05E3 \u05D0\u05D7\u05D3 \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2 \u05D0\u05D9\u05DA \u05D6\u05D4 \u05E2\u05D5\u05D1\u05D3","\u05DB\u05DF, \u05D4\u05D5\u05D0 \u05D7\u05D5\u05E9\u05D1 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05D1\u05DF \u05D0\u05D3\u05DD","\u05DC\u05D0 \u2014 \u05D6\u05D5 \u05EA\u05D5\u05DB\u05E0\u05D4 \u05E9\u05DE\u05D6\u05D4\u05D4 \u05D3\u05E4\u05D5\u05E1\u05D9\u05DD \u05D1\u05DE\u05D9\u05D3\u05E2"],why:"\u05DE\u05D0\u05D7\u05D5\u05E8\u05D9 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E2\u05D5\u05DE\u05D3 \u05D7\u05D9\u05E9\u05D5\u05D1 \u05E2\u05DC \u05D3\u05E4\u05D5\u05E1\u05D9\u05DD \u05E9\u05E0\u05DC\u05DE\u05D3\u05D5 \u05DE\u05DE\u05D9\u05D3\u05E2. \u05D6\u05D4 \u05DE\u05E8\u05E9\u05D9\u05DD \u05DE\u05D0\u05D5\u05D3, \u05D0\u05D1\u05DC \u05D6\u05D5 \u05D4\u05E0\u05D3\u05E1\u05D4 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05D1\u05D9\u05DF."},en:{q:"Is AI a kind of magic?",a:["Yes, nobody knows how it works","Yes, it thinks exactly like a person","No \u2014 it is software that spots patterns in data"],why:"Behind every answer is a calculation over patterns learned from data. Very impressive, but it is engineering, and engineering can be understood."}},{id:"ai-needs-examples",tier:1,topic:"whatai",correct:0,he:{q:"\u05DC\u05DE\u05D4 AI \u05E6\u05E8\u05D9\u05DA \u05D4\u05DE\u05D5\u05DF \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05DB\u05D3\u05D9 \u05DC\u05DC\u05DE\u05D5\u05D3?",a:["\u05DB\u05D9 \u05D3\u05E4\u05D5\u05E1 \u05DE\u05EA\u05D2\u05DC\u05D4 \u05E8\u05E7 \u05DB\u05E9\u05E8\u05D5\u05D0\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05E9\u05D5\u05D1 \u05D5\u05E9\u05D5\u05D1","\u05DB\u05D9 \u05DB\u05DB\u05D4 \u05DE\u05EA\u05DE\u05DC\u05D0 \u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05E9\u05DC\u05D5","\u05DB\u05D9 \u05D4\u05E8\u05D1\u05D4 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05E2\u05D5\u05DC\u05D5\u05EA \u05E4\u05D7\u05D5\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05DE\u05D3\u05D5\u05D2\u05DE\u05D4 \u05D0\u05D7\u05EA \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA \u05DE\u05D4 \u05DB\u05DC\u05DC \u05D5\u05DE\u05D4 \u05D9\u05D5\u05E6\u05D0 \u05D3\u05D5\u05E4\u05DF. \u05E8\u05E7 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05DE\u05D5\u05DF \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05DE\u05EA\u05D1\u05E8\u05E8 \u05DE\u05D4 \u05D7\u05D5\u05D6\u05E8 \u05EA\u05DE\u05D9\u05D3 \u2014 \u05D5\u05D6\u05D4 \u05DE\u05D4 \u05E9\u05E0\u05DC\u05DE\u05D3."},en:{q:"Why does AI need so many examples to learn?",a:["Because a pattern only shows up when you see it again and again","Because that is how its memory gets filled","Because many examples cost fewer tokens"],why:"One example cannot tell you what is a rule and what is an exception. Only after a great many does what always repeats become clear \u2014 and that is what gets learned."}},{id:"ai-knows-me",tier:1,topic:"whatai",correct:1,he:{q:"\u05D4\u05D0\u05DD \u05D4\u05BEAI \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D9 \u05DB\u05D5\u05EA\u05D1 \u05DC\u05D5?",a:["\u05DB\u05DF, \u05D4\u05D5\u05D0 \u05DE\u05D6\u05D4\u05D4 \u05DB\u05DC \u05D0\u05D7\u05D3 \u05DC\u05E4\u05D9 \u05E1\u05D2\u05E0\u05D5\u05DF \u05D4\u05DB\u05EA\u05D9\u05D1\u05D4","\u05DC\u05D0, \u05D0\u05DC\u05D0 \u05D0\u05DD \u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05DC\u05D5 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05E2\u05E6\u05DE\u05E0\u05D5","\u05DB\u05DF, \u05D4\u05D5\u05D0 \u05E8\u05D5\u05D0\u05D4 \u05D3\u05E8\u05DA \u05D4\u05DE\u05E6\u05DC\u05DE\u05D4"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05E8\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05D5. \u05D0\u05DD \u05D7\u05E9\u05D5\u05D1 \u05E9\u05D9\u05D9\u05D3\u05E2 \u05D2\u05D9\u05DC, \u05DB\u05D9\u05EA\u05D4 \u05D0\u05D5 \u05EA\u05D7\u05D1\u05D9\u05D1 \u2014 \u05E4\u05E9\u05D5\u05D8 \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05EA \u05D6\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8."},en:{q:"Does the AI know who is writing to it?",a:["Yes, it recognises everyone by their writing style","No, unless you tell it yourself","Yes, it sees through the camera"],why:"The model only reads what is written to it. If it should know your age, your class or your hobby, just put that in the prompt."}},{id:"ai-image-models",tier:1,topic:"whatai",correct:2,he:{q:"\u05D9\u05E9 \u05D2\u05DD AI \u05E9\u05DE\u05E6\u05D9\u05D9\u05E8. \u05DE\u05D4 \u05D4\u05D5\u05D0 \u05E2\u05D5\u05E9\u05D4 \u05D1\u05E2\u05E6\u05DD?",a:["\u05DE\u05D7\u05E4\u05E9 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05DE\u05D5\u05DB\u05E0\u05D4 \u05D5\u05DE\u05D3\u05D1\u05D9\u05E7 \u05D0\u05D5\u05EA\u05D4","\u05DE\u05E6\u05DC\u05DD \u05D0\u05EA \u05DE\u05D4 \u05E9\u05DE\u05EA\u05D0\u05E8\u05D9\u05DD \u05DC\u05D5","\u05D1\u05D5\u05E0\u05D4 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05DC\u05E4\u05D9 \u05D4\u05EA\u05D9\u05D0\u05D5\u05E8 \u05E9\u05E0\u05DB\u05EA\u05D1"],why:"\u05DE\u05D5\u05D3\u05DC \u05EA\u05DE\u05D5\u05E0\u05D4 \u05DC\u05DE\u05D3 \u05D0\u05EA \u05D4\u05E7\u05E9\u05E8 \u05D1\u05D9\u05DF \u05DE\u05D9\u05DC\u05D9\u05DD \u05DC\u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05D5\u05DE\u05D9\u05D9\u05E6\u05E8 \u05E6\u05D9\u05D5\u05E8 \u05D7\u05D3\u05E9 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD. \u05D2\u05DD \u05DB\u05D0\u05DF \u05EA\u05D9\u05D0\u05D5\u05E8 \u05DE\u05E4\u05D5\u05E8\u05D8 \u05DE\u05E7\u05E8\u05D1 \u05DC\u05EA\u05D5\u05E6\u05D0\u05D4 \u05E9\u05E8\u05D5\u05E6\u05D9\u05DD."},en:{q:"There is AI that draws too. What does it actually do?",a:["Finds a ready-made picture and pastes it","Photographs whatever is described to it","Builds a new image from the description written"],why:"An image model learned how words relate to pictures and makes a fresh image every time. Here too, a detailed description gets you closer to what you wanted."}},{id:"prompt-say-goal",tier:1,topic:"prompt",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05E9\u05D1\u05D9\u05DC \u05DE\u05D4 \u05E6\u05E8\u05D9\u05DA \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4?",a:["\u05DB\u05D9 \u05DE\u05D8\u05E8\u05D4 \u05D1\u05E8\u05D5\u05E8\u05D4 \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05D9\u05D9\u05DB\u05E0\u05E1 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05D9 \u05D6\u05D4 \u05DE\u05E7\u05E6\u05E8 \u05D0\u05EA \u05D6\u05DE\u05DF \u05D4\u05D4\u05DE\u05EA\u05E0\u05D4","\u05DB\u05D9 \u05D1\u05DC\u05D9 \u05DE\u05D8\u05E8\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05E1\u05E8\u05D1 \u05DC\u05E2\u05E0\u05D5\u05EA"],why:"\u05D4\u05E1\u05D1\u05E8 \u05DC\u05E9\u05D9\u05E2\u05D5\u05E8\u05D9 \u05D1\u05D9\u05EA \u05D5\u05D4\u05E1\u05D1\u05E8 \u05DC\u05D4\u05E6\u05D2\u05D4 \u05D1\u05DB\u05D9\u05EA\u05D4 \u05E0\u05E8\u05D0\u05D9\u05DD \u05D0\u05D7\u05E8\u05EA \u05DC\u05D2\u05DE\u05E8\u05D9. \u05DB\u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05DE\u05D4 \u05E6\u05E8\u05D9\u05DA \u05D0\u05EA \u05D6\u05D4, \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05DB\u05D5\u05D5\u05DF \u05DC\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D4\u05E0\u05DB\u05D5\u05DF."},en:{q:"Why say what the answer is needed for?",a:["Because a clear purpose changes what goes into the answer","Because it shortens the waiting time","Because without a purpose the model refuses to answer"],why:"An explanation for homework and one for a class presentation look completely different. Saying why you need it aims the model at the right use."}},{id:"prompt-vague-word",tier:1,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05D4\u05D1\u05E2\u05D9\u05D4 \u05D1\u05D1\u05E7\u05E9\u05D4 "\u05DC\u05DB\u05EA\u05D5\u05D1 \u05DE\u05E9\u05D4\u05D5 \u05D9\u05E4\u05D4"?',a:["\u05D4\u05D9\u05D0 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D3\u05D9",'"\u05D9\u05E4\u05D4" \u05D0\u05D5\u05DE\u05E8 \u05D3\u05D1\u05E8 \u05D0\u05D7\u05E8 \u05DC\u05DB\u05DC \u05D0\u05D7\u05D3','\u05D0\u05E1\u05D5\u05E8 \u05DC\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05DE\u05D9\u05DC\u05D4 "\u05DE\u05E9\u05D4\u05D5"'],why:'\u05DE\u05D9\u05DC\u05D5\u05EA \u05E9\u05D1\u05D7 \u05DC\u05D0 \u05DE\u05EA\u05D0\u05E8\u05D5\u05EA \u05DB\u05DC\u05D5\u05DD. \u05D1\u05DE\u05E7\u05D5\u05DD "\u05D9\u05E4\u05D4" \u05E2\u05D3\u05D9\u05E3 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05DE\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E8\u05D5\u05E6\u05D9\u05DD: \u05E9\u05D9\u05E8 \u05E7\u05E6\u05E8, \u05DE\u05D7\u05D5\u05E8\u05D6, \u05E2\u05DC \u05D4\u05D9\u05DD \u05D1\u05DC\u05D9\u05DC\u05D4.'},en:{q:'What is wrong with "write something nice"?',a:["It is too long",'"Nice" means something different to everyone','The word "something" is not allowed'],why:'Praise words describe nothing. Instead of "nice", say exactly what you want: a short rhyming poem about the sea at night.'}},{id:"prompt-format-ask",tier:1,topic:"prompt",correct:2,he:{q:"\u05E8\u05D5\u05E6\u05D9\u05DD \u05DC\u05E7\u05D1\u05DC \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D1\u05DC\u05D4. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05E7\u05D5\u05D5\u05D9\u05DD \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D1\u05D7\u05E8 \u05D1\u05D8\u05D1\u05DC\u05D4",'\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD "\u05DE\u05E1\u05D5\u05D3\u05E8 \u05D1\u05D1\u05E7\u05E9\u05D4"',"\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D8\u05D1\u05DC\u05D4 \u05D1\u05DE\u05E4\u05D5\u05E8\u05E9, \u05D5\u05D0\u05D9\u05DC\u05D5 \u05E2\u05DE\u05D5\u05D3\u05D5\u05EA \u05E9\u05D9\u05D4\u05D9\u05D5 \u05D1\u05D4"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05DE\u05E0\u05D7\u05E9 \u05E4\u05D5\u05E8\u05DE\u05D8. \u05D1\u05E7\u05E9\u05D4 \u05DC\u05D8\u05D1\u05DC\u05D4 \u05E2\u05DD \u05E8\u05E9\u05D9\u05DE\u05EA \u05D4\u05E2\u05DE\u05D5\u05D3\u05D5\u05EA \u05DE\u05D7\u05D6\u05D9\u05E8\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D6\u05D4, \u05D1\u05DC\u05D9 \u05E1\u05D1\u05D1 \u05EA\u05D9\u05E7\u05D5\u05E0\u05D9\u05DD."},en:{q:"You want the answer as a table. What do you do?",a:["Hope the model picks a table",'Write "make it tidy please"',"Ask for a table outright, and which columns it should have"],why:"The model does not guess format. Asking for a table and listing the columns returns exactly that, with no round of fixes."}},{id:"prompt-language-ask",tier:1,topic:"prompt",correct:0,he:{q:"\u05E8\u05D5\u05E6\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D1\u05D8\u05D5\u05D7 \u05DC\u05E2\u05E9\u05D5\u05EA?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05E4\u05E8\u05D5\u05DE\u0
