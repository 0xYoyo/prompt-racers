:root{
  --gold:#ffc247;
  --gold-1:#ffe9a8; --gold-2:#ffc247; --gold-3:#f59310;
  --ink:#12121c; --ink-2:#1c1c2b;
  --panel:rgba(22,22,34,.82); --panel-solid:#191926;
  --stroke:rgba(255,255,255,.10); --stroke-hi:rgba(255,255,255,.22);
  --txt:#f4f1ea; --txt-dim:#a8a29a;
  --good:#7ee081; --warn:#ffb347; --bad:#ff6b6b; --info:#6fc3ff;
  --token:#ffd66b;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-panel:0 10px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  --sh-pop:0 18px 50px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
#ui{font-family:var(--font);color:var(--txt);}
#ui *{pointer-events:none}
#ui .on{pointer-events:auto}

/* ---- layout helpers that flip correctly under RTL ---- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.fill{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}

/* Logical properties everywhere so a single rule serves both directions. */
.hud-tl{position:absolute;inset-block-start:18px;inset-inline-start:18px}
.hud-tr{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.hud-bl{position:absolute;inset-block-end:18px;inset-inline-start:18px}
.hud-br{position:absolute;inset-block-end:18px;inset-inline-end:18px}
.hud-tc{position:absolute;inset-block-start:14px;left:50%;transform:translateX(-50%)}

/* ---- surfaces ---- */
.panel{
  background:linear-gradient(180deg,rgba(40,40,58,.9),rgba(18,18,28,.92));
  border:1px solid var(--stroke); border-radius:var(--r-m);
  box-shadow:var(--sh-panel); backdrop-filter:blur(8px);
}
.panel-lift{background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(24,24,36,.96));
  border:1px solid var(--stroke-hi); border-radius:var(--r-l); box-shadow:var(--sh-pop)}

/* ---- type ---- */
.display{
  font-weight:900; letter-spacing:-.02em; line-height:.92;
  background:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.5));
  paint-order:stroke fill;
}
.display-white{background:linear-gradient(180deg,#fff 20%,#e8e2d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.rtl .label{letter-spacing:.04em}     /* Hebrew has no case; wide tracking hurts it */
.num{font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate}

/* ---- buttons ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:17px;color:#2a1c00;
  padding:14px 34px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 0 #a4620a, 0 12px 26px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4620a,0 6px 14px rgba(0,0,0,.45)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--stroke-hi);box-shadow:none;font-weight:700}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:3px solid var(--info);outline-offset:3px}

/* ---- misc ---- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1));transition:width .45s var(--ease)}
.rtl .bar>i{background:linear-gradient(270deg,var(--gold-2),var(--gold-1))}

.fade-in{animation:fadeIn .35s var(--ease) both}
.pop-in{animation:popIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .fade-in,.pop-in{animation:none}
  *{transition-duration:.01ms !important}

estions you are allowed per day"],why:"A model can only hold so much text at once. In a very long chat the older parts get pushed out \u2014 so it pays to restate what matters."}},{id:"prompt-what-is",tier:1,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05D4\u05E9\u05DD \u05E9\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \u05E9\u05D0\u05D9\u05EA\u05D5 \u05E2\u05D5\u05D1\u05D3\u05D9\u05DD","\u05D4\u05DB\u05E4\u05EA\u05D5\u05E8 \u05E9\u05E9\u05D5\u05DC\u05D7 \u05D0\u05EA \u05D4\u05D4\u05D5\u05D3\u05E2\u05D4","\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05D0\u05D5 \u05D4\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05BEAI"],why:"\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05D5\u05D0 \u05DB\u05DC \u05DE\u05D4 \u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05BEAI \u05DB\u05D3\u05D9 \u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD. \u05D6\u05D5 \u05E0\u05E7\u05D5\u05D3\u05EA \u05D4\u05D4\u05E9\u05E4\u05E2\u05D4 \u05D4\u05D2\u05D3\u05D5\u05DC\u05D4 \u05D1\u05D9\u05D5\u05EA\u05E8 \u2014 \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4 \u05DE\u05EA\u05D7\u05D9\u05DC\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8."},en:{q:"What is a prompt?",a:["The name of the model being used","The button that sends the message","The instruction or request written to the AI"],why:"A prompt is everything written to the AI to explain what is wanted. It is the biggest point of influence \u2014 the result starts with the prompt."}},{id:"prompt-better-one",tier:1,topic:"prompt",correct:1,he:{q:"\u05D0\u05D9\u05D6\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D9\u05D9\u05EA\u05DF \u05E1\u05D9\u05E4\u05D5\u05E8 \u05E7\u05E8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8 \u05DC\u05DE\u05D4 \u05E9\u05D3\u05DE\u05D9\u05D9\u05E0\u05D5?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D9\u05E4\u05D5\u05E8, \u05EA\u05D5\u05D3\u05D4 \u05E8\u05D1\u05D4!","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D9\u05E4\u05D5\u05E8 \ el between the example and the prompt","Shows exactly what format the answer should take","Makes the prompt longer without changing the result"],why:'It is hard to describe "a table like this" in words. One small example saves a paragraph of explanation, and the model copies the format.'}},{id:"prompt-short-answer",tier:2,topic:"prompt",correct:0,he:{q:"\u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D6\u05D5\u05E8 \u05DC\u05E7\u05D1\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4?",a:['\u05DC\u05D1\u05E7\u05E9 \u05DE\u05E8\u05D0\u05E9: "\u05D1\u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA \u05DC\u05DB\u05DC \u05D4\u05D9\u05D5\u05EA\u05E8"','\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05E7\u05E6\u05E8 \u05D1\u05D1\u05E7\u05E9\u05D4" \u05D1\u05DC\u05D9 \u05DE\u05E1\u05E4\u05E8',"\u05DC\u05E9\u05D0\u05D5\u05DC \u05E9\u05D0\u05DC\u05D4 \u05E7\u05E6\u05E8\u05D4 \u05D5\u05DC\u05E7\u05D5\u05D5\u05EA \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4"],why:'"\u05E7\u05E6\u05E8" \u05D6\u05D4 \u05D9\u05D7\u05E1\u05D9, \u05D5\u05DE\u05E1\u05E4\u05E8 \u05D6\u05D4 \u05DC\u05D0. \u05D2\u05D1\u05D5\u05DC \u05D1\u05E8\u05D5\u05E8 \u2014 \u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA, \u05D7\u05DE\u05D9\u05E9\u05D4 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD \u2014 \u05D4\u05D5\u05E4\u05DA \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05E2\u05D5\u05E8\u05E4\u05DC \u05DC\u05D4\u05D5\u05E8\u05D0\u05D4 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E2\u05DE\u05D5\u05D3 \u05D1\u05D4.'},en:{q:"What helps most to get a short answer?",a:['Asking up front: "three lines at most"','Writing "keep it short" with no number',"Asking a short question and hoping for a short answer"],why:'"Short" is relative; a number is not. A clear limit \u2014 three lines, five sentences \u2014 turns a vague wish into an instruction that can be followed.'}},{id:"prompt-role",tier:3,topic:"prompt",correct:2,he:{q:'\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D4 \u05EA\u05E4\u05E7\u05D9\u05D3 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8, \u05DB\u05DE\u05D5 "\u05D1\u05EA\u05D5\u05E8 \u05DE\u05D3\u05E8\u05D9\u05DA \u05D8\u05D9\u05D5\u05DC\u05D9\u05DD"?',a:["\u05D4\u05D5\u05E4\u05DA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05DE\u05D5\u05DE\u05D7\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9 \u05D1\u05EA\u05D7\u05D5\u05DD","\u05D2\u05D5\u05E8\u05DD \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D9\u05D5\u05EA\u05E8","\u05DE\u05DB\u05D5\u05D5\u05DF \u05D0\u05EA \u05E0\u05E7\u05D5\u05D3\u05EA \u05D4\u05DE\u05D1\u05D8 \u05D5\u05D0\u05EA \u05E1\u05D5\u05D2 \u05D4\u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05D9\u05E2\u05DC\u05D5 \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05EA\u05E4\u05E7\u05D9\u05D3 \u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E3 \u05DC\u05DE\u05D5\u05D3\u05DC \u05D9\u05D3\u05E2 \u05D7\u05D3\u05E9, \u05D0\u05D1\u05DC \u05D4\u05D5\u05D0 \u05D1\u05D5\u05D7\u05E8 \u05DE\u05D0\u05D9\u05D6\u05D5 \u05D6\u05D5\u05D5\u05D9\u05EA \u05DC\u05E2\u05E0\u05D5\u05EA. \u05DE\u05D3\u05E8\u05D9\u05DA \u05D8\u05D9\u05D5\u05DC\u05D9\u05DD \u05D9\u05D3\u05D1\u05E8 \u05E2\u05DC \u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05D5\u05E0\u05D5\u05E3, \u05D1\u05D9\u05D5\u05DC\u05D5\u05D2 \u05D9\u05D3\u05D1\u05E8 \u05E2\u05DC \u05D1\u05E2\u05DC\u05D9 \u05D7\u05D9\u05D9\u05DD."},en:{q:'What does a role like "as a hiking guide" do in a prompt?',a:["Turns the model into a real expert on the subject","Makes the answer longer","Steers the point of view and what the answer brings up"],why:"A role adds no new knowledge, but it picks the angle. A hiking guide talks trails and views; a biologist talks animals."}},{id:"prompt-break-steps",tier:3,topic:"prompt",correct:1,he:{q:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D2\u05D3\u05D5\u05DC \u05D5\u05DE\u05D5\u05E8\u05DB\u05D1, \u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC \u05D1\u05DE 3\u05DC\u05D9 \u05D4\u05BEAI"],why:"\u05D8\u05E7\u05E1\u05D8 \u05DE\u05E4\u05D5\u05E8\u05E7 \u05DC\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA: \u05DE\u05D9\u05DC\u05D4, \u05D7\u05E6\u05D9 \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05E1\u05D9\u05DE\u05DF \u05E4\u05D9\u05E1\u05D5\u05E7. \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05D5\u05DB\u05D5\u05EA\u05D1 \u05D1\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05D4\u05D0\u05DC\u05D4, \u05D5\u05DC\u05DB\u05DF \u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05D0\u05D5\u05EA\u05DF."},en:{q:"What are tokens?",a:["Coins that only exist inside games","Small chunks of text that the model counts","The model names of AI systems"],why:"Text is broken into small chunks: a word, half a word, or a punctuation mark. The model reads and writes in those chunks, so those are what get counted."}},{id:"tokens-long-costs",tier:1,topic:"tokens",correct:2,he:{q:'\u05DC\u05DE\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3 "\u05E2\u05D5\u05DC\u05D4" \u05D9\u05D5\u05EA\u05E8?',a:["\u05DB\u05D9 \u05D4\u05D9\u05D0 \u05E0\u05E9\u05DC\u05D7\u05EA \u05DC\u05DE\u05E7\u05D5\u05DD \u05E8\u05D7\u05D5\u05E7 \u05D9\u05D5\u05EA\u05E8","\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05EA\u05E2\u05E6\u05D1\u05DF \u05DE\u05D8\u05E7\u05E1\u05D8 \u05D0\u05E8\u05D5\u05DA","\u05DB\u05D9 \u05D9\u05E9 \u05D1\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD, \u05D5\u05DB\u05DC \u05D8\u05D5\u05E7\u05DF \u05D3\u05D5\u05E8\u05E9 \u05E2\u05D1\u05D5\u05D3\u05D4"],why:"\u05DC\u05DB\u05DC \u05D8\u05D5\u05E7\u05DF \u05D9\u05E9 \u05DE\u05D7\u05D9\u05E8 \u05E7\u05D8\u05DF \u05D1\u05D7\u05D9\u05E9\u05D5\u05D1. \u05D4\u05E8\u05D1\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u2014 \u05D4\u05E8\u05D1\u05D4 \u05D7\u05D9\u05E9\u05D5\u05D1, \u05D5\u05DC\u05DB\u05DF \u05D9\u05D5\u05EA\u05E8 \u05D6\u05DE\u05DF \u05D5\u05D9\u05D5\u05EA\u05E8 \u05E2\u05DC\u05D5\u05EA. \u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05D0\u05D5\u05E1\u05E4\u05D9\u05DD \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC."},en:{q:'Why does a very long prompt "cost" more?',a:["Because it is sent somewhere further away","Because the model gets annoyed by long text","Because it holds more tokens, and each token takes work"],why:"Every token costs a little computation. Many tokens means much computation \u2014 more time and more cost. Just like the tokens you collect on track."}},{id:"tokens-both-ways",tier:2,topic:"tokens",correct:0,he:{q:"\u05DE\u05D4 \u05E0\u05E1\u05E4\u05E8 \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05D2\u05DD \u05DE\u05D4 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD \u05D5\u05D2\u05DD \u05DE\u05D4 \u05E9\u05D7\u05D5\u05D6\u05E8 \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4","\u05E8\u05E7 \u05DE\u05D4 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD","\u05E8\u05E7 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05D7\u05D5\u05D6\u05E8\u05EA"],why:"\u05E9\u05E0\u05D9 \u05D4\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05E0\u05E1\u05E4\u05E8\u05D9\u05DD. \u05DC\u05DB\u05DF \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05DE\u05D1\u05E7\u05E9 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E2\u05E0\u05E7\u05D9\u05EA \u05D9\u05DB\u05D5\u05DC \u05DC\u05E2\u05DC\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E2\u05E6\u05DE\u05D5 \u2014 \u05D5\u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D4\u05D0\u05D5\u05E8\u05DA \u05E9\u05E6\u05E8\u05D9\u05DA."},en:{q:"What gets counted as tokens?",a:["Both what you send and what comes back","Only what you send","Only the answer that comes back"],why:"Both directions count. Asking for a giant answer can cost more than the question did \u2014 another reason to ask for the length you actually need."}},{id:"tokens-save-well",tier:2,topic:"tokens",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D7\u05D5\u05E1\u05DB\u05D9\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E4\u05D2\u05D5\u05E2 \u05D1\u05EA\u05D5\u05E6\u05D0\u05D4?",a:["\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D0\u05EA \u05DB\u05DC \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D9\u05DD \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D7\u05EA","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D1\u05E7\u05D9\u05E6\u05D5\u05E8\u05D9\u05DD \u05E9\u05E7\u05E9\u05D4 \u05DC\u05D4\u05D1\u05D9\u05DF","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05DE\u05D5\u05E7\u05D3, \u05D1\u05DC\u05D9 \u05D7\u05D6\u05E8\u05D5\u05EA \u05D5\u05D1\u05DC\u05D9 \u05DE\u05D9\u05DC\u05D5\u05D9"],why:'\u05D7\u05D9\u05E1\u05DB\u05D5\u05DF \u05D7\u05DB\u05DD \u05DE\u05D5\u05D7\u05E7 \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E3 \u2014 \u05E0\u05D9\u05DE\u05D5\u05E1\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D9\u05DD, \u05D7\u05D6\u05E8\u05D5\u05EA, "\u05DB\u05DE\u05D5 \u05E9\u05D0\u05DE\u05E8\u05EA\u05D9 \u05E7\u05D5\u05D3\u05DD". \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05E9\u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD \u05E0\u05E9\u05D0\u05E8\u05D9\u05DD \u05EA\u05DE\u05D9\u05D3.'},en:{q:"How do you save tokens without hurting the result?",a:["Delete every detail and leave one word","Write in abbreviations that are hard to follow","Write a focused prompt, no repeats and no filler"],why:'Smart saving cuts what adds nothing \u2014 long pleasantries, repeats, "as I said before". The details that explain what you want always stay.'}},{id:"tokens-worth-spending",tier:3,topic:"tokens",correct:1,he:{q:'\u05DE\u05EA\u05D9 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05E9\u05D5\u05D5\u05D4 "\u05DC\u05D1\u05D6\u05D1\u05D6" \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?',a:["\u05D0\u05E3 \u05E4\u05E2\u05DD \u2014 \u05E7\u05E6\u05E8 \u05EA\u05DE\u05D9\u05D3 \u05E2\u05D3\u05D9\u05E3","\u05DB\u05E9\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05D4\u05E7\u05E9\u05E8 \u05D0\u05D5 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05E9\u05D1\u05D0\u05DE\u05EA \u05DE\u05E9\u05E4\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05E9\u05E8\u05D5\u05E6\u05D9\u05DD \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D9\u05E7\u05D7 \u05D9\u05D5\u05EA\u05E8 \u05D6\u05DE\u05DF \u05DC\u05D7\u05E9\u05D5\u05D1"],why:"\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D4\u05DD \u05EA\u05E7\u05E6\u05D9\u05D1, \u05DC\u05D0 \u05E6\u05D9\u05D5\u05DF. \u05DE\u05E9\u05E4\u05D8 \u05D4\u05E7\u05E9\u05E8 \u05E9\u05D7\u05D5\u05E1\u05DA \u05E9\u05DC\u05D5\u05E9\u05D4 \u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05DB\u05D5\u05E9\u05DC\u05D9\u05DD \u05D4\u05D5\u05D0 \u05D4\u05E2\u05E1\u05E7\u05D4 \u05D4\u05DB\u05D9 \u05DE\u05E9\u05EA\u05DC\u05DE\u05EA \u05E9\u05D9\u05E9."},en:{q:'When is it actually worth "spending" tokens?',a:["Never \u2014 shorter is always better","When context or an example genuinely improves the answer","When you want the model to take longer thinking"],why:"Tokens are a budget, not a score. One sentence of context that saves three failed attempts is the best deal on the table."}},{id:"tokens-languages",tier:3,topic:"tokens",correct:0,he:{q:"\u05DE\u05E9\u05E4\u05D8 \u05E7\u05E6\u05E8 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05D5\u05DE\u05E9\u05E4\u05D8 \u05E7\u05E6\u05E8 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA \u2014 \u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF?",a:["\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D5\u05E0\u05D4 \u05D1\u05D9\u05DF \u05D4\u05E9\u05E4\u05D5\u05EA","\u05EA\u05DE\u05D9\u05D3 \u05D9\u05D5\u05E6\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D5 \u05DE\u05E1\u05E4\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD","\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05E1\u05E4\u05E8\u05D9\u05DD \u05DC\u05E4\u05D9 \u05DE\u05E1\u05E4\u05E8 \u05D4\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u05D1\u05DC\u05D1\u05D3"],why:"\u05D4\u05D7\u05DC\u05D5\u05E7\u05D4 \u05DC\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05DC\u05DE\u05D3\u05D4 \u05D1\u05E2\u05D9\u05E7\u05E8 \u05DE\u05D8\u05E7\u05E1\u05D8\u05D9\u05DD \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA, \u05D5\u05DC\u05DB\u05DF \u05E2\u05D1\u05E8\u05D9\u05EA \u05DE\u05EA\u05E4\u05E8\u05E7\u05EA \u05DC\u05E8\u05D5\u05D1 \u05DC\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8. \u05D0\u05D5\u05EA\u05D5 \u05E8\u05E2\u05D9\u05D5\u05DF, \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD."},en:{q:"A short Hebrew sentence and a short English one \u2014 what is true?",a:["The token count can differ between languages","It always comes out to exactly the same number","Tokens are counted purely by number of letters"],why:"Token splitting was learned mostly from English text, so Hebrew usually breaks into smaller pieces. Same idea, more tokens."}},{id:"iterate-try-again",tier:1,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D9\u05E6\u05D0\u05D4 \u05DC\u05D2\u05DE\u05E8\u05D9 \u05DC\u05D0 \u05DE\u05D4 \u05E9\u05E8\u05E6\u05D5. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E2\u05E9\u05D5\u05EA?",a:["\u05DC\u05D5\u05D5\u05EA\u05E8 \u05D5\u05DC\u05E2\u05E9\u05D5\u05EA \u05D0\u05EA \u05D6\u05D4 \u05DC\u05D1\u05D3","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05E9\u05D5\u05D1 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8","\u05DC\u05E9\u05E4\u05E8 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u2014 \u05D5\u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1"],why:"\u05E0\u05D9\u05E1\u05D9\u05D5\u05DF \u05E8\u05D0\u05E9\u05D5\u05DF \u05D4\u05D5\u05D0 \u05D8\u05D9\u05D5\u05D8\u05D4, \u05DC\u05D0 \u05D2\u05D6\u05E8 \u05D3\u05D9\u05DF. \u05DE\u05D9 \u05E9\u05DE\u05E9\u05E4\u05E8 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D5\u05DE\u05E0\u05E1\u05D4 \u05E9\u05D5\u05D1 \u05DE\u05E7\u05D1\u05DC \u05EA\u05D5\u05E6\u05D0\u05D5\u05EA \u05D8\u05D5\u05D1\u05D5\u05EA \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DE\u05DE\u05D9 \u05E9\u05DE\u05E0\u05E1\u05D4 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA."},en:{q:"The answer came out nothing like what you wanted. What is best?",a:["Give up and do it yourself","Send the exact same prompt again","Improve the prompt \u2014 and try again"],why:"A first try is a draft, not a verdict. People who sharpen the prompt and retry get far better results than people who ask once."}},{id:"iterate-keep-change",tier:2,topic:"iterate",correct:1,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05DE\u05E2\u05D8 \u05D8\u05D5\u05D1\u05D4. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D9\u05DC \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E2\u05DB\u05E9\u05D9\u05D5?",a:['\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05DC\u05D0 \u05D8\u05D5\u05D1" \u05D5\u05DC\u05D7\u05DB\u05D5\u05EA',"\u05DC\u05D4\u05D2\u05D9\u05D3 \u05DE\u05D4 \u05DC\u05E9\u05DE\u05D5\u05E8 \u05D5\u05DE\u05D4 \u05DC\u05E9\u05E0\u05D5\u05EA","\u05DC\u05E4\u05EA\u05D5\u05D7 \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D5\u05DC\u05D4\u05EA\u05D7\u05D9\u05DC \u05DE\u05D4\u05D4\u05EA\u05D7\u05DC\u05D4"],why:'"\u05DC\u05D0 \u05D8\u05D5\u05D1" \u05DE\u05E9\u05D0\u05D9\u05E8 \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05D7\u05E9. "\u05D4\u05E4\u05EA\u05D9\u05D7\u05D4 \u05DE\u05E6\u05D5\u05D9\u05E0\u05EA, \u05D4\u05E1\u05D5\u05E3 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D3\u05D9" \u05E0\u05D5\u05EA\u05DF \u05DC\u05D5 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E6\u05E8\u05D9\u05DA \u05DB\u05D3\u05D9 \u05DC\u05EA\u05E7\u05DF \u05E8\u05E7 \u05D0\u05EA \u05D4\u05D7\u05DC\u05E7 \u05D4\u05E9\u05D1\u05D5\u05E8.'},en:{q:"The answer is almost right. What is most effective to write now?",a:['Write "not good" and wait',"Say what to keep and what to change","Open a new chat and start over"],why:'"Not good" leaves the model guessing. "The opening is great, the ending is too long" gives it exactly what it needs to fix only the broken part.'}},{id:"iterate-one-change",tier:2,topic:"iterate",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E9\u05E0\u05D5\u05EA \u05D3\u05D1\u05E8 \u05D0\u05D7\u05D3 \u05D1\u05DB\u05DC \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF?",a:["\u05DB\u05D9 \u05DB\u05DB\u05D4 \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05D5\u05D0 \u05D6\u05D4 \u05E9\u05E2\u05D6\u05E8","\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05DE\u05E1\u05D5\u05D2\u05DC \u05DC\u05E7\u05DC\u05D5\u05D8 \u05E9\u05E0\u05D9 \u05E9\u05D9\u05E0\u05D5\u05D9\u05D9\u05DD","\u05DB\u05D9 \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF \u05E2\u05DD \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05D3 \u05E8\u05E5 \u05DE\u05D4\u05E8 \u05D9\u05D5\u05EA\u05E8"],why:"\u05DB\u05E9\u05E9\u05E0\u05D9 \u05D3\u05D1\u05E8\u05D9\u05DD \u05DE\u05E9\u05EA\u05E0\u05D9\u05DD \u05D9\u05D7\u05D3 \u05D5\u05DE\u05E9\u05D4\u05D5 \u05DE\u05E9\u05EA\u05E4\u05E8 \u2014 \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA \u05DE\u05D9 \u05D0\u05D7\u05E8\u05D0\u05D9. \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05D3 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u05D4\u05D5\u05E4\u05DA \u05E0\u05D9\u05D7\u05D5\u05E9 \u05DC\u05E0\u05D9\u05E1\u05D5\u05D9 \u05D0\u05DE\u05D9\u05EA\u05D9."},en:{q:"Why change one thing per attempt?",a:["So you know which change is the one that helped","Because the model cannot handle two changes","Because a one-change attempt runs faster"],why:"When two things change together and something improves, you cannot tell which did it. One change at a time turns guessing into a real experiment."}},{id:"iterate-fresh-chat",tier:3,topic:"iterate",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05EA\u05D7\u05D9\u05DC \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05EA\u05E7\u05DF?",a:["\u05D0\u05D7\u05E8\u05D9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D7\u05DE\u05E9 \u05D4\u05D5\u05D3\u05E2\u05D5\u05EA, \u05EA\u05DE\u05D9\u05D3","\u05DB\u05E9\u05D4\u05E9\u05D9\u05D7\u05D4 \u05DE\u05DC\u05D0\u05D4 \u05D1\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05D9\u05E9\u05E0\u05D9\u05DD \u05E9\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05DC\u05D7\u05D6\u05D5\u05E8","\u05D0\u05E3 \u05E4\u05E2\u05DD \u2014 \u05EA\u05DE\u05D9\u05D3 \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E9\u05D9\u05D7\u05D4"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D5\u05D0\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E9\u05D9\u05D7\u05D4, \u05DB\u05D5\u05DC\u05DC \u05D4\u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05E9\u05E0\u05DB\u05E9\u05DC\u05D5, \u05D5\u05DE\u05DE\u05E9\u05D9\u05DA \u05DC\u05D4\u05D9\u05D2\u05E8\u05E8 \u05D0\u05DC\u05D9\u05D4\u05DD. \u05E4\u05EA\u05D9\u05D7\u05D4 \u05E0\u05E7\u05D9\u05D9\u05D4 \u05E2\u05DD \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05DE\u05E9\u05D5\u05E4\u05E8 \u05E2\u05D5\u05E7\u05E4\u05EA \u05D0\u05EA \u05DB\u05DC \u05D4\u05E8\u05E2\u05E9 \u05D4\u05D6\u05D4."},en:{q:"When is a fresh chat better than more fixing?",a:["After exactly five messages, always","When the chat is full of old directions that keep coming back","Never \u2014 continuing the same chat is always better"],why:"The model sees the whole chat, failed attempts included, and keeps drifting back to them. A clean start with the improved prompt skips all that noise."}},{id:"mistakes-confident",tier:1,topic:"mistakes",correct:0,he:{q:"\u05D4\u05BEAI \u05E2\u05E0\u05D4 \u05D1\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05DE\u05DC\u05D0. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E1\u05DE\u05D5\u05DA \u05E2\u05DC \u05D6\u05D4?",a:["\u05DC\u05D0 \u05D1\u05D4\u05DB\u05E8\u05D7 \u2014 \u05D2\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D5\u05D7\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D2\u05D5\u05D9\u05D4","\u05DB\u05DF, \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05E2\u05D9\u05D3 \u05E9\u05D4\u05D9\u05D0 \u05E0\u05DB\u05D5\u05E0\u05D4","\u05DB\u05DF, \u05D0\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D5\u05DE\u05E4\u05D5\u05E8\u05D8\u05EA"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05DB\u05D5\u05EA\u05D1 \u05D4\u05DB\u05D5\u05DC \u05D1\u05D0\u05D5\u05EA\u05D5 \u05D8\u05D5\u05DF \u05D1\u05D8\u05D5\u05D7, \u05D2\u05DD \u05DB\u05E9\u05D4\u05D5\u05D0 \u05D8\u05D5\u05E2\u05D4. \u05D4\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D1\u05D8\u05E7\u05E1\u05D8 \u05D4\u05D5\u05D0 \u05E1\u05D2\u05E0\u05D5\u05DF \u05DB\u05EA\u05D9\u05D1\u05D4 \u2014 \u05DC\u05D0 \u05D4\u05D5\u05DB\u05D7\u05D4."},en:{q:"The AI answered with total confidence. Can you rely on it?",a:["Not necessarily \u2014 a very confident answer can still be wrong","Yes, confidence means it is correct","Yes, if the answer is long and detailed"],why:"The model writes everything in the same confident tone, including its mistakes. Confidence in the text is a writing style, not proof."}},{id:"mistakes-check-fact",tier:1,topic:"mistakes",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E2\u05D5\u05D1\u05D3\u05D4 \u05E9\u05D4\u05BEAI \u05E0\u05EA\u05DF?",a:["\u05E9\u05D5\u05D0\u05DC\u05D9\u05DD \u05D0\u05EA \u05D0\u05D5\u05EA\u05D5 AI \u05D0\u05DD \u05D4\u05D5\u05D0 \u05D1\u05D8\u05D5\u05D7","\u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05DB\u05DE\u05D4 \u05E4\u05E2\u05DE\u05D9\u05DD \u05D4\u05D5\u05D0 \u05D7\u05D6\u05E8 \u05E2\u05DC \u05D6\u05D4","\u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05DC\u05DE\u05E7\u05D5\u05E8 \u05D0\u05DE\u05D9\u05DF \u05E0\u05D5\u05E1\u05E3 \u05DE\u05D7\u05D5\u05E5 \u05DC\u05E9\u05D9\u05D7\u05D4"],why:'\u05DC\u05E9\u05D0\u05D5\u05DC \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC "\u05D0\u05EA\u05D4 \u05D1\u05D8\u05D5\u05D7?" \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC \u05E8\u05E7 \u05DE\u05D5\u05DC\u05D9\u05D3 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D5\u05D7\u05D4 \u05E2\u05D5\u05D3 \u05D9\u05D5\u05EA\u05E8. \u05D1\u05D3\u05D9\u05E7\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u05DE\u05D2\u05D9\u05E2\u05D4 \u05DE\u05DE\u05E7\u05D5\u05E8 \u05D0\u05D7\u05E8: \u05D0\u05EA\u05E8, \u05E1\u05E4\u05E8, \u05DE\u05D1\u05D5\u05D2\u05E8 \u05E9\u05D9\u05D5\u05D3\u05E2.'},en:{q:"How do you check a fact the AI gave you?",a:["Ask the same AI whether it is sure","Count how many times it repeated it","Compare it against a trustworthy source outside the chat"],why:'Asking a model "are you sure?" usually just produces an even surer answer. A real check comes from elsewhere: a site, a book, an adult who knows.'}},{id:"mistakes-hallucination",tier:2,topic:"mistakes",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D4\u05D6\u05D9\u05D4" \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC?',a:["\u05DB\u05E9\u05D4\u05D5\u05D0 \u05DE\u05E1\u05E8\u05D1 \u05DC\u05E2\u05E0\u05D5\u05EA \u05E2\u05DC \u05E9\u05D0\u05DC\u05D4","\u05DB\u05E9\u05D4\u05D5\u05D0 \u05DE\u05DE\u05E6\u05D9\u05D0 \u05E4\u05E8\u05D8 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05E0\u05DB\u05D5\u05DF \u05DC\u05D2\u05DE\u05E8\u05D9 \u05D0\u05D1\u05DC \u05D0\u05D9\u05E0\u05D5 \u05E0\u05DB\u05D5\u05DF","\u05DB\u05E9\u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4 \u05DC\u05D0\u05D8 \u05DE\u05D4\u05E8\u05D2\u05D9\u05DC"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05EA\u05DE\u05D9\u05D3 \u05DE\u05E0\u05E1\u05D4 \u05DC\u05D4\u05E9\u05DC\u05D9\u05DD \u05DE\u05E9\u05D4\u05D5 \u05E9\u05DE\u05EA\u05D0\u05D9\u05DD, \u05D2\u05DD \u05DB\u05E9\u05D0\u05D9\u05DF \u05DC\u05D5 \u05D0\u05EA \u05D4\u05DE\u05D9\u05D3\u05E2. \u05D0\u05D6 \u05E0\u05D5\u05DC\u05D3 \u05E4\u05E8\u05D8 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05DE\u05D5\u05E9\u05DC\u05DD \u05D5\u05E4\u05E9\u05D5\u05D8 \u05DC\u05D0 \u05E7\u05D9\u05D9\u05DD \u2014 \u05D5\u05DC\u05DB\u05DF \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD."},en:{q:'What is a model "hallucination"?',a:["When it refuses to answer a question","When it invents a detail that sounds completely right but is not","When it answers slower than usual"],why:"The model always tries to complete something that fits, even with no information. Out comes a detail that sounds perfect and simply does not exist \u2014 hence checking."}},{id:"mistakes-sources",tier:2,topic:"mistakes",correct:0,he:{q:"\u05D4\u05BEAI \u05E6\u05D9\u05E8\u05E3 \u05E7\u05D9\u05E9\u05D5\u05E8 \u05D0\u05D5 \u05E9\u05DD \u05E9\u05DC \u05E1\u05E4\u05E8. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05E4\u05D5\u05EA\u05D7\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E9\u05D4\u05DE\u05E7\u05D5\u05E8 \u05D1\u05D0\u05DE\u05EA \u05E7\u05D9\u05D9\u05DD \u05D5\u05DE\u05EA\u05D0\u05D9\u05DD","\u05DE\u05E2\u05EA\u05D9\u05E7\u05D9\u05DD \u05D9\u05E9\u05E8 \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4, \u05D6\u05D4 \u05E0\u05E8\u05D0\u05D4 \u05DE\u05E1\u05D5\u05D3\u05E8","\u05DE\u05E0\u05D9\u05D7\u05D9\u05DD \u05E9\u05D6\u05D4 \u05EA\u05E7\u05D9\u05DF \u05DB\u05D9 \u05D9\u05E9 \u05E9\u05DD \u05D5\u05EA\u05D0\u05E8\u05D9\u05DA"],why:"\u05E9\u05DE\u05D5\u05EA \u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05D4\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05D1\u05D5 \u05DE\u05D5\u05D3\u05DC \u05DE\u05DE\u05E6\u05D9\u05D0 \u05D1\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF. \u05DE\u05E7\u05D5\u05E8 \u05D0\u05DE\u05D9\u05EA\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E4\u05EA\u05D5\u05D7 \u2014 \u05D5\u05D6\u05D5 \u05D1\u05D3\u05D9\u05E7\u05D4 \u05E9\u05DC \u05D7\u05DE\u05E9 \u05E9\u05E0\u05D9\u05D5\u05EA."},en:{q:"The AI gave a link or a book title. What now?",a:["Open it and check the source really exists and fits","Copy it straight into the work, it looks tidy","Assume it is fine because it has a name and a date"],why:"Source names are exactly where a model invents confidently. A real source can be opened \u2014 that is a five-second check."}},{id:"mistakes-math",tier:3,topic:"mistakes",correct:2,he:{q:"\u05D1\u05D7\u05E9\u05D1\u05D5\u05DF \u05D0\u05D5 \u05D1\u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD, \u05DC\u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05E9\u05D5\u05D1 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05BEAI?",a:["\u05DB\u05D9 \u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05E2\u05D5\u05DC\u05D9\u05DD \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD","\u05DB\u05D9 \u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DC\u05D0 \u05DE\u05E1\u05D5\u05D2\u05DC \u05DC\u05D7\u05E9\u05D1 \u05D1\u05DB\u05DC\u05DC","\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05DE\u05E0\u05D7\u05E9 \u05D8\u05E7\u05E1\u05D8, \u05D5\u05D3\u05D9\u05D5\u05E7 \u05D1\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05D4\u05D5\u05D0 \u05DC\u05D0 \u05D4\u05D7\u05D5\u05D6\u05E7 \u05E9\u05DC\u05D5"],why:"\u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DE\u05E0\u05D7\u05E9 \u05DE\u05D4 \u05DE\u05EA\u05D0\u05D9\u05DD \u05DC\u05D1\u05D5\u05D0 \u05D0\u05D7\u05E8 \u05DB\u05DA \u2014 \u05D5\u05D6\u05D4 \u05DC\u05D0 \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8 \u05DB\u05DE\u05D5 \u05DC\u05D7\u05E9\u05D1. \u05D1\u05D7\u05D9\u05E9\u05D5\u05D1 \u05D0\u05E8\u05D5\u05DA \u05E9\u05D5\u05D5\u05D4 \u05EA\u05DE\u05D9\u05D3 \u05DC\u05D5\u05D5\u05D3\u05D0, \u05D0\u05D5 \u05DC\u05D1\u05E7\u05E9 \u05DE\u05DE\u05E0\u05D5 \u05DC\u05E4\u05E8\u05D8 \u05D0\u05EA \u05D4\u05E9\u05DC\u05D1\u05D9\u05DD."},en:{q:"With arithmetic or dates, why double-check the AI?",a:["Because numbers cost more tokens","Because a language model cannot calculate at all","Because it guesses text, and exact numbers are not its strength"],why:"A language model guesses what comes next \u2014 which is not the same as calculating. On a long computation, verify, or ask it to show the steps."}},{id:"vibe-what-is",tier:2,topic:"vibe",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D5\u05D9\u05D9\u05D1\u05BE\u05E7\u05D5\u05D3\u05D9\u05E0\u05D2"?',a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05E7\u05D5\u05D3 \u05DE\u05D5\u05DB\u05DF \u05DE\u05D4\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8 \u05D1\u05DC\u05D9 \u05DC\u05E9\u05E0\u05D5\ .quiz-root{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:clamp(8px,2vh,24px) clamp(8px,3vw,32px);opacity:0;visibility:hidden;
  transition:opacity .22s var(--ease),visibility .22s}
.quiz-root.show{opacity:1;visibility:visible}
.quiz-scrim{position:absolute;inset:0;
  background:radial-gradient(120% 92% at 50% 48%,rgba(6,8,20,.28),rgba(3,5,14,.74))}

.quiz-card{position:relative;width:min(720px,94vw);max-height:96vh;overflow:hidden;
  padding:clamp(12px,2.1vh,24px) clamp(14px,2.2vw,28px) clamp(12px,2vh,22px);
  display:flex;flex-direction:column;gap:clamp(7px,1.2vh,14px)}

.quiz-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.quiz-badge{font-size:12px;font-weight:900;letter-spacing:.06em;color:#2a1c00;
  padding:4px 12px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 60%,var(--gold-3))}
.quiz-topic{font-size:12px;font-weight:800;color:var(--info);
  padding:4px 11px;border-radius:var(--r-pill);
  background:rgba(111,195,255,.12);border:1px solid rgba(111,195,255,.30)}

.quiz-timer{height:7px;flex:none}
.quiz-timer>i{transition:none;background:linear-gradient(90deg,var(--gold-3),var(--gold-1))}
.quiz-timer.low>i{background:linear-gradient(90deg,#e07a2a,var(--warn))}

.quiz-q{font-size:clamp(17px,min(2.45vw,3.5vh),29px);font-weight:900;line-height:1.24;
  color:var(--txt);text-shadow:0 2px 0 rgba(0,0,0,.45);margin:clamp(1px,.5vh,6px) 0}

.quiz-opts{display:flex;flex-direction:column;gap:clamp(6px,1vh,11px)}
.quiz-opt{display:flex;align-items:center;gap:clamp(9px,1.4vw,15px);width:100%;
  font-family:var(--font);text-align:start;cursor:pointer;
  padding:clamp(7px,1.15vh,13px) clamp(9px,1.1vw,15px);
  border-radius:var(--r-m);color:var(--txt);
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1px solid var(--stroke-hi);
  transition:transform .12s var(--ease),background .15s,border-color .15s,filter .15s}
.quiz-opt:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
.quiz-opt:focus-visible{outline:3px solid var(--info);outline-offset:3px}
.quiz-key{flex:none;display:flex;align-items:center;justify-content:center;
  inline-size:clamp(26px,3.2vh,34px);block-size:clamp(26px,3.2vh,34px);
  border-radius:10px;font-size:clamp(13px,1.9vh,17px);
  background:rgba(255,255,255,.10);border:1px solid var(--stroke-hi);color:var(--txt)}
.quiz-txt{font-size:clamp(14px,min(1.62vw,2.35vh),20px);font-weight:700;line-height:1.28}

.quiz-opt.ok{background:linear-gradient(180deg,rgba(126,224,129,.30),rgba(126,224,129,.14));
  border-color:rgba(126,224,129,.72)}
.quiz-opt.ok .quiz-key{background:rgba(126,224,129,.30);border-color:rgba(126,224,129,.6)}
.quiz-opt.no{background:linear-gradient(180deg,rgba(255,107,107,.22),rgba(255,107,107,.10));
  border-color:rgba(255,107,107,.55)}
.quiz-opt.dim{filter:saturate(.35) brightness(.72)}
.quiz-answered .quiz-opt{cursor:default;transform:none}
.quiz-answered .quiz-timer{opacity:.25}
.quiz-answered .quiz-opt:hover{transform:none}

.quiz-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-block-size:16px}
.quiz-hint{font-size:12px;font-weight:800;color:var(--txt-dim);letter-spacing:.02em}

.quiz-result{display:none;flex-direction:column;gap:clamp(4px,.8vh,9px);
  padding:clamp(9px,1.3vh,15px) clamp(11px,1.3vw,17px);border-radius:var(--r-m);
  background:rgba(255,255,255,.055);border:1px solid var(--stroke)}
.quiz-answered .quiz-result{display:flex}
.quiz-verdict{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  font-size:clamp(16px,min(2vw,2.8vh),24px);font-weight:900;line-height:1.15}
.quiz-result.good{background:rgba(126,224,129,.10);border-color:rgba(126,224,129,.34)}
.quiz-result.good .quiz-verdict{color:var(--good)}
.quiz-result.soft .quiz-verdict{color:var(--gold-1)}
.quiz-sub{font-size:clamp(12px,min(1.35vw,1.95vh),16px);font-weight:800;color:var(--txt-dim)}
.quiz-why{font-size:clamp(13px,min(1.42vw,2.05vh),17px);font-weight:600;line-height:1.42;
  color:var(--txt)}
.quiz-warm{font-size:clamp(13px,min(1.42vw,2.05vh),17px);font-weight:800;color:var(--gold-1);
  line-height:1.35}

.quiz-good .quiz-card{box-shadow:var(--sh-pop),0 0 0 2px rgba(126,224,129,.5),
  0 0 70px rgba(126,224,129,.30)}

.quiz-flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(60% 46% at 50% 50%,rgba(255,214,107,.34),transparent 72%)}
.quiz-flash.on{animation:quizFlash .55s var(--ease) both}
@keyframes quizFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.quiz-flash.on{animation:none}}
