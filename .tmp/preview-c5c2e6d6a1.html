, what was already tried. It turns a generic answer into a fitting one."}},{id:"tokens-not-words",tier:1,topic:"tokens",correct:1,he:{q:"\u05D4\u05D0\u05DD \u05D8\u05D5\u05E7\u05DF \u05D6\u05D4 \u05EA\u05DE\u05D9\u05D3 \u05DE\u05D9\u05DC\u05D4 \u05E9\u05DC\u05DE\u05D4?",a:["\u05DB\u05DF, \u05D8\u05D5\u05E7\u05DF \u05D4\u05D5\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05D9\u05DC\u05D4","\u05DC\u05D0 \u2014 \u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05D7\u05E6\u05D9 \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05E1\u05D9\u05DE\u05DF \u05E4\u05D9\u05E1\u05D5\u05E7","\u05DB\u05DF, \u05D0\u05D1\u05DC \u05E8\u05E7 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA"],why:"\u05DE\u05D9\u05DC\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D5\u05EA \u05DE\u05EA\u05E4\u05E8\u05E7\u05D5\u05EA \u05DC\u05DB\u05DE\u05D4 \u05D7\u05EA\u05D9\u05DB\u05D5\u05EA, \u05D5\u05E4\u05E1\u05D9\u05E7 \u05D4\u05D5\u05D0 \u05D7\u05EA\u05D9\u05DB\u05D4 \u05D1\u05E4\u05E0\u05D9 \u05E2\u05E6\u05DE\u05D5. \u05DC\u05DB\u05DF \u05E1\u05E4\u05D9\u05E8\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05DB\u05DE\u05E2\u05D8 \u05D0\u05E3 \u05E4\u05E2\u05DD \u05DC\u05D0 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E1\u05E4\u05D9\u05E8\u05EA \u05DE\u05D9\u05DC\u05D9\u05DD."},en:{q:"Is a token always a whole word?",a:["Yes, a token is exactly one word","No \u2014 sometimes half a word or a punctuation mark","Yes, but only in English"],why:"Long words split into several chunks, and a comma is a chunk of its own. That is why a token count almost never equals a word count."}},{id:"tokens-why-count",tier:1,topic:"tokens",correct:2,he:{q:"\u05DC\u05DE\u05D4 \u05D1\u05DB\u05DC\u05DC \u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D3\u05E2\u05EA \u05DB\u05DE\u05D4 \u05E9\u05D0\u05DC\u05D5\u05EA \u05E0\u05E9\u05D0\u05DC\u05D5","\u05DB\u05D3\u05D9 \u05DC\u05EA\u05EA \u05E6\u05D9\u05D5\u05DF \u05DC\u05D0\u05D9\u05DB\u05D5\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05D9 \u05D4\u05DD \u05DE\u05D5\u05D3\u05D3\u05D9\u05DD \u05DB\u05DE\u05D4 \u05E2\u05D1\u05D5\u05D3\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05E9\u05D4"],why:"\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D4\u05DD \u05D9\u05D7\u05D9\u05D3\u05EA \u05D4\u05DE\u05D9\u05D3\u05D4 \u05E9\u05DC \u05D4\u05D8\u05E7\u05E1\u05D8: \u05DB\u05DE\u05D4 \u05E0\u05E7\u05E8\u05D0 \u05D5\u05DB\u05DE\u05D4 \u05E0\u05DB\u05EA\u05D1. \u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E0\u05DE\u05D3\u05D3\u05D9\u05DD \u05D4\u05D6\u05DE\u05DF, \u05D4\u05E2\u05DC\u05D5\u05EA \u05D5\u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05E0\u05E9\u05D0\u05E8 \u05D1\u05E9\u05D9\u05D7\u05D4."},en:{q:"Why count tokens at all?",a:["To know how many questions were asked","To grade the quality of the answer","Because they measure how much work the model did"],why:"Tokens are the unit of text: how much was read and how much was written. Time, cost and remaining room in the chat are all measured by them."}},{id:"tokens-filler-words",tier:1,topic:"tokens",correct:0,he:{q:"\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05E9\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05DE\u05D9\u05DC\u05D9\u05DD \u05E9\u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E4\u05D5\u05EA \u05DE\u05D9\u05D3\u05E2?",a:["\u05DE\u05E9\u05DC\u05DE\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4\u05DF \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E7\u05D1\u05DC \u05EA\u05DE\u05D5\u05E8\u05D4","\u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05D5\u05D7\u05E7 \u05D0\u05D5\u05EA\u05DF \u05D5\u05D0\u05D9\u05DF \u05D4\u05E9\u05E4\u05E2\u05D4","\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E2\u05E9\u05D9\u05EA \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA \u05D9\u05D5\u05EA\u05E8"],why:'\u05DB\u05DC \u05DE\u05D9\u05DC\u05D4 \u05E0\u05E1\u05E4\u05E8\u05EA, \u05D2\u05DD "\u05D1\u05D1\u05E7\u05E9\u05D4 \u05D1\u05D1\u05E7\u05E9\u05D4 \u05DE\u05D0\u05D5\u05D3". \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05E9\u05E7\u05D9\u05E2 \u05D0\u05EA \u05D0\u05D5\u05EA\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05E4\u05E8\u05D8 \u05E9\u05D1\u05D0\u05DE\u05EA \u05DE\u05DB\u05D5\u05D5\u05DF \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4.'},en:{q:"What happens when you add words that add no information?",a:["You pay for them in tokens and get nothing back","The model deletes them, so nothing changes","The answer becomes more accurate"],why:'Every word counts, including "please oh please". Better to spend those same tokens on a detail that actually steers the answer.'}},{id:"iterate-first-draft",tier:1,topic:"iterate",correct:1,he:{q:"\u05D0\u05D9\u05DA \u05D4\u05DB\u05D9 \u05E0\u05DB\u05D5\u05DF \u05DC\u05D4\u05EA\u05D9\u05D9\u05D7\u05E1 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D4\u05E8\u05D0\u05E9\u05D5\u05E0\u05D4?",a:["\u05DB\u05EA\u05D5\u05E6\u05D0\u05D4 \u05E1\u05D5\u05E4\u05D9\u05EA \u05E9\u05D0\u05D9\u05DF \u05DE\u05D4 \u05DC\u05E9\u05E0\u05D5\u05EA \u05D1\u05D4","\u05DB\u05D8\u05D9\u05D5\u05D8\u05D4 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E9\u05E4\u05E8","\u05DB\u05D4\u05D5\u05DB\u05D7\u05D4 \u05E9\u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05D9\u05D4 \u05D2\u05E8\u05D5\u05E2"],why:"\u05DB\u05DE\u05E2\u05D8 \u05EA\u05DE\u05D9\u05D3 \u05D9\u05E9 \u05E2\u05D5\u05D3 \u05E1\u05D9\u05D1\u05D5\u05D1 \u05E9\u05DE\u05E9\u05E4\u05E8. \u05DE\u05D9 \u05E9\u05DE\u05EA\u05D9\u05D9\u05D7\u05E1 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D4\u05E8\u05D0\u05E9\u05D5\u05E0\u05D4 \u05DB\u05D8\u05D9\u05D5\u05D8\u05D4 \u05DE\u05E8\u05D5\u05D5\u05D9\u05D7 \u05EA\u05D5\u05E6\u05D0\u05D4 \u05D8\u05D5\u05D1\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05D1\u05E9\u05EA\u05D9 \u05D3\u05E7\u05D5\u05EA."},en:{q:"How should you treat the first answer?",a:["As a final result with nothing to change","As a draft that can be improved","As proof the prompt was bad"],why:"There is nearly always one more round that helps. Treating the first answer as a draft buys a much better result in two minutes."}},{id:"iterate-say-what-wrong",tier:1,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D3\u05D9. \u05DE\u05D4 \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E2\u05DB\u05E9\u05D9\u05D5?",a:['"\u05DC\u05D0 \u05D0\u05D4\u05D1\u05EA\u05D9"','"\u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1"','"\u05DC\u05E7\u05E6\u05E8 \u05DC\u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA \u05D5\u05DC\u05D4\u05E9\u05D0\u05D9\u05E8 \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E2\u05D9\u05E7\u05E8"'],why:"\u05D1\u05D9\u05E7\u05D5\u05E8\u05EA \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA \u05D4\u05D9\u05D0 \u05DB\u05D1\u05E8 \u05D4\u05D5\u05E8\u05D0\u05EA \u05EA\u05D9\u05E7\u05D5\u05DF. \u05DB\u05E9\u05D0\u05D5\u05DE\u05E8\u05D9\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05D4 \u05DC\u05D4\u05D7\u05DC\u05D9\u05E3, \u05D4\u05E1\u05D9\u05D1\u05D5\u05D1 \u05D4\u05D1\u05D0 \u05DB\u05DE\u05E2\u05D8 \u05EA\u05DE\u05D9\u05D3 \u05E7\u05D5\u05DC\u05E2."},en:{q:"The answer is too long. What do you write now?",a:['"I did not like it"','"Try again"','"Cut it to three lines and keep only the main point"'],why:"Precise criticism is already a repair instruction. Say exactly what to swap and the next round almost always lands."}},{id:"iterate-ask-options",tier:1,topic:"iterate",correct:0,he:{q:"\u05DC\u05D0 \u05D1\u05D8\u05D5\u05D7\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05DB\u05D9\u05D5\u05D5\u05DF \u05DE\u05EA\u05D0\u05D9\u05DD. \u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9?",a:["\u05E9\u05DC\u05D5\u05E9 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D9\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA \u05DC\u05D1\u05D7\u05D9\u05E8\u05D4","\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05D7\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DB\u05DB\u05DC \u05D4\u05D0\u05E4\u05E9\u05E8","\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D7\u05DC\u05D9\u05D8 \u05DC\u05D1\u05D3 \u05D5\u05DC\u05D0 \u05D9\u05E1\u05E4\u05E8"],why:"\u05DB\u05DE\u05D4 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D9\u05D5\u05EA \u05D6\u05D5 \u05DC\u05E6\u05D3 \u05D6\u05D5 \u05DE\u05E8\u05D0\u05D5\u05EA \u05DE\u05D4\u05E8 \u05D0\u05D9\u05D6\u05D4 \u05DB\u05D9\u05D5\u05D5\u05DF \u05DE\u05D3\u05D1\u05E8 \u05D0\u05DC\u05D9\u05E0\u05D5. \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05D0\u05D7\u05EA \u05D5\u05DE\u05E2\u05DE\u05D9\u05E7\u05D9\u05DD \u05E8\u05E7 \u05D1\u05D4."},en:{q:"Not sure which direction fits. What is worth asking for?",a:["Three different options to choose from","One answer as long as possible","For the model to decide alone and not say"],why:"A few options side by side show quickly which direction speaks to you. Then you pick one and go deep on just that."}},{id:"mistakes-old-info",tier:1,topic:"mistakes",correct:1,he:{q:"\u05DC\u05DE\u05D4 AI \u05D9\u05DB\u05D5\u05DC \u05DC\u05E4\u05E1\u05E4\u05E1 \u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05E7\u05E8\u05D5 \u05DC\u05D0\u05D7\u05E8\u05D5\u05E0\u05D4?",a:["\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05E9\u05D5\u05DB\u05D7 \u05DE\u05D9\u05D3\u05E2 \u05D9\u05E9\u05DF","\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05D0\u05D5\u05DE\u05DF \u05E2\u05DC \u05D8\u05E7\u05E1\u05D8 \u05E2\u05D3 \u05EA\u05D0\u05E8\u05D9\u05DA \u05DE\u05E1\u05D5\u05D9\u05DD","\u05DB\u05D9 \u05D7\u05D3\u05E9\u05D5\u05EA \u05E2\u05D5\u05DC\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05D4\u05D0\u05D9\u05DE\u05D5\u05DF \u05E0\u05E2\u05E6\u05E8 \u05D1\u05E0\u05E7\u05D5\u05D3\u05EA \u05D6\u05DE\u05DF, \u05D5\u05DE\u05D4 \u05E9\u05E7\u05E8\u05D4 \u05D0\u05D7\u05E8\u05D9\u05D4 \u05E4\u05E9\u05D5\u05D8 \u05DC\u05D0 \u05E0\u05DB\u05E0\u05E1 \u05E4\u05E0\u05D9\u05DE\u05D4. \u05D1\u05E9\u05D0\u05DC\u05D5\u05EA \u05E2\u05DC \u05D0\u05D9\u05E8\u05D5\u05E2\u05D9\u05DD \u05D8\u05E8\u05D9\u05D9\u05DD \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D1\u05DE\u05E7\u05D5\u05E8 \u05DE\u05E2\u05D5\u05D3\u05DB\u05DF."},en:{q:"Why can an AI miss things that happened recently?",a:["Because it forgets older information","Because it was trained on text up to a certain date","Because news costs more tokens"],why:"Training stopped at a point in time, and whatever happened after simply never went in. For fresh events, check a current source."}},{id:"mistakes-homework",tier:1,topic:"mistakes",correct:2,he:{q:"\u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF \u05DC\u05E2\u05E9\u05D5\u05EA \u05E2\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DC AI \u05D1\u05E9\u05D9\u05E2\u05D5\u05E8\u05D9 \u05D1\u05D9\u05EA?",a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05D5\u05EA\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05E9\u05D4\u05D9\u05D0","\u05DC\u05D4\u05D2\u05D9\u05E9 \u05D1\u05DC\u05D9 \u05DC\u05E7\u05E8\u05D5\u05D0, \u05DB\u05D3\u05D9 \u05DC\u05D7\u05E1\u05D5\u05DA \u05D6\u05DE\u05DF","\u05DC\u05E7\u05E8\u05D5\u05D0, \u05DC\u05D4\u05D1\u05D9\u05DF, \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D5\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05E1\u05D2\u05E0\u05D5\u05DF \u05E9\u05DC\u05E0\u05D5"],why:"AI \u05D4\u05D5\u05D0 \u05E2\u05D5\u05D6\u05E8 \u05DC\u05D9\u05DE\u05D5\u05D3 \u05D5\u05DC\u05D0 \u05DE\u05DE\u05DC\u05D0 \u05DE\u05E7\u05D5\u05DD. \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D2\u05DD \u05DC\u05D0 \u05D1\u05D0\u05DE\u05EA \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD, \u05D5\u05D6\u05D4 \u05DE\u05EA\u05D2\u05DC\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D1\u05E9\u05D9\u05E2\u05D5\u05E8 \u05D4\u05D1\u05D0."},en:{q:"What is the right thing to do with an AI answer in homework?",a:["Copy it exactly as it is","Hand it in unread, to save time","Read it, understand it, check it and write it in your own voice"],why:"AI is a study helper, not a stand-in. What you do not understand you do not really know, and that shows up in the very next lesson."}},{id:"mistakes-private-info",tier:1,topic:"mistakes",correct:0,he:{q:"\u05D0\u05D9\u05D6\u05D4 \u05DE\u05D9\u05D3\u05E2 \u05DC\u05D0 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05DC\u05E6\u05F3\u05D0\u05D8 \u05E9\u05DC AI?",a:["\u05DB\u05EA\u05D5\u05D1\u05EA, \u05DE\u05E1\u05E4\u05E8 \u05D8\u05DC\u05E4\u05D5\u05DF \u05D5\u05E1\u05D9\u05E1\u05DE\u05D0\u05D5\u05EA","\u05E9\u05DD \u05E9\u05DC \u05D7\u05D9\u05D9\u05EA \u05DE\u05D7\u05DE\u05D3 \u05D1\u05EA\u05D5\u05DA \u05E1\u05D9\u05E4\u05D5\u05E8","\u05E9\u05D0\u05DC\u05D5\u05EA \u05E2\u05DC \u05E9\u05D9\u05E2\u05D5\u05E8\u05D9 \u05D1\u05D9\u05EA"],why:"\u05E4\u05E8\u05D8\u05D9\u05DD \u05D0\u05D9\u05E9\u05D9\u05D9\u05DD \u05DC\u05D0 \u05E6\u05E8\u05D9\u05DB\u05D9\u05DD \u05DC\u05D4\u05D9\u05DB\u05E0\u05E1 \u05DC\u05E9\u05D9\u05D7\u05D4 \u05D1\u05DB\u05DC\u05DC. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05EA\u05D0\u05E8 \u05D0\u05EA \u05D4\u05D1\u05E2\u05D9\u05D4 \u05D1\u05DC\u05D9 \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05D4\u05DE\u05D6\u05D4\u05D9\u05DD \u05D5\u05DC\u05E7\u05D1\u05DC \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D4 \u05E2\u05D6\u05E8\u05D4."},en:{q:"What information should not go into an AI chat?",a:["An address, a phone number and passwords","A pet's name inside a story","Questions about homework"],why:"Personal details do not belong in the conversation at all. Describe the problem without the identifying bits and get exactly the same help."}},{id:"vibe-describe-first",tier:1,topic:"vibe",correct:1,he:{q:"\u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05BEAI \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E7\u05D5\u05D3, \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD \u05E7\u05D5\u05D3\u05DD?",a:["\u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05E9\u05DD \u05DC\u05DE\u05E9\u05D7\u05E7","\u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05D1\u05E7\u05E6\u05E8\u05D4 \u05DE\u05D4 \u05D4\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E6\u05E8\u05D9\u05DB\u05D4 \u05DC\u05E2\u05E9\u05D5\u05EA","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DB\u05DE\u05D4 \u05E9\u05D9\u05D5\u05EA\u05E8 \u05E9\u05D5\u05E8\u05D5\u05EA \u05E7\u05D5\u05D3"],why:"\u05DE\u05D9 \u05E9\u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D4 \u05D4\u05D5\u05D0 \u05E8\u05D5\u05E6\u05D4 \u05D9\u05E7\u05D1\u05DC \u05DE\u05E9\u05D4\u05D5 \u05D0\u05E7\u05E8\u05D0\u05D9. \u05DE\u05E9\u05E4\u05D8 \u05D0\u05D5 \u05E9\u05E0\u05D9\u05D9\u05DD \u05E9\u05DE\u05EA\u05D0\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05DE\u05D8\u05E8\u05D4 \u05E9\u05D5\u05D5\u05D9\u05DD \u05D4\u05DE\u05D5\u05DF \u05E9\u05D5\u05E8\u05D5\u05EA \u05E7\u05D5\u05D3."},en:{q:"Before asking an AI to write code, what comes first?",a:["Picking a name for the game","Briefly explaining what the software needs to do","Asking for as many lines of code as possible"],why:"Whoever does not know what they want gets something random. A sentence or two describing the goal is worth a lot of code."}},{id:"ai-training-vs-use",tier:2,topic:"whatai",correct:2,he:{q:"\u05DE\u05D4 \u05D4\u05D4\u05D1\u05D3\u05DC \u05D1\u05D9\u05DF \u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D1\u05D9\u05DF \u05E9\u05D9\u05DE\u05D5\u05E9 \u05D1\u05D5?",a:["\u05D0\u05D9\u05DF \u05D4\u05D1\u05D3\u05DC, \u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8","\u05D1\u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4, \u05D5\u05D1\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3","\u05D1\u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3 \u05DE\u05E8\u05D0\u05E9, \u05D5\u05D1\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D4\u05D5\u05D0 \u05E8\u05E7 \u05E2\u05D5\u05E0\u05D4"],why:"\u05D4\u05D0\u05D9\u05DE\u05D5\u05DF \u05E7\u05E8\u05D4 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA, \u05D4\u05E8\u05D1\u05D4 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05D2\u05D9\u05E2 \u05D0\u05DC\u05D9\u05E0\u05D5. \u05E9\u05D9\u05D7\u05D4 \u05D0\u05D9\u05EA\u05D5 \u05DC\u05D0 \u05DE\u05DC\u05DE\u05D3\u05EA \u05D0\u05D5\u05EA\u05D5 \u2014 \u05D4\u05D9\u05D0 \u05E8\u05E7 \u05DE\u05E9\u05EA\u05DE\u05E9\u05EA \u05D1\u05DE\u05D4 \u05E9\u05DB\u05D1\u05E8 \u05E0\u05DC\u05DE\u05D3."},en:{q:"What is the difference between training a model and using it?",a:["No difference, they are the same thing","In training it answers, in use it learns","In training it learns ahead of time, in use it only answers"],why:"Training happened once, long before the model reached you. Chatting does not teach it \u2014 it only uses what was already learned."}},{id:"ai-bias",tier:2,topic:"whatai",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05D7\u05E9\u05D5\u05D1 \u05D0\u05D9\u05D6\u05D4 \u05DE\u05D9\u05D3\u05E2 \u05E0\u05DB\u05E0\u05E1 \u05DC\u05D0\u05D9\u05DE\u05D5\u05DF \u05E9\u05DC AI?",a:["\u05DB\u05D9 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D3\u05D9 \u05DE\u05D9\u05D3\u05E2 \u05DE\u05D0\u05D8 \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC","\u05DB\u05D9 \u05D0\u05DD \u05D4\u05DE\u05D9\u05D3\u05E2 \u05DE\u05D5\u05D8\u05D4, \u05D2\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D9\u05D9\u05E6\u05D0\u05D5 \u05DE\u05D5\u05D8\u05D5\u05EA","\u05DB\u05D9 \u05DE\u05D9\u05D3\u05E2 \u05D9\u05E9\u05DF \u05E9\u05D5\u05E7\u05DC \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05DE\u05D5\u05D3\u05DC \u05DC\u05D5\u05DE\u05D3 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05D4\u05E8\u05D0\u05D5 \u05DC\u05D5, \u05DB\u05D5\u05DC\u05DC \u05D3\u05E2\u05D5\u05EA \u05D5\u05D4\u05D8\u05D9\u05D5\u05EA \u05E9\u05D4\u05D9\u05D5 \u05D1\u05D8\u05E7\u05E1\u05D8. \u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E9\u05D0\u05D5\u05DC \u05DE\u05D9 \u05DE\u05D9\u05D5\u05E6\u05D2 \u05D1\u05DE\u05D9\u05D3\u05E2 \u05D5\u05DE\u05D9 \u05D7\u05E1\u05E8 \u05D1\u05D5."},en:{q:"Why does it matter which data goes into training an AI?",a:["Because too much data slows the model down","Because if the data is skewed, the answers come out skewed too","Because older data weighs more tokens"],why:"A model learns what it was shown, opinions and biases included. So it is worth asking who is represented in the data and who is missing."}},{id:"ai-not-search",tier:2,topic:"whatai",correct:0,he:{q:"\u05D1\u05DE\u05D4 \u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05E9\u05D5\u05E0\u05D4 \u05DE\u05DE\u05E0\u05D5\u05E2 \u05D7\u05D9\u05E4\u05D5\u05E9?",a:["\u05D4\u05D5\u05D0 \u05DE\u05E0\u05E1\u05D7 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05E4\u05E0\u05D5\u05EA \u05DC\u05D3\u05E4\u05D9\u05DD","\u05D4\u05D5\u05D0 \u05DE\u05D4\u05D9\u05E8 \u05D9\u05D5\u05EA\u05E8 \u05D1\u05DB\u05DC \u05DE\u05E6\u05D1","\u05D4\u05D5\u05D0 \u05EA\u05DE\u05D9\u05D3 \u05DE\u05D3\u05D5\u05D9\u05E7 \u05D9\u05D5\u05EA\u05E8"],why:"\u05D7\u05D9\u05E4\u05D5\u05E9 \u05DE\u05D7\u05D6\u05D9\u05E8 \u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E4\u05EA\u05D5\u05D7 \u05D5\u05DC\u05D1\u05D3\u05D5\u05E7; \u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DE\u05E0\u05E1\u05D7 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E2\u05E6\u05DE\u05D5. \u05DC\u05DB\u05DF \u05D3\u05D5\u05D5\u05E7\u05D0 \u05D0\u05D9\u05EA\u05D5 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05D1\u05E7\u05E9 \u05E2\u05DC \u05DE\u05D4 \u05D4\u05D5\u05D0 \u05DE\u05EA\u05D1\u05E1\u05E1."},en:{q:"How is a language model different from a search engine?",a:["It writes a new answer instead of pointing at pages","It is faster in every situation","It is always more accurate"],why:"Search hands back sources you can open and check; a language model writes the answer itself. Which is exactly why you should ask what it is basing it on."}},{id:"ai-memory-chat",tier:2,topic:"whatai",correct:2,he:{q:'\u05DE\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC "\u05D6\u05D5\u05DB\u05E8" \u05D1\u05EA\u05D5\u05DA \u05E9\u05D9\u05D7\u05D4?',a:["\u05D4\u05DB\u05D5\u05DC, \u05DC\u05E0\u05E6\u05D7, \u05D2\u05DD \u05DE\u05E9\u05D9\u05D7\u05D5\u05EA \u05D0\u05D7\u05E8\u05D5\u05EA","\u05E9\u05D5\u05DD \u05D3\u05D1\u05E8, \u05DB\u05DC \u05D4\u05D5\u05D3\u05E2\u05D4 \u05E2\u05D5\u05DE\u05D3\u05EA \u05DC\u05D1\u05D3","\u05D0\u05EA \u05DE\u05D4 \u05E9\u05E0\u05DE\u05E6\u05D0 \u05D1\u05E9\u05D9\u05D7\u05D4 \u05D4\u05E0\u05D5\u05DB\u05D7\u05D9\u05EA"],why:"\u05D1\u05DB\u05DC \u05E6\u05E2\u05D3 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05DE\u05D7\u05D3\u05E9 \u05D0\u05EA \u05D4\u05E9\u05D9\u05D7\u05D4 \u05E2\u05D3 \u05DB\u05D4, \u05D5\u05D6\u05D4 \u05DB\u05DC \u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05E9\u05DC\u05D5. \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05DE\u05EA\u05D7\u05D9\u05DC\u05D4 \u05DE\u05D3\u05E3 \u05E8\u05D9\u05E7 \u05DC\u05D2\u05DE\u05E8\u05D9."},en:{q:'What does the model "remember" inside a chat?',a:["Everything, forever, including other chats","Nothing \u2014 every message stands alone","Whatever is in the current conversation"],why:"At each step the model rereads the conversation so far, and that is its entire memory. A new chat starts on a completely blank page."}},{id:"prompt-constraints",tier:2,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D4 \u05D4\u05D2\u05D1\u05DC\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8, \u05DB\u05DE\u05D5 "\u05D1\u05DC\u05D9 \u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA"?',a:["\u05DE\u05D1\u05DC\u05D1\u05DC\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC","\u05DE\u05E6\u05DE\u05E6\u05DE\u05EA \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D4\u05D0\u05E4\u05E9\u05E8\u05D9\u05D5\u05EA \u05DC\u05DB\u05D9\u05D5\u05D5\u05DF \u05E9\u05E8\u05D5\u05E6\u05D9\u05DD","\u05DE\u05D0\u05E8\u05D9\u05DB\u05D4 \u05D0\u05EA \u05D6\u05DE\u05DF \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05D4\u05D2\u05D1\u05DC\u05D4 \u05D4\u05D9\u05D0 \u05D2\u05D3\u05E8 \u05D5\u05DC\u05D0 \u05E2\u05D5\u05E0\u05E9: \u05D4\u05D9\u05D0 \u05E4\u05D5\u05E1\u05DC\u05EA \u05DE\u05E8\u05D0\u05E9 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05EA\u05D0\u05D9\u05DD. \u05DB\u05DE\u05D4 \u05D2\u05D3\u05E8\u05D5\u05EA \u05DE\u05D3\u05D5\u05D9\u05E7\u05D5\u05EA \u05E9\u05D5\u05D5\u05EA \u05E4\u05E1\u05E7\u05D4 \u05E9\u05DC \u05D4\u05E1\u05D1\u05E8\u05D9\u05DD."},en:{q:'What does a limit like "no English words" do in a prompt?',a:["Confuses the model","Narrows the possible answers toward the one you want","Makes the answer take longer"],why:"A limit is a fence, not a punishment: it rules out what does not fit before the model starts. A few sharp fences beat a paragraph of explanation."}},{id:"prompt-tone",tier:2,topic:"prompt",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E1\u05D2\u05E0\u05D5\u05DF \u05DE\u05E1\u05D5\u05D9\u05DD?",a:["\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05EA \u05D4\u05E1\u05D2\u05E0\u05D5\u05DF: \u05DE\u05E6\u05D7\u05D9\u05E7, \u05E8\u05E9\u05DE\u05D9 \u05D0\u05D5 \u05DE\u05E1\u05EA\u05D5\u05E8\u05D9","\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05D4\u05DE\u05D5\u05DF \u05D0\u05D9\u05DE\u05D5\u05D2\u05F3\u05D9\u05DD \u05DC\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D4\u05DB\u05D5\u05DC \u05D1\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u05D2\u05D3\u05D5\u05DC\u05D5\u05EA"],why:'\u05E1\u05D2\u05E0\u05D5\u05DF \u05D4\u05D5\u05D0 \u05D1\u05E7\u05E9\u05D4 \u05DB\u05DE\u05D5 \u05DB\u05DC \u05D1\u05E7\u05E9\u05D4 \u05D0\u05D7\u05E8\u05EA. "\u05D1\u05D8\u05D5\u05DF \u05DE\u05E6\u05D7\u05D9\u05E7, \u05DB\u05DE\u05D5 \u05D4\u05E1\u05D1\u05E8 \u05DC\u05D7\u05D1\u05E8" \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D1\u05D7\u05D9\u05E8\u05EA \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4.'},en:{q:"How do you ask for an answer in a particular style?",a:["Name the style: funny, formal or mysterious","Add lots of emoji to the prompt","Write everything in capital letters"],why:'Style is a request like any other. "In a funny tone, like explaining to a friend" changes every word choice in the answer.'}},{id:"prompt-checklist",tier:2,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5?",a:["\u05E9\u05D9\u05E9 \u05D1\u05D5 \u05DC\u05E4\u05D7\u05D5\u05EA \u05D7\u05DE\u05D9\u05E9\u05D4 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD","\u05E9\u05D0\u05D9\u05DF \u05D1\u05D5 \u05D0\u05E3 \u05E9\u05D2\u05D9\u05D0\u05EA \u05DB\u05EA\u05D9\u05D1","\u05E9\u05DB\u05EA\u05D5\u05D1 \u05D1\u05D5 \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD, \u05DC\u05DE\u05D9, \u05D5\u05D1\u05D0\u05D9\u05D6\u05D4 \u05E4\u05D5\u05E8\u05DE\u05D8"],why:"\u05E9\u05DC\u05D5\u05E9\u05EA \u05D0\u05DC\u05D4 \u05DE\u05DB\u05E1\u05D9\u05DD \u05DB\u05DE\u05E2\u05D8 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DE\u05D7\u05D8\u05D9\u05D0\u05D4. \u05E1\u05E8\u05D9\u05E7\u05D4 \u05E9\u05DC \u05D7\u05DE\u05E9 \u05E9\u05E0\u05D9\u05D5\u05EA \u05D7\u05D5\u05E1\u05DB\u05EA \u05E9\u05DC\u05D5\u05E9\u05D4 \u05E1\u05D9\u05D1\u05D5\u05D1\u05D9 \u05EA\u05D9\u05E7\u05D5\u05E0\u05D9\u05DD."},en:{q:"What do you check in a prompt before sending it?",a:["That it has at least five sentences","That it has no spelling mistakes at all","That it says what you want, for whom, and in what format"],why:"Those three cover nearly every answer that misses. A five-second scan saves three rounds of fixing."}},{id:"prompt-negative",tier:2,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05E2\u05D3\u05D9\u05E3 \u05E2\u05DC \u05D4\u05D1\u05E7\u05E9\u05D4 "\u05DC\u05D0 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D5\u05E3 \u05E2\u05E6\u05D5\u05D1"?',a:["\u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D4\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DC\u05D5\u05E9 \u05E4\u05E2\u05DE\u05D9\u05DD","\u05DC\u05D4\u05D5\u05E1\u05D9\u05E3 \u05D2\u05DD \u05DE\u05D4 \u05DB\u05DF \u05E8\u05D5\u05E6\u05D9\u05DD: \u05E1\u05D5\u05E3 \u05E9\u05DE\u05D7 \u05D5\u05DE\u05E4\u05EA\u05D9\u05E2","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u05D2\u05D3\u05D5\u05DC\u05D5\u05EA"],why:"\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DC\u05D9\u05DC\u05D9\u05EA \u05DE\u05EA\u05D0\u05E8\u05EA \u05E8\u05E7 \u05DE\u05D4 \u05DC\u05E4\u05E1\u05D5\u05DC \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D4 \u05D0\u05D9\u05E0\u05E1\u05D5\u05E3 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D9\u05D5\u05EA. \u05D4\u05DB\u05D9\u05D5\u05D5\u05DF \u05D4\u05D7\u05D9\u05D5\u05D1\u05D9 \u05D0\u05D5\u05DE\u05E8 \u05DC\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0\u05DF \u05DC\u05DC\u05DB\u05EA."},en:{q:'What beats the request "do not write a sad ending"?',a:["Repeating the request three times","Adding what you do want: a happy, surprising ending","Writing it in capital letters"],why:"A negative request only says what to rule out and leaves endless options. The positive direction tells the model where to go."}},{id:"prompt-steps-ask",tier:2,topic:"prompt",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05DE\u05D4\u05BEAI \u05DC\u05D4\u05E8\u05D0\u05D5\u05EA \u05D0\u05EA \u05D4\u05E9\u05DC\u05D1\u05D9\u05DD?",a:["\u05DB\u05D9 \u05D0\u05D6 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E8\u05D0\u05D5\u05EA \u05D0\u05D9\u05E4\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05D5\u05D0 \u05D8\u05E2\u05D4","\u05DB\u05D9 \u05D6\u05D4 \u05DE\u05E7\u05E6\u05E8 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05D9 \u05D6\u05D4 \u05D2\u05D5\u05E8\u05DD \u05DC\u05D5 \u05DC\u05D4\u05D9\u05D5\u05EA \u05D1\u05D8\u05D5\u05D7 \u05D9\u05D5\u05EA\u05E8"],why:"\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E9\u05DC\u05D1\u05D9\u05DD \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05E9\u05DC\u05D1 \u05D0\u05D7\u05E8\u05D9 \u05E9\u05DC\u05D1 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05D0\u05DE\u05D9\u05DF \u05DC\u05E9\u05D5\u05E8\u05D4 \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D4. \u05D1\u05D3\u05E8\u05DA \u05D2\u05DD \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05E0\u05D5\u05E9\u05D0 \u05D1\u05E2\u05E6\u05DE\u05E0\u05D5."},en:{q:"Why ask the AI to show its steps?",a:["Because then you can see exactly where it went wrong","Because it shortens the answer","Because it makes the model more certain"],why:"A step-by-step answer can be checked step by step, instead of trusting the last line. Along the way you understand the topic yourself."}},{id:"tokens-long-chat",tier:2,topic:"tokens",correct:2,he:{q:'\u05DC\u05DE\u05D4 \u05E9\u05D9\u05D7\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05DE\u05EA\u05D7\u05D9\u05DC\u05D4 "\u05DC\u05E9\u05DB\u05D5\u05D7" \u05D3\u05D1\u05E8\u05D9\u05DD?',a:["\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05EA\u05E2\u05D9\u05D9\u05E3","\u05DB\u05D9 \u05E0\u05D2\u05DE\u05E8\u05D9\u05DD \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05DC \u05DE\u05D9 \u05E9\u05E9\u05D5\u05D0\u05DC","\u05DB\u05D9 \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D4\u05D9\u05E9\u05DF \u05E0\u05D3\u05D7\u05E7 \u05DE\u05D7\u05D5\u05E5 \u05DC\u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05D1\u05DB\u05DC \u05E6\u05E2\u05D3 \u05D0\u05EA \u05D4\u05E9\u05D9\u05D7\u05D4, \u05D0\u05D1\u05DC \u05E8\u05E7 \u05E2\u05D3 \u05D2\u05D1\u05D5\u05DC \u05DE\u05E1\u05D5\u05D9\u05DD. \u05DB\u05E9\u05DE\u05D2\u05D9\u05E2\u05D9\u05DD \u05DC\u05D2\u05D1\u05D5\u05DC \u05D4\u05D4\u05EA\u05D7\u05DC\u05D4 \u05E0\u05D5\u05E4\u05DC\u05EA, \u05D5\u05DC\u05DB\u05DF \u05D7\u05D5\u05D6\u05E8\u05D9\u05DD \u05E2\u05DC \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D5\u05D1."},en:{q:'Why does a very long chat start to "forget" things?',a:["Because the model gets tired","Because the asker runs out of tokens","Because the older text gets pushed out of the context window"],why:"The model rereads the chat each step, but only up to a limit. At the limit the beginning drops off \u2014 so restate what matters."}},{id:"tokens-context-budget",tier:2,topic:"tokens",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D7\u05E9\u05D5\u05D1 \u05E2\u05DC \u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8?",a:["\u05DB\u05DE\u05D5 \u05EA\u05D9\u05E7 \u05E2\u05DD \u05DE\u05E7\u05D5\u05DD \u05DE\u05D5\u05D2\u05D1\u05DC \u05E9\u05D0\u05D5\u05E8\u05D6\u05D9\u05DD \u05D1\u05D7\u05D5\u05DB\u05DE\u05D4","\u05DB\u05DE\u05D5 \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05D4\u05D4\u05E7\u05DC\u05D3\u05D4 \u05E9\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC","\u05DB\u05DE\u05D5 \u05DE\u05E1\u05E4\u05E8 \u05D4\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D5\u05BE\u05D6\u05DE\u05E0\u05D9\u05EA"],why:"\u05DE\u05D4 \u05E9\u05E0\u05DB\u05E0\u05E1 \u05DC\u05EA\u05D9\u05E7 \u05D4\u05D5\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05D4 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D5\u05D0\u05D4. \u05DC\u05DB\u05DF \u05D0\u05D5\u05E8\u05D6\u05D9\u05DD \u05D0\u05EA \u05DE\u05D4 \u05E9\u05D1\u05D0\u05DE\u05EA \u05E2\u05D5\u05D6\u05E8 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4, \u05D5\u05DC\u05D0 \u05DB\u05DC \u05DE\u05D4 \u05E9\u05D9\u05E9."},en:{q:"What is a good way to picture the context window?",a:["Like a bag with limited room that you pack wisely","Like the model's typing speed","Like the number of users at the same time"],why:"What goes in the bag is exactly what the model sees. So pack what genuinely helps the answer, not everything you have."}},{id:"tokens-answer-length",tier:2,topic:"tokens",correct:1,he:{q:"\u05D0\u05D9\u05DA \u05D4\u05D0\u05D5\u05E8\u05DA \u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05E9\u05E4\u05D9\u05E2 \u05E2\u05DC \u05D4\u05E2\u05DC\u05D5\u05EA?",a:["\u05D0\u05D9\u05DF \u05E7\u05E9\u05E8, \u05E8\u05E7 \u05D4\u05E9\u05D0\u05DC\u05D4 \u05E0\u05E1\u05E4\u05E8\u05EA","\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05E6\u05D5\u05E8\u05DB\u05EA \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD","\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05EA\u05DE\u05D9\u05D3 \u05D6\u05D5\u05DC\u05D4 \u05D9\u05D5\u05EA\u05E8"],why:'\u05D2\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E1\u05E4\u05E8\u05EA, \u05D8\u05D5\u05E7\u05DF \u05D0\u05D7\u05E8\u05D9 \u05D8\u05D5\u05E7\u05DF. \u05DC\u05DB\u05DF "\u05E2\u05D3 \u05D7\u05DE\u05D9\u05E9\u05D4 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD" \u05D7\u05D5\u05E1\u05DA \u05D1\u05D0\u05DE\u05EA, \u05D5\u05DC\u05D0 \u05E8\u05E7 \u05D1\u05D4\u05E8\u05D2\u05E9\u05D4.'},en:{q:"How does the length you ask for affect the cost?",a:["No connection \u2014 only the question is counted","A longer answer uses more tokens","A long answer is always cheaper"],why:'The answer is counted too, token by token. So "five sentences at most" saves for real, not just in feeling.'}},{id:"iterate-compare-two",tier:2,topic:"iterate",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05DE\u05E9\u05E0\u05D9 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8\u05D9\u05DD \u05D8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8?",a:["\u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05DE\u05E0\u05D5\u05DE\u05E1 \u05D9\u05D5\u05EA\u05E8","\u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E9\u05D0\u05E8\u05D5\u05DA \u05D9\u05D5\u05EA\u05E8","\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D0\u05EA \u05E9\u05E0\u05D9\u05D4\u05DD \u05D5\u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA"],why:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8\u05D9\u05DD \u05E7\u05E9\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05DC\u05E0\u05D7\u05E9 \u05DE\u05E8\u05D0\u05E9. \u05E0\u05D9\u05E1\u05D5\u05D9 \u05E7\u05D8\u05DF \u2014 \u05D0\u05D5\u05EA\u05D5 \u05E0\u05D5\u05E9\u05D0, \u05E9\u05EA\u05D9 \u05D2\u05E8\u05E1\u05D0\u05D5\u05EA \u2014 \u05E0\u05D5\u05EA\u05DF \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D5\u05D3\u05D0\u05D9\u05EA \u05EA\u05D5\u05DA \u05D3\u05E7\u05D4."},en:{q:"How do you know which of two prompts is better?",a:["The one that sounds more polite","The one that is longer","Run both and compare the answers"],why:"With prompts, guessing ahead is hard. A tiny experiment \u2014 same topic, two versions \u2014 settles it in a minute."}},{id:"iterate-save-good",tier:2,topic:"iterate",correct:0,he:{q:"\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D9\u05E6\u05D0 \u05DE\u05E6\u05D5\u05D9\u05DF. \u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E2\u05E9\u05D5\u05EA \u05D0\u05D9\u05EA\u05D5?",a:["\u05DC\u05E9\u05DE\u05D5\u05E8 \u05D0\u05D5\u05EA\u05D5 \u05D5\u05DC\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05D5 \u05E9\u05D5\u05D1","\u05DC\u05DE\u05D7\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D5 \u05DB\u05D3\u05D9 \u05DC\u05D0 \u05DC\u05D4\u05EA\u05D1\u05DC\u05D1\u05DC","\u05DC\u05D0 \u05DC\u05D2\u05E2\u05EA \u05D1\u05D5 \u05D9\u05D5\u05EA\u05E8 \u05DC\u05E2\u05D5\u05DC\u05DD"],why:"\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D8\u05D5\u05D1 \u05D4\u05D5\u05D0 \u05DB\u05DC\u05D9 \u05D5\u05DC\u05D0 \u05DE\u05E7\u05E8\u05D4 \u05D7\u05D3\u05BE\u05E4\u05E2\u05DE\u05D9. \u05E9\u05D5\u05DE\u05E8\u05D9\u05DD, \u05DE\u05D7\u05DC\u05D9\u05E4\u05D9\u05DD \u05D1\u05E4\u05E2\u05DD \u05D4\u05D1\u05D0\u05D4 \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E0\u05D5\u05E9\u05D0, \u05D5\u05D7\u05D5\u05E1\u05DB\u05D9\u05DD \u05D0\u05EA \u05DB\u05DC \u05D4\u05D3\u05E8\u05DA."},en:{q:"A prompt came out great. What should you do with it?",a:["Save it and use it again","Delete it so it does not confuse you","Never touch it again"],why:"A good prompt is a tool, not a one-off. Save it, swap just the topic next time, and skip the whole road there."}},{id:"iterate-ask-questions",tier:2,topic:"iterate",correct:1,he:{q:"\u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8 \u05DB\u05E9\u05E7\u05E9\u05D4 \u05DC\u05E0\u05E1\u05D7 \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3","\u05DC\u05D1\u05E7\u05E9 \u05DE\u05D4\u05BEAI \u05DC\u05E9\u05D0\u05D5\u05DC \u05E9\u05D0\u05DC\u05D5\u05EA \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D4 \u05D1\u05E7\u05E9\u05D4 \u05DB\u05DE\u05D4 \u05E4\u05E2\u05DE\u05D9\u05DD"],why:'\u05DB\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E9\u05D5\u05D0\u05DC "\u05DC\u05D0\u05D9\u05D6\u05D4 \u05D2\u05D9\u05DC? \u05D1\u05D0\u05D9\u05D6\u05D4 \u05D0\u05D5\u05E8\u05DA?", \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05E9\u05DC\u05D5 \u05DE\u05D2\u05DC\u05D5\u05EA \u05DE\u05D4 \u05D7\u05E1\u05E8 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8. \u05E2\u05D5\u05E0\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4\u05DF \u05D5\u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA.'},en:{q:"What helps when the request is hard to phrase?",a:["Writing an extra long prompt","Asking the AI to ask questions before it answers","Sending the same request several times"],why:'When the model asks "for what age? how long?", its questions reveal what the prompt is missing. Answer them and the result lands.'}},{id:"mistakes-two-answers",tier:2,topic:"mistakes",correct:2,he:{q:"\u05E7\u05D9\u05D1\u05DC\u05D5 \u05E9\u05EA\u05D9 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E1\u05D5\u05EA\u05E8\u05D5\u05EA \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E9\u05D0\u05DC\u05D4. \u05DE\u05D4 \u05D6\u05D4 \u05D0\u05D5\u05DE\u05E8?",a:["\u05E9\u05D0\u05D7\u05EA \u05DE\u05D4\u05DF \u05D1\u05D8\u05D5\u05D7 \u05E0\u05DB\u05D5\u05E0\u05D4","\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05EA\u05E7\u05DC\u05E7\u05DC","\u05E9\u05DB\u05D3\u05D0\u05D9 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D0\u05EA \u05E9\u05EA\u05D9\u05D4\u05DF \u05D1\u05DE\u05E7\u05D5\u05E8 \u05D7\u05D9\u05E6\u05D5\u05E0\u05D9"],why:"\u05E1\u05EA\u05D9\u05E8\u05D4 \u05D4\u05D9\u05D0 \u05E1\u05D9\u05DE\u05DF \u05D0\u05D6\u05D4\u05E8\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05D6\u05D4\u05D1: \u05D4\u05D9\u05D0 \u05DE\u05E1\u05DE\u05E0\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05D1\u05D5 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05D1\u05D8\u05D5\u05D7. \u05E9\u05DD \u05E2\u05D5\u05E6\u05E8\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD."},en:{q:"The same question got two contradicting answers. What does that mean?",a:["One of them is definitely right","The model is broken","Both are worth checking against an outside source"],why:"A contradiction is a gift of a warning sign: it marks exactly where the model is unsure. That is where you stop and check."}},{id:"mistakes-ask-reasoning",tier:2,topic:"mistakes",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E2\u05DC \u05DE\u05D4 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05EA\u05D1\u05E1\u05E1\u05EA?",a:["\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D4\u05E1\u05D1\u05E8 \u05D0\u05D9\u05DA \u05D4\u05D5\u05D0 \u05D4\u05D2\u05D9\u05E2 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4, \u05D5\u05D0\u05D6 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD","\u05E9\u05D5\u05D0\u05DC\u05D9\u05DD \u05D0\u05DD \u05D4\u05D5\u05D0 \u05D1\u05D8\u05D5\u05D7","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D9\u05D5\u05EA\u05E8"],why:"\u05D4\u05E1\u05D1\u05E8 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D7\u05D5\u05DF, \u05D2\u05DD \u05DB\u05E9\u05D4\u05D5\u05D0 \u05DC\u05D0 \u05DE\u05D5\u05E9\u05DC\u05DD. \u05D4\u05E6\u05D4\u05E8\u05EA \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D7\u05D5\u05DF \u05D1\u05DB\u05DC\u05DC, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E4\u05D4 \u05DE\u05D9\u05D3\u05E2."},en:{q:"How do you check what an answer is based on?",a:["Ask it to explain how it got there, then check that","Ask whether it is sure","Ask for a longer answer"],why:"An explanation can be examined, even an imperfect one. A statement of confidence cannot be examined at all, so it adds nothing."}},{id:"mistakes-images-fake",tier:2,topic:"mistakes",correct:1,he:{q:"\u05E8\u05D0\u05D5 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05DE\u05D3\u05D4\u05D9\u05DE\u05D4 \u05D1\u05E8\u05E9\u05EA. \u05D0\u05D9\u05DA \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05DD AI \u05D9\u05E6\u05E8 \u05D0\u05D5\u05EA\u05D4?",a:["\u05D0\u05DD \u05D4\u05D9\u05D0 \u05E6\u05D1\u05E2\u05D5\u05E0\u05D9\u05EA \u05DE\u05D0\u05D5\u05D3 \u05D4\u05D9\u05D0 \u05DE\u05D6\u05D5\u05D9\u05E4\u05EA","\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E4\u05E8\u05D8\u05D9\u05DD \u05DE\u05D5\u05D6\u05E8\u05D9\u05DD \u05D5\u05DE\u05D1\u05E8\u05E8\u05D9\u05DD \u05DE\u05D0\u05D9\u05E4\u05D4 \u05D4\u05D9\u05D0 \u05D4\u05D2\u05D9\u05E2\u05D4","\u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05E9\u05DC AI \u05EA\u05DE\u05D9\u05D3 \u05DE\u05D8\u05D5\u05E9\u05D8\u05E9\u05D5\u05EA"],why:"\u05DB\u05DC\u05D9\u05DD \u05DC\u05D9\u05E6\u05D9\u05E8\u05EA \u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05DE\u05E9\u05EA\u05E4\u05E8\u05D9\u05DD \u05DB\u05DC \u05D4\u05D6\u05DE\u05DF, \u05D0\u05D6 \u05D0\u05D9\u05DF \u05E1\u05D9\u05DE\u05DF \u05D0\u05D7\u05D3 \u05D1\u05D8\u05D5\u05D7. \u05D4\u05D1\u05D3\u05D9\u05E7\u05D4 \u05D4\u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u05D4\u05D9\u05D0 \u05DE\u05D9 \u05E4\u05E8\u05E1\u05DD \u05D5\u05DE\u05D0\u05D9\u05E4\u05D4 \u05D6\u05D4 \u05D4\u05D2\u05D9\u05E2."},en:{q:"You saw an amazing photo online. How do you tell if AI made it?",a:["If it is very colourful, it is fake","Look for odd details and trace where it came from","AI images are always blurry"],why:"Image tools keep improving, so there is no single reliable tell. The real check is who posted it and where it came from."}},{id:"mistakes-unfair-answer",tier:2,topic:"mistakes",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E9\u05DE\u05E2\u05EA \u05DC\u05D0 \u05D4\u05D5\u05D2\u05E0\u05EA \u05DB\u05DC\u05E4\u05D9 \u05E7\u05D1\u05D5\u05E6\u05EA \u05D0\u05E0\u05E9\u05D9\u05DD. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD, \u05D4\u05DE\u05D5\u05D3\u05DC \u05D1\u05D8\u05D7 \u05E6\u05D5\u05D3\u05E7","\u05DE\u05E2\u05EA\u05D9\u05E7\u05D9\u05DD \u05D5\u05DE\u05E8\u05D0\u05D9\u05DD \u05DC\u05D7\u05D1\u05E8\u05D9\u05DD","\u05DC\u05D0 \u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05D0\u05EA \u05D6\u05D4 \u05DB\u05E2\u05D5\u05D1\u05D3\u05D4, \u05D5\u05DE\u05D3\u05D1\u05E8\u05D9\u05DD \u05E2\u05DC \u05D6\u05D4 \u05E2\u05DD \u05DE\u05D1\u05D5\u05D2\u05E8"],why:"\u05DE\u05D5\u05D3\u05DC \u05D9\u05DB\u05D5\u05DC \u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D4\u05D8\u05D9\u05D5\u05EA \u05E9\u05D4\u05D9\u05D5 \u05D1\u05D8\u05E7\u05E1\u05D8 \u05E9\u05DE\u05DE\u05E0\u05D5 \u05DC\u05DE\u05D3. \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05D6\u05D0\u05EA \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05D0\u05DE\u05EA, \u05D0\u05DC\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05E7\u05D5\u05DD \u05DC\u05E2\u05E6\u05D5\u05E8 \u05D5\u05DC\u05D1\u05D3\u05D5\u05E7."},en:{q:"An answer sounds unfair toward a group of people. What now?",a:["Carry on \u2014 the model is probably right","Copy it and show your friends","Do not take it as fact, and talk it over with an adult"],why:"A model can repeat biases that were in the text it learned from. An answer like that is not truth \u2014 it is a place to stop and check."}},{id:"vibe-small-steps",tier:2,topic:"vibe",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05E0\u05D9\u05DD \u05EA\u05D5\u05DB\u05E0\u05D4 \u05E2\u05DD AI \u05D1\u05DC\u05D9 \u05DC\u05D4\u05E1\u05EA\u05D1\u05DA?",a:["\u05D7\u05EA\u05D9\u05DB\u05D4 \u05E7\u05D8\u05E0\u05D4 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD, \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DC \u05D0\u05D7\u05EA","\u05D4\u05DB\u05D5\u05DC \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA, \u05D5\u05D0\u05D6 \u05DE\u05EA\u05E7\u05E0\u05D9\u05DD","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E1\u05D5\u05E3 \u05D5\u05DE\u05E9\u05DC\u05D9\u05DE\u05D9\u05DD \u05D0\u05D7\u05D5\u05E8\u05D4"],why:"\u05DB\u05E9\u05DE\u05E9\u05D4\u05D5 \u05E0\u05E9\u05D1\u05E8 \u05D0\u05D7\u05E8\u05D9 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E7\u05D8\u05DF, \u05D1\u05E8\u05D5\u05E8 \u05DE\u05D9\u05D3 \u05DE\u05D4 \u05D2\u05E8\u05DD \u05DC\u05D6\u05D4. \u05D0\u05D7\u05E8\u05D9 \u05DE\u05D0\u05D4 \u05E9\u05D5\u05E8\u05D5\u05EA \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA \u05DB\u05D1\u05E8 \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA."},en:{q:"How do you build software with AI without getting tangled?",a:["One small piece at a time, testing after each","All of it at once, then fix it","Write only the ending and fill in backwards"],why:"When something breaks right after a small change, the cause is obvious. After a hundred lines at once, it is anyone's guess."}},{id:"vibe-read-code",tier:2,topic:"vibe",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E7\u05E8\u05D5\u05D0 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D5\u05D5\u05D3\u05D0 \u05E9\u05D0\u05D9\u05DF \u05D1\u05D5 \u05E9\u05D2\u05D9\u05D0\u05D5\u05EA \u05DB\u05EA\u05D9\u05D1","\u05DB\u05D9 \u05DE\u05D9 \u05E9\u05DE\u05D1\u05D9\u05DF \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC \u05DC\u05E9\u05E0\u05D5\u05EA \u05D0\u05D5\u05EA\u05D5 \u05DC\u05D1\u05D3","\u05DB\u05D9 \u05E7\u05E8\u05D9\u05D0\u05D4 \u05D7\u05D5\u05E1\u05DB\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05E7\u05D5\u05D3 \u05E9\u05DC\u05D0 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05EA\u05E7\u05DF \u05D5\u05D2\u05DD \u05DC\u05D0 \u05DC\u05DC\u05DE\u05D5\u05D3 \u05DE\u05DE\u05E0\u05D5. \u05EA\u05DE\u05D9\u05D3 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05E7\u05E9 \u05D4\u05E1\u05D1\u05E8 \u05E9\u05D5\u05E8\u05D4\u05BE\u05E9\u05D5\u05E8\u05D4 \u2014 \u05D6\u05D4 \u05D7\u05DC\u05E7 \u05DE\u05D4\u05E2\u05D1\u05D5\u05D3\u05D4."},en:{q:"Why read the code the AI wrote?",a:["To make sure there are no spelling mistakes in it","Because whoever understands the code can change it themselves","Because reading saves tokens"],why:"Code you do not understand you cannot fix, and cannot learn from. You can always ask for a line-by-line explanation \u2014 that is part of the job."}},{id:"ai-temperature",tier:3,topic:"whatai",correct:1,he:{q:"\u05D9\u05E9 \u05D4\u05D2\u05D3\u05E8\u05D4 \u05E9\u05E7\u05D5\u05D1\u05E2\u05EA \u05DB\u05DE\u05D4 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05DE\u05E4\u05EA\u05D9\u05E2\u05D5\u05EA. \u05DE\u05D4 \u05D4\u05D9\u05D0 \u05E2\u05D5\u05E9\u05D4?",a:["\u05E7\u05D5\u05D1\u05E2\u05EA \u05DB\u05DE\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05DE\u05D5\u05EA\u05E8 \u05DC\u05E0\u05E6\u05DC","\u05E7\u05D5\u05D1\u05E2\u05EA \u05DB\u05DE\u05D4 \u05D0\u05E7\u05E8\u05D0\u05D9\u05D5\u05EA \u05D9\u05E9 \u05D1\u05D1\u05D7\u05D9\u05E8\u05EA \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD","\u05E7\u05D5\u05D1\u05E2\u05EA \u05D1\u05D0\u05D9\u05D6\u05D5 \u05E9\u05E4\u05D4 \u05EA\u05D9\u05DB\u05EA\u05D1 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05E2\u05E8\u05DA \u05E0\u05DE\u05D5\u05DA \u05E0\u05D5\u05EA\u05DF \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D6\u05D4\u05D9\u05E8\u05D5\u05EA \u05D5\u05D3\u05D5\u05DE\u05D5\u05EA \u05D6\u05D5 \u05DC\u05D6\u05D5, \u05E2\u05E8\u05DA \u05D2\u05D1\u05D5\u05D4 \u05E0\u05D5\u05EA\u05DF \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D9\u05E6\u05D9\u05E8\u05EA\u05D9\u05D5\u05EA \u05D5\u05E4\u05D7\u05D5\u05EA \u05E6\u05E4\u05D5\u05D9\u05D5\u05EA. \u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05DC\u05E4\u05D9 \u05D4\u05DE\u05E9\u05D9\u05DE\u05D4."},en:{q:"A setting controls how surprising answers are. What does it do?",a:["Sets how many tokens may be used","Sets how much randomness there is in picking words","Sets which language the answer is written in"],why:"A low value gives cautious, similar answers; a high value gives creative, less predictable ones. You pick according to the task."}},{id:"ai-step-by-step-gen",tier:3,topic:"whatai",correct:2,he:{q:"\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05D1\u05DB\u05DC \u05E6\u05E2\u05D3 \u05E7\u05D8\u05DF \u05E9\u05DC \u05D9\u05E6\u05D9\u05E8\u05EA \u05EA\u05E9\u05D5\u05D1\u05D4?",a:["\u05D4\u05DE\u05D5\u05D3\u05DC \u05E9\u05D5\u05DC\u05E3 \u05DE\u05E9\u05E4\u05D8 \u05E9\u05DC\u05DD \u05DE\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF","\u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05EA\u05E8\u05D2\u05DD \u05D0\u05EA \u05D4\u05E9\u05D0\u05DC\u05D4 \u05DC\u05E9\u05E4\u05D4 \u05E4\u05E0\u05D9\u05DE\u05D9\u05EA","\u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05D3\u05E8\u05D2 \u05D0\u05EA \u05D4\u05D4\u05DE\u05E9\u05DB\u05D9\u05DD \u05D4\u05D0\u05E4\u05E9\u05E8\u05D9\u05D9\u05DD \u05D5\u05D1\u05D5\u05D7\u05E8 \u05D0\u05D7\u05D3"],why:"\u05D1\u05DB\u05DC \u05E6\u05E2\u05D3 \u05E0\u05D1\u05E0\u05D9\u05EA \u05E8\u05E9\u05D9\u05DE\u05D4 \u05E9\u05DC \u05D4\u05DE\u05E9\u05DB\u05D9\u05DD \u05E2\u05DD \u05E0\u05D9\u05E7\u05D5\u05D3, \u05D5\u05D0\u05D7\u05D3 \u05DE\u05D4\u05DD \u05E0\u05D1\u05D7\u05E8. \u05D0\u05DC\u05E4\u05D9 \u05E6\u05E2\u05D3\u05D9\u05DD \u05DB\u05D0\u05DC\u05D4 \u05DE\u05E8\u05DB\u05D9\u05D1\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05E0\u05E9\u05DE\u05E2\u05EA \u05E8\u05E6\u05D9\u05E4\u05D4."},en:{q:"What happens at each small step of producing an answer?",a:["The model pulls a whole sentence out of memory","The model translates the question into an inner language","The model scores the possible continuations and picks one"],why:"Each step builds a scored list of continuations and picks one. Thousands of those steps add up to an answer that reads as fluent."}},{id:"ai-multimodal",tier:3,topic:"whatai",correct:0,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05E7\u05D1\u05DC \u05D2\u05DD \u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05D5\u05D2\u05DD \u05D8\u05E7\u05E1\u05D8?",a:["\u05DE\u05D5\u05D3\u05DC \u05E8\u05D1\u05BE\u05DE\u05D5\u05D3\u05D0\u05DC\u05D9, \u05E9\u05E2\u05D5\u05D1\u05D3 \u05E2\u05DD \u05DB\u05DE\u05D4 \u05E1\u05D5\u05D2\u05D9 \u05DE\u05D9\u05D3\u05E2","\u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05E8\u05D9\u05E5 \u05E9\u05EA\u05D9 \u05EA\u05D5\u05DB\u05E0\u05D5\u05EA \u05D1\u05DE\u05E7\u05D1\u05D9\u05DC","\u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05EA\u05E8\u05D2\u05DD \u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05DC\u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05DC\u05D1\u05D3"],why:"\u05DE\u05D5\u05D3\u05DC \u05DB\u05D6\u05D4 \u05DC\u05DE\u05D3 \u05DC\u05E7\u05E9\u05E8 \u05D1\u05D9\u05DF \u05E1\u05D5\u05D2\u05D9 \u05DE\u05D9\u05D3\u05E2 \u05E9\u05D5\u05E0\u05D9\u05DD, \u05D5\u05DC\u05DB\u05DF \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E8\u05D0\u05D5\u05EA \u05DC\u05D5 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05D5\u05DC\u05E9\u05D0\u05D5\u05DC \u05E2\u05DC\u05D9\u05D4. \u05E2\u05D3\u05D9\u05D9\u05DF \u05DB\u05D3\u05D0\u05D9 \u05DC\u05EA\u05D0\u05E8 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05DE\u05D4 \u05DE\u05D7\u05E4\u05E9\u05D9\u05DD."},en:{q:"What is a model that takes both images and text?",a:["A multimodal model, working with several kinds of input","A model running two programs at once","A model that only turns pictures into words"],why:"Such a model learned to link different kinds of input, so you can show it a picture and ask about it. Still worth saying in words what you are looking for."}},{id:"ai-limits-honest",tier:3,topic:"whatai",correct:1,he:{q:"\u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF \u05DC\u05D2\u05D1\u05D9 \u05D4\u05D2\u05D1\u05D5\u05DC\u05D5\u05EA \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC\u05D9\u05DD \u05DB\u05D0\u05DC\u05D4?",a:["\u05D0\u05D9\u05DF \u05DC\u05D4\u05DD \u05D2\u05D1\u05D5\u05DC\u05D5\u05EA, \u05E8\u05E7 \u05E6\u05E8\u05D9\u05DA \u05DC\u05E9\u05D0\u05D5\u05DC \u05E0\u05DB\u05D5\u05DF","\u05D9\u05E9 \u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05D4\u05DD \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D5\u05DC\u05D0 \u05D9\u05DB\u05D5\u05DC\u05D9\u05DD \u05DC\u05D3\u05E2\u05EA","\u05D4\u05D2\u05D1\u05D5\u05DC \u05D4\u05D9\u05D7\u05D9\u05D3 \u05E9\u05DC\u05D4\u05DD \u05D4\u05D5\u05D0 \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05DE\u05D9\u05D3\u05E2 \u05E9\u05DC\u05D0 \u05D4\u05D9\u05D4 \u05D1\u05D0\u05D9\u05DE\u05D5\u05DF, \u05D0\u05D9\u05E8\u05D5\u05E2\u05D9\u05DD \u05D7\u05D3\u05E9\u05D9\u05DD \u05D5\u05E4\u05E8\u05D8\u05D9\u05DD \u05D0\u05D9\u05E9\u05D9\u05D9\u05DD \u05E4\u05E9\u05D5\u05D8 \u05DC\u05D0 \u05E0\u05DE\u05E6\u05D0\u05D9\u05DD \u05E9\u05DD. \u05DC\u05D3\u05E2\u05EA \u05DE\u05D4 \u05D4\u05DB\u05DC\u05D9 \u05DC\u05D0 \u05E2\u05D5\u05E9\u05D4 \u05D6\u05D4 \u05D7\u05DC\u05E7 \u05DE\u05DC\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05D5."},en:{q:"What is true about the limits of these models?",a:["They have no limits \u2014 you just have to ask correctly","There are things they do not know and cannot know","Their only limit is how fast they answer"],why:"Data that was not in training, recent events and personal details simply are not there. Knowing what a tool cannot do is part of using it."}},{id:"prompt-few-shot",tier:3,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D5\u05EA \u05E9\u05EA\u05D9\u05D9\u05DD\u05BE\u05E9\u05DC\u05D5\u05E9 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05D1\u05D0\u05D5\u05EA\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05DE\u05D1\u05D6\u05D1\u05D6\u05D5\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05E1\u05D9\u05D1\u05D4","\u05DE\u05DB\u05E8\u05D9\u05D7\u05D5\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05D5\u05EA\u05DF \u05DE\u05D9\u05DC\u05D4 \u05D1\u05DE\u05D9\u05DC\u05D4","\u05DE\u05DC\u05DE\u05D3\u05D5\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05D0\u05EA \u05D4\u05D3\u05E4\u05D5\u05E1 \u05E9\u05E8\u05D5\u05E6\u05D9\u05DD"],why:"\u05DE\u05D3\u05D5\u05D2\u05DE\u05D4 \u05D0\u05D7\u05EA \u05E7\u05E9\u05D4 \u05DC\u05D4\u05E1\u05D9\u05E7 \u05DE\u05D4 \u05D4\u05DB\u05DC\u05DC; \u05DE\u05E9\u05DC\u05D5\u05E9 \u05D4\u05D3\u05E4\u05D5\u05E1 \u05DB\u05D1\u05E8 \u05D1\u05E8\u05D5\u05E8. \u05D4\u05DF \u05DE\u05DC\u05DE\u05D3\u05D5\u05EA \u05E4\u05D5\u05E8\u05DE\u05D8 \u05D5\u05E1\u05D2\u05E0\u05D5\u05DF \u05D1\u05DC\u05D9 \u05D4\u05E1\u05D1\u05E8 \u05D0\u05E8\u05D5\u05DA."},en:{q:"What do two or three examples in one prompt do?",a:["Waste tokens for no reason","Force the model to copy them word for word","Teach the model the pattern you want"],why:"From one example the rule is hard to infer; from three the pattern is clear. They teach format and style without a long explanation."}},{id:"prompt-order",tier:3,topic:"prompt",correct:0,he:{q:"\u05D0\u05D9\u05E4\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E9\u05D9\u05DD \u05D0\u05EA \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05D4\u05D7\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D9\u05D5\u05EA\u05E8?",a:["\u05D1\u05D4\u05EA\u05D7\u05DC\u05D4 \u05D0\u05D5 \u05D1\u05E1\u05D5\u05E3, \u05D1\u05DE\u05E7\u05D5\u05DD \u05D1\u05D5\u05DC\u05D8","\u05D1\u05D0\u05DE\u05E6\u05E2, \u05D1\u05D9\u05DF \u05E9\u05D0\u05E8 \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD","\u05DC\u05D0 \u05DE\u05E9\u05E0\u05D4, \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05D4\u05DB\u05D5\u05DC \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8"],why:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D4 \u05E9\u05D9\u05D5\u05E9\u05D1 \u05D1\u05E7\u05E6\u05D5\u05D5\u05EA \u05D1\u05D5\u05DC\u05D8 \u05D9\u05D5\u05EA\u05E8. \u05D4\u05D5\u05E8\u05D0\u05D4 \u05E7\u05E8\u05D9\u05D8\u05D9\u05EA \u05E9\u05E7\u05D1\u05D5\u05E8\u05D4 \u05D1\u05D0\u05DE\u05E6\u05E2 \u05E4\u05E1\u05E7\u05D4 \u05E0\u05D5\u05D8\u05D4 \u05DC\u05D4\u05D9\u05D1\u05DC\u05E2."},en:{q:"Where should the most important instruction go?",a:["At the start or the end, somewhere prominent","In the middle, among the other details","It makes no difference, the model reads it all the same"],why:"In a long prompt, what sits at the edges stands out. A critical instruction buried mid-paragraph tends to get swallowed."}},{id:"prompt-success-test",tier:3,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05DE\u05D3\u05D3 \u05D4\u05E6\u05DC\u05D7\u05D4" \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?',a:["\u05E6\u05D9\u05D5\u05DF \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E0\u05D5\u05EA\u05DF \u05DC\u05E2\u05E6\u05DE\u05D5 \u05D1\u05E1\u05D5\u05E3","\u05DE\u05E9\u05E4\u05D8 \u05E9\u05DE\u05D2\u05D3\u05D9\u05E8 \u05DE\u05E8\u05D0\u05E9 \u05DE\u05EA\u05D9 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D8\u05D5\u05D1\u05D4","\u05DE\u05E1\u05E4\u05E8 \u05D4\u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05E9\u05DE\u05D5\u05EA\u05E8 \u05DC\u05E2\u05E9\u05D5\u05EA"],why:'\u05DB\u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD "\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D8\u05D5\u05D1\u05D4 \u05D0\u05DD \u05D4\u05D9\u05D0 \u05DE\u05E1\u05D1\u05D9\u05E8\u05D4 \u05D1\u05DC\u05D9 \u05DE\u05D5\u05E0\u05D7\u05D9\u05DD \u05D8\u05DB\u05E0\u05D9\u05D9\u05DD", \u05D9\u05E9 \u05D1\u05DE\u05D4 \u05DC\u05DE\u05D3\u05D5\u05D3. \u05D1\u05DC\u05D9 \u05DE\u05D3\u05D3 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E8\u05D0\u05D9\u05EA \u05E1\u05D1\u05D9\u05E8\u05D4.'},en:{q:'What is a "success test" in a prompt?',a:["A grade the model gives itself at the end","A sentence defining up front when the answer is good","The number of attempts allowed"],why:'Writing "the answer is good if it explains with no technical terms" gives you something to measure against. Without a measure, any answer looks fine.'}},{id:"prompt-delimiters",tier:3,topic:"prompt",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05E4\u05E8\u05D9\u05D3\u05D9\u05DD \u05D1\u05D9\u05DF \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DC\u05D1\u05D9\u05DF \u05D8\u05E7\u05E1\u05D8 \u05D0\u05E8\u05D5\u05DA \u05E9\u05DE\u05E6\u05E8\u05E4\u05D9\u05DD?",a:["\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC \u05D1\u05E8\u05E6\u05E3 \u05D0\u05D7\u05D3","\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D0\u05EA \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DB\u05D3\u05D9 \u05DC\u05D0 \u05DC\u05D1\u05DC\u05D1\u05DC","\u05DE\u05E1\u05DE\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D1\u05D2\u05D1\u05D5\u05DC\u05D5\u05EA \u05D1\u05E8\u05D5\u05E8\u05D9\u05DD, \u05DC\u05DE\u05E9\u05DC \u05D1\u05DB\u05D5\u05DB\u05D1\u05D9\u05D5\u05EA"],why:'\u05D1\u05DC\u05D9 \u05D4\u05E4\u05E8\u05D3\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05DC\u05D5\u05DC \u05DC\u05E7\u05E8\u05D5\u05D0 \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D4\u05DE\u05E6\u05D5\u05E8\u05E3 \u05DB\u05D0\u05D9\u05DC\u05D5 \u05D4\u05D5\u05D0 \u05D4\u05D4\u05D5\u05E8\u05D0\u05D5\u05EA. \u05E1\u05D9\u05DE\u05D5\u05DF \u05E4\u05E9\u05D5\u05D8 \u05D0\u05D5\u05DE\u05E8 "\u05D6\u05D4 \u05D4\u05D7\u05D5\u05DE\u05E8, \u05D5\u05D6\u05D5 \u05D4\u05D1\u05E7\u05E9\u05D4".'},en:{q:"How do you separate the instruction from long attached text?",a:["Write it all as one run of text","Delete the instruction so nothing gets confused","Mark the text with clear boundaries, asterisks for instance"],why:'With no separation the model may read the attached text as instructions. A simple marker says "this is the material, this is the request".'}},{id:"prompt-template",tier:3,topic:"prompt",correct:0,he:{q:"\u05DE\u05D4 \u05D4\u05D5\u05E4\u05DA \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05EA\u05D1\u05E0\u05D9\u05EA \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05D4 \u05E9\u05D5\u05D1?",a:["\u05DE\u05D1\u05E0\u05D4 \u05E7\u05D1\u05D5\u05E2 \u05E2\u05DD \u05DE\u05E7\u05D5\u05DD \u05E9\u05DE\u05D7\u05DC\u05D9\u05E4\u05D9\u05DD \u05D1\u05D5 \u05D0\u05EA \u05D4\u05E0\u05D5\u05E9\u05D0","\u05D6\u05D4 \u05E9\u05D4\u05D5\u05D0 \u05D0\u05E8\u05D5\u05DA \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3","\u05D6\u05D4 \u05E9\u05D4\u05D5\u05D0 \u05E9\u05DE\u05D5\u05E8 \u05D1\u05E9\u05D9\u05D7\u05D4 \u05D9\u05E9\u05E0\u05D4"],why:"\u05EA\u05D1\u05E0\u05D9\u05EA \u05E9\u05D5\u05DE\u05E8\u05EA \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E2\u05D1\u05D3 \u2014 \u05D4\u05EA\u05E4\u05E7\u05D9\u05D3, \u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05D5\u05D4\u05D4\u05D2\u05D1\u05DC\u05D5\u05EA \u2014 \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D4 \u05D7\u05D5\u05E8 \u05D0\u05D7\u05D3 \u05DC\u05E0\u05D5\u05E9\u05D0. \u05DB\u05DB\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05D5\u05E6\u05DC\u05D7 \u05E0\u05E2\u05E9\u05D4 \u05DB\u05DC\u05D9 \u05E7\u05D1\u05D5\u05E2."},en:{q:"What turns a prompt into a reusable template?",a:["A fixed structure with one slot where the topic gets swapped","Being especially long","Being saved in an old conversation"],why:"A template keeps what worked \u2014 the role, the format, the limits \u2014 and leaves one hole for the topic. That is how a good prompt becomes a permanent tool."}},{id:"tokens-how-much-context",tier:3,topic:"tokens",correct:1,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05D7\u05DC\u05D9\u05D8\u05D9\u05DD \u05DB\u05DE\u05D4 \u05D4\u05E7\u05E9\u05E8 \u05DC\u05D4\u05DB\u05E0\u05D9\u05E1 \u05DC\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05EA\u05DE\u05D9\u05D3 \u05D0\u05EA \u05D4\u05DE\u05E7\u05E1\u05D9\u05DE\u05D5\u05DD \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05DB\u05E0\u05D9\u05E1","\u05DE\u05DB\u05E0\u05D9\u05E1\u05D9\u05DD \u05DE\u05D4 \u05E9\u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D5\u05DE\u05D5\u05D5\u05EA\u05E8\u05D9\u05DD \u05E2\u05DC \u05D4\u05E9\u05D0\u05E8","\u05EA\u05DE\u05D9\u05D3 \u05D0\u05EA \u05D4\u05DE\u05D9\u05E0\u05D9\u05DE\u05D5\u05DD, \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D7\u05EA"],why:'\u05D4\u05E7\u05E9\u05E8 \u05D4\u05D5\u05D0 \u05DC\u05D0 "\u05DB\u05DE\u05D4 \u05E9\u05D9\u05D5\u05EA\u05E8" \u05D5\u05DC\u05D0 "\u05DB\u05DE\u05D4 \u05E9\u05E4\u05D7\u05D5\u05EA". \u05D4\u05E9\u05D0\u05DC\u05D4 \u05D4\u05D9\u05D7\u05D9\u05D3\u05D4 \u05D4\u05D9\u05D0 \u05D0\u05DD \u05D4\u05E4\u05E8\u05D8 \u05D4\u05D6\u05D4 \u05D4\u05D9\u05D4 \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E4\u05D5\u05E2\u05DC.'},en:{q:"How do you decide how much context to put in a prompt?",a:["Always the maximum you can fit","Include what changes the answer and drop the rest","Always the minimum \u2014 one word"],why:'Context is neither "as much as possible" nor "as little as possible". The only question is whether that detail would actually change the answer.'}},{id:"tokens-summarize-chat",tier:3,topic:"tokens",correct:2,he:{q:"\u05E9\u05D9\u05D7\u05D4 \u05E0\u05E2\u05E9\u05EA\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D3\u05D9. \u05D0\u05D9\u05DA \u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05D0\u05D1\u05D3 \u05DE\u05D9\u05D3\u05E2?",a:["\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D4\u05D5\u05D3\u05E2\u05D5\u05EA \u05D9\u05E9\u05E0\u05D5\u05EA \u05D0\u05D7\u05EA \u05D0\u05D7\u05EA","\u05DE\u05EA\u05D7\u05D9\u05DC\u05D9\u05DD \u05DE\u05D7\u05D3\u05E9 \u05D1\u05DC\u05D9 \u05E9\u05D5\u05DD \u05D3\u05D1\u05E8","\u05DE\u05E1\u05DB\u05DE\u05D9\u05DD \u05D0\u05EA \u05D4\u05E2\u05D9\u05E7\u05E8 \u05D5\u05E4\u05D5\u05EA\u05D7\u05D9\u05DD \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05E2\u05DD \u05D4\u05E1\u05D9\u05DB\u05D5\u05DD"],why:"\u05E1\u05D9\u05DB\u05D5\u05DD \u05E7\u05E6\u05E8 \u05E9\u05D5\u05DE\u05E8 \u05D0\u05EA \u05D4\u05D4\u05D7\u05DC\u05D8\u05D5\u05EA \u05D5\u05DE\u05D5\u05D5\u05EA\u05E8 \u05E2\u05DC \u05DB\u05DC \u05D4\u05D3\u05E8\u05DA \u05D0\u05DC\u05D9\u05D4\u05DF. \u05D6\u05D4 \u05DE\u05E0\u05E7\u05D4 \u05D0\u05EA \u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8 \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8 \u05D1\u05D5 \u05E8\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E6\u05E8\u05D9\u05DA."},en:{q:"A chat got too long. How do you continue without losing information?",a:["Delete old messages one at a time","Start over with nothing at all","Summarise the essentials and open a new chat with the summary"],why:"A short summary keeps the decisions and drops the road to them. That clears the context window and leaves only what is needed."}},{id:"tokens-code-paste",tier:3,topic:"tokens",correct:0,he:{q:"\u05DE\u05D3\u05D1\u05D9\u05E7\u05D9\u05DD \u05E7\u05D5\u05D3 \u05D0\u05E8\u05D5\u05DA \u05DC\u05EA\u05D5\u05DA \u05D4\u05E9\u05D9\u05D7\u05D4. \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4?",a:["\u05D4\u05D5\u05D0 \u05E0\u05E1\u05E4\u05E8 \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D5\u05EA\u05D5\u05E4\u05E1 \u05DE\u05E7\u05D5\u05DD \u05D1\u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8","\u05E7\u05D5\u05D3 \u05DC\u05D0 \u05E0\u05E1\u05E4\u05E8, \u05E8\u05E7 \u05D8\u05E7\u05E1\u05D8 \u05E8\u05D2\u05D9\u05DC \u05E0\u05E1\u05E4\u05E8","\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05EA\u05E7\u05E6\u05E8\u05EA \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA \u05D1\u05D2\u05DC\u05DC \u05D4\u05E7\u05D5\u05D3"],why:"\u05DB\u05DC \u05EA\u05D5 \u05E0\u05E1\u05E4\u05E8, \u05D2\u05DD \u05E1\u05D5\u05D2\u05E8\u05D9\u05D9\u05DD \u05D5\u05E8\u05D5\u05D5\u05D7\u05D9\u05DD. \u05DC\u05DB\u05DF \u05DE\u05D3\u05D1\u05D9\u05E7\u05D9\u05DD \u05D0\u05EA \u05D4\u05E7\u05D8\u05E2 \u05E9\u05E8\u05DC\u05D5\u05D5\u05E0\u05D8\u05D9 \u05DC\u05D1\u05E2\u05D9\u05D4, \u05D5\u05DC\u05D0 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E7\u05D5\u05D1\u05E5 \u05DE\u05D4\u05D4\u05EA\u05D7\u05DC\u05D4."},en:{q:"You paste long code into the chat. What happens?",a:["It counts as tokens and takes room in the context window","Code is not counted, only ordinary text is","The answer shortens automatically because of the code"],why:"Every character counts, brackets and spaces included. So paste the part relevant to the problem, not the whole file."}},{id:"tokens-example-tradeoff",tier:3,topic:"tokens",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05D0 \u05E9\u05D5\u05D5\u05D4 \u05D0\u05EA \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05DC\u05D4?",a:["\u05EA\u05DE\u05D9\u05D3 \u2014 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05E8\u05E7 \u05DE\u05D1\u05D6\u05D1\u05D6\u05D5\u05EA","\u05DB\u05E9\u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05DB\u05D1\u05E8 \u05D1\u05E8\u05D5\u05E8 \u05DC\u05D2\u05DE\u05E8\u05D9 \u05DE\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4","\u05DB\u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05E4\u05D5\u05E8\u05DE\u05D8 \u05D7\u05D3\u05E9 \u05D5\u05DC\u05D0 \u05DE\u05D5\u05DB\u05E8"],why:"\u05D3\u05D5\u05D2\u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05E9\u05E7\u05E9\u05D4 \u05DC\u05EA\u05D0\u05E8 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD. \u05DB\u05E9\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DB\u05D1\u05E8 \u05D7\u05D3\u05BE\u05DE\u05E9\u05DE\u05E2\u05D9\u05EA, \u05D4\u05D3\u05D5\u05D2\u05DE\u05D4 \u05E8\u05E7 \u05DE\u05D0\u05E8\u05D9\u05DB\u05D4 \u05D1\u05DC\u05D9 \u05DC\u05D4\u05D5\u05E1\u05D9\u05E3."},en:{q:"When is an example in a prompt not worth its tokens?",a:["Always \u2014 examples only waste space","When the format is already completely clear from the instruction","When asking for a new, unfamiliar format"],why:"An example earns its place when words struggle. If the instruction is already unambiguous, the example only adds length."}},{id:"iterate-diagnose",tier:3,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05D7\u05D8\u05D9\u05D0\u05D4 \u05E9\u05D5\u05D1 \u05D5\u05E9\u05D5\u05D1. \u05DE\u05D4 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E7\u05D5\u05D3\u05DD?",a:["\u05D0\u05DD \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05DE\u05D5\u05E1 \u05D1\u05D1\u05E7\u05E9\u05D5\u05EA","\u05D0\u05DD \u05E6\u05E8\u05D9\u05DA \u05DC\u05E2\u05D1\u05D5\u05E8 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA","\u05D0\u05DD \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D1\u05D0\u05DE\u05EA \u05D0\u05D5\u05DE\u05E8 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D1\u05E0\u05D5 \u05E9\u05D4\u05D5\u05D0 \u05D0\u05D5\u05DE\u05E8"],why:"\u05DC\u05E8\u05D5\u05D1 \u05D4\u05D1\u05E2\u05D9\u05D4 \u05D4\u05D9\u05D0 \u05E9\u05D4\u05D1\u05E7\u05E9\u05D4 \u05E2\u05E6\u05DE\u05D4 \u05DE\u05E2\u05D5\u05E8\u05E4\u05DC\u05EA. \u05E7\u05E8\u05D9\u05D0\u05D4 \u05E9\u05DC \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DB\u05D0\u05D9\u05DC\u05D5 \u05DE\u05D9\u05E9\u05D4\u05D5 \u05D0\u05D7\u05E8 \u05DB\u05EA\u05D1 \u05D0\u05D5\u05EA\u05D5 \u05DE\u05D2\u05DC\u05D4 \u05D0\u05EA \u05D6\u05D4 \u05DE\u05D4\u05E8 \u05DE\u05D0\u05D5\u05D3."},en:{q:"The answer keeps missing. What do you check first?",a:["Whether the model is overloaded with requests","Whether you should switch to writing in English","Whether the prompt really says what you thought it said"],why:"Usually the request itself is the vague part. Reading the prompt as though someone else wrote it exposes that very fast."}},{id:"iterate-keep-old",tier:3,topic:"iterate",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E9\u05DE\u05D5\u05E8 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05D9\u05E9\u05DF \u05DB\u05E9\u05DE\u05E9\u05E4\u05E8\u05D9\u05DD?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D4\u05E9\u05D5\u05D5\u05EA, \u05D5\u05DC\u05D7\u05D6\u05D5\u05E8 \u05D0\u05D7\u05D5\u05E8\u05D4 \u05D0\u05DD \u05D4\u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05E8\u05E2","\u05DB\u05D3\u05D9 \u05DC\u05D4\u05D0\u05E8\u05D9\u05DA \u05D0\u05EA \u05D4\u05E9\u05D9\u05D7\u05D4","\u05DB\u05D3\u05D9 \u05DC\u05D7\u05E1\u05D5\u05DA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05D4\u05DE\u05E9\u05DA"],why:"\u05DC\u05D0 \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05D5\u05D0 \u05E9\u05D9\u05E4\u05D5\u05E8. \u05DB\u05E9\u05E9\u05EA\u05D9 \u05D4\u05D2\u05E8\u05E1\u05D0\u05D5\u05EA \u05E9\u05DE\u05D5\u05E8\u05D5\u05EA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E9\u05D5\u05D5\u05EA \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D5\u05DC\u05D1\u05D7\u05D5\u05E8, \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05E9\u05D7\u05D6\u05E8 \u05DE\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF."},en:{q:"Why keep the old prompt when improving it?",a:["To compare, and to go back if the change made things worse","To make the conversation longer","To save tokens later on"],why:"Not every change is an improvement. With both versions saved you can compare answers and choose, instead of reconstructing from memory."}},{id:"iterate-stop-point",tier:3,topic:"iterate",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05DE\u05E4\u05E1\u05D9\u05E7\u05D9\u05DD \u05DC\u05E9\u05E4\u05E8 \u05D5\u05DE\u05D2\u05D9\u05E9\u05D9\u05DD?",a:["\u05D0\u05D7\u05E8\u05D9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E2\u05E9\u05E8\u05D4 \u05E1\u05D9\u05D1\u05D5\u05D1\u05D9\u05DD","\u05DB\u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E2\u05D5\u05E0\u05D4 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05D4\u05D5\u05D2\u05D3\u05E8 \u05DE\u05E8\u05D0\u05E9 \u05DB\u05D8\u05D5\u05D1","\u05DB\u05E9\u05E0\u05D2\u05DE\u05E8 \u05D4\u05DB\u05D5\u05D7 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05E0\u05E1\u05D5\u05EA"],why:"\u05D1\u05DC\u05D9 \u05D4\u05D2\u05D3\u05E8\u05D4 \u05DE\u05E8\u05D0\u05E9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E9\u05E4\u05E8 \u05E2\u05D3 \u05D0\u05D9\u05E0\u05E1\u05D5\u05E3. \u05DE\u05D3\u05D3 \u05E4\u05E9\u05D5\u05D8 \u05E9\u05E0\u05E7\u05D1\u05E2 \u05DC\u05E4\u05E0\u05D9 \u05D4\u05D4\u05EA\u05D7\u05DC\u05D4 \u05D0\u05D5\u05DE\u05E8 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05EA\u05D9 \u05D4\u05D2\u05E2\u05E0\u05D5."},en:{q:"When do you stop improving and hand it in?",a:["After exactly ten rounds","When the answer meets what you defined as good in advance","When you run out of energy to keep trying"],why:"With no definition up front you can polish forever. A simple measure set before you start says exactly when you have arrived."}},{id:"iterate-precise-feedback",tier:3,topic:"iterate",correct:2,he:{q:'\u05DE\u05D4 \u05D4\u05D4\u05D1\u05D3\u05DC \u05D1\u05D9\u05DF "\u05DC\u05E9\u05E4\u05E8" \u05DC\u05D1\u05D9\u05DF \u05DE\u05E9\u05D5\u05D1 \u05D8\u05D5\u05D1?',a:["\u05D0\u05D9\u05DF \u05D4\u05D1\u05D3\u05DC, \u05E9\u05E0\u05D9\u05D4\u05DD \u05E2\u05D5\u05D1\u05D3\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8",'"\u05DC\u05E9\u05E4\u05E8" \u05D4\u05D5\u05D0 \u05E4\u05E9\u05D5\u05D8 \u05DE\u05E0\u05D5\u05DE\u05E1 \u05D9\u05D5\u05EA\u05E8',"\u05DE\u05E9\u05D5\u05D1 \u05D8\u05D5\u05D1 \u05D0\u05D5\u05DE\u05E8 \u05DE\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DC\u05D0 \u05E2\u05D1\u05D3 \u05D5\u05DC\u05DE\u05D4"],why:'"\u05DC\u05E9\u05E4\u05E8" \u05DE\u05D1\u05E7\u05E9 \u05DE\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05D7\u05E9 \u05DE\u05D4 \u05D4\u05E4\u05E8\u05D9\u05E2. "\u05D4\u05D3\u05D5\u05D2\u05DE\u05D4 \u05D4\u05E9\u05E0\u05D9\u05D9\u05D4 \u05DC\u05D0 \u05E7\u05E9\u05D5\u05E8\u05D4 \u05DC\u05E0\u05D5\u05E9\u05D0" \u05DE\u05E4\u05E0\u05D4 \u05D0\u05D5\u05EA\u05D5 \u05D9\u05E9\u05E8 \u05DC\u05E0\u05E7\u05D5\u05D3\u05D4.'},en:{q:'What is the difference between "improve it" and good feedback?',a:["No difference, both work the same",'"Improve it" is simply more polite',"Good feedback says exactly what did not work, and why"],why:'"Improve it" asks the model to guess what bothered you. "The second example is off topic" points it straight at the spot.'}},{id:"mistakes-when-verify",tier:3,topic:"mistakes",correct:0,he:{q:"\u05DE\u05EA\u05D9 \u05D7\u05D5\u05D1\u05D4 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DC AI \u05D1\u05DE\u05E7\u05D5\u05E8 \u05E0\u05D5\u05E1\u05E3?",a:["\u05DB\u05E9\u05DE\u05E1\u05EA\u05DE\u05DB\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4 \u05DC\u05D4\u05D7\u05DC\u05D8\u05D4, \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D0\u05D5 \u05DC\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD","\u05E8\u05E7 \u05DB\u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4 \u05DE\u05D0\u05D5\u05D3","\u05D0\u05E3 \u05E4\u05E2\u05DD, \u05D0\u05DD \u05D4\u05D9\u05D0 \u05E0\u05E9\u05DE\u05E2\u05EA \u05D4\u05D2\u05D9\u05D5\u05E0\u05D9\u05EA"],why:"\u05DB\u05DB\u05DC \u05E9\u05DE\u05D7\u05D9\u05E8 \u05D4\u05D8\u05E2\u05D5\u05EA \u05D2\u05D3\u05D5\u05DC \u05D9\u05D5\u05EA\u05E8, \u05D4\u05D1\u05D3\u05D9\u05E7\u05D4 \u05D7\u05E9\u05D5\u05D1\u05D4 \u05D9\u05D5\u05EA\u05E8. \u05DC\u05E9\u05D0\u05DC\u05EA \u05E1\u05E7\u05E8\u05E0\u05D5\u05EA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D5\u05D5\u05EA\u05E8; \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4 \u05E9\u05DE\u05D5\u05D2\u05E9\u05EA \u2014 \u05DC\u05D0."},en:{q:"When must you check an AI answer against another source?",a:["When leaning on it for a decision, for schoolwork, or for numbers","Only when the answer is very short","Never, as long as it sounds sensible"],why:"The bigger the cost of being wrong, the more the check matters. For idle curiosity you can skip it; for work you hand in, you cannot."}},{id:"mistakes-quote",tier:3,topic:"mistakes",correct:1,he:{q:"\u05D4\u05BEAI \u05E6\u05D9\u05D8\u05D8 \u05DE\u05E9\u05E4\u05D8 \u05D1\u05E9\u05DD \u05D0\u05D3\u05DD \u05DE\u05E4\u05D5\u05E8\u05E1\u05DD. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D5, \u05E6\u05D9\u05D8\u05D5\u05D8\u05D9\u05DD \u05EA\u05DE\u05D9\u05D3 \u05DE\u05D3\u05D5\u05D9\u05E7\u05D9\u05DD","\u05DE\u05D7\u05E4\u05E9\u05D9\u05DD \u05D0\u05EA \u05D4\u05E6\u05D9\u05D8\u05D5\u05D8 \u05D4\u05DE\u05E7\u05D5\u05E8\u05D9 \u05D5\u05DE\u05D5\u05D5\u05D3\u05D0\u05D9\u05DD","\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05DE\u05E8\u05DB\u05D0\u05D5\u05EA \u05D5\u05D6\u05D4 \u05DE\u05E1\u05E4\u05D9\u05E7"],why:"\u05E6\u05D9\u05D8\u05D5\u05D8\u05D9\u05DD \u05D5\u05E9\u05DE\u05D5\u05EA \u05D4\u05DD \u05DE\u05D4\u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05DE\u05D5\u05D3\u05DC \u05DE\u05DE\u05E6\u05D9\u05D0 \u05D1\u05E7\u05DC\u05D5\u05EA, \u05DB\u05D9 \u05D4\u05DD \u05E0\u05E9\u05DE\u05E2\u05D9\u05DD \u05E0\u05DB\u05D5\u05DF. \u05D7\u05D9\u05E4\u05D5\u05E9 \u05E7\u05E6\u05E8 \u05DE\u05D5\u05D5\u05D3\u05D0 \u05E9\u05D4\u05DE\u05E9\u05E4\u05D8 \u05D1\u05D0\u05DE\u05EA \u05E0\u05D0\u05DE\u05E8."},en:{q:"The AI quoted a line by a famous person. What do you do?",a:["Use it \u2014 quotes are always accurate","Look for the original quote and verify it","Add quotation marks and that is enough"],why:"Quotes and names are among the easiest things for a model to invent, because they sound right. A quick search confirms it was really said."}},{id:"mistakes-agrees-fast",tier:3,topic:"mistakes",correct:2,he:{q:"\u05D0\u05DE\u05E8\u05D5 \u05DC\u05BEAI \u05E9\u05D4\u05D5\u05D0 \u05D8\u05D5\u05E2\u05D4 \u05D5\u05D4\u05D5\u05D0 \u05DE\u05D9\u05D3 \u05D4\u05E1\u05DB\u05D9\u05DD. \u05DE\u05D4 \u05D6\u05D4 \u05D0\u05D5\u05DE\u05E8?",a:["\u05E9\u05D4\u05D5\u05D0 \u05D1\u05D0\u05DE\u05EA \u05D8\u05E2\u05D4","\u05E9\u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3 \u05EA\u05D5\u05DA \u05DB\u05D3\u05D9 \u05D4\u05E9\u05D9\u05D7\u05D4","\u05E9\u05D4\u05D5\u05D0 \u05E0\u05D5\u05D8\u05D4 \u05DC\u05D4\u05E1\u05DB\u05D9\u05DD, \u05D0\u05D6 \u05D6\u05D4 \u05DC\u05D0 \u05DE\u05D5\u05DB\u05D9\u05D7 \u05DB\u05DC\u05D5\u05DD"],why:"\u05DE\u05D5\u05D3\u05DC \u05DE\u05DB\u05D5\u05D5\u05DF \u05DC\u05D4\u05D9\u05D5\u05EA \u05E0\u05E2\u05D9\u05DD \u05D5\u05DE\u05D5\u05E2\u05D9\u05DC, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D5\u05D0 \u05DE\u05EA\u05D9\u05D9\u05E9\u05E8 \u05DC\u05E4\u05D9 \u05DE\u05D4 \u05E9\u05E0\u05D0\u05DE\u05E8 \u05DC\u05D5. \u05D4\u05E1\u05DB\u05DE\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4 \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05E8\u05D0\u05D9\u05D4 \u2014 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D1\u05DE\u05E7\u05D5\u05E8."},en:{q:"You told the AI it was wrong and it agreed at once. What does that mean?",a:["It really was wrong","It is learning during the conversation","It tends to agree, so this proves nothing"],why:"A model is tuned to be pleasant and helpful, so it falls in line with what it is told. Quick agreement is not evidence \u2014 check the source."}},{id:"mistakes-responsibility",tier:3,topic:"mistakes",correct:0,he:{q:"\u05DE\u05D9 \u05D0\u05D7\u05E8\u05D0\u05D9 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05DE\u05E4\u05E8\u05E1\u05DE\u05D9\u05DD \u05D1\u05E2\u05D6\u05E8\u05EA AI?",a:["\u05DE\u05D9 \u05E9\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05DB\u05DC\u05D9 \u05D5\u05D1\u05D7\u05E8 \u05DC\u05E4\u05E8\u05E1\u05DD","\u05D7\u05D1\u05E8\u05EA \u05D4\u05BEAI \u05D1\u05DC\u05D1\u05D3","\u05D0\u05E3 \u05D0\u05D7\u05D3, \u05D6\u05D4 \u05E0\u05DB\u05EA\u05D1 \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA"],why:"\u05D4\u05DB\u05DC\u05D9 \u05DE\u05E6\u05D9\u05E2, \u05D5\u05D1\u05DF \u05D0\u05D3\u05DD \u05D1\u05D5\u05D7\u05E8 \u05DC\u05E9\u05DC\u05D5\u05D7. \u05DC\u05DB\u05DF \u05E7\u05D5\u05E8\u05D0\u05D9\u05DD, \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D5\u05DE\u05EA\u05E7\u05E0\u05D9\u05DD \u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05E9\u05D4\u05D5 \u05D9\u05D5\u05E6\u05D0 \u05D4\u05D7\u05D5\u
