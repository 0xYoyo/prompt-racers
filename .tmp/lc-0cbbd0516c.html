:root{
  --gold:#ffc247;
  --gold-1:#ffe9a8; --gold-2:#ffc247; --gold-3:#f59310;
  --ink:#12121c; --ink-2:#1c1c2b;
  --panel:rgba(22,22,34,.82); --panel-solid:#191926;
  --stroke:rgba(255,255,255,.10); --stroke-hi:rgba(255,255,255,.22);
  --txt:#f4f1ea; --txt-dim:#a8a29a;
  --good:#7ee081; --warn:#ffb347; --bad:#ff6b6b; --info:#6fc3ff;
  --token:#ffd66b;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-panel:0 10px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  --sh-pop:0 18px 50px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
#ui{font-family:var(--font);color:var(--txt);}
#ui *{pointer-events:none}
#ui .on{pointer-events:auto}

/* ---- layout helpers that flip correctly under RTL ---- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.fill{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}

/* Logical properties everywhere so a single rule serves both directions. */
.hud-tl{position:absolute;inset-block-start:18px;inset-inline-start:18px}
.hud-tr{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.hud-bl{position:absolute;inset-block-end:18px;inset-inline-start:18px}
.hud-br{position:absolute;inset-block-end:18px;inset-inline-end:18px}
.hud-tc{position:absolute;inset-block-start:14px;left:50%;transform:translateX(-50%)}

/* ---- surfaces ---- */
.panel{
  background:linear-gradient(180deg,rgba(40,40,58,.9),rgba(18,18,28,.92));
  border:1px solid var(--stroke); border-radius:var(--r-m);
  box-shadow:var(--sh-panel); backdrop-filter:blur(8px);
}
.panel-lift{background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(24,24,36,.96));
  border:1px solid var(--stroke-hi); border-radius:var(--r-l); box-shadow:var(--sh-pop)}

/* ---- type ---- */
.display{
  font-weight:900; letter-spacing:-.02em; line-height:.92;
  background:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.5));
  paint-order:stroke fill;
}
.display-white{background:linear-gradient(180deg,#fff 20%,#e8e2d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.rtl .label{letter-spacing:.04em}     /* Hebrew has no case; wide tracking hurts it */
.num{font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate}

/* ---- buttons ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:17px;color:#2a1c00;
  padding:14px 34px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 0 #a4620a, 0 12px 26px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4620a,0 6px 14px rgba(0,0,0,.45)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--stroke-hi);box-shadow:none;font-weight:700}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:3px solid var(--info);outline-offset:3px}

/* ---- misc ---- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1));transition:width .45s var(--ease)}
.rtl .bar>i{background:linear-gradient(270deg,var(--gold-2),var(--gold-1))}

.fade-in{animation:fadeIn .35s var(--ease) both}
.pop-in{animation:popIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .fade-in,.pop-in{animation:none}
  *{transition-duration:.01ms !important}

u05D5\u05E8\u05D0 \u05DE\u05D7\u05D3\u05E9 \u05D0\u05EA \u05DB\u05DC \u05D4\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u05E9\u05E9\u05D5\u05D0\u05DC\u05D9\u05DD"],why:"\u05D0\u05E3 \u05D0\u05D7\u05D3 \u05DC\u05D0 \u05DB\u05EA\u05D1 \u05DC\u05DE\u05D5\u05D3\u05DC \u05E8\u05E9\u05D9\u05DE\u05EA \u05DB\u05DC\u05DC\u05D9\u05DD. \u05D4\u05D5\u05D0 \u05E8\u05D0\u05D4 \u05DE\u05D9\u05DC\u05D9\u05D5\u05E0\u05D9 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05D5\u05DE\u05E6\u05D0 \u05D1\u05E2\u05E6\u05DE\u05D5 \u05D0\u05EA \u05D4\u05D3\u05E4\u05D5\u05E1\u05D9\u05DD \u05D4\u05D7\u05D5\u05D6\u05E8\u05D9\u05DD \u2014 \u05D1\u05E2\u05E8\u05DA \u05DB\u05DE\u05D5 \u05DC\u05DC\u05DE\u05D5\u05D3 \u05E9\u05E4\u05D4 \u05DE\u05E9\u05DE\u05D9\u05E2\u05D4."},en:{q:"How does an AI model learn what it knows?",a:["By training on an enormous number of examples","Someone typed every rule into it one by one","It rereads the entire internet every time you ask it something"],why:"Nobody wrote the model a rulebook. It saw millions of examples and found the repeating patterns itself \u2014 a bit like picking up a language by ear."}},{id:"ai-answer-source",tier:1,topic:"whatai",correct:2,he:{q:"\u05DB\u05E9\u05D4\u05BEAI \u05E2\u05D5\u05E0\u05D4, \u05DE\u05D0\u05D9\u05E4\u05D4 \u05DE\u05D2\u05D9\u05E2\u05D4 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4?",a:["\u05DE\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DE\u05D5\u05E8\u05D4 \u05E9\u05E0\u05E9\u05DC\u05E4\u05EA \u05DE\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF","\u05DE\u05DE\u05D5\u05DE\u05D7\u05D4 \u05D0\u05E0\u05D5\u05E9\u05D9 \u05E9\u05DE\u05E7\u05D1\u05DC \u05D0\u05EA \u05D4\u05E9\u05D0\u05DC\u05D4 \u05D5\u05DE\u05DB\u05EA\u05D9\u05D1 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05D4\u05D5\u05D0 \u05DE\u05E8\u05DB\u05D9\u05D1 \u05D0\u05D5\u05EA\u05D4 \u05D7\u05EA\u05D9\u05DB\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05D7\u05EA\u05D9\u05DB\u05D4, \u05DE\u05DE\u05E9 \u05E2\u05DB\u05E9\u05D9\u05D5"],why:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05D1\u05E0\u05D9\u05EA \u05EA\u05D5\u05DA \u05DB\u05D3\u05D9, \u05D7\u05EA\u05D9\u05DB\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05D7\u05EA\u05D9\u05DB\u05D4. \u05DC\u05DB\u05DF \u05D0\u05D5\u05EA\u05D4 \u05E9\u05D0\u05DC\u05D4 \u05D9\u05DB\u05D5\u05DC\u05D4 \u05DC\u05E7\u05D1\u05DC \u05E0\u05D9\u05E1\u05D5\u05D7 \u05D0\u05D7\u05E8 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u2014 \u05D0\u05D9\u05DF \u05DE\u05D2\u05D9\u05E8\u05D4 \u05E2\u05DD \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05DE\u05D5\u05DB\u05E0\u05D5\u05EA."},en:{q:"When an AI answers, where does the answer come from?",a:["A saved answer pulled out of storage","A human expert who receives the question","It builds it piece by piece, right now"],why:"The answer is built as it goes, piece by piece. That is why the same question can come back worded differently \u2014 there is no drawer of ready answers."}},{id:"ai-feelings",tier:2,topic:"whatai",correct:1,he:{q:"\u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF \u05DC\u05D2\u05D1\u05D9 AI \u05D5\u05E8\u05D2\u05E9\u05D5\u05EA?",a:["\u05D4\u05D5\u05D0 \u05DE\u05E8\u05D2\u05D9\u05E9 \u05E9\u05DE\u05D7\u05D4, \u05E2\u05E6\u05D1 \u05D5\u05D4\u05EA\u05E8\u05D2\u05E9\u05D5\u05EA \u05DE\u05DE\u05E9 \u05DB\u05DE\u05D5 \u05D1\u05DF \u05D0\u05D3\u05DD","\u05D4\u05D5\u05D0 \u05D9\u05D5\u05D3\u05E2 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E2\u05DC \u05E8\u05D2\u05E9\u05D5\u05EA, \u05D0\u05D1\u05DC \u05DC\u05D0 \u05DE\u05E8\u05D2\u05D9\u05E9 \u05D0\u05D5\u05EA\u05DD","\u05D4\u05D5\u05D0 \u05DC\u05D0 \u05DE\u05E1\u05D5\u05D2\u05DC \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E2\u05DC \u05E8\u05D2\u05E9\u05D5\u05EA \u05D1\u05DB\u05DC\u05DC"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05DE\u05D3 \u05D0\u05D9\u05DA \u05D0\u05E0\u05E9\u05D9\u05DD \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E2\u05DC \u05E8\u05D2\u05E9\u05D5\u05EA, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D5\u05D0 \u05DB\u05D5\u05EA\u05D1 \u05E2\u05DC \u05D6\u05D4 \u05D9\u05E4\u05D4. \u05D6\u05D4 \u05E2\u05D3\u05D9\u05D9\u05DF \u05EA\u05D9\u05D0\u05D5\u05E8 \u05E9\u05DC \u05E8\u05D2\u05E9 \u05D5\u05DC\u05D0 \u05E8\u05D2\u05E9 \u2014 \u05E0\u05D7\u05DE\u05D3 \u05DC\u05D6\u05DB\u05D5\u05E8 \u05D0\u05EA \u05D6\u05D4 \u05DB\u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E9\u05DE\u05E2\u05EA \u05D0\u05D9\u05E9\u05D9\u05EA."},en:{q:"What is true about AI and feelings?",a:["It feels joy, sadness and excitement just like a person does","It can write about feelings, but does not feel them","It cannot write about feelings at all"],why:"The model learned how people write about feelings, so it writes about them well. That is still a description of a feeling, not a feeling \u2014 worth remembering when an answer sounds personal."}},{id:"ai-same-question",tier:2,topic:"whatai",correct:2,he:{q:"\u05DC\u05DE\u05D4 \u05D0\u05D5\u05EA\u05D4 \u05E9\u05D0\u05DC\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D9\u05DB\u05D5\u05DC\u05D4 \u05DC\u05E7\u05D1\u05DC \u05E9\u05EA\u05D9 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA?",a:["\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05D6\u05D5\u05DB\u05E8 \u05DE\u05D9 \u05E9\u05D0\u05DC \u05D0\u05D5\u05EA\u05D5 \u05E7\u05D5\u05D3\u05DD \u05D5\u05DE\u05E9\u05EA\u05E2\u05DE\u05DD \u05DE\u05D7\u05D6\u05E8\u05D5\u05EA","\u05DB\u05D9 \u05DB\u05DC \u05D0\u05D7\u05D3 \u05DE\u05E7\u05D1\u05DC \u05DE\u05D5\u05D3\u05DC \u05D0\u05D7\u05E8","\u05DB\u05D9 \u05D1\u05D1\u05D7\u05D9\u05E8\u05EA \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D9\u05E9 \u05D2\u05DD \u05E7\u05E6\u05EA \u05D0\u05E7\u05E8\u05D0\u05D9\u05D5\u05EA"],why:"\u05D1\u05DB\u05DC \u05E6\u05E2\u05D3 \u05D9\u05E9 \u05DB\u05DE\u05D4 \u05DE\u05D9\u05DC\u05D9\u05DD \u05E9\u05DE\u05EA\u05D0\u05D9\u05DE\u05D5\u05EA, \u05D5\u05D4\u05DE\u05D5\u05D3\u05DC \u05D1\u05D5\u05D7\u05E8 \u05D1\u05D9\u05E0\u05D9\u05D4\u05DF \u05E2\u05DD \u05E7\u05E6\u05EA \u05D0\u05E7\u05E8\u05D0\u05D9\u05D5\u05EA. \u05D6\u05D4 \u05DE\u05D4 \u05E9\u05E0\u05D5\u05EA\u05DF \u05D2\u05D9\u05D5\u05D5\u05DF \u2014 \u05D5\u05D1\u05D3\u05D9\u05D5\u05E7 \u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1 \u05DB\u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DC\u05D0 \u05E7\u05DC\u05E2\u05D4."},en:{q:"Why can the exact same question get two different answers?",a:["The model remembers who asked before and gets bored of repeating","Everyone gets a different model","There is a little randomness in how words get picked"],why:"At each step several words fit, and the model picks among them with a little randomness. That is what gives variety \u2014 and exactly why retrying is worth it."}},{id:"ai-context-window",tier:3,topic:"whatai",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D7\u05DC\u05D5\u05DF \u05D4\u05E7\u05E9\u05E8" \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC?',a:["\u05D4\u05D7\u05DC\u05D5\u05DF \u05E9\u05D1\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E9\u05D1\u05D5 \u05DE\u05E7\u05DC\u05D9\u05D3\u05D9\u05DD \u05D0\u05EA \u05D4\u05E9\u05D0\u05DC\u05D4 \u05D5\u05DC\u05D5\u05D7\u05E6\u05D9\u05DD \u05E2\u05DC \u05E9\u05DC\u05D9\u05D7\u05D4","\u05DB\u05DE\u05D5\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D7\u05D6\u05D9\u05E7 \u05DE\u05D5\u05DC \u05D4\u05E2\u05D9\u05E0\u05D9\u05D9\u05DD \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA","\u05DE\u05E1\u05E4\u05E8 \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05E9\u05DE\u05D5\u05EA\u05E8 \u05DC\u05E9\u05D0\u05D5\u05DC \u05D1\u05D9\u05D5\u05DD"],why:"\u05DC\u05DE\u05D5\u05D3\u05DC \u05D9\u05E9 \u05D2\u05D1\u05D5\u05DC \u05DC\u05DB\u05DE\u05D5\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05E9\u05D4\u05D5\u05D0 \u05DE\u05D7\u05D6\u05D9\u05E7 \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA. \u05DB\u05E9\u05E9\u05D9\u05D7\u05D4 \u05E0\u05E2\u05E9\u05D9\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D0\u05D5\u05D3, \u05D4\u05D3\u05D1\u05E8\u05D9\u05DD \u05D4\u05D9\u05E9\u05E0\u05D9\u05DD \u05E0\u05D3\u05D7\u05E7\u05D9\u05DD \u05D4\u05D7\u05D5\u05E6\u05D4 \u2014 \u05D5\u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D5\u05D1."},en:{q:`What is a model's "context window"?`,a:["The box on screen where you type the question and press send","How much text the model can hold in view at once","How many questions you are allowed per day"],why:"A model can only hold so much text at once. In a very long chat the older parts get pushed out \u2014 so it pays to restate what matters."}},{id:"prompt-what-is",tier:1,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05D4\u05E9\u05DD \u05E9\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05D7\u05DB\u05DD \u05E9\u05D0\u05D9\u05EA\u05D5 \u05E2\u05D5\u05D1\u05D3\u05D9\u05DD \u05DB\u05E8\u05D2\u05E2","\u05D4\u05DB\u05E4\u05EA\u05D5\u05E8 \u05E9\u05E9\u05D5\u05DC\u05D7 \u05D0\u05EA \u05D4\u05D4\u05D5\u05D3\u05E2\u05D4","\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05D0\u05D5 \u05D4\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05BEAI"],why:"\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05D5\u05D0 \u05DB\u05DC \u05DE\u05D4 \u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05BEAI \u05DB\u05D3\u05D9 \u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD. \u05D6\u05D5 \u05E0\u05E7\u05D5\u05D3\u05EA \u05D4\u05D4\u05E9\u05E4\u05E2\u05D4 \u05D4\u05D2\u05D3\u05D5\u05DC\u05D4 \u05D1\u05D9\u05D5\u05EA\u05E8 \u2014 \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4 \u05DE\u05EA\u05D7\u05D9\u05DC\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8."},en:{q:"What is a prompt?",a:["The name of the smart model you are working with","The button that sends the message","The instruction or request written to the AI"],why:"A prompt is everything written to the AI to explain what is wanted. It is the biggest point of influence \u2014 the result starts with the prompt."}},{id:"prompt-better-one",tier:1,topic:"prompt",correct:1,he:{q:"\u05D0\u05D9\u05D6\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D9\u05D9\u05EA\u05DF \u05E1\u05D9\u05E4\u05D5\u05E8 \u05E7\u05E8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8 \u05DC\u05DE\u05D4 \u05E9\u05D3\u05DE\u05D9\u05D9\u05E0\u05D5?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D9\u05E4\u05D5\u05E8, \u05EA\u05D5\u05D3\u05D4 \u05E8\u05D1\u05D4!","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D9\u05E4\u05D5\u05E8 \u05E7\u05E6\u05E8 \u05DC\u05D9\u05DC\u05D3\u05D9 \u05DB\u05D9\u05EA\u05D4 \u05D3\u05F3 \u05E2\u05DC \u05D7\u05EA\u05D5\u05DC \u05D0\u05DE\u05D9\u05E5 \u05E9\u05DE\u05E4\u05D7\u05D3 \u05DE\u05DE\u05D9\u05DD","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D9\u05E4\u05D5\u05E8 \u05DE\u05DE\u05E9 \u05DE\u05E2\u05D5\u05DC\u05D4, \u05DE\u05E8\u05D2\u05E9 \u05DE\u05D0\u05D5\u05D3 \u05D5\u05DE\u05E8\u05EA\u05E7 \u05E9\u05DB\u05DC \u05D4\u05DB\u05D9\u05EA\u05D4 \u05EA\u05D0\u05D4\u05D1"],why:'\u05DE\u05D9\u05DC\u05D9\u05DD \u05DB\u05DE\u05D5 "\u05DE\u05E2\u05D5\u05DC\u05D4" \u05DC\u05D0 \u05D0\u05D5\u05DE\u05E8\u05D5\u05EA \u05DC\u05DE\u05D5\u05D3\u05DC \u05DB\u05DC\u05D5\u05DD. \u05E4\u05E8\u05D8\u05D9\u05DD \u05DB\u05DF: \u05E2\u05DC \u05DE\u05D4, \u05DC\u05DE\u05D9, \u05D5\u05D1\u05D0\u05D9\u05D6\u05D4 \u05D0\u05D5\u05E8\u05DA. \u05E0\u05D9\u05DE\u05D5\u05E1 \u05D6\u05D4 \u05E0\u05D7\u05DE\u05D3 \u2014 \u05D0\u05D1\u05DC \u05E4\u05E8\u05D8\u05D9\u05DD \u05D6\u05D4 \u05DE\u05D4 \u05E9\u05E2\u05D5\u05D1\u05D3.'},en:{q:"Which prompt gives a story closer to the one imagined?",a:["Write a story, thanks a lot!","Write a short story for 4th graders about a brave cat afraid of water","Write a truly excellent, very moving story that the whole class will love"],why:'Words like "excellent" tell the model nothing. Details do: about what, for whom, how long. Politeness is nice \u2014 details are what work.'}},{id:"prompt-add-detail",tier:1,topic:"prompt",correct:0,he:{q:'\u05DE\u05D4 \u05D4\u05DB\u05D9 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05D4\u05D5\u05E1\u05D9\u05E3 \u05DC\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 "\u05DC\u05E6\u05D9\u05D9\u05E8 \u05D1\u05D9\u05EA"?',a:["\u05D0\u05D9\u05D6\u05D4 \u05D1\u05D9\u05EA, \u05D1\u05D0\u05D9\u05D6\u05D4 \u05E1\u05D2\u05E0\u05D5\u05DF \u05D5\u05D1\u05D0\u05D9\u05DC\u05D5 \u05E6\u05D1\u05E2\u05D9\u05DD","\u05E1\u05D9\u05DE\u05E0\u05D9 \u05E7\u05E8\u05D9\u05D0\u05D4 \u05E8\u05D1\u05D9\u05DD, \u05DB\u05D3\u05D9 \u05DC\u05D4\u05D3\u05D2\u05D9\u05E9 \u05E9\u05D6\u05D4 \u05D1\u05D0\u05DE\u05EA \u05D7\u05E9\u05D5\u05D1","\u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D0\u05D5\u05EA\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05DC\u05D5\u05E9 \u05E4\u05E2\u05DE\u05D9\u05DD"],why:'\u05DC"\u05D1\u05D9\u05EA" \u05D9\u05E9 \u05DE\u05D9\u05DC\u05D9\u05D5\u05DF \u05D2\u05E8\u05E1\u05D0\u05D5\u05EA, \u05D5\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D1\u05D7\u05E8 \u05D0\u05D7\u05EA. \u05DB\u05DC \u05E4\u05E8\u05D8 \u05E9\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u2014 \u05E1\u05D2\u05E0\u05D5\u05DF, \u05E6\u05D1\u05E2, \u05E9\u05E2\u05D4 \u05D1\u05D9\u05D5\u05DD \u2014 \u05DE\u05E7\u05E8\u05D1 \u05D0\u05EA \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4 \u05DC\u05EA\u05DE\u05D5\u05E0\u05D4 \u05E9\u05D1\u05E8\u05D0\u05E9.'},en:{q:'What is most worth adding to the prompt "draw a house"?',a:["Which house, in what style, in which colours","Lots of exclamation marks, to show that it really matters","The same prompt repeated three times"],why:'A "house" has a million versions and the model will pick one. Every detail added \u2014 style, colour, time of day \u2014 pulls the result toward the picture in your head.'}},{id:"prompt-audience",tier:2,topic:"prompt",correct:2,he:{q:'\u05DC\u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8 \u05DC\u05DB\u05EA\u05D5\u05D1 "\u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05DB\u05D0\u05D9\u05DC\u05D5 \u05DC\u05D9\u05DC\u05D3 \u05D1\u05DF \u05E2\u05E9\u05E8"?',a:["\u05DB\u05D9 \u05DB\u05DB\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05D5\u05D1\u05D3 \u05DE\u05D4\u05E8 \u05D9\u05D5\u05EA\u05E8 \u05D5\u05DE\u05D7\u05D6\u05D9\u05E8 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05DE\u05E2\u05D8 \u05DE\u05D9\u05D3","\u05DB\u05D9 \u05D4\u05E1\u05D1\u05E8 \u05DC\u05D9\u05DC\u05D3 \u05E7\u05E6\u05E8 \u05D9\u05D5\u05EA\u05E8, \u05D5\u05E7\u05E6\u05E8 \u05E2\u05D5\u05DC\u05D4 \u05E4\u05D7\u05D5\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD","\u05DB\u05D9 \u05E7\u05D4\u05DC \u05D4\u05D9\u05E2\u05D3 \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D5\u05D0\u05EA \u05E8\u05DE\u05EA \u05D4\u05D4\u05E1\u05D1\u05E8"],why:"\u05D0\u05D5\u05EA\u05D5 \u05EA\u05D5\u05DB\u05DF \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05D1\u05DE\u05D0\u05D4 \u05E8\u05DE\u05D5\u05EA. \u05DB\u05E9\u05D0\u05D5\u05DE\u05E8\u05D9\u05DD \u05DC\u05DE\u05D9 \u05D4\u05D4\u05E1\u05D1\u05E8 \u05DE\u05D9\u05D5\u05E2\u05D3, \u05D4\u05DE\u05D5\u05D3\u05DC \u05D1\u05D5\u05D7\u05E8 \u05DE\u05D9\u05DC\u05D9\u05DD \u05D5\u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05E9\u05DE\u05EA\u05D0\u05D9\u05DE\u05D5\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DC\u05E7\u05D4\u05DC \u05D4\u05D6\u05D4."},en:{q:`Why does "explain it like I'm ten" help?`,a:["It makes the model run faster","An explanation for a child is shorter, and short costs fewer tokens","Naming the audience changes the words and the level"],why:"The same content can be explained a hundred ways. Naming who it is for lets the model pick words and examples that fit that reader."}},{id:"prompt-example",tier:2,topic:"prompt",correct:1,he:{q:"\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D4 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05E9\u05DE\u05E6\u05E8\u05E4\u05D9\u05DD \u05DC\u05EA\u05D5\u05DA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05DE\u05D1\u05DC\u05D1\u05DC\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05D1\u05D9\u05DF \u05D4\u05D3\u05D5\u05D2\u05DE\u05D4 \u05DC\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8","\u05DE\u05E8\u05D0\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D1\u05D0\u05D9\u05D6\u05D4 \u05E4\u05D5\u05E8\u05DE\u05D8 \u05E8\u05D5\u05E6\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DE\u05D0\u05E8\u05D9\u05DB\u05D4 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D1\u05DC\u05D9 \u05DC\u05D4\u05E9\u05E4\u05D9\u05E2 \u05E2\u05DC \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4"],why:'\u05E7\u05E9\u05D4 \u05DC\u05EA\u05D0\u05E8 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD "\u05D8\u05D1\u05DC\u05D4 \u05DB\u05D6\u05D0\u05EA" \u05D0\u05D5 "\u05E1\u05D2\u05E0\u05D5\u05DF \u05DB\u05D6\u05D4". \u05D3\u05D5\u05D2\u05DE\u05D4 \u05D0\u05D7\u05EA \u05E7\u05D8\u05E0\u05D4 \u05D7\u05D5\u05E1\u05DB\u05EA \u05E4\u05E1\u05E7\u05D4 \u05E9\u05DC\u05DE\u05D4 \u05E9\u05DC \u05D4\u05E1\u05D1\u05E8\u05D9\u05DD, \u05D5\u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05D7\u05E7\u05D4 \u05D0\u05EA \u05D4\u05E4\u05D5\u05E8\u05DE\u05D8.'},en:{q:"What does an example inside a prompt do?",a:["Confuses the model between the example and the prompt","Shows exactly what format the answer should take","Makes the prompt longer without changing the result"],why:'It is hard to describe "a table like this" in words. One small example saves a paragraph of explanation, and the model copies the format.'}},{id:"prompt-short-answer",tier:2,topic:"prompt",correct:0,he:{q:"\u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D6\u05D5\u05E8 \u05DC\u05E7\u05D1\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4?",a:["\u05DC\u05D1\u05E7\u05E9 \u05DE\u05E8\u05D0\u05E9 \u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA \u05DC\u05DB\u05DC \u05D4\u05D9\u05D5\u05EA\u05E8 \u2014 \u05E4\u05D7\u05D5\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D5\u05D2\u05DD \u05D1\u05E8\u05D5\u05E8 \u05D9\u05D5\u05EA\u05E8",'\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05E7\u05E6\u05E8 \u05D1\u05D1\u05E7\u05E9\u05D4" \u05D1\u05DC\u05D9 \u05DE\u05E1\u05E4\u05E8',"\u05DC\u05E9\u05D0\u05D5\u05DC \u05E9\u05D0\u05DC\u05D4 \u05E7\u05E6\u05E8\u05D4 \u05D5\u05DC\u05E7\u05D5\u05D5\u05EA \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4"],why:'"\u05E7\u05E6\u05E8" \u05D6\u05D4 \u05D9\u05D7\u05E1\u05D9, \u05D5\u05DE\u05E1\u05E4\u05E8 \u05D6\u05D4 \u05DC\u05D0. \u05D2\u05D1\u05D5\u05DC \u05D1\u05E8\u05D5\u05E8 \u2014 \u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA, \u05D7\u05DE\u05D9\u05E9\u05D4 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD \u2014 \u05D4\u05D5\u05E4\u05DA \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05E2\u05D5\u05E8\u05E4\u05DC \u05DC\u05D4\u05D5\u05E8\u05D0\u05D4 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E2\u05DE\u05D5\u05D3 \u05D1\u05D4.'},en:{q:"What helps most to get a short answer?",a:["Asking up front for three lines at most \u2014 fewer tokens, clearer answer",'Writing "keep it short" with no number',"Asking a short question and hoping for a short answer"],why:'"Short" is relative; a number is not. A clear limit \u2014 three lines, five sentences \u2014 turns a vague wish into an instruction that can be followed.'}},{id:"prompt-role",tier:3,topic:"prompt",correct:2,he:{q:'\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D4 \u05EA\u05E4\u05E7\u05D9\u05D3 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8, \u05DB\u05DE\u05D5 "\u05D1\u05EA\u05D5\u05E8 \u05DE\u05D3\u05E8\u05D9\u05DA \u05D8\u05D9\u05D5\u05DC\u05D9\u05DD"?',a:["\u05D4\u05D5\u05E4\u05DA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05DE\u05D5\u05DE\u05D7\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9 \u05D1\u05EA\u05D7\u05D5\u05DD, \u05E2\u05DD \u05D9\u05D3\u05E2 \u05E9\u05DC\u05D0 \u05D4\u05D9\u05D4 \u05DC\u05D5","\u05D2\u05D5\u05E8\u05DD \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D9\u05D5\u05EA\u05E8","\u05DE\u05DB\u05D5\u05D5\u05DF \u05D0\u05EA \u05E0\u05E7\u05D5\u05D3\u05EA \u05D4\u05DE\u05D1\u05D8 \u05D5\u05D0\u05EA \u05E1\u05D5\u05D2 \u05D4\u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05D9\u05E2\u05DC\u05D5 \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05EA\u05E4\u05E7\u05D9\u05D3 \u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E3 \u05DC\u05DE\u05D5\u05D3\u05DC \u05D9\u05D3\u05E2 \u05D7\u05D3\u05E9, \u05D0\u05D1\u05DC \u05D4\u05D5\u05D0 \u05D1\u05D5\u05D7\u05E8 \u05DE\u05D0\u05D9\u05D6\u05D5 \u05D6\u05D5\u05D5\u05D9\u05EA \u05DC\u05E2\u05E0\u05D5\u05EA. \u05DE\u05D3\u05E8\u05D9\u05DA \u05D8\u05D9\u05D5\u05DC\u05D9\u05DD \u05D9\u05D3\u05D1\u05E8 \u05E2\u05DC \u05DE\u05E1\u05DC\u05D5\u05DC\u05D9\u05DD \u05D5\u05E0\u05D5\u05E3, \u05D1\u05D9\u05D5\u05DC\u05D5\u05D2 \u05D9\u05D3\u05D1\u05E8 \u05E2\u05DC \u05D1\u05E2\u05DC\u05D9 \u05D7\u05D9\u05D9\u05DD."},en:{q:'What does a role like "as a hiking guide" do in a prompt?',a:["Turns the model into a real expert with new knowledge of the field","Makes the answer longer","Steers the point of view and what the answer brings up"],why:"A role adds no new knowledge, but it picks the angle. A hiking guide talks trails and views; a biologist talks animals."}},{id:"prompt-break-steps",tier:3,topic:"prompt",correct:1,he:{q:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D2\u05D3\u05D5\u05DC \u05D5\u05DE\u05D5\u05E8\u05DB\u05D1, \u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D0\u05D7\u05D3 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3","\u05DC\u05E4\u05E8\u05E7 \u05DC\u05E9\u05DC\u05D1\u05D9\u05DD \u05D5\u05DC\u05D4\u05D2\u05D9\u05D3 \u05DE\u05D4 \u05D7\u05E9\u05D5\u05D1 \u05D1\u05DB\u05DC \u05E9\u05DC\u05D1","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05DB\u05DE\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8\u05D9\u05DD \u05E7\u05E6\u05E8\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E7\u05E9\u05E8 \u05D1\u05D9\u05E0\u05D9\u05D4\u05DD"],why:"\u05DE\u05E9\u05D9\u05DE\u05D4 \u05D2\u05D3\u05D5\u05DC\u05D4 \u05D1\u05D4\u05D5\u05D3\u05E2\u05D4 \u05D0\u05D7\u05EA \u05DE\u05D6\u05DE\u05D9\u05E0\u05D4 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DE\u05D7\u05DE\u05D9\u05E6\u05D4 \u05D7\u05DC\u05E7\u05D9\u05DD. \u05E9\u05DC\u05D1\u05D9\u05DD \u05DE\u05E1\u05D5\u05D3\u05E8\u05D9\u05DD \u05E0\u05D5\u05EA\u05E0\u05D9\u05DD \u05DC\u05DE\u05D5\u05D3\u05DC \u2014 \u05D5\u05DC\u05E0\u05D5 \u2014 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05DB\u05DC \u05D7\u05DC\u05E7 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD."},en:{q:"For one big, complicated prompt, what usually helps?",a:["Writing it all in one very long sentence","Breaking it into steps and saying what matters in each","Sending several short prompts with no connection between them"],why:"A big task in one message invites an answer that misses parts. Ordered steps let the model \u2014 and you \u2014 check each piece before moving on."}},{id:"tokens-what-is",tier:1,topic:"tokens",correct:1,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05DE\u05D8\u05D1\u05E2\u05D5\u05EA \u05E9\u05D0\u05D5\u05E1\u05E4\u05D9\u05DD \u05D1\u05EA\u05D5\u05DA \u05DE\u05E9\u05D7\u05E7\u05D9 \u05DE\u05D7\u05E9\u05D1 \u05D5\u05D0\u05E4\u05DC\u05D9\u05E7\u05E6\u05D9\u05D5\u05EA","\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA \u05E9\u05DC \u05D8\u05E7\u05E1\u05D8 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E1\u05D5\u05E4\u05E8","\u05E9\u05DE\u05D5\u05EA \u05D4\u05D3\u05D2\u05DE\u05D9\u05DD \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC\u05D9 \u05D4\u05BEAI"],why:"\u05D8\u05E7\u05E1\u05D8 \u05DE\u05E4\u05D5\u05E8\u05E7 \u05DC\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA: \u05DE\u05D9\u05DC\u05D4, \u05D7\u05E6\u05D9 \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05E1\u05D9\u05DE\u05DF \u05E4\u05D9\u05E1\u05D5\u05E7. \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05D5\u05DB\u05D5\u05EA\u05D1 \u05D1\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05D4\u05D0\u05DC\u05D4, \u05D5\u05DC\u05DB\u05DF \u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05D0\u05D5\u05EA\u05DF."},en:{q:"What are tokens?",a:["Coins you collect inside computer games and apps","Small chunks of text that the model counts","The model names of AI systems"],why:"Text is broken into small chunks: a word, half a word, or a punctuation mark. The model reads and writes in those chunks, so those are what get counted."}},{id:"tokens-long-costs",tier:1,topic:"tokens",correct:2,he:{q:'\u05DC\u05DE\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3 "\u05E2\u05D5\u05DC\u05D4" \u05D9\u05D5\u05EA\u05E8?',a:["\u05DB\u05D9 \u05D4\u05D9\u05D0 \u05E0\u05E9\u05DC\u05D7\u05EA \u05DC\u05DE\u05E7\u05D5\u05DD \u05E8\u05D7\u05D5\u05E7 \u05D9\u05D5\u05EA\u05E8","\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05EA\u05E7\u05E9\u05D4 \u05DC\u05D4\u05EA\u05E8\u05DB\u05D6 \u05D1\u05D8\u05E7\u05E1\u05D8 \u05D0\u05E8\u05D5\u05DA \u05D5\u05DE\u05D0\u05D1\u05D3 \u05E1\u05D1\u05DC\u05E0\u05D5\u05EA","\u05DB\u05D9 \u05D9\u05E9 \u05D1\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD, \u05D5\u05DB\u05DC \u05D8\u05D5\u05E7\u05DF \u05D3\u05D5\u05E8\u05E9 \u05E2\u05D1\u05D5\u05D3\u05D4"],why:"\u05DC\u05DB\u05DC \u05D8\u05D5\u05E7\u05DF \u05D9\u05E9 \u05DE\u05D7\u05D9\u05E8 \u05E7\u05D8\u05DF \u05D1\u05D7\u05D9\u05E9\u05D5\u05D1. \u05D4\u05E8\u05D1\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u2014 \u05D4\u05E8\u05D1\u05D4 \u05D7\u05D9\u05E9\u05D5\u05D1, \u05D5\u05DC\u05DB\u05DF \u05D9\u05D5\u05EA\u05E8 \u05D6\u05DE\u05DF \u05D5\u05D9\u05D5\u05EA\u05E8 \u05E2\u05DC\u05D5\u05EA. \u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05D0\u05D5\u05E1\u05E4\u05D9\u05DD \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC."},en:{q:'Why does a very long prompt "cost" more?',a:["Because it is sent somewhere further away","Because the model struggles to stay focused through long text","Because it holds more tokens, and each token takes work"],why:"Every token costs a little computation. Many tokens means much computation \u2014 more time and more cost. Just like the tokens you collect on track."}},{id:"tokens-both-ways",tier:2,topic:"tokens",correct:0,he:{q:"\u05DE\u05D4 \u05E0\u05E1\u05E4\u05E8 \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05D2\u05DD \u05DE\u05D4 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD \u05D5\u05D2\u05DD \u05DE\u05D4 \u05E9\u05D7\u05D5\u05D6\u05E8 \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4","\u05E8\u05E7 \u05DE\u05D4 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD, \u05DB\u05D9 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05D1\u05E8 \u05E0\u05DB\u05EA\u05D1\u05EA \u05D1\u05D7\u05D9\u05E0\u05DD","\u05E8\u05E7 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05D7\u05D5\u05D6\u05E8\u05EA"],why:"\u05E9\u05E0\u05D9 \u05D4\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05E0\u05E1\u05E4\u05E8\u05D9\u05DD. \u05DC\u05DB\u05DF \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05DE\u05D1\u05E7\u05E9 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E2\u05E0\u05E7\u05D9\u05EA \u05D9\u05DB\u05D5\u05DC \u05DC\u05E2\u05DC\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E2\u05E6\u05DE\u05D5 \u2014 \u05D5\u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D4\u05D0\u05D5\u05E8\u05DA \u05E9\u05E6\u05E8\u05D9\u05DA."},en:{q:"What gets counted as tokens?",a:["Both what you send and what comes back","Only what you send, since the answer is written for free","Only the answer that comes back"],why:"Both directions count. Asking for a giant answer can cost more than the question did \u2014 another reason to ask for the length you actually need."}},{id:"tokens-save-well",tier:2,topic:"tokens",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D7\u05D5\u05E1\u05DB\u05D9\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E4\u05D2\u05D5\u05E2 \u05D1\u05EA\u05D5\u05E6\u05D0\u05D4?",a:["\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D0\u05EA \u05DB\u05DC \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D9\u05DD \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D7\u05EA \u05D1\u05DC\u05D1\u05D3","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D1\u05E7\u05D9\u05E6\u05D5\u05E8\u05D9\u05DD \u05E9\u05E7\u05E9\u05D4 \u05DC\u05D4\u05D1\u05D9\u05DF","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05DE\u05D5\u05E7\u05D3, \u05D1\u05DC\u05D9 \u05D7\u05D6\u05E8\u05D5\u05EA \u05D5\u05D1\u05DC\u05D9 \u05DE\u05D9\u05DC\u05D5\u05D9"],why:'\u05D7\u05D9\u05E1\u05DB\u05D5\u05DF \u05D7\u05DB\u05DD \u05DE\u05D5\u05D7\u05E7 \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E3 \u2014 \u05E0\u05D9\u05DE\u05D5\u05E1\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D9\u05DD, \u05D7\u05D6\u05E8\u05D5\u05EA, "\u05DB\u05DE\u05D5 \u05E9\u05D0\u05DE\u05E8\u05EA\u05D9 \u05E7\u05D5\u05D3\u05DD". \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05E9\u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD \u05E0\u05E9\u05D0\u05E8\u05D9\u05DD \u05EA\u05DE\u05D9\u05D3.'},en:{q:"How do you save tokens without hurting the result?",a:["Delete every detail and leave just one single word","Write in abbreviations that are hard to follow","Write a focused prompt, no repeats and no filler"],why:'Smart saving cuts what adds nothing \u2014 long pleasantries, repeats, "as I said before". The details that explain what you want always stay.'}},{id:"tokens-worth-spending",tier:3,topic:"tokens",correct:1,he:{q:'\u05DE\u05EA\u05D9 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05E9\u05D5\u05D5\u05D4 "\u05DC\u05D1\u05D6\u05D1\u05D6" \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?',a:["\u05D0\u05E3 \u05E4\u05E2\u05DD \u2014 \u05E7\u05E6\u05E8 \u05EA\u05DE\u05D9\u05D3 \u05E2\u05D3\u05D9\u05E3","\u05DB\u05E9\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05D4\u05E7\u05E9\u05E8 \u05D0\u05D5 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05E9\u05D1\u05D0\u05DE\u05EA \u05DE\u05E9\u05E4\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05E9\u05E8\u05D5\u05E6\u05D9\u05DD \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D9\u05E7\u05D7 \u05DC\u05E2\u05E6\u05DE\u05D5 \u05D9\u05D5\u05EA\u05E8 \u05D6\u05DE\u05DF \u05DC\u05D7\u05E9\u05D5\u05D1 \u05E2\u05DC \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D4\u05DD \u05EA\u05E7\u05E6\u05D9\u05D1, \u05DC\u05D0 \u05E6\u05D9\u05D5\u05DF. \u05DE\u05E9\u05E4\u05D8 \u05D4\u05E7\u05E9\u05E8 \u05E9\u05D7\u05D5\u05E1\u05DA \u05E9\u05DC\u05D5\u05E9\u05D4 \u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05DB\u05D5\u05E9\u05DC\u05D9\u05DD \u05D4\u05D5\u05D0 \u05D4\u05E2\u05E1\u05E7\u05D4 \u05D4\u05DB\u05D9 \u05DE\u05E9\u05EA\u05DC\u05DE\u05EA \u05E9\u05D9\u05E9."},en:{q:'When is it actually worth "spending" tokens?',a:["Never \u2014 shorter is always better","When context or an example genuinely improves the answer","When you want the model to spend longer thinking the answer over"],why:"Tokens are a budget, not a score. One sentence of context that saves three failed attempts is the best deal on the table."}},{id:"tokens-languages",tier:3,topic:"tokens",correct:0,he:{q:"\u05DE\u05E9\u05E4\u05D8 \u05E7\u05E6\u05E8 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05D5\u05DE\u05E9\u05E4\u05D8 \u05E7\u05E6\u05E8 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA \u2014 \u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF?",a:["\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D5\u05E0\u05D4 \u05D1\u05D9\u05DF \u05D4\u05E9\u05E4\u05D5\u05EA","\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05E7\u05D1\u05E2 \u05DC\u05E4\u05D9 \u05DE\u05E1\u05E4\u05E8 \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05DE\u05E9\u05E4\u05D8","\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05E1\u05E4\u05E8\u05D9\u05DD \u05DC\u05E4\u05D9 \u05DE\u05E1\u05E4\u05E8 \u05D4\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u05D1\u05DC\u05D1\u05D3"],why:"\u05D4\u05D7\u05DC\u05D5\u05E7\u05D4 \u05DC\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05DC\u05DE\u05D3\u05D4 \u05D1\u05E2\u05D9\u05E7\u05E8 \u05DE\u05D8\u05E7\u05E1\u05D8\u05D9\u05DD \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA, \u05D5\u05DC\u05DB\u05DF \u05E2\u05D1\u05E8\u05D9\u05EA \u05DE\u05EA\u05E4\u05E8\u05E7\u05EA \u05DC\u05E8\u05D5\u05D1 \u05DC\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8. \u05D0\u05D5\u05EA\u05D5 \u05E8\u05E2\u05D9\u05D5\u05DF, \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD."},en:{q:"A short Hebrew sentence and a short English one \u2014 what is true?",a:["The token count can differ between languages","The token count is set by how many words the sentence has","Tokens are counted purely by number of letters"],why:"Token splitting was learned mostly from English text, so Hebrew usually breaks into smaller pieces. Same idea, more tokens."}},{id:"iterate-try-again",tier:1,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D9\u05E6\u05D0\u05D4 \u05DC\u05D2\u05DE\u05E8\u05D9 \u05DC\u05D0 \u05DE\u05D4 \u05E9\u05E8\u05E6\u05D5. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E2\u05E9\u05D5\u05EA?",a:["\u05DC\u05D5\u05D5\u05EA\u05E8 \u05D5\u05DC\u05E2\u05E9\u05D5\u05EA \u05D0\u05EA \u05D6\u05D4 \u05DC\u05D1\u05D3","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05E9\u05D5\u05D1 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8","\u05DC\u05E9\u05E4\u05E8 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u2014 \u05D5\u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1"],why:"\u05E0\u05D9\u05E1\u05D9\u05D5\u05DF \u05E8\u05D0\u05E9\u05D5\u05DF \u05D4\u05D5\u05D0 \u05D8\u05D9\u05D5\u05D8\u05D4, \u05DC\u05D0 \u05D2\u05D6\u05E8 \u05D3\u05D9\u05DF. \u05DE\u05D9 \u05E9\u05DE\u05E9\u05E4\u05E8 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D5\u05DE\u05E0\u05E1\u05D4 \u05E9\u05D5\u05D1 \u05DE\u05E7\u05D1\u05DC \u05EA\u05D5\u05E6\u05D0\u05D5\u05EA \u05D8\u05D5\u05D1\u05D5\u05EA \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DE\u05DE\u05D9 \u05E9\u05DE\u05E0\u05E1\u05D4 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA."},en:{q:"The answer came out nothing like what you wanted. What is best?",a:["Give up and do it yourself","Send the exact same prompt again and hope for better","Improve the prompt \u2014 and try again"],why:"A first try is a draft, not a verdict. People who sharpen the prompt and retry get far better results than people who ask once."}},{id:"iterate-keep-change",tier:2,topic:"iterate",correct:1,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05DE\u05E2\u05D8 \u05D8\u05D5\u05D1\u05D4. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D9\u05DC \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E2\u05DB\u05E9\u05D9\u05D5?",a:['\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05DC\u05D0 \u05D8\u05D5\u05D1" \u05D5\u05DC\u05D7\u05DB\u05D5\u05EA',"\u05DC\u05D4\u05D2\u05D9\u05D3 \u05DE\u05D4 \u05DC\u05E9\u05DE\u05D5\u05E8 \u05D5\u05DE\u05D4 \u05DC\u05E9\u05E0\u05D5\u05EA","\u05DC\u05E4\u05EA\u05D5\u05D7 \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D5\u05DC\u05D4\u05EA\u05D7\u05D9\u05DC \u05DE\u05D4\u05D4\u05EA\u05D7\u05DC\u05D4"],why:'"\u05DC\u05D0 \u05D8\u05D5\u05D1" \u05DE\u05E9\u05D0\u05D9\u05E8 \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05D7\u05E9. "\u05D4\u05E4\u05EA\u05D9\u05D7\u05D4 \u05DE\u05E6\u05D5\u05D9\u05E0\u05EA, \u05D4\u05E1\u05D5\u05E3 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D3\u05D9" \u05E0\u05D5\u05EA\u05DF \u05DC\u05D5 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E6\u05E8\u05D9\u05DA \u05DB\u05D3\u05D9 \u05DC\u05EA\u05E7\u05DF \u05E8\u05E7 \u05D0\u05EA \u05D4\u05D7\u05DC\u05E7 \u05D4\u05E9\u05D1\u05D5\u05E8.'},en:{q:"The answer is almost right. What is most effective to write now?",a:['Write "not good" and wait',"Say what to keep and what to change","Open a brand new chat and start over from scratch"],why:'"Not good" leaves the model guessing. "The opening is great, the ending is too long" gives it exactly what it needs to fix only the broken part.'}},{id:"iterate-one-change",tier:2,topic:"iterate",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E9\u05E0\u05D5\u05EA \u05D3\u05D1\u05E8 \u05D0\u05D7\u05D3 \u05D1\u05DB\u05DC \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF?",a:["\u05DB\u05D9 \u05DB\u05DB\u05D4 \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05D5\u05D0 \u05D6\u05D4 \u05E9\u05E2\u05D6\u05E8","\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05DE\u05E1\u05D5\u05D2\u05DC \u05DC\u05E7\u05DC\u05D5\u05D8 \u05E9\u05E0\u05D9 \u05E9\u05D9\u05E0\u05D5\u05D9\u05D9\u05DD \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA","\u05DB\u05D9 \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF \u05E2\u05DD \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05D3 \u05E8\u05E5 \u05DE\u05D4\u05E8 \u05D9\u05D5\u05EA\u05E8"],why:"\u05DB\u05E9\u05E9\u05E0\u05D9 \u05D3\u05D1\u05E8\u05D9\u05DD \u05DE\u05E9\u05EA\u05E0\u05D9\u05DD \u05D9\u05D7\u05D3 \u05D5\u05DE\u05E9\u05D4\u05D5 \u05DE\u05E9\u05EA\u05E4\u05E8 \u2014 \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA \u05DE\u05D9 \u05D0\u05D7\u05E8\u05D0\u05D9. \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05D3 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u05D4\u05D5\u05E4\u05DA \u05E0\u05D9\u05D7\u05D5\u05E9 \u05DC\u05E0\u05D9\u05E1\u05D5\u05D9 \u05D0\u05DE\u05D9\u05EA\u05D9."},en:{q:"Why change one thing per attempt?",a:["So you know which change is the one that helped","Because the model cannot handle two changes at once","Because a one-change attempt runs faster"],why:"When two things change together and something improves, you cannot tell which did it. One change at a time turns guessing into a real experiment."}},{id:"iterate-fresh-chat",tier:3,topic:"iterate",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05EA\u05D7\u05D9\u05DC \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05EA\u05E7\u05DF?",a:["\u05D0\u05D7\u05E8\u05D9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D7\u05DE\u05E9 \u05D4\u05D5\u05D3\u05E2\u05D5\u05EA \u05D1\u05E9\u05D9\u05D7\u05D4, \u05DC\u05E4\u05D9 \u05D4\u05DB\u05DC\u05DC \u05D4\u05DE\u05E7\u05D5\u05D1\u05DC","\u05DB\u05E9\u05D4\u05E9\u05D9\u05D7\u05D4 \u05DE\u05DC\u05D0\u05D4 \u05D1\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05D9\u05E9\u05E0\u05D9\u05DD \u05E9\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05DC\u05D7\u05D6\u05D5\u05E8","\u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E9\u05D9\u05D7\u05D4, \u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DB\u05D1\u05E8 \u05DE\u05DB\u05D9\u05E8 \u05D0\u05EA \u05D4\u05D4\u05E7\u05E9\u05E8"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D5\u05D0\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E9\u05D9\u05D7\u05D4, \u05DB\u05D5\u05DC\u05DC \u05D4\u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05E9\u05E0\u05DB\u05E9\u05DC\u05D5, \u05D5\u05DE\u05DE\u05E9\u05D9\u05DA \u05DC\u05D4\u05D9\u05D2\u05E8\u05E8 \u05D0\u05DC\u05D9\u05D4\u05DD. \u05E4\u05EA\u05D9\u05D7\u05D4 \u05E0\u05E7\u05D9\u05D9\u05D4 \u05E2\u05DD \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05DE\u05E9\u05D5\u05E4\u05E8 \u05E2\u05D5\u05E7\u05E4\u05EA \u05D0\u05EA \u05DB\u05DC \u05D4\u05E8\u05E2\u05E9 \u05D4\u05D6\u05D4."},en:{q:"When is a fresh chat better than more fixing?",a:["After exactly five messages, as the usual rule goes","When the chat is full of old directions that keep coming back","Better to continue the same chat, since it already knows the context"],why:"The model sees the whole chat, failed attempts included, and keeps drifting back to them. A clean start with the improved prompt skips all that noise."}},{id:"mistakes-confident",tier:1,topic:"mistakes",correct:0,he:{q:"\u05D4\u05BEAI \u05E2\u05E0\u05D4 \u05D1\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05DE\u05DC\u05D0. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E1\u05DE\u05D5\u05DA \u05E2\u05DC \u05D6\u05D4?",a:["\u05DC\u05D0 \u05D1\u05D4\u05DB\u05E8\u05D7 \u2014 \u05D2\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D5\u05D7\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D2\u05D5\u05D9\u05D4","\u05DB\u05DF, \u05DB\u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E9\u05DE\u05E2\u05EA \u05D1\u05D8\u05D5\u05D7\u05D4 \u05D6\u05D4 \u05D1\u05D3\u05E8\u05 05D5\u05D8 \u05DC\u05D0 \u05E7\u05D9\u05D9\u05DD \u2014 \u05D5\u05DC\u05DB\u05DF \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD."},en:{q:'What is a model "hallucination"?',a:["When it refuses to answer a question that it finds odd or risky","When it invents a detail that sounds completely right but is not","When it answers slower than usual"],why:"The model always tries to complete something that fits, even with no information. Out comes a detail that sounds perfect and simply does not exist \u2014 hence checking."}},{id:"mistakes-sources",tier:2,topic:"mistakes",correct:0,he:{q:"\u05D4\u05BEAI \u05E6\u05D9\u05E8\u05E3 \u05E7\u05D9\u05E9\u05D5\u05E8 \u05D0\u05D5 \u05E9\u05DD \u05E9\u05DC \u05E1\u05E4\u05E8. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05E4\u05D5\u05EA\u05D7\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E9\u05D4\u05DE\u05E7\u05D5\u05E8 \u05D1\u05D0\u05DE\u05EA \u05E7\u05D9\u05D9\u05DD \u05D5\u05DE\u05EA\u05D0\u05D9\u05DD","\u05DE\u05E2\u05EA\u05D9\u05E7\u05D9\u05DD \u05D9\u05E9\u05E8 \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4, \u05DB\u05D9 \u05D6\u05D4 \u05E0\u05E8\u05D0\u05D4 \u05DE\u05E1\u05D5\u05D3\u05E8 \u05D5\u05DE\u05E7\u05E6\u05D5\u05E2\u05D9","\u05DE\u05E0\u05D9\u05D7\u05D9\u05DD \u05E9\u05D6\u05D4 \u05EA\u05E7\u05D9\u05DF \u05DB\u05D9 \u05D9\u05E9 \u05E9\u05DD \u05D5\u05EA\u05D0\u05E8\u05D9\u05DA"],why:"\u05E9\u05DE\u05D5\u05EA \u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05D4\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05D1\u05D5 \u05DE\u05D5\u05D3\u05DC \u05DE\u05DE\u05E6\u05D9\u05D0 \u05D1\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF. \u05DE\u05E7\u05D5\u05E8 \u05D0\u05DE\u05D9\u05EA\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E4\u05EA\u05D5\u05D7 \u2014 \u05D5\u05D6\u05D5 \u05D1\u05D3\u05D9\u05E7\u05D4 \u05E9\u05DC \u05D7\u05DE\u05E9 \u05E9\u05E0\u05D9\u05D5\u05EA."},en:{q:"The AI gave a link or a book title. What now?",a:["Open it and check the source really exists and fits","Copy it straight into the work, since it looks tidy and professional","Assume it is fine because it has a name and a date"],why:"Source names are exactly where a model invents confidently. A real source can be opened \u2014 that is a five-second check."}},{id:"mistakes-math",tier:3,topic:"mistakes",correct:2,he:{q:"\u05D1\u05D7\u05E9\u05D1\u05D5\u05DF \u05D0\u05D5 \u05D1\u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD, \u05DC\u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05E9\u05D5\u05D1 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05BEAI?",a:["\u05DB\u05D9 \u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05E2\u05D5\u05DC\u05D9\u05DD \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD","\u05DB\u05D9 \u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DE\u05D7\u05E9\u05D1 \u05DC\u05D0\u05D8, \u05D5\u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD \u05DE\u05D1\u05DC\u05D1\u05DC\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3","\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05DE\u05E0\u05D7\u05E9 \u05D8\u05E7\u05E1\u05D8, \u05D5\u05D3\u05D9\u05D5\u05E7 \u05D1\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05D4\u05D5\u05D0 \u05DC\u05D0 \u05D4\u05D7\u05D5\u05D6\u05E7 \u05E9\u05DC\u05D5"],why:"\u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DE\u05E0\u05D7\u05E9 \u05DE\u05D4 \u05DE\u05EA\u05D0\u05D9\u05DD \u05DC\u05D1\u05D5\u05D0 \u05D0\u05D7\u05E8 \u05DB\u05DA \u2014 \u05D5\u05D6\u05D4 \u05DC\u05D0 \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8 \u05DB\u05DE\u05D5 \u05DC\u05D7\u05E9\u05D1. \u05D1\u05D7\u05D9\u05E9\u05D5\u05D1 \u05D0\u05E8\u05D5\u05DA \u05E9\u05D5\u05D5\u05D4 \u05EA\u05DE\u05D9\u05D3 \u05DC\u05D5\u05D5\u05D3\u05D0, \u05D0\u05D5 \u05DC\u05D1\u05E7\u05E9 \u05DE\u05DE\u05E0\u05D5 \u05DC\u05E4\u05E8\u05D8 \u05D0\u05EA \u05D4\u05E9\u05DC\u05D1\u05D9\u05DD."},en:{q:"With arithmetic or dates, why double-check the AI?",a:["Because numbers cost more tokens","Because a language model calculates slowly, and dates confuse it badly","Because it guesses text, and exact numbers are not its strength"],why:"A language model guesses what comes next \u2014 which is not the same as calculating. On a long computation, verify, or ask it to show the steps."}},{id:"vibe-what-is",tier:2,topic:"vibe",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D5\u05D9\u05D9\u05D1\u05BE\u05E7\u05D5\u05D3\u05D9\u05E0\u05D2"?',a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05E7\u05D5\u05D3 \u05DE\u05D5\u05DB\u05DF \u05DE\u05D4\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8 \u05D1\u05DC\u05D9 \u05DC\u05E9\u05E0\u05D5\u05EA","\u05DC\u05EA\u05D0\u05E8 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05DE\u05D4 \u05D4\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E6\u05E8\u05D9\u05DB\u05D4 \u05DC\u05E2\u05E9\u05D5\u05EA, \u05D5\u05DC\u05EA\u05EA \u05DC\u05BEAI \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05E8\u05D5\u05D1 \u05D4\u05E7\u05D5\u05D3 \u05DC\u05D1\u05D3 \u05D5\u05DC\u05D1\u05E7\u05E9 \u05DE\u05BEAI \u05E8\u05E7 \u05DC\u05D7\u05E4\u05E9 \u05D1\u05D5 \u05E9\u05D2\u05D9\u05D0\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA"],why:"\u05D1\u05D5\u05D9\u05D9\u05D1\u05BE\u05E7\u05D5\u05D3\u05D9\u05E0\u05D2 \u05DE\u05EA\u05D0\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05E8\u05E2\u05D9\u05D5\u05DF \u05D1\u05E9\u05E4\u05D4 \u05E8\u05D2\u05D9\u05DC\u05D4, \u05D5\u05D4\u05BEAI \u05DB\u05D5\u05EA\u05D1 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3. \u05D4\u05EA\u05D9\u05D0\u05D5\u05E8 \u05D4\u05D5\u05D0 \u05D4\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D4\u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u2014 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D8\u05D5\u05D1."},en:{q:'What is "vibe coding"?',a:["Copying ready-made code off the internet unchanged","Describing what the software should do, and letting AI write the code","Writing most of the code yourself and asking AI only to hunt for small bugs"],why:"In vibe coding you describe the idea in ordinary language and the AI writes the code. The description is the real work \u2014 exactly like a good prompt."}},{id:"vibe-start-project",tier:2,topic:"vibe",correct:2,he:{q:"\u05D1\u05D5\u05E0\u05D9\u05DD \u05DE\u05E9\u05D7\u05E7 \u05E2\u05DD AI. \u05D0\u05D9\u05DA \u05D4\u05DB\u05D9 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05D4\u05EA\u05D7\u05D9\u05DC?",a:['\u05DC\u05D1\u05E7\u05E9 "\u05DC\u05D1\u05E0\u05D5\u05EA \u05DE\u05E9\u05D7\u05E7 \u05DE\u05D2\u05E0\u05D9\u05D1" \u05D5\u05DC\u05D7\u05DB\u05D5\u05EA',"\u05DC\u05D1\u05E7\u05E9 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E7\u05D5\u05D3 \u05E9\u05DC \u05D4\u05DE\u05E9\u05D7\u05E7 \u05D1\u05D4\u05D5\u05D3\u05E2\u05D4 \u05E2\u05E0\u05E7\u05D9\u05EA \u05D0\u05D7\u05EA","\u05DC\u05EA\u05D0\u05E8 \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05D1\u05DE\u05E9\u05D7\u05E7, \u05D5\u05D0\u05D6 \u05DC\u05D1\u05E7\u05E9 \u05E9\u05DC\u05D1 \u05D0\u05D7\u05E8 \u05E9\u05DC\u05D1"],why:"\u05E7\u05D5\u05D3\u05DD \u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05DE\u05D4 \u05D4\u05DE\u05E9\u05D7\u05E7 \u05E2\u05D5\u05E9\u05D4 \u2014 \u05DE\u05D9 \u05D6\u05D6, \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05E9\u05DE\u05E0\u05E6\u05D7\u05D9\u05DD. \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D1\u05D5\u05E0\u05D9\u05DD \u05D7\u05DC\u05E7\u05BE\u05D7\u05DC\u05E7 \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05DB\u05DC \u05D7\u05DC\u05E7. \u05DB\u05DB\u05D4 \u05D9\u05D5\u05E6\u05D0 \u05DE\u05E9\u05D7\u05E7 \u05D5\u05DC\u05D0 \u05E2\u05E8\u05D9\u05DE\u05EA \u05E7\u05D5\u05D3."},en:{q:"Building a game with AI. What is the best way to start?",a:['Ask for "a cool game" and wait',"Ask for all of the code for the whole game in one giant message","Describe what happens in the game, then build step by step"],why:"First explain what the game does \u2014 who moves, what happens when you win. Then build piece by piece and test each one. That gets a game, not a pile of code."}},{id:"vibe-error",tier:3,topic:"vibe",correct:0,he:{q:"\u05D4\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1 \u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D6\u05D5\u05E8?",a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05EA \u05D4\u05D5\u05D3\u05E2\u05EA \u05D4\u05E9\u05D2\u05D9\u05D0\u05D4 \u05D5\u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05DE\u05D4 \u05E7\u05E8\u05D4 \u05D1\u05E4\u05D5\u05E2\u05DC",'\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3, \u05DC\u05EA\u05E7\u05DF"',"\u05DC\u05DE\u05D7\u05D5\u05E7 \u05D4\u05DB\u05D5\u05DC \u05D5\u05DC\u05D1\u05E7\u05E9 \u05DE\u05D4\u05BEAI \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D6\u05D4 \u05DE\u05D7\u05D3\u05E9 \u05DE\u05D0\u05E4\u05E1"],why:'\u05D4\u05D5\u05D3\u05E2\u05EA \u05D4\u05E9\u05D2\u05D9\u05D0\u05D4 \u05D4\u05D9\u05D0 \u05D4\u05E8\u05DE\u05D6 \u05D4\u05DB\u05D9 \u05E9\u05D5\u05D5\u05D4 \u05E9\u05D9\u05E9, \u05D5\u05D4\u05D9\u05D0 \u05E2\u05D5\u05DC\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05D5\u05D3\u05D3\u05D9\u05DD. "\u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3" \u05DE\u05D1\u05E7\u05E9 \u05DE\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05D7\u05E9 \u05D0\u05D9\u05E4\u05D4 \u05D4\u05D1\u05E2\u05D9\u05D4.'},en:{q:"The code the AI wrote does not work. What helps most?",a:["Paste the error message and describe what actually happened",'Write "broken, fix it"',"Delete everything and ask the AI to write it again from scratch"],why:'The error message is the most valuable clue there is, and it costs a handful of tokens. "Broken" asks the model to guess where the problem is.'}},{id:"vibe-test-each",tier:3,topic:"vibe",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E9\u05D4\u05BEAI \u05E2\u05E9\u05D4?",a:["\u05DB\u05D9 \u05D4\u05BEAI \u05DC\u05D0 \u05D1\u05D0\u05DE\u05EA \u05D6\u05D5\u05DB\u05E8 \u05DE\u05D4 \u05D4\u05D5\u05D0 \u05DB\u05EA\u05D1 \u05DC\u05E4\u05E0\u05D9 \u05E8\u05D2\u05E2","\u05DB\u05D9 \u05E8\u05E7 \u05D4\u05E8\u05E6\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u05DE\u05E8\u05D0\u05D4 \u05D0\u05DD \u05D6\u05D4 \u05D1\u05D0\u05DE\u05EA \u05E2\u05D5\u05D1\u05D3","\u05DB\u05D9 \u05D1\u05D3\u05D9\u05E7\u05D4 \u05EA\u05DB\u05D5\u05E4\u05D4 \u05D7\u05D5\u05E1\u05DB\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05E7\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D9\u05E8\u05D0\u05D5\u05EA \u05DE\u05D5\u05E9\u05DC\u05DD \u05D5\u05DC\u05D4\u05EA\u05E4\u05D5\u05E6\u05E5 \u05D1\u05D4\u05E8\u05E6\u05D4 \u05D4\u05E8\u05D0\u05E9\u05D5\u05E0\u05D4. \u05D1\u05D3\u05D9\u05E7\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E7\u05D8\u05DF \u05DE\u05D0\u05EA\u05E8\u05EA \u05D0\u05EA \u05D4\u05EA\u05E7\u05DC\u05D4 \u05DB\u05E9\u05E2\u05D5\u05D3 \u05D1\u05E8\u05D5\u05E8 \u05DE\u05D4 \u05D2\u05E8\u05DD \u05DC\u05D4."},en:{q:"Why run and test every change the AI made?",a:["Because the AI does not really remember what it just wrote","Because only actually running it shows whether it works","Because frequent testing saves tokens"],why:"Code can look perfect and blow up on the first run. Testing after each small change catches the break while it is still obvious what caused it."}},{id:"vibe-good-spec",tier:3,topic:"vibe",correct:2,he:{q:"\u05DE\u05D4 \u05DE\u05E1\u05DE\u05DF \u05EA\u05D9\u05D0\u05D5\u05E8 \u05D8\u05D5\u05D1 \u05E9\u05DC \u05E4\u05D9\u05E6\u05F3\u05E8 \u05DC\u05BEAI?",a:["\u05D4\u05D5\u05D0 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3 \u05D5\u05DE\u05DB\u05E1\u05D4 \u05D4\u05DB\u05D5\u05DC","\u05D4\u05D5\u05D0 \u05DE\u05DC\u05D0 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05D8\u05DB\u05E0\u05D9\u05D5\u05EA \u05DE\u05E8\u05E9\u05D9\u05DE\u05D5\u05EA \u05E9\u05E0\u05E9\u05DE\u05E2\u05D5\u05EA \u05DE\u05E7\u05E6\u05D5\u05E2\u05D9\u05D5\u05EA \u05DE\u05D0\u05D5\u05D3","\u05DB\u05EA\u05D5\u05D1 \u05D1\u05D5 \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4, \u05DE\u05EA\u05D9 \u05D6\u05D4 \u05E7\u05D5\u05E8\u05D4, \u05D5\u05DE\u05D4 \u05E8\u05D5\u05D0\u05D9\u05DD \u05E2\u05DC \u05D4\u05DE\u05E1\u05DA"],why:'\u05EA\u05D9\u05D0\u05D5\u05E8 \u05D8\u05D5\u05D1 \u05D4\u05D5\u05D0 \u05DB\u05D6\u05D4 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D0\u05D7\u05E8\u05D9\u05D5. "\u05DB\u05E9\u05DC\u05D5\u05D7\u05E6\u05D9\u05DD \u05E8\u05D5\u05D5\u05D7 \u05D4\u05DB\u05D3\u05D5\u05E8 \u05E7\u05D5\u05E4\u05E5 \u05D5\u05E0\u05E9\u05DE\u05E2 \u05E6\u05DC\u05D9\u05DC" \u2014 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E8\u05D9\u05E5 \u05D5\u05DC\u05E8\u05D0\u05D5\u05EA \u05D0\u05DD \u05D6\u05D4 \u05E7\u05E8\u05D4.'},en:{q:"What marks a good feature description for an AI?",a:["It is very long and covers everything","It is packed with impressive technical words that sound professional","It says what happens, when it happens, and what appears on screen"],why:'A good description is one you can check afterwards. "Press space, the ball jumps and a sound plays" \u2014 you can run it and see whether that happened.'}},{id:"ai-everyday",tier:1,topic:"whatai",correct:1,he:{q:"\u05D0\u05D9\u05E4\u05D4 \u05E4\u05D5\u05D2\u05E9\u05D9\u05DD AI \u05D1\u05D9\u05D5\u05DD \u05E8\u05D2\u05D9\u05DC?",a:["\u05E8\u05E7 \u05D1\u05DE\u05E2\u05D1\u05D3\u05D5\u05EA \u05E9\u05DC \u05DE\u05D3\u05E2\u05E0\u05D9\u05DD \u05D5\u05D1\u05D0\u05D5\u05E0\u05D9\u05D1\u05E8\u05E1\u05D9\u05D8\u05D0\u05D5\u05EA \u05D2\u05D3\u05D5\u05DC\u05D5\u05EA","\u05D1\u05EA\u05E8\u05D2\u05D5\u05DD, \u05D1\u05D4\u05DE\u05DC\u05E6\u05D5\u05EA \u05E1\u05E8\u05D8\u05D9\u05DD \u05D5\u05D1\u05E1\u05D9\u05E0\u05D5\u05DF \u05D3\u05D5\u05D0\u05E8 \u05D6\u05D1\u05DC","\u05E8\u05E7 \u05D1\u05DE\u05E9\u05D7\u05E7\u05D9 \u05DE\u05D7\u05E9\u05D1 \u05D7\u05D3\u05E9\u05D9\u05DD"],why:"AI \u05DB\u05D1\u05E8 \u05D9\u05D5\u05E9\u05D1 \u05D1\u05D4\u05DE\u05D5\u05DF \u05DE\u05E7\u05D5\u05DE\u05D5\u05EA \u05E9\u05D2\u05E8\u05EA\u05D9\u05D9\u05DD: \u05EA\u05E8\u05D2\u05D5\u05DD, \u05E0\u05D9\u05D5\u05D5\u05D8, \u05D4\u05DE\u05DC\u05E6\u05D5\u05EA \u05D5\u05E1\u05D9\u05E0\u05D5\u05DF \u05E1\u05E4\u05D0\u05DD. \u05E8\u05D5\u05D1 \u05D4\u05E4\u05E2\u05DE\u05D9\u05DD \u05D1\u05DB\u05DC\u05DC \u05DC\u05D0 \u05E9\u05DE\u05D9\u05DD \u05DC\u05D1 \u05E9\u05D4\u05D5\u05D0 \u05E9\u05DD."},en:{q:"Where do you meet AI on an ordinary day?",a:["Only in the laboratories of scientists and big universities","In translation, film recommendations and spam filtering","Only in brand new video games"],why:"AI already sits in plenty of everyday places: translation, navigation, recommendations, spam filters. Most of the time nobody notices it is there."}},{id:"ai-not-magic",tier:1,topic:"whatai",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D4\u05DB\u05D9 \u05E0\u05DB\u05D5\u05DF \u05DC\u05EA\u05D0\u05E8 AI \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D0\u05D7\u05D3?",a:["\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E9\u05DE\u05D6\u05D4\u05D4 \u05D3\u05E4\u05D5\u05E1\u05D9\u05DD \u05D1\u05D4\u05DE\u05D5\u05DF \u05DE\u05D9\u05D3\u05E2 \u05D5\u05DE\u05E0\u05D7\u05E9\u05EA \u05DC\u05E4\u05D9\u05D4\u05DD","\u05DE\u05D5\u05D7 \u05D0\u05DC\u05E7\u05D8\u05E8\u05D5\u05E0\u05D9 \u05E7\u05D8\u05DF \u05E9\u05D7\u05D5\u05E9\u05D1 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05D1\u05DF \u05D0\u05D3\u05DD \u05D7\u05DB\u05DD","\u05E7\u05E1\u05DD \u05DE\u05D5\u05D3\u05E8\u05E0\u05D9 \u05E9\u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05D0\u05D5\u05EA\u05D5 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05E4\u05E9\u05D5\u05D8\u05D5\u05EA"],why:"\u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D9\u05DA \u05D1\u05E0\u05D5 \u05D0\u05D5\u05EA\u05D5 \u05D5\u05D0\u05D9\u05DA \u05D0\u05D9\u05DE\u05E0\u05D5 \u05D0\u05D5\u05EA\u05D5, \u05D2\u05DD \u05DB\u05E9\u05DC\u05D0 \u05D1\u05E8\u05D5\u05E8 \u05DC\u05DE\u05D4 \u05D9\u05E6\u05D0\u05D4 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D4\u05D6\u05D0\u05EA. \u05D6\u05D5 \u05D4\u05E0\u05D3\u05E1\u05D4 \u2014 \u05D5\u05D0\u05E4\u05E9\u05E8 \u05DC\u05DC\u05DE\u05D5\u05D3 \u05D0\u05D5\u05EA\u05D4."},en:{q:"What is the best one-sentence description of AI?",a:["Software that spots patterns in lots of data and guesses from them","A small electronic brain that thinks exactly like a clever person does","Modern magic that cannot really be explained in plain words"],why:"We know exactly how it was built and trained, even when it is unclear why this particular answer came out. It is engineering \u2014 and engineering can be learned."}},{id:"ai-needs-examples",tier:2,topic:"whatai",correct:0,he:{q:"\u05DC\u05DE\u05D4 AI \u05E6\u05E8\u05D9\u05DA \u05D4\u05DE\u05D5\u05DF \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05DB\u05D3\u05D9 \u05DC\u05DC\u05DE\u05D5\u05D3?",a:["\u05DB\u05D9 \u05D3\u05E4\u05D5\u05E1 \u05DE\u05EA\u05D2\u05DC\u05D4 \u05E8\u05E7 \u05DB\u05E9\u05E8\u05D5\u05D0\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05E9\u05D5\u05D1 \u05D5\u05E9\u05D5\u05D1","\u05DB\u05D9 \u05DB\u05DB\u05D4 \u05DE\u05EA\u05DE\u05DC\u05D0 \u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05E9\u05DC\u05D5","\u05DB\u05D9 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05D7\u05D3\u05E9\u05D5\u05EA \u05DE\u05D7\u05DC\u05D9\u05E4\u05D5\u05EA \u05D0\u05E6\u05DC\u05D5 \u05D0\u05EA \u05D4\u05D9\u05E9\u05E0\u05D5\u05EA"],why:"\u05DE\u05D3\u05D5\u05D2\u05DE\u05D4 \u05D0\u05D7\u05EA \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA \u05DE\u05D4 \u05DB\u05DC\u05DC \u05D5\u05DE\u05D4 \u05D9\u05D5\u05E6\u05D0 \u05D3\u05D5\u05E4\u05DF. \u05E8\u05E7 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05DE\u05D5\u05DF \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05DE\u05EA\u05D1\u05E8\u05E8 \u05DE\u05D4 \u05D7\u05D5\u05D6\u05E8 \u05EA\u05DE\u05D9\u05D3 \u2014 \u05D5\u05D6\u05D4 \u05DE\u05D4 \u05E9\u05E0\u05DC\u05DE\u05D3."},en:{q:"Why does AI need so many examples to learn?",a:["Because a pattern only shows up when you see it again and again","Because that is how its memory gets filled","Because newer examples simply replace the older ones it saw"],why:"One example cannot tell you what is a rule and what is an exception. Only after a great many does what always repeats become clear \u2014 and that is what gets learned."}},{id:"ai-knows-me",tier:1,topic:"whatai",correct:1,he:{q:"\u05D4\u05D0\u05DD \u05D4\u05BEAI \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D9 \u05DB\u05D5\u05EA\u05D1 \u05DC\u05D5?",a:["\u05DB\u05DF, \u05D4\u05D5\u05D0 \u05DE\u05D6\u05D4\u05D4 \u05D2\u05D9\u05DC \u05D5\u05E1\u05D2\u05E0\u05D5\u05DF \u05DC\u05E4\u05D9 \u05D4\u05D3\u05E8\u05DA \u05E9\u05D1\u05D4 \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05DC\u05D9\u05D5","\u05DC\u05D0, \u05D0\u05DC\u05D0 \u05D0\u05DD \u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05DC\u05D5 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05E2\u05E6\u05DE\u05E0\u05D5","\u05DB\u05DF, \u05D4\u05E9\u05DD \u05D5\u05D4\u05DB\u05D9\u05EA\u05D4 \u05E0\u05E9\u05DC\u05D7\u05D9\u05DD \u05D0\u05DC\u05D9\u05D5 \u05D9\u05D7\u05D3 \u05E2\u05DD \u05DB\u05DC \u05D4\u05D5\u05D3\u05E2\u05D4"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05E8\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05D5. \u05D0\u05DD \u05D7\u05E9\u05D5\u05D1 \u05E9\u05D9\u05D9\u05D3\u05E2 \u05D2\u05D9\u05DC, \u05DB\u05D9\u05EA\u05D4 \u05D0\u05D5 \u05EA\u05D7\u05D1\u05D9\u05D1 \u2014 \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05EA \u05D6\u05D4, \u05D5\u05DC\u05D0 \u05DE\u05E6\u05E4\u05D9\u05DD \u05E9\u05D9\u05E0\u05D7\u05E9."},en:{q:"Does the AI know who is writing to it?",a:["Yes, it works out age and style from how you write to it","No, unless you tell it yourself","Yes, your name and class are sent along with every message"],why:"The model reads only what is written to it. If it should know an age, a class or a hobby, write it down instead of expecting a guess."}},{id:"ai-image-models",tier:1,topic:"whatai",correct:2,he:{q:"\u05D9\u05E9 \u05D2\u05DD AI \u05E9\u05DE\u05E6\u05D9\u05D9\u05E8. \u05DE\u05D4 \u05D4\u05D5\u05D0 \u05E2\u05D5\u05E9\u05D4 \u05D1\u05E2\u05E6\u05DD?",a:["\u05DE\u05D7\u05E4\u05E9 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05DE\u05D5\u05DB\u05E0\u05D4 \u05D1\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8 \u05D5\u05DE\u05D3\u05D1\u05D9\u05E7 \u05D0\u05D5\u05 u05D4.'},en:{q:'What is wrong with "write something nice"?',a:["It is too long",'"Nice" means something different to everyone','The word "something" confuses the model more than any other'],why:'Praise words describe nothing. Instead of "nice", say exactly what you want: a short rhyming poem about the sea at night.'}},{id:"prompt-format-ask",tier:1,topic:"prompt",correct:2,he:{q:"\u05E8\u05D5\u05E6\u05D9\u05DD \u05DC\u05E7\u05D1\u05DC \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D1\u05DC\u05D4. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05E7\u05D5\u05D5\u05D9\u05DD \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D1\u05D7\u05E8 \u05D1\u05D8\u05D1\u05DC\u05D4, \u05DB\u05D9 \u05D6\u05D4 \u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05D4\u05DB\u05D9 \u05D1\u05E8\u05D5\u05E8",'\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD "\u05DE\u05E1\u05D5\u05D3\u05E8 \u05D1\u05D1\u05E7\u05E9\u05D4"',"\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D8\u05D1\u05DC\u05D4 \u05D1\u05DE\u05E4\u05D5\u05E8\u05E9, \u05D5\u05D0\u05D9\u05DC\u05D5 \u05E2\u05DE\u05D5\u05D3\u05D5\u05EA \u05E9\u05D9\u05D4\u05D9\u05D5 \u05D1\u05D4"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05DE\u05E0\u05D7\u05E9 \u05E4\u05D5\u05E8\u05DE\u05D8. \u05D1\u05E7\u05E9\u05D4 \u05DC\u05D8\u05D1\u05DC\u05D4 \u05E2\u05DD \u05E8\u05E9\u05D9\u05DE\u05EA \u05D4\u05E2\u05DE\u05D5\u05D3\u05D5\u05EA \u05DE\u05D7\u05D6\u05D9\u05E8\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D6\u05D4, \u05D1\u05DC\u05D9 \u05E1\u05D1\u05D1 \u05EA\u05D9\u05E7\u05D5\u05E0\u05D9\u05DD."},en:{q:"You want the answer as a table. What do you do?",a:["Hope the model picks a table, since that is the clearest format",'Write "make it tidy please"',"Ask for a table outright, and which columns it should have"],why:"The model does not guess format. Asking for a table and listing the columns returns exactly that, with no round of fixes."}},{id:"prompt-language-ask",tier:1,topic:"prompt",correct:0,he:{q:"\u05E8\u05D5\u05E6\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D1\u05D8\u05D5\u05D7 \u05DC\u05E2\u05E9\u05D5\u05EA?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05EA\u05D4\u05D9\u05D4 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05D5\u05DC\u05D4\u05E0\u05D9\u05D7 \u05E9\u05D2\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05EA\u05D4\u05D9\u05D4 \u05DB\u05D6\u05D0\u05EA","\u05DC\u05D1\u05E7\u05E9 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4, \u05DB\u05D9 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E7\u05E6\u05E8\u05D5\u05EA \u05D9\u05D5\u05E6\u05D0\u05D5\u05EA \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA"],why:"\u05DC\u05E8\u05D5\u05D1 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05DE\u05D7\u05D6\u05D9\u05E8 \u05E2\u05D1\u05E8\u05D9\u05EA, \u05D0\u05D1\u05DC \u05DC\u05D0 \u05EA\u05DE\u05D9\u05D3 \u2014 \u05D1\u05D9\u05D9\u05D7\u05D5\u05D3 \u05D1\u05E0\u05D5\u05E9\u05D0\u05D9\u05DD \u05D8\u05DB\u05E0\u05D9\u05D9\u05DD. \u05E9\u05D5\u05E8\u05D4 \u05D0\u05D7\u05EA \u05DE\u05E4\u05D5\u05E8\u05E9\u05EA \u05E1\u05D5\u05D2\u05E8\u05EA \u05D0\u05EA \u05D4\u05E2\u05E0\u05D9\u05D9\u05DF."},en:{q:"You want the answer in Hebrew. What is safest?",a:["Write in the prompt that the answer should be in Hebrew","Write the request in Hebrew and assume the answer follows","Ask for a short answer, since short answers come back in Hebrew"],why:"A Hebrew prompt usually returns Hebrew \u2014 but not always, especially on technical topics. One explicit line settles it."}},{id:"prompt-one-thing",tier:1,topic:"prompt",correct:1,he:{q:"\u05D9\u05E9 \u05E9\u05DC\u05D5\u05E9 \u05E9\u05D0\u05DC\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA. \u05DE\u05D4 \u05E2\u05D3\u05D9\u05E3 \u05DC\u05E2\u05E9\u05D5\u05EA?",a:["\u05DC\u05D3\u05D7\u05D5\u05E1 \u05D0\u05EA \u05E9\u05DC\u05D5\u05E9\u05EA\u05DF \u05DC\u05DE\u05E9\u05E4\u05D8 \u05D0\u05D7\u05D3","\u05DC\u05E9\u05D0\u05D5\u05DC \u05D0\u05D5\u05EA\u05DF \u05D1\u05E0\u05E4\u05E8\u05D3, \u05D0\u05D7\u05EA \u05D0\u05D7\u05E8\u05D9 \u05D4\u05E9\u05E0\u05D9\u05D9\u05D4","\u05DC\u05E9\u05D0\u05D5\u05DC \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E7\u05DC\u05D4 \u05DE\u05D1\u05D9\u05E0\u05D9\u05D4\u05DF \u05D5\u05DC\u05D5\u05D5\u05EA\u05E8 \u05E2\u05DC \u05D4\u05E9\u05D0\u05E8"],why:"\u05D1\u05D4\u05D5\u05D3\u05E2\u05D4 \u05E2\u05DE\u05D5\u05E1\u05D4 \u05D9\u05E9 \u05E1\u05D9\u05DB\u05D5\u05D9 \u05D8\u05D5\u05D1 \u05E9\u05D7\u05DC\u05E7 \u05DE\u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05D9\u05D9\u05D1\u05DC\u05E2\u05D5. \u05E9\u05D0\u05DC\u05D4 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u05DE\u05E7\u05D1\u05DC\u05EA \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05DC\u05D0\u05D4, \u05D5\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DE\u05E9\u05DD."},en:{q:"You have three different questions. What is better?",a:["Cram all three into one sentence","Ask them separately, one after another","Ask only the easy one and give up on the rest"],why:"In a crowded message some questions get swallowed. One question at a time gets a full answer, and you can build from there."}},{id:"prompt-context-what",tier:2,topic:"prompt",correct:2,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D4\u05E7\u05E9\u05E8" \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?',a:["\u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D4\u05DE\u05E0\u05D5\u05DE\u05E1\u05D5\u05EA \u05D1\u05D4\u05EA\u05D7\u05DC\u05D4","\u05D4\u05D0\u05D5\u05E8\u05DA \u05D5\u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05E9\u05D9\u05D4\u05D9\u05D5 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4","\u05D4\u05DE\u05D9\u05D3\u05E2 \u05D4\u05E0\u05D5\u05E1\u05E3 \u05E9\u05E2\u05D5\u05D6\u05E8 \u05DC\u05D4\u05D1\u05D9\u05DF \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4"],why:"\u05D4\u05E7\u05E9\u05E8 \u05D4\u05D5\u05D0 \u05DB\u05DC \u05DE\u05D4 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05D9\u05DB\u05D5\u05DC \u05DC\u05D3\u05E2\u05EA \u05DC\u05D1\u05D3: \u05DC\u05D0\u05D9\u05D6\u05D5 \u05DB\u05D9\u05EA\u05D4, \u05DC\u05D0\u05D9\u05D6\u05D5 \u05DE\u05D8\u05E8\u05D4, \u05DE\u05D4 \u05DB\u05D1\u05E8 \u05E0\u05D9\u05E1\u05D5. \u05D4\u05D5\u05D0 \u05E9\u05D4\u05D5\u05E4\u05DA \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05DC\u05DC\u05D9\u05EA \u05DC\u05DE\u05EA\u05D0\u05D9\u05DE\u05D4."},en:{q:'What is "context" in a prompt?',a:["The polite words at the start","The length and the format you are asking the answer to come in","The extra information that helps make sense of the request"],why:"Context is everything the model cannot know by itself: which class, what for, what was already tried. It turns a generic answer into a fitting one."}},{id:"tokens-not-words",tier:1,topic:"tokens",correct:1,he:{q:"\u05D4\u05D0\u05DD \u05D8\u05D5\u05E7\u05DF \u05D6\u05D4 \u05EA\u05DE\u05D9\u05D3 \u05DE\u05D9\u05DC\u05D4 \u05E9\u05DC\u05DE\u05D4?",a:["\u05DB\u05DF, \u05DB\u05DC \u05DE\u05D9\u05DC\u05D4 \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D4\u05D9\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D8\u05D5\u05E7\u05DF \u05D0\u05D7\u05D3","\u05DC\u05D0 \u2014 \u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05D7\u05E6\u05D9 \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05E1\u05D9\u05DE\u05DF \u05E4\u05D9\u05E1\u05D5\u05E7","\u05DB\u05DF, \u05D0\u05D1\u05DC \u05E8\u05E7 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA"],why:"\u05DE\u05D9\u05DC\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D5\u05EA \u05DE\u05EA\u05E4\u05E8\u05E7\u05D5\u05EA \u05DC\u05DB\u05DE\u05D4 \u05D7\u05EA\u05D9\u05DB\u05D5\u05EA, \u05D5\u05E4\u05E1\u05D9\u05E7 \u05D4\u05D5\u05D0 \u05D7\u05EA\u05D9\u05DB\u05D4 \u05D1\u05E4\u05E0\u05D9 \u05E2\u05E6\u05DE\u05D5. \u05DC\u05DB\u05DF \u05E1\u05E4\u05D9\u05E8\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05DB\u05DE\u05E2\u05D8 \u05D0\u05E3 \u05E4\u05E2\u05DD \u05DC\u05D0 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E1\u05E4\u05D9\u05E8\u05EA \u05DE\u05D9\u05DC\u05D9\u05DD."},en:{q:"Is a token always a whole word?",a:["Yes, every word in a sentence is exactly one token","No \u2014 sometimes half a word or a punctuation mark","Yes, but only in English"],why:"Long words split into several chunks, and a comma is a chunk of its own. That is why a token count almost never equals a word count."}},{id:"tokens-why-count",tier:1,topic:"tokens",correct:2,he:{q:"\u05DC\u05DE\u05D4 \u05D1\u05DB\u05DC\u05DC \u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D3\u05E2\u05EA \u05DB\u05DE\u05D4 \u05E9\u05D0\u05DC\u05D5\u05EA \u05E0\u05E9\u05D0\u05DC\u05D5","\u05DB\u05D3\u05D9 \u05DC\u05EA\u05EA \u05E6\u05D9\u05D5\u05DF \u05DC\u05D0\u05D9\u05DB\u05D5\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05D4\u05EA\u05E7\u05D1\u05DC\u05D4","\u05DB\u05D9 \u05D4\u05DD \u05DE\u05D5\u05D3\u05D3\u05D9\u05DD \u05DB\u05DE\u05D4 \u05E2\u05D1\u05D5\u05D3\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05E9\u05D4"],why:"\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D4\u05DD \u05D9\u05D7\u05D9\u05D3\u05EA \u05D4\u05DE\u05D9\u05D3\u05D4 \u05E9\u05DC \u05D4\u05D8\u05E7\u05E1\u05D8: \u05DB\u05DE\u05D4 \u05E0\u05E7\u05E8\u05D0 \u05D5\u05DB\u05DE\u05D4 \u05E0\u05DB\u05EA\u05D1. \u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E0\u05DE\u05D3\u05D3\u05D9\u05DD \u05D4\u05D6\u05DE\u05DF, \u05D4\u05E2\u05DC\u05D5\u05EA \u05D5\u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05E0\u05E9\u05D0\u05E8 \u05D1\u05E9\u05D9\u05D7\u05D4."},en:{q:"Why count tokens at all?",a:["To know how many questions were asked","To grade the quality of the answer that came back","Because they measure how much work the model did"],why:"Tokens are the unit of text: how much was read and how much was written. Time, cost and remaining room in the chat are all measured by them."}},{id:"tokens-filler-words",tier:1,topic:"tokens",correct:0,he:{q:"\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05E9\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05DE\u05D9\u05DC\u05D9\u05DD \u05E9\u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E4\u05D5\u05EA \u05DE\u05D9\u05D3\u05E2?",a:["\u05DE\u05E9\u05DC\u05DE\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4\u05DF \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E7\u05D1\u05DC \u05EA\u05DE\u05D5\u05E8\u05D4","\u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05D5\u05D7\u05E7 \u05D0\u05D5\u05EA\u05DF \u05DC\u05D1\u05D3, \u05D0\u05D6 \u05D0\u05D9\u05DF \u05DC\u05D6\u05D4 \u05E9\u05D5\u05DD \u05D4\u05E9\u05E4\u05E2\u05D4","\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E2\u05E9\u05D9\u05EA \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA \u05D9\u05D5\u05EA\u05E8"],why:'\u05DB\u05DC \u05DE\u05D9\u05DC\u05D4 \u05E0\u05E1\u05E4\u05E8\u05EA, \u05D2\u05DD "\u05D1\u05D1\u05E7\u05E9\u05D4 \u05D1\u05D1\u05E7\u05E9\u05D4 \u05DE\u05D0\u05D5\u05D3". \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05E9\u05E7\u05D9\u05E2 \u05D0\u05EA \u05D0\u05D5\u05EA\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05E4\u05E8\u05D8 \u05E9\u05D1\u05D0\u05DE\u05EA \u05DE\u05DB\u05D5\u05D5\u05DF \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4.'},en:{q:"What happens when you add words that add no information?",a:["You pay for them in tokens and get nothing back","The model deletes them by itself, so nothing changes","The answer becomes more accurate"],why:'Every word counts, including "please oh please". Better to spend those same tokens on a detail that actually steers the answer.'}},{id:"iterate-say-what-wrong",tier:1,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D3\u05D9. \u05DE\u05D4 \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E2\u05DB\u05E9\u05D9\u05D5?",a:['"\u05DC\u05D0 \u05D0\u05D4\u05D1\u05EA\u05D9"','"\u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1, \u05D0\u05D5\u05DC\u05D9 \u05D4\u05E4\u05E2\u05DD \u05D6\u05D4 \u05D9\u05D9\u05E6\u05D0 \u05D8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8"','"\u05DC\u05E7\u05E6\u05E8 \u05DC\u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA \u05D5\u05DC\u05D4\u05E9\u05D0\u05D9\u05E8 \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E2\u05D9\u05E7\u05E8"'],why:"\u05D1\u05D9\u05E7\u05D5\u05E8\u05EA \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA \u05D4\u05D9\u05D0 \u05DB\u05D1\u05E8 \u05D4\u05D5\u05E8\u05D0\u05EA \u05EA\u05D9\u05E7\u05D5\u05DF. \u05DB\u05E9\u05D0\u05D5\u05DE\u05E8\u05D9\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05D4 \u05DC\u05D4\u05D7\u05DC\u05D9\u05E3, \u05D4\u05E1\u05D9\u05D1\u05D5\u05D1 \u05D4\u05D1\u05D0 \u05DB\u05DE\u05E2\u05D8 \u05EA\u05DE\u05D9\u05D3 \u05E7\u05D5\u05DC\u05E2."},en:{q:"The answer is too long. What do you write now?",a:['"I did not like it"','"Try again \u2014 maybe this time it comes out better"','"Cut it to three lines and keep only the main point"'],why:"Precise criticism is already a repair instruction. Say exactly what to swap and the next round almost always lands."}},{id:"iterate-ask-options",tier:1,topic:"iterate",correct:0,he:{q:"\u05DC\u05D0 \u05D1\u05D8\u05D5\u05D7\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05DB\u05D9\u05D5\u05D5\u05DF \u05DE\u05EA\u05D0\u05D9\u05DD. \u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9?",a:["\u05E9\u05DC\u05D5\u05E9 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D9\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA \u05D6\u05D5 \u05DE\u05D6\u05D5, \u05D5\u05D0\u05D6 \u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05D0\u05D7\u05EA","\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05D7\u05EA \u05DE\u05E4\u05D5\u05E8\u05D8\u05EA \u05DE\u05D0\u05D5\u05D3 \u05E9\u05DE\u05DB\u05E1\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D4\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05D1\u05D9\u05D7\u05D3","\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D1\u05D7\u05E8 \u05D0\u05EA \u05D4\u05DB\u05D9\u05D5\u05D5\u05DF \u05D4\u05DB\u05D9 \u05E4\u05D5\u05E4\u05D5\u05DC\u05E8\u05D9 \u05D1\u05D9\u05DF \u05DB\u05DC \u05D4\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD"],why:"\u05E7\u05DC \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DC\u05D1\u05D7\u05D5\u05E8 \u05DE\u05EA\u05D5\u05DA \u05E9\u05DC\u05D5\u05E9 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D
