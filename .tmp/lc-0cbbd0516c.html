9\u05D5\u05EA \u05DE\u05D0\u05E9\u05E8 \u05DC\u05EA\u05D0\u05E8 \u05DE\u05E8\u05D0\u05E9 \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD. \u05D0\u05D7\u05E8\u05D9 \u05D4\u05D1\u05D7\u05D9\u05E8\u05D4 \u05DE\u05E2\u05DE\u05D9\u05E7\u05D9\u05DD \u05E8\u05E7 \u05D1\u05DB\u05D9\u05D5\u05D5\u05DF \u05D0\u05D7\u05D3."},en:{q:"Not sure which direction fits. What is worth asking for?",a:["Three options that differ from each other, then pick one","One very detailed answer covering all the directions at once","For the model to pick whichever direction most users prefer"],why:"Choosing between three options is far easier than describing what you want up front. After choosing, go deep on one direction only."}},{id:"mistakes-old-info",tier:1,topic:"mistakes",correct:1,he:{q:"\u05E9\u05D0\u05DC\u05D5 AI \u05E2\u05DC \u05DE\u05E9\u05D4\u05D5 \u05E9\u05E7\u05E8\u05D4 \u05D4\u05E9\u05D1\u05D5\u05E2. \u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05D1\u05D3\u05D5\u05E7?",a:["\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05E9\u05D5\u05DB\u05D7 \u05DE\u05D9\u05D3\u05E2 \u05D9\u05E9\u05DF \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DE\u05D4 \u05D7\u05D5\u05D3\u05E9\u05D9\u05DD \u05D1\u05DC\u05D9 \u05E9\u05D9\u05DE\u05D5\u05E9","\u05DB\u05D9 \u05D4\u05D9\u05D3\u05E2 \u05E9\u05DC\u05D5 \u05E0\u05E2\u05E6\u05E8 \u05D1\u05EA\u05D0\u05E8\u05D9\u05DA, \u05D0\u05DC\u05D0 \u05D0\u05DD \u05D7\u05D9\u05E4\u05E9 \u05DE\u05DE\u05E9 \u05E2\u05DB\u05E9\u05D9\u05D5","\u05DB\u05D9 \u05D7\u05D3\u05E9\u05D5\u05EA \u05DE\u05D2\u05D9\u05E2\u05D5\u05EA \u05D0\u05DC\u05D9\u05D5 \u05EA\u05DE\u05D9\u05D3 \u05D1\u05D0\u05D9\u05D7\u05D5\u05E8 \u05E9\u05DC \u05D9\u05D5\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7"],why:"\u05D4\u05D0\u05D9\u05DE\u05D5\u05DF \u05E0\u05E2\u05E6\u05E8 \u05D1\u05E0\u05E7\u05D5\u05D3\u05EA \u05D6\u05DE\u05DF \u05DB\u05DC\u05E9\u05D4\u05D9. \u05D7\u05DC\u05E7 \u05DE\u05D4\u05DB\u05DC\u05D9\u05DD \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D2\u05DD \u05DC\u05D7\u05E4\u05E9 \u05D1\u05E8\u05E9\u05EA \u05EA\u05D5\u05DA \u05DB\u05D3\u05D9 \u2014 \u05D5\u05D0\u05D6 \u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DC\u05E8\u05D0\u05D5\u05EA \u05D0\u05EA \u05D4\u05E7\u05D9\u05E9\u05D5\u05E8 \u05E2\u05E6\u05DE\u05D5."},en:{q:"You asked an AI about something from this week. Why check it?",a:["Because it forgets older information after a few unused months","Because its knowledge stops at a date, unless it just searched","Because news always reaches it exactly one day late"],why:"Training stopped at some point in time. Some tools can also search the web as they go \u2014 in which case, ask to see the link itself."}},{id:"mistakes-homework",tier:1,topic:"mistakes",correct:2,he:{q:"\u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF \u05DC\u05E2\u05E9\u05D5\u05EA \u05E2\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DC AI \u05D1\u05E9\u05D9\u05E2\u05D5\u05E8\u05D9 \u05D1\u05D9\u05EA?",a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05D5\u05EA\u05D4 \u05D5\u05DC\u05E9\u05E0\u05D5\u05EA \u05E7\u05E6\u05EA \u05DE\u05D9\u05DC\u05D9\u05DD \u05DB\u05D3\u05D9 \u05E9\u05EA\u05D9\u05E9\u05DE\u05E2 \u05D0\u05D7\u05E8\u05EA","\u05DC\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05D4 \u05DB\u05DE\u05D5 \u05E9\u05D4\u05D9\u05D0 \u05D5\u05DC\u05E6\u05D9\u05D9\u05DF \u05D1\u05E1\u05D5\u05E3 \u05E9\u05D4\u05D9\u05D0 \u05E0\u05DB\u05EA\u05D1\u05D4 \u05D1\u05BEAI","\u05DC\u05E7\u05E8\u05D5\u05D0, \u05DC\u05D4\u05D1\u05D9\u05DF, \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D5\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05E1\u05D2\u05E0\u05D5\u05DF \u05E9\u05DC\u05E0\u05D5"],why:"\u05D4\u05D7\u05DC\u05E4\u05EA \u05DE\u05D9\u05DC\u05D9\u05DD \u05DC\u05D0 \u05D4\u05D5\u05E4\u05DB\u05EA \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DC\u05E9\u05DC\u05E0\u05D5, \u05D5\u05D2\u05DD \u05DC\u05D0 \u05DE\u05DC\u05DE\u05D3\u05EA \u05DB\u05DC\u05D5\u05DD. \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05DE\u05EA\u05D2\u05DC\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D1\u05E9\u05D9\u05E2\u05D5\u05E8 \u05D4\u05D1\u05D0."},en:{q:"What is the right thing to do with an AI answer in homework?",a:["Copy it and swap a few words so it sounds different","Use it as is and note at the end that AI wrote it","Read it, understand it, check it and write it in your own voice"],why:"Swapping words does not make the answer yours, and teaches nothing. Whatever you did not understand surfaces in the very next lesson."}},{id:"mistakes-private-info",tier:1,topic:"mistakes",correct:0,he:{q:"\u05D0\u05D9\u05D6\u05D4 \u05DE\u05D9\u05D3\u05E2 \u05DC\u05D0 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05DC\u05E6\u05F3\u05D0\u05D8 \u05E9\u05DC AI?",a:["\u05DB\u05EA\u05D5\u05D1\u05EA, \u05DE\u05E1\u05E4\u05E8 \u05D8\u05DC\u05E4\u05D5\u05DF \u05D5\u05E1\u05D9\u05E1\u05DE\u05D0\u05D5\u05EA","\u05E9\u05DD \u05E9\u05DC \u05D7\u05D9\u05D9\u05EA \u05DE\u05D7\u05DE\u05D3 \u05D1\u05EA\u05D5\u05DA \u05E1\u05D9\u05E4\u05D5\u05E8","\u05E9\u05D0\u05DC\u05D5\u05EA \u05E2\u05DC \u05E9\u05D9\u05E2\u05D5\u05E8\u05D9 \u05D1\u05D9\u05EA"],why:"\u05E4\u05E8\u05D8\u05D9\u05DD \u05D0\u05D9\u05E9\u05D9\u05D9\u05DD \u05DC\u05D0 \u05E6\u05E8\u05D9\u05DB\u05D9\u05DD \u05DC\u05D4\u05D9\u05DB\u05E0\u05E1 \u05DC\u05E9\u05D9\u05D7\u05D4 \u05D1\u05DB\u05DC\u05DC. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05EA\u05D0\u05E8 \u05D0\u05EA \u05D4\u05D1\u05E2\u05D9\u05D4 \u05D1\u05DC\u05D9 \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05D4\u05DE\u05D6\u05D4\u05D9\u05DD \u05D5\u05DC\u05E7\u05D1\u05DC \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D4 \u05E2\u05D6\u05E8\u05D4."},en:{q:"What information should not go into an AI chat?",a:["An address, a phone number and passwords","A pet's name inside a story","Questions about homework"],why:"Personal details do not belong in the conversation at all. Describe the problem without the identifying bits and get exactly the same help."}},{id:"vibe-describe-first",tier:1,topic:"vibe",correct:1,he:{q:"\u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05BEAI \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E7\u05D5\u05D3, \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD \u05E7\u05D5\u05D3\u05DD?",a:["\u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05E9\u05DD \u05DC\u05DE\u05E9\u05D7\u05E7","\u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05D1\u05E7\u05E6\u05E8\u05D4 \u05DE\u05D4 \u05D4\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E6\u05E8\u05D9\u05DB\u05D4 \u05DC\u05E2\u05E9\u05D5\u05EA","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DB\u05DE\u05D4 \u05E9\u05D9\u05D5\u05EA\u05E8 \u05E9\u05D5\u05E8\u05D5\u05EA \u05E7\u05D5\u05D3, \u05DB\u05D3\u05D9 \u05E9\u05D9\u05D4\u05D9\u05D4 \u05DE\u05D0\u05D9\u05E4\u05D4 \u05DC\u05D4\u05EA\u05D7\u05D9\u05DC"],why:"\u05DE\u05D9 \u05E9\u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D4 \u05D4\u05D5\u05D0 \u05E8\u05D5\u05E6\u05D4 \u05D9\u05E7\u05D1\u05DC \u05DE\u05E9\u05D4\u05D5 \u05D0\u05E7\u05E8\u05D0\u05D9. \u05DE\u05E9\u05E4\u05D8 \u05D0\u05D5 \u05E9\u05E0\u05D9\u05D9\u05DD \u05E9\u05DE\u05EA\u05D0\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05DE\u05D8\u05E8\u05D4 \u05E9\u05D5\u05D5\u05D9\u05DD \u05D4\u05DE\u05D5\u05DF \u05E9\u05D5\u05E8\u05D5\u05EA \u05E7\u05D5\u05D3."},en:{q:"Before asking an AI to write code, what comes first?",a:["Choosing a name for the game first","Briefly explaining what the software needs to do","Asking for as many lines of code as possible, to have a start"],why:"Whoever does not know what they want gets something random. A sentence or two describing the goal is worth a lot of code."}},{id:"ai-training-vs-use",tier:2,topic:"whatai",correct:2,he:{q:"\u05DE\u05D4 \u05D4\u05D4\u05D1\u05D3\u05DC \u05D1\u05D9\u05DF \u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D1\u05D9\u05DF \u05E9\u05D9\u05DE\u05D5\u05E9 \u05D1\u05D5?",a:["\u05D0\u05D9\u05DF \u05E9\u05D5\u05DD \u05D4\u05D1\u05D3\u05DC \u05D0\u05DE\u05D9\u05EA\u05D9, \u05DE\u05D3\u05D5\u05D1\u05E8 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D1\u05D0\u05D5\u05EA\u05D5 \u05EA\u05D4\u05DC\u05D9\u05DA","\u05D1\u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4, \u05D5\u05D1\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3","\u05D1\u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3 \u05DE\u05E8\u05D0\u05E9, \u05D5\u05D1\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D4\u05D5\u05D0 \u05E8\u05E7 \u05E2\u05D5\u05E0\u05D4"],why:"\u05D4\u05D0\u05D9\u05DE\u05D5\u05DF \u05E7\u05E8\u05D4 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA, \u05D4\u05E8\u05D1\u05D4 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05D2\u05D9\u05E2 \u05D0\u05DC\u05D9\u05E0\u05D5. \u05E9\u05D9\u05D7\u05D4 \u05D0\u05D9\u05EA\u05D5 \u05DC\u05D0 \u05DE\u05DC\u05DE\u05D3\u05EA \u05D0\u05D5\u05EA\u05D5 \u2014 \u05D4\u05D9\u05D0 \u05E8\u05E7 \u05DE\u05E9\u05EA\u05DE\u05E9\u05EA \u05D1\u05DE\u05D4 \u05E9\u05DB\u05D1\u05E8 \u05E0\u05DC\u05DE\u05D3."},en:{q:"What is the difference between training a model and using it?",a:["No real difference at all: it is exactly the same process either way","In training it answers, in use it learns","In training it learns ahead of time, in use it only answers"],why:"Training happened once, long before the model reached you. Chatting does not teach it \u2014 it only uses what was already learned."}},{id:"ai-bias",tier:2,topic:"whatai",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05D7\u05E9\u05D5\u05D1 \u05D0\u05D9\u05D6\u05D4 \u05DE\u05D9\u05D3\u05E2 \u05E0\u05DB\u05E0\u05E1 \u05DC\u05D0\u05D9\u05DE\u05D5\u05DF \u05E9\u05DC AI?",a:["\u05DB\u05D9 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D3\u05D9 \u05DE\u05D9\u05D3\u05E2 \u05DE\u05D0\u05D8 \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC","\u05DB\u05D9 \u05D0\u05DD \u05D4\u05DE\u05D9\u05D3\u05E2 \u05DE\u05D5\u05D8\u05D4, \u05D2\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D9\u05D9\u05E6\u05D0\u05D5 \u05DE\u05D5\u05D8\u05D5\u05EA","\u05DB\u05D9 \u05DE\u05D9\u05D3\u05E2 \u05D9\u05E9\u05DF \u05DE\u05EA\u05E2\u05E8\u05D1\u05D1 \u05D0\u05E6\u05DC\u05D5 \u05E2\u05DD \u05DE\u05D9\u05D3\u05E2 \u05D7\u05D3\u05E9 \u05D9\u05D5\u05EA\u05E8"],why:"\u05DE\u05D5\u05D3\u05DC \u05DC\u05D5\u05DE\u05D3 \u05DE\u05DE\u05D4 \u05E9\u05D4\u05E8\u05D0\u05D5 \u05DC\u05D5. \u05D0\u05DD \u05D1\u05DB\u05DC \u05D4\u05E1\u05D9\u05E4\u05D5\u05E8\u05D9\u05DD \u05E9\u05E7\u05E8\u05D0 \u05E8\u05E7 \u05D1\u05E0\u05D9\u05DD \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05DB\u05D3\u05D5\u05E8\u05D2\u05DC, \u05D6\u05D4 \u05DE\u05D4 \u05E9\u05D9\u05D9\u05E6\u05D0 \u05DC\u05D5 \u2014 \u05D5\u05D6\u05D0\u05EA \u05DC\u05D0 \u05D4\u05D0\u05DE\u05EA \u05E2\u05DC \u05D4\u05E2\u05D5\u05DC\u05DD."},en:{q:"Why does it matter which data goes into training an AI?",a:["Because too much data slows the model down","Because if the data is skewed, the answers come out skewed too","Because older data gets muddled together with the newer data"],why:"A model learns from what it was shown. If every story it read had only boys playing football, that is what comes out \u2014 and that is not the truth about the world."}},{id:"ai-not-search",tier:2,topic:"whatai",correct:0,he:{q:"\u05D1\u05DE\u05D4 \u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05E9\u05D5\u05E0\u05D4 \u05DE\u05DE\u05E0\u05D5\u05E2 \u05D7\u05D9\u05E4\u05D5\u05E9?",a:["\u05D4\u05D5\u05D0 \u05DE\u05E0\u05E1\u05D7 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E2\u05E6\u05DE\u05D5 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05E8\u05D0\u05D5\u05EA \u05E8\u05E9\u05D9\u05DE\u05EA \u05D3\u05E4\u05D9\u05DD","\u05D4\u05D5\u05D0 \u05DE\u05D7\u05D6\u05D9\u05E7 \u05D1\u05EA\u05D5\u05DB\u05D5 \u05E2\u05D5\u05EA\u05E7 \u05DE\u05DC\u05D0 \u05D5\u05DE\u05E2\u05D5\u05D3\u05DB\u05DF \u05E9\u05DC \u05DB\u05DC \u05D4\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8","\u05D4\u05D5\u05D0 \u05D1\u05D5\u05D3\u05E7 \u05DB\u05DC \u05E2\u05D5\u05D1\u05D3\u05D4 \u05D1\u05E9\u05DC\u05D5\u05E9\u05D4 \u05D0\u05EA\u05E8\u05D9\u05DD \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4"],why:"\u05D7\u05D9\u05E4\u05D5\u05E9 \u05DE\u05D7\u05D6\u05D9\u05E8 \u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E4\u05EA\u05D5\u05D7; \u05DE\u05D5\u05D3\u05DC \u05DE\u05E0\u05E1\u05D7 \u05EA\u05E9\u05D5\u05D1\u05D4. \u05D2\u05DD \u05DB\u05E9\u05D4\u05D5\u05D0 \u05DB\u05DF \u05DE\u05D7\u05E4\u05E9 \u05D1\u05E8\u05E9\u05EA, \u05D0\u05EA \u05D4\u05E0\u05D9\u05E1\u05D5\u05D7 \u05D4\u05D5\u05D0 \u05E2\u05D3\u05D9\u05D9\u05DF \u05DB\u05D5\u05EA\u05D1 \u05D1\u05E2\u05E6\u05DE\u05D5."},en:{q:"How is a language model different from a search engine?",a:["It writes the answer itself instead of showing a list of pages","It holds a full, up-to-date copy of the whole internet inside it","It checks every fact on three websites before it answers"],why:"Search hands back sources you can open; a model writes an answer. Even when it does search the web, the wording is still its own."}},{id:"ai-memory-chat",tier:2,topic:"whatai",correct:2,he:{q:"\u05DE\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05DC\u05E4\u05E0\u05D9 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E9\u05D9\u05D7\u05D4?",a:["\u05D0\u05EA \u05DB\u05DC \u05DE\u05D4 \u05E9\u05E0\u05DB\u05EA\u05D1 \u05DC\u05D5 \u05D0\u05D9 \u05E4\u05E2\u05DD, \u05D1\u05DB\u05DC \u05D4\u05E9\u05D9\u05D7\u05D5\u05EA \u05E9\u05DC \u05DB\u05DC \u05D4\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD","\u05E8\u05E7 \u05D0\u05EA \u05D4\u05D4\u05D5\u05D3\u05E2\u05D4 \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D4 \u05E9\u05E0\u05E9\u05DC\u05D7\u05D4 \u05D0\u05DC\u05D9\u05D5 \u05D1\u05E8\u05D2\u05E2 \u05D6\u05D4","\u05D0\u05EA \u05D4\u05E9\u05D9\u05D7\u05D4 \u05D4\u05E0\u05D5\u05DB\u05D7\u05D9\u05EA, \u05D5\u05E2\u05D5\u05D3 \u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05E0\u05E9\u05DE\u05E8\u05D5 \u05DC\u05D5 \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3"],why:"\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05E9\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05D5\u05D0 \u05D4\u05D8\u05E7\u05E1\u05D8 \u05E9\u05DE\u05D2\u05D9\u05E9\u05D9\u05DD \u05DC\u05D5 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD: \u05D4\u05E9\u05D9\u05D7\u05D4 \u05E2\u05D3 \u05DB\u05D4, \u05D5\u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05E1\u05D9\u05DB\u05D5\u05DE\u05D9\u05DD \u05E9\u05E0\u05E9\u05DE\u05E8\u05D5 \u05D1\u05E9\u05D1\u05D9\u05DC\u05D5. \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05E9\u05DD, \u05DC\u05D0 \u05E7\u05D9\u05D9\u05DD \u05D1\u05E9\u05D1\u05D9\u05DC\u05D5."},en:{q:"What does the model read before every answer in a chat?",a:["Everything ever written to it, in the chats of every single user","Only the single message that was just sent to it","The current conversation, plus anything specially saved for it"],why:"The model's memory is the text handed to it each time: the chat so far, and sometimes summaries saved for it. What is not in there does not exist for it."}},{id:"prompt-constraints",tier:2,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D4 \u05D4\u05D2\u05D1\u05DC\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8, \u05DB\u05DE\u05D5 "\u05D1\u05DC\u05D9 \u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA"?',a:["\u05DE\u05D1\u05DC\u05D1\u05DC\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC","\u05DE\u05E6\u05DE\u05E6\u05DE\u05EA \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D4\u05D0\u05E4\u05E9\u05E8\u05D9\u05D5\u05EA \u05DC\u05DB\u05D9\u05D5\u05D5\u05DF \u05E9\u05E8\u05D5\u05E6\u05D9\u05DD","\u05DE\u05D0\u05E8\u05D9\u05DB\u05D4 \u05D0\u05EA \u05D6\u05DE\u05DF \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D5\u05DE\u05E7\u05E9\u05D4 \u05E2\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E2\u05E0\u05D5\u05EA"],why:"\u05D4\u05D2\u05D1\u05DC\u05D4 \u05E2\u05D5\u05D1\u05D3\u05EA \u05DB\u05DE\u05D5 \u05D2\u05D3\u05E8 \u05D1\u05DE\u05D2\u05E8\u05E9: \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05D0\u05D5\u05DE\u05E8\u05EA \u05DC\u05D0\u05DF \u05DC\u05E8\u05D5\u05E5, \u05D0\u05D1\u05DC \u05D4\u05D9\u05D0 \u05DE\u05D5\u05E6\u05D9\u05D0\u05D4 \u05DE\u05D4\u05DE\u05E9\u05D7\u05E7 \u05D0\u05EA \u05DB\u05DC \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05EA\u05D0\u05D9\u05DD."},en:{q:'What does a limit like "no English words" do in a prompt?',a:["Confuses the model","Narrows the possible answers toward the one you want","Makes the answer take longer and the model work harder"],why:"A limit works like a fence on a pitch: it does not say where to run, but it takes everything that does not fit out of the game."}},{id:"prompt-tone",tier:2,topic:"prompt",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E1\u05D2\u05E0\u05D5\u05DF \u05DE\u05E1\u05D5\u05D9\u05DD?",a:["\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05EA \u05D4\u05E1\u05D2\u05E0\u05D5\u05DF: \u05DE\u05E6\u05D7\u05D9\u05E7, \u05E8\u05E9\u05DE\u05D9 \u05D0\u05D5 \u05DE\u05E1\u05EA\u05D5\u05E8\u05D9","\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05D4\u05DE\u05D5\u05DF \u05D0\u05D9\u05DE\u05D5\u05D2\u05F3\u05D9\u05DD \u05E9\u05DE\u05EA\u05D0\u05D9\u05DE\u05D9\u05DD \u05DC\u05E1\u05D2\u05E0\u05D5\u05DF","\u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05DE\u05D5\u05D3\u05DC \u05D0\u05D7\u05E8, \u05DB\u05D9 \u05DC\u05DB\u05DC \u05DE\u05D5\u05D3\u05DC \u05D9\u05E9 \u05E1\u05D2\u05E0\u05D5\u05DF \u05E7\u05D1\u05D5\u05E2"],why:'\u05E1\u05D2\u05E0\u05D5\u05DF \u05D4\u05D5\u05D0 \u05D1\u05E7\u05E9\u05D4 \u05DB\u05DE\u05D5 \u05DB\u05DC \u05D1\u05E7\u05E9\u05D4 \u05D0\u05D7\u05E8\u05EA. "\u05D1\u05D8\u05D5\u05DF \u05DE\u05E6\u05D7\u05D9\u05E7, \u05DB\u05DE\u05D5 \u05D4\u05E1\u05D1\u05E8 \u05DC\u05D7\u05D1\u05E8" \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D1\u05D7\u05D9\u05E8\u05EA \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4.'},en:{q:"How do you ask for an answer in a particular style?",a:["Name the style: funny, formal or mysterious","Add lots of emoji that match the style","Switch models, since each model has one fixed style"],why:'Style is a request like any other. "In a funny tone, like explaining to a friend" changes every word choice in the answer.'}},{id:"prompt-checklist",tier:2,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5?",a:["\u05E9\u05D9\u05E9 \u05D1\u05D5 \u05DC\u05E4\u05D7\u05D5\u05EA \u05D7\u05DE\u05D9\u05E9\u05D4 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD","\u05E9\u05D0\u05D9\u05DF \u05D1\u05D5 \u05D0\u05E3 \u05E9\u05D2\u05D9\u05D0\u05EA \u05DB\u05EA\u05D9\u05D1","\u05E9\u05DB\u05EA\u05D5\u05D1 \u05D1\u05D5 \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD, \u05DC\u05DE\u05D9, \u05D5\u05D1\u05D0\u05D9\u05D6\u05D4 \u05E4\u05D5\u05E8\u05DE\u05D8"],why:"\u05DB\u05DE\u05E2\u05D8 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DE\u05D7\u05D8\u05D9\u05D0\u05D4 \u05DE\u05E4\u05E1\u05E4\u05E1\u05EA \u05D3\u05D5\u05D5\u05E7\u05D0 \u05D1\u05D0\u05D7\u05D3 \u05D4\u05E9\u05DC\u05D5\u05E9\u05D4. \u05DE\u05D9 \u05E9\u05E1\u05D5\u05E8\u05E7 \u05D0\u05D5\u05EA\u05DD \u05DC\u05E4\u05E0\u05D9 \u05D4\u05E9\u05DC\u05D9\u05D7\u05D4 \u05EA\u05D5\u05E4\u05E1 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05D7\u05DE\u05E9 \u05E9\u05E0\u05D9\u05D5\u05EA."},en:{q:"What do you check in a prompt before sending it?",a:["That it has at least five sentences","That it has no spelling mistakes at all","That it says what you want, for whom, and in what format"],why:"Nearly every answer that misses went wrong on one of those three. Scanning them before you send catches it in five seconds."}},{id:"prompt-negative",tier:2,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05E2\u05D3\u05D9\u05E3 \u05E2\u05DC \u05D4\u05D1\u05E7\u05E9\u05D4 "\u05DC\u05D0 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D5\u05E3 \u05E2\u05E6\u05D5\u05D1"?',a:["\u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D4\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DC\u05D5\u05E9 \u05E4\u05E2\u05DE\u05D9\u05DD","\u05DC\u05D4\u05D5\u05E1\u05D9\u05E3 \u05D2\u05DD \u05DE\u05D4 \u05DB\u05DF \u05E8\u05D5\u05E6\u05D9\u05DD: \u05E1\u05D5\u05E3 \u05E9\u05DE\u05D7 \u05D5\u05DE\u05E4\u05EA\u05D9\u05E2","\u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D4\u05D1\u05E7\u05E9\u05D4 \u05D2\u05DD \u05D1\u05E1\u05D5\u05E3 \u05D4\u05D4\u05D5\u05D3\u05E2\u05D4, \u05DC\u05D4\u05D3\u05D2\u05E9\u05D4"],why:"\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DC\u05D9\u05DC\u05D9\u05EA \u05DE\u05EA\u05D0\u05E8\u05EA \u05E8\u05E7 \u05DE\u05D4 \u05DC\u05E4\u05E1\u05D5\u05DC \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D4 \u05D0\u05D9\u05E0\u05E1\u05D5\u05E3 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D9\u05D5\u05EA. \u05D4\u05DB\u05D9\u05D5\u05D5\u05DF \u05D4\u05D7\u05D9\u05D5\u05D1\u05D9 \u05D0\u05D5\u05DE\u05E8 \u05DC\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0\u05DF \u05DC\u05DC\u05DB\u05EA."},en:{q:'What beats the request "do not write a sad ending"?',a:["Repeating the request three times","Adding what you do want: a happy, surprising ending","Repeating the request at the end of the message too"],why:"A negative request only says what to rule out and leaves endless options. The positive direction tells the model where to go."}},{id:"prompt-steps-ask",tier:2,topic:"prompt",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05DE\u05D4\u05BEAI \u05DC\u05D4\u05E8\u05D0\u05D5\u05EA \u05D0\u05EA \u05D4\u05E9\u05DC\u05D1\u05D9\u05DD?",a:["\u05DB\u05D9 \u05D0\u05D6 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E8\u05D0\u05D5\u05EA \u05D0\u05D9\u05E4\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05D5\u05D0 \u05D8\u05E2\u05D4","\u05DB\u05D9 \u05D6\u05D4 \u05DE\u05E7\u05E6\u05E8 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05D9 \u05D6\u05D4 \u05D2\u05D5\u05E8\u05DD \u05DC\u05D5 \u05DC\u05D4\u05D9\u05D5\u05EA \u05D1\u05D8\u05D5\u05D7 \u05D9\u05D5\u05EA\u05E8"],why:"\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E9\u05DC\u05D1\u05D9\u05DD \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05E9\u05DC\u05D1 \u05D0\u05D7\u05E8\u05D9 \u05E9\u05DC\u05D1 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05D0\u05DE\u05D9\u05DF \u05DC\u05E9\u05D5\u05E8\u05D4 \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D4. \u05D1\u05D3\u05E8\u05DA \u05D2\u05DD \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05E0\u05D5\u05E9\u05D0 \u05D1\u05E2\u05E6\u05DE\u05E0\u05D5."},en:{q:"Why ask the AI to show its steps?",a:["Because then you can see exactly where it went wrong","Because it shortens the answer","Because it makes the model more certain"],why:"A step-by-step answer can be checked step by step, instead of trusting the last line. Along the way you understand the topic yourself."}},{id:"tokens-long-chat",tier:2,topic:"tokens",correct:2,he:{q:'\u05DC\u05DE\u05D4 \u05E9\u05D9\u05D7\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05DE\u05EA\u05D7\u05D9\u05DC\u05D4 "\u05DC\u05E9\u05DB\u05D5\u05D7" \u05D3\u05D1\u05E8\u05D9\u05DD?',a:["\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05EA\u05E2\u05D9\u05D9\u05E3","\u05DB\u05D9 \u05E0\u05D2\u05DE\u05E8\u05D9\u05DD \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05DC \u05DE\u05D9 \u05E9\u05E9\u05D5\u05D0\u05DC","\u05DB\u05D9 \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D4\u05D9\u05E9\u05DF \u05E0\u05D3\u05D7\u05E7 \u05DE\u05D7\u05D5\u05E5 \u05DC\u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05D1\u05DB\u05DC \u05E6\u05E2\u05D3 \u05D0\u05EA \u05D4\u05E9\u05D9\u05D7\u05D4, \u05D0\u05D1\u05DC \u05E8\u05E7 \u05E2\u05D3 \u05D2\u05D1\u05D5\u05DC \u05DE\u05E1\u05D5\u05D9\u05DD. \u05DB\u05E9\u05DE\u05D2\u05D9\u05E2\u05D9\u05DD \u05DC\u05D2\u05D1\u05D5\u05DC \u05D4\u05D4\u05EA\u05D7\u05DC\u05D4 \u05E0\u05D5\u05E4\u05DC\u05EA, \u05D5\u05DC\u05DB\u05DF \u05D7\u05D5\u05D6\u05E8\u05D9\u05DD \u05E2\u05DC \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D5\u05D1."},en:{q:'Why does a very long chat start to "forget" things?',a:["Because the model gets tired","Because the asker runs out of tokens","Because the older text gets pushed out of the context window"],why:"The model rereads the chat each step, but only up to a limit. At the limit the beginning drops off \u2014 so restate what matters."}},{id:"tokens-context-budget",tier:2,topic:"tokens",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D7\u05E9\u05D5\u05D1 \u05E2\u05DC \u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8?",a:["\u05DB\u05DE\u05D5 \u05EA\u05D9\u05E7 \u05E2\u05DD \u05DE\u05E7\u05D5\u05DD \u05DE\u05D5\u05D2\u05D1\u05DC \u05E9\u05D0\u05D5\u05E8\u05D6\u05D9\u05DD \u05D1\u05D7\u05D5\u05DB\u05DE\u05D4","\u05DB\u05DE\u05D5 \u05DE\u05D3\u05E3 \u05E9\u05E0\u05E9\u05DE\u05E8 \u05D1\u05D9\u05DF \u05E9\u05D9\u05D7\u05D4 \u05DC\u05E9\u05D9\u05D7\u05D4 \u05D5\u05DE\u05E6\u05D8\u05D1\u05E8 \u05E2\u05DD \u05D4\u05D6\u05DE\u05DF","\u05DB\u05DE\u05D5 \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA: \u05DB\u05DB\u05DC \u05E9\u05D9\u05E9 \u05D1\u05D5 \u05D9\u05D5\u05EA\u05E8, \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D7\u05D5\u05D6\u05E8\u05EA \u05DE\u05D4\u05E8 \u05D9\u05D5\u05EA\u05E8"],why:"\u05DE\u05D4 \u05E9\u05E0\u05DB\u05E0\u05E1 \u05DC\u05EA\u05D9\u05E7 \u05D4\u05D5\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05D4 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D5\u05D0\u05D4, \u05D5\u05DB\u05E9\u05D4\u05D5\u05D0 \u05DE\u05DC\u05D0 \u05DE\u05E9\u05D4\u05D5 \u05E0\u05D5\u05E4\u05DC \u05D4\u05D7\u05D5\u05E6\u05D4. \u05DC\u05DB\u05DF \u05D0\u05D5\u05E8\u05D6\u05D9\u05DD \u05D0\u05EA \u05DE\u05D4 \u05E9\u05DE\u05E9\u05E0\u05D4, \u05DC\u05D0 \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC."},en:{q:"What is a good way to picture the context window?",a:["Like a bag with limited room that you pack wisely","Like a shelf that carries over between chats and builds up","Like speed: the more of it there is, the faster the answer"],why:"What goes in the bag is exactly what the model sees, and when it is full something falls out. So pack what matters, not everything."}},{id:"iterate-compare-two",tier:2,topic:"iterate",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05DE\u05E9\u05E0\u05D9 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8\u05D9\u05DD \u05D8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8?",a:["\u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05DE\u05E0\u05D5\u05DE\u05E1 \u05D9\u05D5\u05EA\u05E8","\u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E9\u05D0\u05E8\u05D5\u05DA \u05D9\u05D5\u05EA\u05E8","\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D0\u05EA \u05E9\u05E0\u05D9\u05D4\u05DD \u05D5\u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA"],why:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8\u05D9\u05DD \u05E7\u05E9\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05DC\u05E0\u05D7\u05E9 \u05DE\u05E8\u05D0\u05E9. \u05E0\u05D9\u05E1\u05D5\u05D9 \u05E7\u05D8\u05DF \u2014 \u05D0\u05D5\u05EA\u05D5 \u05E0\u05D5\u05E9\u05D0, \u05E9\u05EA\u05D9 \u05D2\u05E8\u05E1\u05D0\u05D5\u05EA \u2014 \u05E0\u05D5\u05EA\u05DF \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D5\u05D3\u05D0\u05D9\u05EA \u05EA\u05D5\u05DA \u05D3\u05E7\u05D4."},en:{q:"How do you know which of two prompts is better?",a:["The one that sounds more polite","The one that is longer","Run both and compare the answers"],why:"With prompts, guessing ahead is hard. A tiny experiment \u2014 same topic, two versions \u2014 settles it in a minute."}},{id:"iterate-save-good",tier:1,topic:"iterate",correct:0,he:{q:"\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D9\u05E6\u05D0 \u05DE\u05E6\u05D5\u05D9\u05DF. \u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E2\u05E9\u05D5\u05EA \u05D0\u05D9\u05EA\u05D5?",a:["\u05DC\u05E9\u05DE\u05D5\u05E8 \u05D0\u05D5\u05EA\u05D5, \u05DB\u05D9 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D8\u05D5\u05D1 \u05EA\u05DE\u05D9\u05D3 \u05E9\u05D5\u05D5\u05D4 \u05E9\u05D9\u05DE\u05D5\u05E9 \u05D7\u05D5\u05D6\u05E8","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05D0\u05D5\u05EA\u05D5 \u05E9\u05D5\u05D1 \u05DE\u05D9\u05D3, \u05DB\u05D3\u05D9 \u05DC\u05E7\u05D1\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05E0\u05D9\u05D9\u05D4 \u05DC\u05D4\u05E9\u05D5\u05D5\u05D0\u05D4","\u05DC\u05D6\u05DB\u05D5\u05E8 \u05D1\u05E2\u05E8\u05DA \u05DE\u05D4 \u05D4\u05D9\u05D4 \u05D1\u05D5 \u05D5\u05DC\u05E0\u05E1\u05D7 \u05D0\u05D5\u05EA\u05D5 \u05DE\u05D7\u05D3\u05E9 \u05D1\u05E4\u05E2\u05DD \u05D4\u05D1\u05D0\u05D4"],why:"\u05E0\u05D9\u05E1\u05D5\u05D7 \u05DE\u05D7\u05D3\u05E9 \u05DE\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05DE\u05D0\u05D1\u05D3 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05E9\u05E2\u05E9\u05D5 \u05D0\u05EA \u05D4\u05D4\u05D1\u05D3\u05DC. \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05DE\u05D5\u05E8 \u05D4\u05D5\u05D0 \u05DB\u05DC\u05D9 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E9\u05DC\u05D5\u05E3 \u05D1\u05E2\u05D5\u05D3 \u05D7\u05D5\u05D3\u05E9."},en:{q:"A prompt came out great. What should you do with it?",a:["Save it \u2014 a good prompt is always worth reusing","Send it again right away, for a second answer to compare","Roughly remember it and rewrite it from scratch next time"],why:"Rewriting from memory loses exactly the details that made the difference. A saved prompt is a tool you can pull out a month later."}},{id:"iterate-ask-questions",tier:2,topic:"iterate",correct:1,he:{q:"\u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8 \u05DB\u05E9\u05E7\u05E9\u05D4 \u05DC\u05E0\u05E1\u05D7 \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3","\u05DC\u05D1\u05E7\u05E9 \u05DE\u05D4\u05BEAI \u05DC\u05E9\u05D0\u05D5\u05DC \u05E9\u05D0\u05DC\u05D5\u05EA \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D4 \u05D1\u05E7\u05E9\u05D4 \u05DB\u05DE\u05D4 \u05E4\u05E2\u05DE\u05D9\u05DD"],why:'\u05DB\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E9\u05D5\u05D0\u05DC "\u05DC\u05D0\u05D9\u05D6\u05D4 \u05D2\u05D9\u05DC? \u05D1\u05D0\u05D9\u05D6\u05D4 \u05D0\u05D5\u05E8\u05DA?", \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05E9\u05DC\u05D5 \u05DE\u05D2\u05DC\u05D5\u05EA \u05DE\u05D4 \u05D7\u05E1\u05E8 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8. \u05E2\u05D5\u05E0\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4\u05DF \u05D5\u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA.'},en:{q:"What helps when the request is hard to phrase?",a:["Writing an extra long prompt","Asking the AI to ask questions before it answers","Sending the same request several times"],why:'When the model asks "for what age? how long?", its questions reveal what the prompt is missing. Answer them and the result lands.'}},{id:"mistakes-two-answers",tier:2,topic:"mistakes",correct:2,he:{q:"\u05E7\u05D9\u05D1\u05DC\u05D5 \u05E9\u05EA\u05D9 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E1\u05D5\u05EA\u05E8\u05D5\u05EA \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E9\u05D0\u05DC\u05D4. \u05DE\u05D4 \u05D6\u05D4 \u05D0\u05D5\u05DE\u05E8?",a:["\u05E9\u05D0\u05D7\u05EA \u05DE\u05D4\u05DF \u05D1\u05D8\u05D5\u05D7 \u05E0\u05DB\u05D5\u05E0\u05D4","\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05EA\u05E7\u05DC\u05E7\u05DC","\u05E9\u05DB\u05D3\u05D0\u05D9 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D0\u05EA \u05E9\u05EA\u05D9\u05D4\u05DF \u05D1\u05DE\u05E7\u05D5\u05E8 \u05D7\u05D9\u05E6\u05D5\u05E0\u05D9"],why:"\u05E1\u05EA\u05D9\u05E8\u05D4 \u05D4\u05D9\u05D0 \u05E1\u05D9\u05DE\u05DF \u05D0\u05D6\u05D4\u05E8\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05D6\u05D4\u05D1: \u05D4\u05D9\u05D0 \u05DE\u05E1\u05DE\u05E0\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05D1\u05D5 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05D1\u05D8\u05D5\u05D7. \u05E9\u05DD \u05E2\u05D5\u05E6\u05E8\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD."},en:{q:"The same question got two contradicting answers. What does that mean?",a:["One of them is definitely right","The model is broken","Both are worth checking against an outside source"],why:"A contradiction is the most useful warning sign you can get: it marks exactly where the model is unsure. That is where you stop and check."}},{id:"mistakes-ask-reasoning",tier:2,topic:"mistakes",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E2\u05DC \u05DE\u05D4 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05EA\u05D1\u05E1\u05E1\u05EA?",a:["\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D4\u05E1\u05D1\u05E8 \u05D0\u05D9\u05DA \u05D4\u05D5\u05D0 \u05D4\u05D2\u05D9\u05E2 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4, \u05D5\u05D0\u05D6 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD","\u05E9\u05D5\u05D0\u05DC\u05D9\u05DD \u05D0\u05DD \u05D4\u05D5\u05D0 \u05D1\u05D8\u05D5\u05D7","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D9\u05D5\u05EA\u05E8"],why:"\u05D4\u05E1\u05D1\u05E8 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D7\u05D5\u05DF, \u05D2\u05DD \u05DB\u05E9\u05D4\u05D5\u05D0 \u05DC\u05D0 \u05DE\u05D5\u05E9\u05DC\u05DD. \u05D4\u05E6\u05D4\u05E8\u05EA \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D7\u05D5\u05DF \u05D1\u05DB\u05DC\u05DC, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E4\u05D4 \u05DE\u05D9\u05D3\u05E2."},en:{q:"How do you check what an answer is based on?",a:["Ask it to explain how it got there, then check that","Ask whether it is sure","Ask for a longer answer"],why:"An explanation can be examined, even an imperfect one. A statement of confidence cannot be examined at all, so it adds nothing."}},{id:"mistakes-images-fake",tier:2,topic:"mistakes",correct:1,he:{q:"\u05E8\u05D0\u05D5 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05DE\u05D3\u05D4\u05D9\u05DE\u05D4 \u05D1\u05E8\u05E9\u05EA. \u05D0\u05D9\u05DA \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05DD AI \u05D9\u05E6\u05E8 \u05D0\u05D5\u05EA\u05D4?",a:["\u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05D0\u05E6\u05D1\u05E2\u05D5\u05EA \u05D5\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u2014 \u05E9\u05DD AI \u05EA\u05DE\u05D9\u05D3 \u05E0\u05E9\u05D1\u05E8 \u05D1\u05E1\u05D5\u05E3","\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E4\u05E8\u05D8\u05D9\u05DD \u05DE\u05D5\u05D6\u05E8\u05D9\u05DD, \u05D5\u05D1\u05E2\u05D9\u05E7\u05E8 \u05DE\u05D1\u05E8\u05E8\u05D9\u05DD \u05DE\u05D9 \u05E4\u05E8\u05E1\u05DD \u05D5\u05DE\u05D0\u05D9\u05E4\u05D4","\u05DE\u05D7\u05E4\u05E9\u05D9\u05DD \u05D0\u05D5\u05EA\u05D4 \u05D1\u05DB\u05DC\u05D9 \u05D6\u05D9\u05D4\u05D5\u05D9, \u05D5\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DC\u05D5 \u05E1\u05D5\u05D2\u05E8\u05EA \u05D0\u05EA \u05D4\u05E2\u05E0\u05D9\u05D9\u05DF"],why:"\u05E1\u05D9\u05DE\u05E0\u05D9 \u05D4\u05D0\u05E6\u05D1\u05E2\u05D5\u05EA \u05D5\u05D4\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u05E0\u05E2\u05DC\u05DE\u05D9\u05DD \u05DB\u05DB\u05DC \u05E9\u05D4\u05DB\u05DC\u05D9\u05DD \u05DE\u05E9\u05EA\u05E4\u05E8\u05D9\u05DD, \u05D5\u05D2\u05DD \u05DB\u05DC\u05D9 \u05D6\u05D9\u05D4\u05D5\u05D9 \u05D8\u05D5\u05E2\u05D4. \u05DE\u05E7\u05D5\u05E8 \u05D4\u05E4\u05E8\u05E1\u05D5\u05DD \u05E0\u05E9\u05D0\u05E8 \u05D4\u05E8\u05DE\u05D6 \u05D4\u05D7\u05D6\u05E7 \u05D1\u05D9\u05D5\u05EA\u05E8."},en:{q:"You saw an amazing photo online. How do you tell if AI made it?",a:["Count the fingers and letters \u2014 AI always breaks there","Look for odd details, and above all trace who posted it","Run it through a detector tool and take its verdict as final"],why:"Finger and letter glitches fade as tools improve, and detectors get it wrong too. Where a picture came from stays the strongest clue."}},{id:"mistakes-unfair-answer",tier:2,topic:"mistakes",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E9\u05DE\u05E2\u05EA \u05DC\u05D0 \u05D4\u05D5\u05D2\u05E0\u05EA \u05DB\u05DC\u05E4\u05D9 \u05E7\u05D1\u05D5\u05E6\u05EA \u05D0\u05E0\u05E9\u05D9\u05DD. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05E1\u05D7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D4 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E6\u05D5\u05E8\u05D4 \u05E2\u05D3\u05D9\u05E0\u05D4 \u05D9\u05D5\u05EA\u05E8","\u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05D0\u05EA \u05D6\u05D4, \u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D0\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D9\u05D3\u05E2 \u05DE\u05DB\u05DC \u05D0\u05D3\u05DD \u05D0\u05D7\u05D3","\u05DC\u05D0 \u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05D0\u05EA \u05D6\u05D4 \u05DB\u05E2\u05D5\u05D1\u05D3\u05D4, \u05D5\u05DE\u05D3\u05D1\u05E8\u05D9\u05DD \u05E2\u05DC \u05D6\u05D4 \u05E2\u05DD \u05DE\u05D1\u05D5\u05D2\u05E8"],why:"\u05E0\u05D9\u05E1\u05D5\u05D7 \u05E2\u05D3\u05D9\u05DF \u05D9\u05D5\u05EA\u05E8 \u05DC\u05D0 \u05D4\u05D5\u05E4\u05DA \u05D8\u05E2\u05E0\u05D4 \u05DE\u05D5\u05D8\u05D4 \u05DC\u05E0\u05DB\u05D5\u05E0\u05D4. \u05DE\u05D5\u05D3\u05DC \u05D7\u05D5\u05D6\u05E8 \u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05E2\u05DC \u05D4\u05D8\u05D9\u05D5\u05EA \u05E9\u05D4\u05D9\u05D5 \u05D1\u05D8\u05E7\u05E1\u05D8 \u05E9\u05DC\u05DE\u05D3 \u05DE\u05DE\u05E0\u05D5, \u05D5\u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05E7\u05D5\u05DD \u05DC\u05E2\u05E6\u05D5\u05E8."},en:{q:"An answer sounds unfair toward a group of people. What now?",a:["Ask the model to word the same claim more gently","Accept it, since the model has seen more text than any person","Do not take it as fact, and talk it over with an adult"],why:"Gentler wording does not make a skewed claim true. A model sometimes repeats biases from the text it learned from, and that is a place to stop."}},{id:"vibe-small-steps",tier:2,topic:"vibe",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05E0\u05D9\u05DD \u05EA\u05D5\u05DB\u05E0\u05D4 \u05E2\u05DD AI \u05D1\u05DC\u05D9 \u05DC\u05D4\u05E1\u05EA\u05D1\u05DA?",a:["\u05D7\u05EA\u05D9\u05DB\u05D4 \u05E7\u05D8\u05E0\u05D4 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD, \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DC \u05D0\u05D7\u05EA","\u05D4\u05DB\u05D5\u05DC \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA, \u05D5\u05D0\u05D6 \u05DE\u05EA\u05E7\u05E0\u05D9\u05DD","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E1\u05D5\u05E3 \u05D5\u05DE\u05E9\u05DC\u05D9\u05DE\u05D9\u05DD \u05D0\u05D7\u05D5\u05E8\u05D4"],why:"\u05DB\u05E9\u05DE\u05E9\u05D4\u05D5 \u05E0\u05E9\u05D1\u05E8 \u05D0\u05D7\u05E8\u05D9 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E7\u05D8\u05DF, \u05D1\u05E8\u05D5\u05E8 \u05DE\u05D9\u05D3 \u05DE\u05D4 \u05D2\u05E8\u05DD \u05DC\u05D6\u05D4. \u05D0\u05D7\u05E8\u05D9 \u05DE\u05D0\u05D4 \u05E9\u05D5\u05E8\u05D5\u05EA \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA \u05DB\u05D1\u05E8 \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA."},en:{q:"How do you build software with AI without getting tangled?",a:["One small piece at a time, testing after each","All of it at once, then fix it","Write only the ending and fill in backwards"],why:"When something breaks right after a small change, the cause is obvious. After a hundred lines at once, it is anyone's guess."}},{id:"vibe-read-code",tier:2,topic:"vibe",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E7\u05E8\u05D5\u05D0 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D5\u05D5\u05D3\u05D0 \u05E9\u05D0\u05D9\u05DF \u05D1\u05D5 \u05E9\u05D2\u05D9\u05D0\u05D5\u05EA \u05DB\u05EA\u05D9\u05D1","\u05DB\u05D9 \u05DE\u05D9 \u05E9\u05DE\u05D1\u05D9\u05DF \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC \u05DC\u05E9\u05E0\u05D5\u05EA \u05D0\u05D5\u05EA\u05D5 \u05DC\u05D1\u05D3","\u05DB\u05D9 \u05E7\u05E8\u05D9\u05D0\u05D4 \u05D7\u05D5\u05E1\u05DB\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05E7\u05D5\u05D3 \u05E9\u05DC\u05D0 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05EA\u05E7\u05DF \u05D5\u05D2\u05DD \u05DC\u05D0 \u05DC\u05DC\u05DE\u05D5\u05D3 \u05DE\u05DE\u05E0\u05D5. \u05EA\u05DE\u05D9\u05D3 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05E7\u05E9 \u05D4\u05E1\u05D1\u05E8 \u05E9\u05D5\u05E8\u05D4\u05BE\u05E9\u05D5\u05E8\u05D4 \u2014 \u05D6\u05D4 \u05D7\u05DC\u05E7 \u05DE\u05D4\u05E2\u05D1\u05D5\u05D3\u05D4."},en:{q:"Why read the code the AI wrote?",a:["To make sure there are no spelling mistakes in it","Because whoever understands the code can change it themselves","Because reading saves tokens"],why:"Code you do not understand you cannot fix, and cannot learn from. You can always ask for a line-by-line explanation \u2014 that is part of the job."}},{id:"ai-temperature",tier:3,topic:"whatai",correct:1,he:{q:"\u05D9\u05E9 \u05D4\u05D2\u05D3\u05E8\u05D4 \u05E9\u05E7\u05D5\u05D1\u05E2\u05EA \u05DB\u05DE\u05D4 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05DE\u05E4\u05EA\u05D9\u05E2\u05D5\u05EA. \u05DE\u05D4 \u05D4\u05D9\u05D0 \u05E2\u05D5\u05E9\u05D4?",a:["\u05E7\u05D5\u05D1\u05E2\u05EA \u05DB\u05DE\u05D4 \u05D6\u05DE\u05DF \u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05E9\u05E7\u05D9\u05E2 \u05D1\u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4","\u05E7\u05D5\u05D1\u05E2\u05EA \u05DB\u05DE\u05D4 \u05D0\u05E7\u05E8\u05D0\u05D9\u05D5\u05EA \u05D9\u05E9 \u05D1\u05D1\u05D7\u05D9\u05E8\u05EA \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD","\u05E7\u05D5\u05D1\u05E2\u05EA \u05D1\u05D0\u05D9\u05D6\u05D5 \u05E9\u05E4\u05D4 \u05EA\u05D9\u05DB\u05EA\u05D1 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05E2\u05E8\u05DA \u05E0\u05DE\u05D5\u05DA \u05E0\u05D5\u05EA\u05DF \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D6\u05D4\u05D9\u05E8\u05D5\u05EA \u05D5\u05D3\u05D5\u05DE\u05D5\u05EA \u05D6\u05D5 \u05DC\u05D6\u05D5, \u05E2\u05E8\u05DA \u05D2\u05D1\u05D5\u05D4 \u05E0\u05D5\u05EA\u05DF \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D9\u05E6\u05D9\u05E8\u05EA\u05D9\u05D5\u05EA \u05D5\u05E4\u05D7\u05D5\u05EA \u05E6\u05E4\u05D5\u05D9\u05D5\u05EA. \u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05DC\u05E4\u05D9 \u05D4\u05DE\u05E9\u05D9\u05DE\u05D4."},en:{q:"A setting controls how surprising answers are. What does it do?",a:["Sets how long the model spends on each answer","Sets how much randomness there is in picking words","Sets which language the answer is written in"],why:"A low value gives cautious, similar answers; a high value gives creative, less predictable ones. You pick according to the task."}},{id:"ai-step-by-step-gen",tier:3,topic:"whatai",correct:2,he:{q:"\u05DC\u05DE\u05D4 AI \u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05E4\u05D5\u05EA\u05D7 \u05DE\u05E9\u05E4\u05D8 \u05DE\u05E6\u05D5\u05D9\u05DF \u05D5\u05DE\u05E1\u05D9\u05D9\u05DD \u05D1\u05E9\u05D8\u05D5\u05EA?",a:["\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05DE\u05EA\u05E2\u05D9\u05D9\u05E3 \u05D1\u05D0\u05DE\u05E6\u05E2 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D9\u05DD \u05DE\u05D3\u05D9","\u05DB\u05D9 \u05DE\u05D9\u05E9\u05D4\u05D5 \u05DE\u05D7\u05DC\u05D9\u05E3 \u05D0\u05D5\u05EA\u05D5 \u05D1\u05D0\u05DE\u05E6\u05E2 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05DE\u05D5\u05D3\u05DC \u05D0\u05D7\u05E8","\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05D1\u05D5\u05E0\u05D4 \u05D7\u05EA\u05D9\u05DB\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05D7\u05EA\u05D9\u05DB\u05D4 \u05D5\u05DC\u05D0 \u05DE\u05EA\u05DB\u05E0\u05DF \u05E2\u05D3 \u05D4\u05E1\u05D5\u05E3"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05D1\u05D5\u05D7\u05E8 \u05D0\u05EA \u05D4\u05D4\u05DE\u05E9\u05DA \u05D4\u05DE\u05EA\u05D0\u05D9\u05DD \u05D1\u05DB\u05DC \u05E6\u05E2\u05D3, \u05D1\u05DC\u05D9 \u05DC\u05D3\u05E2\u05EA \u05DC\u05D0\u05DF \u05D4\u05DE\u05E9\u05E4\u05D8 \u05D4\u05D5\u05DC\u05DA. \u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05E7\u05D5\u05D3\u05DD \u05E8\u05D0\u05E9\u05D9 \u05E4\u05E8\u05E7\u05D9\u05DD \u05D5\u05E8\u05E7 \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D4\u05DE\u05DC\u05D0."},en:{q:"Why does AI sometimes open a great sentence and end in nonsense?",a:["Because it gets tired in the middle of long sentences","Because a different model quietly takes over mid-answer","Because it builds piece by piece and does not plan to the end"],why:"The model picks a fitting continuation each step without knowing where the sentence is going. So ask for an outline first, then the full text."}},{id:"ai-multimodal",tier:3,topic:"whatai",correct:0,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05E7\u05D1\u05DC \u05D2\u05DD \u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05D5\u05D2\u05DD \u05D8\u05E7\u05E1\u05D8?",a:["\u05DE\u05D5\u05D3\u05DC \u05E8\u05D1\u05BE\u05DE\u05D5\u05D3\u05D0\u05DC\u05D9, \u05E9\u05E2\u05D5\u05D1\u05D3 \u05E2\u05DD \u05DB\u05DE\u05D4 \u05E1\u05D5\u05D2\u05D9 \u05DE\u05D9\u05D3\u05E2","\u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05E8\u05D9\u05E5 \u05E9\u05EA\u05D9 \u05EA\u05D5\u05DB\u05E0\u05D5\u05EA \u05D1\u05DE\u05E7\u05D1\u05D9\u05DC","\u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05EA\u05E8\u05D2\u05DD \u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05DC\u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05DC\u05D1\u05D3"],why:"\u05D4\u05D5\u05D0 \u05E8\u05D5\u05D0\u05D4 \u05D0\u05EA \u05D4\u05EA\u05DE\u05D5\u05E0\u05D4, \u05D0\u05D1\u05DC \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D4 \u05DE\u05E2\u05E0\u05D9\u05D9\u05DF \u05D1\u05D4. \u05F4\u05DE\u05D4 \u05DB\u05EA\u05D5\u05D1 \u05D1\u05E9\u05DC\u05D8?\u05F4 \u05D9\u05D1\u05D9\u05D0 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D8\u05D5\u05D1\u05D4 \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DE\u05F4\u05DE\u05D4 \u05D9\u05E9 \u05D1\u05EA\u05DE\u05D5\u05E0\u05D4?\u05F4."},en:{q:"What is a model that takes both images and text?",a:["A multimodal model, working with several kinds of input","A model running two programs at once","A model that only turns pictures into words"],why:'It can see the picture, but it does not know what you find interesting in it. "What does the sign say?" beats "what is in this photo?" every time.'}},{id:"ai-limits-honest",tier:3,topic:"whatai",correct:1,he:{q:"\u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF \u05DC\u05D2\u05D1\u05D9 \u05D4\u05D2\u05D1\u05D5\u05DC\u05D5\u05EA \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC\u05D9\u05DD \u05DB\u05D0\u05DC\u05D4?",a:["\u05D0\u05D9\u05DF \u05DC\u05D4\u05DD \u05D2\u05D1\u05D5\u05DC\u05D5\u05EA, \u05E8\u05E7 \u05E6\u05E8\u05D9\u05DA \u05DC\u05E9\u05D0\u05D5\u05DC \u05E0\u05DB\u05D5\u05DF","\u05EA\u05DE\u05D9\u05D3 \u05D9\u05E9 \u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05D4\u05DD \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D5\u05DC\u05D0 \u05D9\u05DB\u05D5\u05DC\u05D9\u05DD \u05DC\u05D3\u05E2\u05EA","\u05D4\u05D2\u05D1\u05D5\u05DC \u05D4\u05D9\u05D7\u05D9\u05D3 \u05E9\u05DC\u05D4\u05DD \u05D4\u05D5\u05D0 \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05D0\u05E3 \u05D0\u05D7\u05D3 \u05DC\u05D0 \u05DE\u05E6\u05E4\u05D4 \u05DE\u05E4\u05D8\u05D9\u05E9 \u05DC\u05D7\u05EA\u05D5\u05DA \u05E2\u05E5. \u05D2\u05DD \u05DB\u05D0\u05DF: \u05D9\u05E9 \u05E9\u05D0\u05DC\u05D5\u05EA \u05E9\u05D4\u05DB\u05DC\u05D9 \u05D4\u05D6\u05D4 \u05E4\u05E9\u05D5\u05D8 \u05DC\u05D0 \u05D1\u05E0\u05D5\u05D9 \u05D1\u05E9\u05D1\u05D9\u05DC\u05DF, \u05D5\u05DB\u05D3\u05D0\u05D9 \u05DC\u05D6\u05D4\u05D5\u05EA \u05D0\u05D5\u05EA\u05DF \u05DE\u05E8\u05D0\u05E9."},en:{q:"What is true about the limits of these models?",a:["They have no limits \u2014 you just have to ask correctly","There are always things they do not and cannot know","Their only limit is how fast they answer"],why:"Nobody expects a hammer to saw wood. Same here: some questions this tool is simply not built for, and spotting them early saves time."}},{id:"prompt-few-shot",tier:3,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D5\u05EA \u05E9\u05EA\u05D9\u05D9\u05DD\u05BE\u05E9\u05DC\u05D5\u05E9 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05D1\u05D0\u05D5\u05EA\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05DE\u05D1\u05D6\u05D1\u05D6\u05D5\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05E1\u05D9\u05D1\u05D4","\u05DE\u05DB\u05E8\u05D9\u05D7\u05D5\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05D5\u05EA\u05DF \u05DE\u05D9\u05DC\u05D4 \u05D1\u05DE\u05D9\u05DC\u05D4","\u05DE\u05DC\u05DE\u05D3\u05D5\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05D0\u05EA \u05D4\u05D3\u05E4\u05D5\u05E1 \u05E9\u05E8\u05D5\u05E6\u05D9\u05DD"],why:"\u05DE\u05D3\u05D5\u05D2\u05DE\u05D4 \u05D0\u05D7\u05EA \u05E7\u05E9\u05D4 \u05DC\u05D4\u05E1\u05D9\u05E7 \u05DE\u05D4 \u05D4\u05DB\u05DC\u05DC; \u05DE\u05E9\u05DC\u05D5\u05E9 \u05D4\u05D3\u05E4\u05D5\u05E1 \u05DB\u05D1\u05E8 \u05D1\u05E8\u05D5\u05E8. \u05D4\u05DF \u05DE\u05DC\u05DE\u05D3\u05D5\u05EA \u05E4\u05D5\u05E8\u05DE\u05D8 \u05D5\u05E1\u05D2\u05E0\u05D5\u05DF \u05D1\u05DC\u05D9 \u05D4\u05E1\u05D1\u05E8 \u05D0\u05E8\u05D5\u05DA."},en:{q:"What do two or three examples in one prompt do?",a:["Waste tokens for no reason","Force the model to copy them word for word","Teach the model the pattern you want"],why:"From one example the rule is hard to infer; from three the pattern is clear. They teach format and style without a long explanation."}},{id:"prompt-order",tier:3,topic:"prompt",correct:0,he:{q:"\u05D0\u05D9\u05E4\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E9\u05D9\u05DD \u05D0\u05EA \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05D4\u05D7\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D9\u05D5\u05EA\u05E8?",a:["\u05D1\u05D4\u05EA\u05D7\u05DC\u05D4 \u05D0\u05D5 \u05D1\u05E1\u05D5\u05E3, \u05D1\u05DE\u05E7\u05D5\u05DD \u05D1\u05D5\u05DC\u05D8","\u05D1\u05D0\u05DE\u05E6\u05E2, \u05D1\u05D9\u05DF \u05E9\u05D0\u05E8 \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD","\u05DC\u05D0 \u05DE\u05E9\u05E0\u05D4, \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05D4\u05DB\u05D5\u05DC \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8"],why:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D4 \u05E9\u05D9\u05D5\u05E9\u05D1 \u05D1\u05E7\u05E6\u05D5\u05D5\u05EA \u05D1\u05D5\u05DC\u05D8 \u05D9\u05D5\u05EA\u05E8. \u05D4\u05D5\u05E8\u05D0\u05D4 \u05E7\u05E8\u05D9\u05D8\u05D9\u05EA \u05E9\u05E7\u05D1\u05D5\u05E8\u05D4 \u05D1\u05D0\u05DE\u05E6\u05E2 \u05E4\u05E1\u05E7\u05D4 \u05E0\u05D5\u05D8\u05D4 \u05DC\u05D4\u05D9\u05D1\u05DC\u05E2."},en:{q:"Where should the most important instruction go?",a:["At the start or the end, somewhere prominent","In the middle, among the other details","It makes no difference, the model reads it all the same"],why:"In a long prompt, what sits at the edges stands out. A critical instruction buried mid-paragraph tends to get swallowed."}},{id:"prompt-success-test",tier:3,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05DE\u05D3\u05D3 \u05D4\u05E6\u05DC\u05D7\u05D4" \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?',a:["\u05E6\u05D9\u05D5\u05DF \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E0\u05D5\u05EA\u05DF \u05DC\u05E2\u05E6\u05DE\u05D5 \u05D1\u05E1\u05D5\u05E3","\u05DE\u05E9\u05E4\u05D8 \u05E9\u05DE\u05D2\u05D3\u05D9\u05E8 \u05DE\u05E8\u05D0\u05E9 \u05DE\u05EA\u05D9 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D8\u05D5\u05D1\u05D4","\u05DE\u05E1\u05E4\u05E8 \u05D4\u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05E9\u05DE\u05D5\u05EA\u05E8 \u05DC\u05E2\u05E9\u05D5\u05EA"],why:'\u05DB\u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD "\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D8\u05D5\u05D1\u05D4 \u05D0\u05DD \u05D4\u05D9\u05D0 \u05DE\u05E1\u05D1\u05D9\u05E8\u05D4 \u05D1\u05DC\u05D9 \u05DE\u05D5\u05E0\u05D7\u05D9\u05DD \u05D8\u05DB\u05E0\u05D9\u05D9\u05DD", \u05D9\u05E9 \u05D1\u05DE\u05D4 \u05DC\u05DE\u05D3\u05D5\u05D3. \u05D1\u05DC\u05D9 \u05DE\u05D3\u05D3 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E8\u05D0\u05D9\u05EA \u05E1\u05D1\u05D9\u05E8\u05D4.'},en:{q:'What is a "success test" in a prompt?',a:["A grade the model gives itself at the end","A sentence defining up front when the answer is good","The number of attempts allowed"],why:'Writing "the answer is good if it explains with no technical terms" gives you something to measure against. Without a measure, any answer looks fine.'}},{id:"prompt-delimiters",tier:3,topic:"prompt",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05E4\u05E8\u05D9\u05D3\u05D9\u05DD \u05D1\u05D9\u05DF \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DC\u05D1\u05D9\u05DF \u05D8\u05E7\u05E1\u05D8 \u05D0\u05E8\u05D5\u05DA \u05E9\u05DE\u05E6\u05E8\u05E4\u05D9\u05DD?",a:["\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC \u05D1\u05E8\u05E6\u05E3 \u05D0\u05D7\u05D3","\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D0\u05EA \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DB\u05D3\u05D9 \u05DC\u05D0 \u05DC\u05D1\u05DC\u05D1\u05DC","\u05DE\u05E1\u05DE\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D1\u05D2\u05D1\u05D5\u05DC\u05D5\u05EA \u05D1\u05E8\u05D5\u05E8\u05D9\u05DD, \u05DC\u05DE\u05E9\u05DC \u05D1\u05DB\u05D5\u05DB\u05D1\u05D9\u05D5\u05EA"],why:'\u05D1\u05DC\u05D9 \u05D4\u05E4\u05E8\u05D3\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05DC\u05D5\u05DC \u05DC\u05E7\u05E8\u05D5\u05D0 \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D4\u05DE\u05E6\u05D5\u05E8\u05E3 \u05DB\u05D0\u05D9\u05DC\u05D5 \u05D4\u05D5\u05D0 \u05D4\u05D4\u05D5\u05E8\u05D0\u05D5\u05EA. \u05E1\u05D9\u05DE\u05D5\u05DF \u05E4\u05E9\u05D5\u05D8 \u05D0\u05D5\u05DE\u05E8 "\u05D6\u05D4 \u05D4\u05D7\u05D5\u05DE\u05E8, \u05D5\u05D6\u05D5 \u05D4\u05D1\u05E7\u05E9\u05D4".'},en:{q:"How do you separate the instruction from long attached text?",a:["Write it all as one run of text","Delete the instruction so nothing gets confused","Mark the text with clear boundaries, asterisks for instance"],why:'With no separation the model may read the attached text as instructions. A simple marker says "this is the material, this is the request".'}},{id:"prompt-template",tier:3,topic:"prompt",correct:0,he:{q:"\u05DE\u05D4 \u05D4\u05D5\u05E4\u05DA \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05EA\u05D1\u05E0\u05D9\u05EA \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05D4 \u05E9\u05D5\u05D1?",a:["\u05DE\u05D1\u05E0\u05D4 \u05E7\u05D1\u05D5\u05E2 \u05E2\u05DD \u05DE\u05E7\u05D5\u05DD \u05E9\u05DE\u05D7\u05DC\u05D9\u05E4\u05D9\u05DD \u05D1\u05D5 \u05D0\u05EA \u05D4\u05E0\u05D5\u05E9\u05D0","\u05D6\u05D4 \u05E9\u05D4\u05D5\u05D0 \u05D0\u05E8\u05D5\u05DA \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3","\u05D6\u05D4 \u05E9\u05D4\u05D5\u05D0 \u05E9\u05DE\u05D5\u05E8 \u05D1\u05E9\u05D9\u05D7\u05D4 \u05D9\u05E9\u05E0\u05D4"],why:"\u05EA\u05D1\u05E0\u05D9\u05EA \u05E9\u05D5\u05DE\u05E8\u05EA \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E2\u05D1\u05D3 \u2014 \u05D4\u05EA\u05E4\u05E7\u05D9\u05D3, \u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05D5\u05D4\u05D4\u05D2\u05D1\u05DC\u05D5\u05EA \u2014 \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D4 \u05D7\u05D5\u05E8 \u05D0\u05D7\u05D3 \u05DC\u05E0\u05D5\u05E9\u05D0. \u05DB\u05DB\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05D5\u05E6\u05DC\u05D7 \u05E0\u05E2\u05E9\u05D4 \u05DB\u05DC\u05D9 \u05E7\u05D1\u05D5\u05E2."},en:{q:"What turns a prompt into a reusable template?",a:["A fixed structure with one slot where the topic gets swapped","Being especially long","Being saved in an old conversation"],why:"A template keeps what worked \u2014 the role, the format, the limits \u2014 and leaves one hole for the topic. That is how a good prompt becomes a permanent tool."}},{id:"tokens-how-much-context",tier:3,topic:"tokens",correct:1,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05D7\u05DC\u05D9\u05D8\u05D9\u05DD \u05DB\u05DE\u05D4 \u05D4\u05E7\u05E9\u05E8 \u05DC\u05D4\u05DB\u05E0\u05D9\u05E1 \u05DC\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05D0\u05EA \u05D4\u05DE\u05E7\u05E1\u05D9\u05DE\u05D5\u05DD \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05DB\u05E0\u05D9\u05E1, \u05DC\u05D9\u05EA\u05E8 \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF","\u05DE\u05DB\u05E0\u05D9\u05E1\u05D9\u05DD \u05EA\u05DE\u05D9\u05D3 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4, \u05D5\u05DC\u05D0 \u05D9\u05D5\u05EA\u05E8","\u05D0\u05EA \u05D4\u05DE\u05D9\u05E0\u05D9\u05DE\u05D5\u05DD \u05D4\u05D4\u05DB\u05E8\u05D7\u05D9, \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05E9\u05EA\u05D9\u05D9\u05DD"],why:'\u05D4\u05E7\u05E9\u05E8 \u05D4\u05D5\u05D0 \u05DC\u05D0 "\u05DB\u05DE\u05D4 \u05E9\u05D9\u05D5\u05EA\u05E8" \u05D5\u05DC\u05D0 "\u05DB\u05DE\u05D4 \u05E9\u05E4\u05D7\u05D5\u05EA". \u05D4\u05E9\u05D0\u05DC\u05D4 \u05D4\u05D9\u05D7\u05D9\u05D3\u05D4 \u05D4\u05D9\u05D0 \u05D0\u05DD \u05D4\u05E4\u05E8\u05D8 \u05D4\u05D6\u05D4 \u05D4\u05D9\u05D4 \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E4\u05D5\u05E2\u05DC.'},en:{q:"How do you decide how much context to put in a prompt?",a:["The maximum you can fit, just to be safe","Always include what changes the answer, and nothing more","The bare minimum \u2014 a word or two"],why:'Context is neither "as much as possible" nor "as little as possible". The only question is whether that detail would actually change the answer.'}},{id:"tokens-summarize-chat",tier:3,topic:"tokens",correct:2,he:{q:"\u05E9\u05D9\u05D7\u05D4 \u05E0\u05E2\u05E9\u05EA\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D3\u05D9. \u05D0\u05D9\u05DA \u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05D0\u05D1\u05D3 \u05DE\u05D9\u05D3\u05E2?",a:["\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D4\u05D5\u05D3\u05E2\u05D5\u05EA \u05D9\u05E9\u05E0\u05D5\u05EA \u05D0\u05D7\u05EA \u05D0\u05D7\u05EA","\u05DE\u05EA\u05D7\u05D9\u05DC\u05D9\u05DD \u05DE\u05D7\u05D3\u05E9 \u05D1\u05DC\u05D9 \u05E9\u05D5\u05DD \u05D3\u05D1\u05E8","\u05DE\u05E1\u05DB\u05DE\u05D9\u05DD \u05D0\u05EA \u05D4\u05E2\u05D9\u05E7\u05E8 \u05D5\u05E4\u05D5\u05EA\u05D7\u05D9\u05DD \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05E2\u05DD \u05D4\u05E1\u05D9\u05DB\u05D5\u05DD"],why:"\u05E1\u05D9\u05DB\u05D5\u05DD \u05E7\u05E6\u05E8 \u05E9\u05D5\u05DE\u05E8 \u05D0\u05EA \u05D4\u05D4\u05D7\u05DC\u05D8\u05D5\u05EA \u05D5\u05DE\u05D5\u05D5\u05EA\u05E8 \u05E2\u05DC \u05DB\u05DC \u05D4\u05D3\u05E8\u05DA \u05D0\u05DC\u05D9\u05D4\u05DF. \u05D6\u05D4 \u05DE\u05E0\u05E7\u05D4 \u05D0\u05EA \u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8 \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8 \u05D1\u05D5 \u05E8\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E6\u05E8\u05D9\u05DA."},en:{q:"A chat got too long. How do you continue without losing information?",a:["Delete old messages one at a time","Start over with nothing at all","Summarise the essentials and open a new chat with the summary"],why:"A short summary keeps the decisions and drops the road to them. That clears the context window and leaves only what is needed."}},{id:"tokens-code-paste",tier:3,topic:"tokens",correct:0,he:{q:"\u05DE\u05D3\u05D1\u05D9\u05E7\u05D9\u05DD \u05E7\u05D5\u05D3 \u05D0\u05E8\u05D5\u05DA \u05DC\u05EA\u05D5\u05DA \u05D4\u05E9\u05D9\u05D7\u05D4. \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4?",a:["\u05D4\u05D5\u05D0 \u05E0\u05E1\u05E4\u05E8 \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D5\u05EA\u05D5\u05E4\u05E1 \u05DE\u05E7\u05D5\u05DD \u05D1\u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8","\u05E7\u05D5\u05D3 \u05DC\u05D0 \u05E0\u05E1\u05E4\u05E8, \u05E8\u05E7 \u05D8\u05E7\u05E1\u05D8 \u05E8\u05D2\u05D9\u05DC \u05E0\u05E1\u05E4\u05E8","\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05EA\u05E7\u05E6\u05E8\u05EA \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA \u05D1\u05D2\u05DC\u05DC \u05D4\u05E7\u05D5\u05D3"],why:"\u05DB\u05DC \u05EA\u05D5 \u05E0\u05E1\u05E4\u05E8, \u05D2\u05DD \u05E1\u05D5\u05D2\u05E8\u05D9\u05D9\u05DD \u05D5\u05E8\u05D5\u05D5\u05D7\u05D9\u05DD. \u05DC\u05DB\u05DF \u05DE\u05D3\u05D1\u05D9\u05E7\u05D9\u05DD \u05D0\u05EA \u05D4\u05E7\u05D8\u05E2 \u05E9\u05E8\u05DC\u05D5\u05D5\u05E0\u05D8\u05D9 \u05DC\u05D1\u05E2\u05D9\u05D4, \u05D5\u05DC\u05D0 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E7\u05D5\u05D1\u05E5 \u05DE\u05D4\u05D4\u05EA\u05D7\u05DC\u05D4."},en:{q:"You paste long code into the chat. What happens?",a:["It counts as tokens and takes room in the context window","Code is not counted, only ordinary text is","The answer shortens automatically because of the code"],why:"Every character counts, brackets and spaces included. So paste the part relevant to the problem, not the whole file."}},{id:"tokens-example-tradeoff",tier:3,topic:"tokens",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05D0 \u05E9\u05D5\u05D5\u05D4 \u05D0\u05EA \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05DC\u05D4?",a:["\u05DB\u05DE\u05E2\u05D8 \u05D1\u05DB\u05DC \u05DE\u05E7\u05E8\u05D4, \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05E8\u05E7 \u05DE\u05D0\u05E8\u05D9\u05DB\u05D5\u05EA \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8","\u05DB\u05E9\u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05DB\u05D1\u05E8 \u05D1\u05E8\u05D5\u05E8 \u05DC\u05D2\u05DE\u05E8\u05D9 \u05DE\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4","\u05DB\u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05E4\u05D5\u05E8\u05DE\u05D8 \u05D7\u05D3\u05E9 \u05D5\u05DC\u05D0 \u05DE\u05D5\u05DB\u05E8"],why:"\u05D3\u05D5\u05D2\u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05E9\u05E7\u05E9\u05D4 \u05DC\u05EA\u05D0\u05E8 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD. \u05DB\u05E9\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DB\u05D1\u05E8 \u05D7\u05D3\u05BE\u05DE\u05E9\u05DE\u05E2\u05D9\u05EA, \u05D4\u05D3\u05D5\u05D2\u05DE\u05D4 \u05E8\u05E7 \u05DE\u05D0\u05E8\u05D9\u05DB\u05D4 \u05D1\u05DC\u05D9 \u05DC\u05D4\u05D5\u05E1\u05D9\u05E3."},en:{q:"When is an example in a prompt not worth its tokens?",a:["In nearly every case, examples just make the prompt longer","When the format is already completely clear from the instruction","When asking for a new, unfamiliar format"],why:"An example earns its place when words struggle. If the instruction is already unambiguous, the example only adds length."}},{id:"iterate-diagnose",tier:3,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05D7\u05D8\u05D9\u05D0\u05D4 \u05E9\u05D5\u05D1 \u05D5\u05E9\u05D5\u05D1. \u05DE\u05D4 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E7\u05D5\u05D3\u05DD?",a:["\u05D0\u05DD \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05DE\u05D5\u05E1 \u05D1\u05D1\u05E7\u05E9\u05D5\u05EA","\u05D0\u05DD \u05E6\u05E8\u05D9\u05DA \u05DC\u05E2\u05D1\u05D5\u05E8 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA","\u05D0\u05DD \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D1\u05D0\u05DE\u05EA \u05D0\u05D5\u05DE\u05E8 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D1\u05E0\u05D5 \u05E9\u05D4\u05D5\u05D0 \u05D0\u05D5\u05DE\u05E8"],why:"\u05DC\u05E8\u05D5\u05D1 \u05D4\u05D1\u05E2\u05D9\u05D4 \u05D4\u05D9\u05D0 \u05E9\u05D4\u05D1\u05E7\u05E9\u05D4 \u05E2\u05E6\u05DE\u05D4 \u05DE\u05E2\u05D5\u05E8\u05E4\u05DC\u05EA. \u05E7\u05E8\u05D9\u05D0\u05D4 \u05E9\u05DC \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DB\u05D0\u05D9\u05DC\u05D5 \u05DE\u05D9\u05E9\u05D4\u05D5 \u05D0\u05D7\u05E8 \u05DB\u05EA\u05D1 \u05D0\u05D5\u05EA\u05D5 \u05DE\u05D2\u05DC\u05D4 \u05D0\u05EA \u05D6\u05D4 \u05DE\u05D4\u05E8 \u05DE\u05D0\u05D5\u05D3."},en:{q:"The answer keeps missing. What do you check first?",a:["Whether the model is overloaded with requests","Whether you should switch to writing in English","Whether the prompt really says what you thought it said"],why:"Usually the request itself is the vague part. Reading the prompt as though someone else wrote it exposes that very fast."}},{id:"iterate-keep-old",tier:2,topic:"iterate",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E9\u05DE\u05D5\u05E8 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05D9\u05E9\u05DF \u05DB\u05E9\u05DE\u05E9\u05E4\u05E8\u05D9\u05DD?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D4\u05E9\u05D5\u05D5\u05EA, \u05D5\u05DC\u05D7\u05D6\u05D5\u05E8 \u05D0\u05D7\u05D5\u05E8\u05D4 \u05D0\u05DD \u05D4\u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05E8\u05E2","\u05DB\u05D3\u05D9 \u05DC\u05D4\u05D0\u05E8\u05D9\u05DA \u05D0\u05EA \u05D4\u05E9\u05D9\u05D7\u05D4","\u05DB\u05D3\u05D9 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05D9\u05D4\u05D9\u05D4 \u05DC\u05D4\u05E8\u05D0\u05D5\u05EA \u05D0\u05D5\u05EA\u05D5 \u05DC\u05DE\u05D9\u05E9\u05D4\u05D5 \u05D0\u05D7\u05E8"],why:"\u05DC\u05D0 \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05D5\u05D0 \u05E9\u05D9\u05E4\u05D5\u05E8. \u05DB\u05E9\u05E9\u05EA\u05D9 \u05D4\u05D2\u05E8\u05E1\u05D0\u05D5\u05EA \u05E9\u05DE\u05D5\u05E8\u05D5\u05EA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E9\u05D5\u05D5\u05EA \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D5\u05DC\u05D1\u05D7\u05D5\u05E8, \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05E9\u05D7\u05D6\u05E8 \u05DE\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF."},en:{q:"Why keep the old prompt when improving it?",a:["To compare, and to go back if the change made things worse","To make the conversation longer","So it can be shown to somebody else later"],why:"Not every change is an improvement. With both versions saved you can compare answers and choose, instead of reconstructing from memory."}},{id:"iterate-stop-point",tier:3,topic:"iterate",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05DE\u05E4\u05E1\u05D9\u05E7\u05D9\u05DD \u05DC\u05E9\u05E4\u05E8 \u05D5\u05DE\u05D2\u05D9\u05E9\u05D9\u05DD?",a:["\u05D0\u05D7\u05E8\u05D9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E2\u05E9\u05E8\u05D4 \u05E1\u05D9\u05D1\u05D5\u05D1\u05D9\u05DD","\u05DB\u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E2\u05D5\u05E0\u05D4 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05D4\u05D5\u05D2\u05D3\u05E8 \u05DE\u05E8\u05D0\u05E9 \u05DB\u05D8\u05D5\u05D1","\u05DB\u05E9\u05E0\u05D2\u05DE\u05E8 \u05D4\u05DB\u05D5\u05D7 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05E0\u05E1\u05D5\u05EA"],why:"\u05D1\u05DC\u05D9 \u05D4\u05D2\u05D3\u05E8\u05D4 \u05DE\u05E8\u05D0\u05E9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E9\u05E4\u05E8 \u05E2\u05D3 \u05D0\u05D9\u05E0\u05E1\u05D5\u05E3. \u05DE\u05D3\u05D3 \u05E4\u05E9\u05D5\u05D8 \u05E9\u05E0\u05E7\u05D1\u05E2 \u05DC\u05E4\u05E0\u05D9 \u05D4\u05D4\u05EA\u05D7\u05DC\u05D4 \u05D0\u05D5\u05DE\u05E8 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05EA\u05D9 \u05D4\u05D2\u05E2\u05E0\u05D5."},en:{q:"When do you stop improving and hand it in?",a:["After exactly ten rounds","When the answer meets what you defined as good in advance","When you run out of energy to keep trying"],why:"With no definition up front you can polish forever. A simple measure set before you start says exactly when you have arrived."}},{id:"mistakes-when-verify",tier:2,topic:"mistakes",correct:0,he:{q:"\u05DE\u05EA\u05D9 \u05D7\u05D5\u05D1\u05D4 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DC AI \u05D1\u05DE\u05E7\u05D5\u05E8 \u05E0\u05D5\u05E1\u05E3?",a:["\u05D1\u05DB\u05DC \u05DE\u05E6\u05D1 \u05E9\u05D1\u05D5 \u05DE\u05E1\u05EA\u05DE\u05DB\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4 \u05DC\u05D4\u05D7\u05DC\u05D8\u05D4, \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D0\u05D5 \u05DC\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD","\u05E8\u05E7 \u05DB\u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4 \u05DE\u05D0\u05D5\u05D3","\u05D0\u05E3 \u05E4\u05E2\u05DD, \u05D0\u05DD \u05D4\u05D9\u05D0 \u05E0\u05E9\u05DE\u05E2\u05EA \u05D4\u05D2\u05D9\u05D5\u05E0\u05D9\u05EA"],why:"\u05DB\u05DB\u05DC \u05E9\u05DE\u05D7\u05D9\u05E8 \u05D4\u05D8\u05E2\u05D5\u05EA \u05D2\u05D3\u05D5\u05DC \u05D9\u05D5\u05EA\u05E8, \u05D4\u05D1\u05D3\u05D9\u05E7\u05D4 \u05D7\u05E9\u05D5\u05D1\u05D4 \u05D9\u05D5\u05EA\u05E8. \u05DC\u05E9\u05D0\u05DC\u05EA \u05E1\u05E7\u05E8\u05E0\u05D5\u05EA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D5\u05D5\u05EA\u05E8; \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4 \u05E9\u05DE\u05D5\u05D2\u05E9\u05EA \u2014 \u05DC\u05D0."},en:{q:"When must you check an AI answer against another source?",a:["In every case where it carries a decision, schoolwork or numbers","Only when the answer is very short","Never, as long as it sounds sensible"],why:"The bigger the cost of being wrong, the more the check matters. For idle curiosity you can skip it; for work you hand in, you cannot."}},{id:"mistakes-quote",tier:3,topic:"mistakes",correct:1,he:{q:"\u05D4\u05BEAI \u05E6\u05D9\u05D8\u05D8 \u05DE\u05E9\u05E4\u05D8 \u05D1\u05E9\u05DD \u05D0\u05D3\u05DD \u05DE\u05E4\u05D5\u05E8\u05E1\u05DD. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D5, \u05E6\u05D9\u05D8\u05D5\u05D8\u05D9\u05DD \u05DB\u05D0\u05DC\u05D4 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC \u05DE\u05D3\u05D5\u05D9\u05E7\u05D9\u05DD","\u05DE\u05D7\u05E4\u05E9\u05D9\u05DD \u05EA\u05DE\u05D9\u05D3 \u05D0\u05EA \u05D4\u05E6\u05D9\u05D8\u05D5\u05D8 \u05D4\u05DE\u05E7\u05D5\u05E8\u05D9 \u05D5\u05DE\u05D5\u05D5\u05D3\u05D0\u05D9\u05DD","\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05DE\u05E8\u05DB\u05D0\u05D5\u05EA \u05D5\u05D6\u05D4 \u05DE\u05E1\u05E4\u05D9\u05E7"],why:"\u05E6\u05D9\u05D8\u05D5\u05D8\u05D9\u05DD \u05D5\u05E9\u05DE\u05D5\u05EA \u05D4\u05DD \u05DE\u05D4\u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05DE\u05D5\u05D3\u05DC \u05DE\u05DE\u05E6\u05D9\u05D0 \u05D1\u05E7\u05DC\u05D5\u05EA, \u05DB\u05D9 \u05D4\u05DD \u05E0\u05E9\u05DE\u05E2\u05D9\u05DD \u05E0\u05DB\u05D5\u05DF. \u05D7\u05D9\u05E4\u05D5\u05E9 \u05E7\u05E6\u05E8 \u05DE\u05D5\u05D5\u05D3\u05D0 \u05E9\u05D4\u05DE\u05E9\u05E4\u05D8 \u05D1\u05D0\u05DE\u05EA \u05E0\u05D0\u05DE\u05E8."},en:{q:"The AI quoted a line by a famous person. What do you do?",a:["Use it, quotes like that are usually accurate","Always look for the original quote and verify it","Add quotation marks and that is enough"],why:"Quotes and names are among the easiest things for a model to invent, because they sound right. A quick search confirms it was really said."}},{id:"mistakes-agrees-fast",tier:3,topic:"mistakes",correct:2,he:{q:"\u05D0\u05DE\u05E8\u05D5 \u05DC\u05BEAI \u05E9\u05D4\u05D5\u05D0 \u05D8\u05D5\u05E2\u05D4 \u05D5\u05D4\u05D5\u05D0 \u05DE\u05D9\u05D3 \u05D4\u05E1\u05DB\u05D9\u05DD. \u05DE\u05D4 \u05D6\u05D4 \u05D0\u05D5\u05DE\u05E8?",a:["\u05E9\u05D4\u05D5\u05D0 \u05D1\u05D0\u05DE\u05EA \u05D8\u05E2\u05D4","\u05E9\u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3 \u05EA\u05D5\u05DA \u05DB\u05D3\u05D9 \u05D4\u05E9\u05D9\u05D7\u05D4","\u05E9\u05D4\u05D5\u05D0 \u05E0\u05D5\u05D8\u05D4 \u05DC\u05D4\u05E1\u05DB\u05D9\u05DD, \u05D0\u05D6 \u05D6\u05D4 \u05DC\u05D0 \u05DE\u05D5\u05DB\u05D9\u05D7 \u05DB\u05DC\u05D5\u05DD"],why:"\u05DE\u05D5\u05D3\u05DC \u05DE\u05DB\u05D5\u05D5\u05DF \u05DC\u05D4\u05D9\u05D5\u05EA \u05E0\u05E2\u05D9\u05DD \u05D5\u05DE\u05D5\u05E2\u05D9\u05DC, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D5\u05D0 \u05DE\u05EA\u05D9\u05D9\u05E9\u05E8 \u05DC\u05E4\u05D9 \u05DE\u05D4 \u05E9\u05E0\u05D0\u05DE\u05E8 \u05DC\u05D5. \u05D4\u05E1\u05DB\u05DE\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4 \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05E8\u05D0\u05D9\u05D4 \u2014 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D1\u05DE\u05E7\u05D5\u05E8."},en:{q:"You told the AI it was wrong and it agreed at once. What does that mean?",a:["It really was wrong","It is learning during the conversation","It tends to agree, so this proves nothing"],why:"A model is tuned to be pleasant and helpful, so it falls in line with what it is told. Quick agreement is not evidence \u2014 check the source."}},{id:"mistakes-responsibility",tier:3,topic:"mistakes",correct:0,he:{q:"\u05DE\u05D9 \u05D0\u05D7\u05E8\u05D0\u05D9 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05DE\u05E4\u05E8\u05E1\u05DE\u05D9\u05DD \u05D1\u05E2\u05D6\u05E8\u05EA AI?",a:["\u05DE\u05D9 \u05E9\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05DB\u05DC\u05D9 \u05D5\u05D1\u05D7\u05E8 \u05DC\u05E4\u05E8\u05E1\u05DD","\u05D7\u05D1\u05E8\u05EA \u05D4\u05BEAI \u05D1\u05DC\u05D1\u05D3","\u05D0\u05E3 \u05D0\u05D7\u05D3, \u05D6\u05D4 \u05E0\u05DB\u05EA\u05D1 \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA"],why:"\u05D4\u05DB\u05DC\u05D9 \u05DE\u05E6\u05D9\u05E2, \u05D5\u05D0\u05E0\u05D7\u05E0\u05D5 \u05DC\u05D5\u05D7\u05E6\u05D9\u05DD \u05E2\u05DC \u05E9\u05DC\u05D7. \u05D0\u05DD \u05D9\u05E9 \u05D1\u05E4\u05E0\u05D9\u05DD \u05D8\u05E2\u05D5\u05EA, \u05D4\u05D9\u05D0 \u05DB\u05D1\u05E8 \u05E9\u05DC\u05E0\u05D5 \u2014 \u05D0\u05D6 \u05E7\u05D5\u05E8\u05D0\u05D9\u05DD \u05D5\u05DE\u05EA\u05E7\u05E0\u05D9\u05DD \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D6\u05D4 \u05D9\u05D5\u05E6\u05D0."},en:{q:"Who is responsible for what gets published with AI's help?",a:["Whoever used the tool and chose to publish","The AI company alone","Nobody \u2014 it was written automatically"],why:"The tool suggests; you press send. If there is a mistake inside, it is yours now \u2014 so read it and fix it before it goes out."}},{id:"vibe-learn-from-code",tier:3,topic:"vibe",correct:1,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D0\u05DE\u05EA \u05DC\u05D5\u05DE\u05D3\u05D9\u05DD \u05DE\u05D4\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1?",a:["\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05DB\u05DE\u05D4 \u05E4\u05E2\u05DE\u05D9\u05DD \u05D1\u05E8\u05E6\u05E3","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D4\u05E1\u05D1\u05E8 \u05E2\u05DC \u05DB\u05DC \u05D7\u05DC\u05E7 \u05D5\u05DE\u05E0\u05E1\u05D9\u05DD \u05DC\u05E9\u05E0\u05D5\u05EA \u05D1\u05E2\u05E6\u05DE\u05E0\u05D5","\u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05D1\u05E6\u05D3 \u05D1\u05DC\u05D9 \u05DC\u05E4\u05EA\u05D5\u05D7"],why:"\u05E9\u05D9\u05E0\u05D5\u05D9 \u05E7\u05D8\u05DF \u05E9\u05E2\u05D5\u05E9\u05D9\u05DD \u05DC\u05D1\u05D3 \u05DE\u05DC\u05DE\u05D3 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05DB\u05DC \u05D4\u05E1\u05D1\u05E8. \u05D0\u05DD \u05DE\u05E9\u05D4\u05D5 \u05E0\u05E9\u05D1\u05E8 \u2014 \u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05E8\u05D2\u05E2 \u05E9\u05D1\u05D5 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05D9\u05DA \u05D6\u05D4 \u05E2\u05D5\u05D1\u05D3."},en:{q:"How do you actually learn from the code the AI wrote?",a:["Run it several times in a row","Ask for an explanation of each part and try changing it yourself","File it away without opening it"],why:"One small change you make yourself teaches more than any explanation. If something breaks, that is the moment you understand how it works."}},{id:"vibe-report-bug",tier:3,topic:"vibe",correct:2,he:{q:"\u05DE\u05D4 \u05D4\u05DB\u05D9 \u05E2\u05D5\u05D6\u05E8 \u05DB\u05E9\u05DE\u05EA\u05D0\u05E8\u05D9\u05DD \u05EA\u05E7\u05DC\u05D4 \u05DC\u05BEAI?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E9\u05D4\u05DB\u05D5\u05DC \u05DE\u05E7\u05D5\u05DC\u05E7\u05DC","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E7\u05D5\u05D1\u05E5 \u05D1\u05DC\u05D9 \u05E9\u05D5\u05DD \u05D4\u05E1\u05D1\u05E8","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05DE\u05D4 \u05E2\u05E9\u05D9\u05E0\u05D5, \u05DE\u05D4 \u05E6\u05D9\u05E4\u05D9\u05E0\u05D5, \u05D5\u05DE\u05D4 \u05E7\u05E8\u05D4 \u05D1\u05E4\u05D5\u05E2\u05DC"],why:"\u05E9\u05DC\u05D5\u05E9\u05EA \u05D4\u05D7\u05DC\u05E7\u05D9\u05DD \u05D4\u05D0\u05DC\u05D4 \u05D4\u05D5\u05E4\u05DB\u05D9\u05DD \u05EA\u05DC\u05D5\u05E0\u05D4 \u05DC\u05D3\u05D9\u05D5\u05D5\u05D7 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D7\u05E7\u05D5\u05E8. \u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05D4 \u05E9\u05DE\u05EA\u05DB\u05E0\u05EA\u05D9\u05DD \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05D7\u05D3 \u05DC\u05E9\u05E0\u05D9."},en:{q:"What helps most when describing a bug to an AI?",a:["Writing that everything is broken","Sending the whole file with no explanation","Writing what you did, what you expected, and what happened"],why:"Those three parts turn a complaint into a report someone can investigate. It is exactly what programmers write to each other."}},{id:"vibe-say-what-happens",tier:1,topic:"vibe",correct:2,he:{q:"\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05BEAI \u05DC\u05D1\u05E0\u05D5\u05EA \u05DE\u05E9\u05D7\u05E7. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D7\u05E9\u05D5\u05D1 \u05DC\u05D4\u05D2\u05D9\u05D3 \u05DC\u05D5?",a:["\u05E9\u05D4\u05DE\u05E9\u05D7\u05E7 \u05E6\u05E8\u05D9\u05DA \u05DC\u05E6\u05D0\u05EA \u05D4\u05DB\u05D9 \u05D8\u05D5\u05D1 \u05E9\u05D9\u05E9, \u05D1\u05E8\u05DE\u05D4 \u05E9\u05DC \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05D0\u05DE\u05D9\u05EA\u05D9\u05D9\u05DD","\u05D1\u05E2\u05E8\u05DA \u05DB\u05DE\u05D4 \u05E9\u05D5\u05E8\u05D5\u05EA \u05E7\u05D5\u05D3 \u05DC\u05DB\u05EA\u05D5\u05D1, \u05D5\u05DB\u05DE\u05D4 \u05E7\u05D1\u05E6\u05D9\u05DD \u05E9\u05D9\u05D4\u05D9\u05D5","\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05D1\u05DE\u05E9\u05D7\u05E7: \u05DE\u05D9 \u05D6\u05D6, \u05DE\u05D9 \u05DE\u05E0\u05E6\u05D7, \u05D5\u05DE\u05D4 \u05E8\u05D5\u05D0\u05D9\u05DD \u05E2\u05DC \u05D4\u05DE\u05E1\u05DA"],why:'\u05EA\u05D5\u05DB\u05E0\u05D4 \u05D4\u05D9\u05D0 \u05D1\u05E1\u05DA \u05D4\u05DB\u05D5\u05DC \u05E8\u05E6\u05E3 \u05E9\u05DC "\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05E9\u2026". \u05DE\u05D9 \u05E9\u05DE\u05EA\u05D0\u05E8 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05E4\u05E9\u05D5\u05D8\u05D5\u05EA \u05DB\u05D1\u05E8 \u05E2\u05E9\u05D4 \u05D0\u05EA \u05D4\u05D7\u05DC\u05E7 \u05D4\u05E7\u05E9\u05D4.'},en:{q:"You ask an AI to build a game. What matters most to tell it?",a:["That the game must turn out as good as real commercial games","Roughly how many lines of code to write, and how many files","What happens in the game: who moves, who wins, what you see"],why:'Software is really just a stack of "what happens when\u2026". Describing that in plain words is already the hard part done.'}},{id:"vibe-run-it",tier:1,topic:"vibe",correct:0,he:{q:"\u05D4\u05BEAI \u05DB\u05EA\u05D1 \u05E7\u05D5\u05D3. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD \u05D0\u05D9\u05EA\u05D5 \u05E8\u05D0\u05E9\u05D5\u05DF?",a:["\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05D5\u05E8\u05D5\u05D0\u05D9\u05DD \u05DE\u05D4 \u05D1\u05D0\u05DE\u05EA \u05E7\u05D5\u05E8\u05D4","\u05E7\u05D5\u05E8\u05D0\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05DC\u05D0\u05D8 \u05D5\u05DE\u05D7\u05E4\u05E9\u05D9\u05DD \u05E9\u05D5\u05E8\u05D5\u05EA \u05E9\u05E0\u05E8\u05D0\u05D5\u05EA \u05DE\u05D5\u05D6\u05E8\u05D5\u05EA","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05D9\u05D3 \u05D0\u05EA \u05D4\u05D7\u05DC\u05E7 \u05D4\u05D1\u05D0, \u05DB\u05D3\u05D9 \u05DC\u05D0 \u05DC\u05D0\u05D1\u05D3 \u05D0\u05EA \u05D4\u05E7\u05E6\u05D1"],why:"\u05D2\u05DD \u05E7\u05D5\u05D3 \u05E9\u05E0\u05E8\u05D0\u05D4 \u05DE\u05E6\u05D5\u05D9\u05DF \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05EA\u05E4\u05D5\u05E6\u05E5 \u05D1\u05E9\u05E0\u05D9\u05D9\u05D4 \u05D4\u05E8\u05D0\u05E9\u05D5\u05E0\u05D4. \u05D4\u05D4\u05E8\u05E6\u05D4 \u05DC\u05D5\u05E7\u05D7\u05EA \u05E9\u05E0\u05D9\u05D5\u05EA \u05D5\u05D4\u05D9\u05D0 \u05D4\u05D3\u05D1\u05E8 \u05D4\u05D9\u05D7\u05D9\u05D3 \u05E9\u05DE\u05E1\u05E4\u05E8 \u05D0\u05EA \u05D4\u05D0\u05DE\u05EA."},en:{q:"The AI wrote some code. What do you do with it first?",a:["Run it and see what actually happens","Read it slowly and look for lines that seem odd","Ask straight away for the next part, to keep the momentum"],why:"Even code that looks perfect can blow up in the first second. Running it takes seconds and is the only thing that tells the truth."}},{id:"vibe-ask-explain",tier:1,topic:"vibe",correct:1,he:{q:"\u05DC\u05D0 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05E9\u05D5\u05E8\u05D4 \u05D1\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05D4\u05DC\u05D0\u05D4, \u05DB\u05D9 \u05D1\u05E1\u05D5\u05E3 \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D5\u05D1 \u05D6\u05D4 \u05E9\u05D4\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E2\u05D5\u05D1\u05D3\u05EA","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D4\u05E1\u05D1\u05E8 \u05E4\u05E9\u05D5\u05D8 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E2\u05DC \u05D4\u05E9\u05D5\u05E8\u05D4 \u05D4\u05D6\u05D0\u05EA","\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D0\u05EA \u05D4\u05E9\u05D5\u05E8\u05D4 \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D0\u05DD \u05DE\u05E9\u05D4\u05D5 \u05D1\u05DB\u05DC\u05DC \u05D4\u05E9\u05EA\u05E0\u05D4"],why:"\u05DC\u05D1\u05E7\u05E9 \u05D4\u05E1\u05D1\u05E8 \u05DC\u05D0 \u05E2\u05D5\u05DC\u05D4 \u05DB\u05DC\u05D5\u05DD, \u05D5\u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05E8\u05D2\u05E2 \u05E9\u05D1\u05D5 \u05DC\u05D5\u05DE\u05D3\u05D9\u05DD. \u05E7\u05D5\u05D3 \u05E9\u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05E4\u05E9\u05E8 \u05D2\u05DD \u05DC\u05EA\u05E7\u05DF \u05DC\u05D1\u05D3 \u05D1\u05E4\u05E2\u05DD \u05D4\u05D1\u05D0\u05D4."},en:{q:"You do not understand a line in the c
