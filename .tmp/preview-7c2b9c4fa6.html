u05D9\u05E9 \u05E1\u05D2\u05E0\u05D5\u05DF \u05E7\u05D1\u05D5\u05E2"],why:'\u05E1\u05D2\u05E0\u05D5\u05DF \u05D4\u05D5\u05D0 \u05D1\u05E7\u05E9\u05D4 \u05DB\u05DE\u05D5 \u05DB\u05DC \u05D1\u05E7\u05E9\u05D4 \u05D0\u05D7\u05E8\u05EA. "\u05D1\u05D8\u05D5\u05DF \u05DE\u05E6\u05D7\u05D9\u05E7, \u05DB\u05DE\u05D5 \u05D4\u05E1\u05D1\u05E8 \u05DC\u05D7\u05D1\u05E8" \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D1\u05D7\u05D9\u05E8\u05EA \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4.'},en:{q:"How do you ask for an answer in a particular style?",a:["Name the style: funny or formal","Add lots of emoji that match the style","Switch models, since each model has one fixed style"],why:'Style is a request like any other. "In a funny tone, like explaining to a friend" changes every word choice in the answer.'}},{id:"prompt-checklist",tier:2,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5?",a:["\u05E9\u05D9\u05E9 \u05D1\u05D5 \u05DC\u05E4\u05D7\u05D5\u05EA \u05D7\u05DE\u05D9\u05E9\u05D4 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD \u05D1\u05E8\u05D5\u05E8\u05D9\u05DD","\u05E9\u05D0\u05D9\u05DF \u05D1\u05D5 \u05D0\u05E3 \u05E9\u05D2\u05D9\u05D0\u05EA \u05DB\u05EA\u05D9\u05D1","\u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD, \u05DC\u05DE\u05D9, \u05D5\u05D1\u05D0\u05D9\u05D6\u05D4 \u05E4\u05D5\u05E8\u05DE\u05D8"],why:"\u05DB\u05DE\u05E2\u05D8 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DE\u05D7\u05D8\u05D9\u05D0\u05D4 \u05DE\u05E4\u05E1\u05E4\u05E1\u05EA \u05D3\u05D5\u05D5\u05E7\u05D0 \u05D1\u05D0\u05D7\u05D3 \u05D4\u05E9\u05DC\u05D5\u05E9\u05D4. \u05DE\u05D9 \u05E9\u05E1\u05D5\u05E8\u05E7 \u05D0\u05D5\u05EA\u05DD \u05DC\u05E4\u05E0\u05D9 \u05D4\u05E9\u05DC\u05D9\u05D7\u05D4 \u05EA\u05D5\u05E4\u05E1 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05D7\u05DE\u05E9 \u05E9\u05E0\u05D9\u05D5\u05EA."},en:{q:"What do you check in a prompt before sending it?",a:["That it has at least five sentences","That it contains no spelling mistakes at all","What you want, for whom, in what format"],why:"Nearly every answer that misses went wrong on one of those three. Scanning them before you send catches it in five seconds."}},{id:"prompt-negative",tier:2,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05E2\u05D3\u05D9\u05E3 \u05E2\u05DC \u05D4\u05D1\u05E7\u05E9\u05D4 "\u05DC\u05D0 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E1\u05D5\u05E3 \u05E2\u05E6\u05D5\u05D1"?',a:["\u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D4\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DC\u05D5\u05E9 \u05E4\u05E2\u05DE\u05D9\u05DD","\u05DC\u05D4\u05D5\u05E1\u05D9\u05E3 \u05D2\u05DD \u05DE\u05D4 \u05DB\u05DF \u05E8\u05D5\u05E6\u05D9\u05DD: \u05E1\u05D5\u05E3 \u05E9\u05DE\u05D7 \u05D5\u05DE\u05E4\u05EA\u05D9\u05E2","\u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D4\u05D1\u05E7\u05E9\u05D4 \u05D2\u05DD \u05D1\u05E1\u05D5\u05E3 \u05D4\u05D4\u05D5\u05D3\u05E2\u05D4, \u05DC\u05D4\u05D3\u05D2\u05E9\u05D4"],why:"\u05D1\u05E7\u05E9\u05D4 \u05E9\u05DC\u05D9\u05DC\u05D9\u05EA \u05DE\u05EA\u05D0\u05E8\u05EA \u05E8\u05E7 \u05DE\u05D4 \u05DC\u05E4\u05E1\u05D5\u05DC \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D4 \u05D0\u05D9\u05E0\u05E1\u05D5\u05E3 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D9\u05D5\u05EA. \u05D4\u05DB\u05D9\u05D5\u05D5\u05DF \u05D4\u05D7\u05D9\u05D5\u05D1\u05D9 \u05D0\u05D5\u05DE\u05E8 \u05DC\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0\u05DF \u05DC\u05DC\u05DB\u05EA."},en:{q:'What beats the request "do not write a sad ending"?',a:["Repeating the request three times","Adding what you do want: a happy, surprising ending","Repeating the request at the end of the message too"],why:"A negative request only says what to rule out and leaves endless options. The positive direction tells the model where to go."}},{id:"prompt-steps-ask",tier:2,topic:"prompt",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05DE\u05D4\u05BEAI \u05DC\u05D4\u05E8\u05D0\u05D5\u05EA \u05D0\u05EA \u05D4\u05E9\u05DC\u05D1\u05D9\u05DD?",a:["\u05DB\u05D9 \u05D0\u05D6 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E8\u05D0\u05D5\u05EA \u05D0\u05D9\u05E4\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05D5\u05D0 \u05D8\u05E2\u05D4","\u05DB\u05D9 \u05D6\u05D4 \u05DE\u05E7\u05E6\u05E8 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05D9 \u05D6\u05D4 \u05D2\u05D5\u05E8\u05DD \u05DC\u05D5 \u05DC\u05D4\u05D9\u05D5\u05EA \u05D1\u05D8\u05D5\u05D7 \u05D9\u05D5\u05EA\u05E8"],why:"\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E9\u05DC\u05D1\u05D9\u05DD \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05E9\u05DC\u05D1 \u05D0\u05D7\u05E8\u05D9 \u05E9\u05DC\u05D1 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05D0\u05DE\u05D9\u05DF \u05DC\u05E9\u05D5\u05E8\u05D4 \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D4. \u05D1\u05D3\u05E8\u05DA \u05D2\u05DD \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05E0\u05D5\u05E9\u05D0 \u05D1\u05E2\u05E6\u05DE\u05E0\u05D5."},en:{q:"Why ask the AI to show its steps?",a:["Because then you can see exactly where it went wrong","Because it shortens the answer","Because it makes the model more certain"],why:"A step-by-step answer can be checked step by step, instead of trusting the last line. Along the way you understand the topic yourself."}},{id:"tokens-context-budget",tier:2,topic:"tokens",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D7\u05E9\u05D5\u05D1 \u05E2\u05DC \u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8?",a:["\u05DB\u05DE\u05D5 \u05EA\u05D9\u05E7 \u05E2\u05DD \u05DE\u05E7\u05D5\u05DD \u05DE\u05D5\u05D2\u05D1\u05DC \u05E9\u05D0\u05D5\u05E8\u05D6\u05D9\u05DD \u05D1\u05D7\u05D5\u05DB\u05DE\u05D4","\u05DB\u05DE\u05D5 \u05DE\u05D3\u05E3 \u05E9\u05E0\u05E9\u05DE\u05E8 \u05D1\u05D9\u05DF \u05E9\u05D9\u05D7\u05D4 \u05DC\u05E9\u05D9\u05D7\u05D4 \u05D5\u05DE\u05E6\u05D8\u05D1\u05E8 \u05E2\u05DD \u05D4\u05D6\u05DE\u05DF","\u05DB\u05DE\u05D5 \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA: \u05DB\u05DB\u05DC \u05E9\u05D9\u05E9 \u05D1\u05D5 \u05D9\u05D5\u05EA\u05E8, \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D7\u05D5\u05D6\u05E8\u05EA \u05DE\u05D4\u05E8 \u05D9\u05D5\u05EA\u05E8"],why:"\u05DE\u05D4 \u05E9\u05E0\u05DB\u05E0\u05E1 \u05DC\u05EA\u05D9\u05E7 \u05D4\u05D5\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05D4 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D5\u05D0\u05D4, \u05D5\u05DB\u05E9\u05D4\u05D5\u05D0 \u05DE\u05DC\u05D0 \u05DE\u05E9\u05D4\u05D5 \u05E0\u05D5\u05E4\u05DC \u05D4\u05D7\u05D5\u05E6\u05D4. \u05DC\u05DB\u05DF \u05D0\u05D5\u05E8\u05D6\u05D9\u05DD \u05D0\u05EA \u05DE\u05D4 \u05E9\u05DE\u05E9\u05E0\u05D4, \u05DC\u05D0 \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC."},en:{q:"What is a good way to picture the context window?",a:["Like a bag with limited room that you pack wisely","Like a shelf that carries over between chats and builds up","Like speed: the more of it there is, the faster the answer"],why:"What goes in the bag is exactly what the model sees, and when it is full something falls out. So pack what matters, not everything."}},{id:"iterate-compare-two",tier:2,topic:"iterate",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05DE\u05E9\u05E0\u05D9 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8\u05D9\u05DD \u05D8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8?",a:["\u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05DE\u05E0\u05D5\u05DE\u05E1 \u05D5\u05D9\u05E4\u05D4 \u05D9\u05D5\u05EA\u05E8","\u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E9\u05D0\u05E8\u05D5\u05DA \u05D9\u05D5\u05EA\u05E8","\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D0\u05EA \u05E9\u05E0\u05D9\u05D4\u05DD \u05D5\u05DE\u05E9\u05D5\u05D5\u05D9\u05DD"],why:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8\u05D9\u05DD \u05E7\u05E9\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05DC\u05E0\u05D7\u05E9 \u05DE\u05E8\u05D0\u05E9. \u05E0\u05D9\u05E1\u05D5\u05D9 \u05E7\u05D8\u05DF \u2014 \u05D0\u05D5\u05EA\u05D5 \u05E0\u05D5\u05E9\u05D0, \u05E9\u05EA\u05D9 \u05D2\u05E8\u05E1\u05D0\u05D5\u05EA \u2014 \u05E0\u05D5\u05EA\u05DF \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D5\u05D3\u05D0\u05D9\u05EA \u05EA\u05D5\u05DA \u05D3\u05E7\u05D4."},en:{q:"How do you know which of two prompts is better?",a:["The one that sounds more polite","The one that is longer","Run both and compare"],why:"With prompts, guessing ahead is hard. A tiny experiment \u2014 same topic, two versions \u2014 settles it in a minute."}},{id:"iterate-save-good",tier:1,topic:"iterate",correct:0,he:{q:"\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D9\u05E6\u05D0 \u05DE\u05E6\u05D5\u05D9\u05DF. \u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E2\u05E9\u05D5\u05EA \u05D0\u05D9\u05EA\u05D5?",a:["\u05DC\u05E9\u05DE\u05D5\u05E8 \u05D0\u05D5\u05EA\u05D5, \u05DB\u05D9 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D8\u05D5\u05D1 \u05EA\u05DE\u05D9\u05D3 \u05E9\u05D5\u05D5\u05D4 \u05E9\u05D9\u05DE\u05D5\u05E9 \u05D7\u05D5\u05D6\u05E8","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05D0\u05D5\u05EA\u05D5 \u05E9\u05D5\u05D1 \u05DE\u05D9\u05D3, \u05DB\u05D3\u05D9 \u05DC\u05E7\u05D1\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05E0\u05D9\u05D9\u05D4 \u05DC\u05D4\u05E9\u05D5\u05D5\u05D0\u05D4","\u05DC\u05D6\u05DB\u05D5\u05E8 \u05D1\u05E2\u05E8\u05DA \u05DE\u05D4 \u05D4\u05D9\u05D4 \u05D1\u05D5 \u05D5\u05DC\u05E0\u05E1\u05D7 \u05D0\u05D5\u05EA\u05D5 \u05DE\u05D7\u05D3\u05E9 \u05D1\u05E4\u05E2\u05DD \u05D4\u05D1\u05D0\u05D4"],why:"\u05E0\u05D9\u05E1\u05D5\u05D7 \u05DE\u05D7\u05D3\u05E9 \u05DE\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05DE\u05D0\u05D1\u05D3 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05E9\u05E2\u05E9\u05D5 \u05D0\u05EA \u05D4\u05D4\u05D1\u05D3\u05DC. \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05DE\u05D5\u05E8 \u05D4\u05D5\u05D0 \u05DB\u05DC\u05D9 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E9\u05DC\u05D5\u05E3 \u05D1\u05E2\u05D5\u05D3 \u05D7\u05D5\u05D3\u05E9."},en:{q:"A prompt came out great. What should you do with it?",a:["Save it \u2014 a good prompt is always worth reusing","Send it again right away, for a second answer to compare","Roughly remember it and rewrite it from scratch next time"],why:"Rewriting from memory loses exactly the details that made the difference. A saved prompt is a tool you can pull out a month later."}},{id:"iterate-ask-questions",tier:2,topic:"iterate",correct:1,he:{q:"\u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8 \u05DB\u05E9\u05E7\u05E9\u05D4 \u05DC\u05E0\u05E1\u05D7 \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3","\u05DC\u05D1\u05E7\u05E9 \u05DE\u05D4\u05BEAI \u05DC\u05E9\u05D0\u05D5\u05DC \u05E9\u05D0\u05DC\u05D5\u05EA \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D4 \u05D1\u05E7\u05E9\u05D4 \u05DB\u05DE\u05D4 \u05E4\u05E2\u05DE\u05D9\u05DD"],why:'\u05DB\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E9\u05D5\u05D0\u05DC "\u05DC\u05D0\u05D9\u05D6\u05D4 \u05D2\u05D9\u05DC? \u05D1\u05D0\u05D9\u05D6\u05D4 \u05D0\u05D5\u05E8\u05DA?", \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05E9\u05DC\u05D5 \u05DE\u05D2\u05DC\u05D5\u05EA \u05DE\u05D4 \u05D7\u05E1\u05E8 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8. \u05E2\u05D5\u05E0\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4\u05DF \u05D5\u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA.'},en:{q:"What helps when the request is hard to phrase?",a:["Writing an extra long prompt","Asking the AI to ask questions before it answers","Sending the same request several times"],why:'When the model asks "for what age? how long?", its questions reveal what the prompt is missing. Answer them and the result lands.'}},{id:"mistakes-two-answers",tier:2,topic:"mistakes",correct:2,he:{q:"\u05E7\u05D9\u05D1\u05DC\u05D5 \u05E9\u05EA\u05D9 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E1\u05D5\u05EA\u05E8\u05D5\u05EA \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E9\u05D0\u05DC\u05D4. \u05DE\u05D4 \u05D6\u05D4 \u05D0\u05D5\u05DE\u05E8?",a:["\u05E9\u05D0\u05D7\u05EA \u05DE\u05D4\u05DF \u05D1\u05D8\u05D5\u05D7 \u05E0\u05DB\u05D5\u05E0\u05D4","\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05EA\u05E7\u05DC\u05E7\u05DC","\u05E9\u05D4\u05E0\u05D5\u05E9\u05D0 \u05D4\u05D6\u05D4 \u05E2\u05DC \u05D2\u05D1\u05D5\u05DC \u05D4\u05D9\u05D3\u05E2 \u05E9\u05DC\u05D5"],why:"\u05E1\u05EA\u05D9\u05E8\u05D4 \u05DE\u05E1\u05DE\u05E0\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D9\u05E4\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05E0\u05D7\u05E9. \u05E9\u05D9\u05DE\u05D5 \u05DC\u05D1: \u05D6\u05D4 \u05DC\u05D0 \u05D0\u05D5\u05DE\u05E8 \u05E9\u05D0\u05D7\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E0\u05DB\u05D5\u05E0\u05D4 \u2014 \u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05E9\u05EA\u05D9\u05D4\u05DF \u05DC\u05D0."},en:{q:"The same question got two contradicting answers. What does that mean?",a:["One of them is definitely right","The model is broken","That this topic sits at the edge of what it knows"],why:"A contradiction marks exactly where the model is guessing. Note that it does not mean one answer is right \u2014 sometimes neither is."}},{id:"mistakes-ask-reasoning",tier:2,topic:"mistakes",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E2\u05DC \u05DE\u05D4 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05EA\u05D1\u05E1\u05E1\u05EA?",a:["\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D4\u05E1\u05D1\u05E8 \u05D0\u05D9\u05DA \u05D4\u05D5\u05D0 \u05D4\u05D2\u05D9\u05E2 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4, \u05D5\u05D0\u05D6 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD","\u05E9\u05D5\u05D0\u05DC\u05D9\u05DD \u05D0\u05DD \u05D4\u05D5\u05D0 \u05D1\u05D8\u05D5\u05D7","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D9\u05D5\u05EA\u05E8"],why:"\u05D4\u05E1\u05D1\u05E8 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D7\u05D5\u05DF, \u05D2\u05DD \u05DB\u05E9\u05D4\u05D5\u05D0 \u05DC\u05D0 \u05DE\u05D5\u05E9\u05DC\u05DD. \u05D4\u05E6\u05D4\u05E8\u05EA \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D7\u05D5\u05DF \u05D1\u05DB\u05DC\u05DC, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E4\u05D4 \u05DE\u05D9\u05D3\u05E2."},en:{q:"How do you check what an answer is based on?",a:["Ask it to explain how it got there, then check that","Ask whether it is sure","Ask for a longer answer"],why:"An explanation can be examined, even an imperfect one. A statement of confidence cannot be examined at all, so it adds nothing."}},{id:"mistakes-images-fake",tier:2,topic:"mistakes",correct:1,he:{q:"\u05E8\u05D0\u05D5 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05DE\u05D3\u05D4\u05D9\u05DE\u05D4 \u05D1\u05E8\u05E9\u05EA. \u05D0\u05D9\u05DA \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05DD AI \u05D9\u05E6\u05E8 \u05D0\u05D5\u05EA\u05D4?",a:["\u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05D0\u05E6\u05D1\u05E2\u05D5\u05EA \u05D5\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u2014 \u05E9\u05DD AI \u05EA\u05DE\u05D9\u05D3 \u05E0\u05E9\u05D1\u05E8 \u05D1\u05E1\u05D5\u05E3","\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E4\u05E8\u05D8\u05D9\u05DD \u05DE\u05D5\u05D6\u05E8\u05D9\u05DD, \u05D5\u05DE\u05D1\u05E8\u05E8\u05D9\u05DD \u05DE\u05D9 \u05E4\u05E8\u05E1\u05DD","\u05DE\u05D7\u05E4\u05E9\u05D9\u05DD \u05D0\u05D5\u05EA\u05D4 \u05D1\u05DB\u05DC\u05D9 \u05D6\u05D9\u05D4\u05D5\u05D9, \u05D5\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DC\u05D5 \u05E1\u05D5\u05D2\u05E8\u05EA \u05D0\u05EA \u05D4\u05E2\u05E0\u05D9\u05D9\u05DF"],why:"\u05E1\u05D9\u05DE\u05E0\u05D9 \u05D4\u05D0\u05E6\u05D1\u05E2\u05D5\u05EA \u05D5\u05D4\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u05E0\u05E2\u05DC\u05DE\u05D9\u05DD \u05DB\u05DB\u05DC \u05E9\u05D4\u05DB\u05DC\u05D9\u05DD \u05DE\u05E9\u05EA\u05E4\u05E8\u05D9\u05DD, \u05D5\u05D2\u05DD \u05DB\u05DC\u05D9 \u05D6\u05D9\u05D4\u05D5\u05D9 \u05D8\u05D5\u05E2\u05D4. \u05DE\u05E7\u05D5\u05E8 \u05D4\u05E4\u05E8\u05E1\u05D5\u05DD \u05E0\u05E9\u05D0\u05E8 \u05D4\u05E8\u05DE\u05D6 \u05D4\u05D7\u05D6\u05E7 \u05D1\u05D9\u05D5\u05EA\u05E8."},en:{q:"You saw an amazing photo online. How do you tell if AI made it?",a:["Count the fingers and letters \u2014 AI always breaks there","Look for odd details, and trace who posted it","Run it through a detector tool and take its verdict as final"],why:"Finger and letter glitches fade as tools improve, and detectors get it wrong too. Where a picture came from stays the strongest clue."}},{id:"mistakes-unfair-answer",tier:2,topic:"mistakes",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E9\u05DE\u05E2\u05EA \u05DC\u05D0 \u05D4\u05D5\u05D2\u05E0\u05EA \u05DB\u05DC\u05E4\u05D9 \u05E7\u05D1\u05D5\u05E6\u05EA \u05D0\u05E0\u05E9\u05D9\u05DD. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05E1\u05D7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D4 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E6\u05D5\u05E8\u05D4 \u05E2\u05D3\u05D9\u05E0\u05D4 \u05D9\u05D5\u05EA\u05E8","\u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05D0\u05EA \u05D6\u05D4, \u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D0\u05D4 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D9\u05D3\u05E2 \u05DE\u05DB\u05DC \u05D0\u05D3\u05DD \u05D0\u05D7\u05D3","\u05DC\u05D0 \u05DE\u05E7\u05D1\u05DC\u05D9\u05DD \u05D0\u05EA \u05D6\u05D4 \u05DB\u05E2\u05D5\u05D1\u05D3\u05D4, \u05D5\u05DE\u05D3\u05D1\u05E8\u05D9\u05DD \u05E2\u05DC \u05D6\u05D4 \u05E2\u05DD \u05DE\u05D1\u05D5\u05D2\u05E8"],why:"\u05E0\u05D9\u05E1\u05D5\u05D7 \u05E2\u05D3\u05D9\u05DF \u05D9\u05D5\u05EA\u05E8 \u05DC\u05D0 \u05D4\u05D5\u05E4\u05DA \u05D8\u05E2\u05E0\u05D4 \u05DE\u05D5\u05D8\u05D4 \u05DC\u05E0\u05DB\u05D5\u05E0\u05D4. \u05DE\u05D5\u05D3\u05DC \u05D7\u05D5\u05D6\u05E8 \u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05E2\u05DC \u05D4\u05D8\u05D9\u05D5\u05EA \u05E9\u05D4\u05D9\u05D5 \u05D1\u05D8\u05E7\u05E1\u05D8 \u05E9\u05DC\u05DE\u05D3 \u05DE\u05DE\u05E0\u05D5, \u05D5\u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05E7\u05D5\u05DD \u05DC\u05E2\u05E6\u05D5\u05E8."},en:{q:"An answer sounds unfair toward a group of people. What now?",a:["Ask the model to word the same claim more gently","Accept it, since the model has seen more text than any person","Do not take it as fact \u2014 talk to an adult"],why:"Gentler wording does not make a skewed claim true. A model sometimes repeats biases from the text it learned from, and that is a place to stop."}},{id:"vibe-small-steps",tier:2,topic:"vibe",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05E0\u05D9\u05DD \u05EA\u05D5\u05DB\u05E0\u05D4 \u05E2\u05DD AI \u05D1\u05DC\u05D9 \u05DC\u05D4\u05E1\u05EA\u05D1\u05DA?",a:["\u05D7\u05EA\u05D9\u05DB\u05D4 \u05E7\u05D8\u05E0\u05D4 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD, \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DC \u05D0\u05D7\u05EA","\u05D4\u05DB\u05D5\u05DC \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA, \u05D5\u05D0\u05D6 \u05DE\u05EA\u05E7\u05E0\u05D9\u05DD","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E1\u05D5\u05E3 \u05D5\u05DE\u05E9\u05DC\u05D9\u05DE\u05D9\u05DD \u05D0\u05D7\u05D5\u05E8\u05D4"],why:"\u05DB\u05E9\u05DE\u05E9\u05D4\u05D5 \u05E0\u05E9\u05D1\u05E8 \u05D0\u05D7\u05E8\u05D9 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E7\u05D8\u05DF, \u05D1\u05E8\u05D5\u05E8 \u05DE\u05D9\u05D3 \u05DE\u05D4 \u05D2\u05E8\u05DD \u05DC\u05D6\u05D4. \u05D0\u05D7\u05E8\u05D9 \u05DE\u05D0\u05D4 \u05E9\u05D5\u05E8\u05D5\u05EA \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA \u05DB\u05D1\u05E8 \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA."},en:{q:"How do you build software with AI without getting tangled?",a:["One small piece at a time, testing after each","All of it at once, then fix it","Write only the ending and fill in backwards"],why:"When something breaks right after a small change, the cause is obvious. After a hundred lines at once, it is anyone's guess."}},{id:"vibe-read-code",tier:2,topic:"vibe",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E7\u05E8\u05D5\u05D0 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D5\u05D5\u05D3\u05D0 \u05E9\u05D0\u05D9\u05DF \u05D1\u05D5 \u05E9\u05D2\u05D9\u05D0\u05D5\u05EA \u05DB\u05EA\u05D9\u05D1","\u05DB\u05D9 \u05DE\u05D9 \u05E9\u05DE\u05D1\u05D9\u05DF \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC \u05DC\u05E9\u05E0\u05D5\u05EA \u05D0\u05D5\u05EA\u05D5 \u05DC\u05D1\u05D3","\u05DB\u05D9 \u05E7\u05E8\u05D9\u05D0\u05D4 \u05D7\u05D5\u05E1\u05DB\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05E7\u05D5\u05D3 \u05E9\u05DC\u05D0 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05EA\u05E7\u05DF \u05D5\u05D2\u05DD \u05DC\u05D0 \u05DC\u05DC\u05DE\u05D5\u05D3 \u05DE\u05DE\u05E0\u05D5. \u05EA\u05DE\u05D9\u05D3 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05E7\u05E9 \u05D4\u05E1\u05D1\u05E8 \u05E9\u05D5\u05E8\u05D4\u05BE\u05E9\u05D5\u05E8\u05D4 \u2014 \u05D6\u05D4 \u05D7\u05DC\u05E7 \u05DE\u05D4\u05E2\u05D1\u05D5\u05D3\u05D4."},en:{q:"Why read the code the AI wrote?",a:["To make sure there are no spelling mistakes in it","Because whoever understands the code can change it themselves","Because reading saves tokens"],why:"Code you do not understand you cannot fix, and cannot learn from. You can always ask for a line-by-line explanation \u2014 that is part of the job."}},{id:"ai-step-by-step-gen",tier:3,topic:"whatai",correct:2,he:{q:"\u05DC\u05DE\u05D4 AI \u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05E4\u05D5\u05EA\u05D7 \u05DE\u05E9\u05E4\u05D8 \u05DE\u05E6\u05D5\u05D9\u05DF \u05D5\u05DE\u05E1\u05D9\u05D9\u05DD \u05D1\u05E9\u05D8\u05D5\u05EA?",a:["\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05DE\u05EA\u05E2\u05D9\u05D9\u05E3 \u05D1\u05D0\u05DE\u05E6\u05E2 \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D9\u05DD \u05DE\u05D3\u05D9","\u05DB\u05D9 \u05DE\u05D9\u05E9\u05D4\u05D5 \u05DE\u05D7\u05DC\u05D9\u05E3 \u05D0\u05D5\u05EA\u05D5 \u05D1\u05D0\u05DE\u05E6\u05E2 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05DE\u05D5\u05D3\u05DC \u05D0\u05D7\u05E8","\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05D1\u05D5\u05D7\u05E8 \u05DE\u05D9\u05DC\u05D4 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD, \u05D5\u05DC\u05D0 \u05EA\u05DE\u05D9\u05D3 \u05DE\u05EA\u05DB\u05E0\u05DF \u05E2\u05D3 \u05D4\u05E1\u05D5\u05E3"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05D1\u05D5\u05D7\u05E8 \u05D0\u05EA \u05D4\u05D4\u05DE\u05E9\u05DA \u05D4\u05DE\u05EA\u05D0\u05D9\u05DD \u05D1\u05DB\u05DC \u05E6\u05E2\u05D3, \u05D1\u05DC\u05D9 \u05DC\u05D3\u05E2\u05EA \u05DC\u05D0\u05DF \u05D4\u05DE\u05E9\u05E4\u05D8 \u05D4\u05D5\u05DC\u05DA. \u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05E7\u05D5\u05D3\u05DD \u05E8\u05D0\u05E9\u05D9 \u05E4\u05E8\u05E7\u05D9\u05DD \u05D5\u05E8\u05E7 \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D4\u05DE\u05DC\u05D0."},en:{q:"Why does AI sometimes open a great sentence and end in nonsense?",a:["Because it gets tired in the middle of long sentences","Because a different model quietly takes over mid-answer","Because it picks one word at a time and does not always plan ahead"],why:"The model picks a fitting continuation each step without knowing where the sentence is going. So ask for an outline first, then the full text."}},{id:"ai-multimodal",tier:2,topic:"whatai",correct:0,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05E7\u05D1\u05DC \u05D2\u05DD \u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05D5\u05D2\u05DD \u05D8\u05E7\u05E1\u05D8?",a:["\u05DE\u05D5\u05D3\u05DC \u05E8\u05D1\u05BE\u05DE\u05D5\u05D3\u05D0\u05DC\u05D9, \u05E9\u05E2\u05D5\u05D1\u05D3 \u05E2\u05DD \u05DB\u05DE\u05D4 \u05E1\u05D5\u05D2\u05D9 \u05DE\u05D9\u05D3\u05E2","\u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05E8\u05D9\u05E5 \u05E9\u05EA\u05D9 \u05EA\u05D5\u05DB\u05E0\u05D5\u05EA \u05D1\u05DE\u05E7\u05D1\u05D9\u05DC","\u05DE\u05D5\u05D3\u05DC \u05E9\u05DE\u05EA\u05E8\u05D2\u05DD \u05EA\u05DE\u05D5\u05E0\u05D5\u05EA \u05DC\u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05DC\u05D1\u05D3"],why:"\u05D4\u05D5\u05D0 \u05E8\u05D5\u05D0\u05D4 \u05D0\u05EA \u05D4\u05EA\u05DE\u05D5\u05E0\u05D4, \u05D0\u05D1\u05DC \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D4 \u05DE\u05E2\u05E0\u05D9\u05D9\u05DF \u05D1\u05D4. \u05F4\u05DE\u05D4 \u05DB\u05EA\u05D5\u05D1 \u05D1\u05E9\u05DC\u05D8?\u05F4 \u05D9\u05D1\u05D9\u05D0 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D8\u05D5\u05D1\u05D4 \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DE\u05F4\u05DE\u05D4 \u05D9\u05E9 \u05D1\u05EA\u05DE\u05D5\u05E0\u05D4?\u05F4."},en:{q:"What is a model that takes both images and text?",a:["A multimodal model, working with several kinds of input","A model running two programs at once","A model that only turns pictures into words"],why:'It can see the picture, but it does not know what you find interesting in it. "What does the sign say?" beats "what is in this photo?" every time.'}},{id:"ai-limits-honest",tier:1,topic:"whatai",correct:1,he:{q:"\u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF \u05DC\u05D2\u05D1\u05D9 \u05D4\u05D2\u05D1\u05D5\u05DC\u05D5\u05EA \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC\u05D9\u05DD \u05DB\u05D0\u05DC\u05D4?",a:["\u05D0\u05D9\u05DF \u05DC\u05D4\u05DD \u05D2\u05D1\u05D5\u05DC\u05D5\u05EA, \u05E8\u05E7 \u05E6\u05E8\u05D9\u05DA \u05DC\u05E9\u05D0\u05D5\u05DC \u05E0\u05DB\u05D5\u05DF","\u05EA\u05DE\u05D9\u05D3 \u05D9\u05E9 \u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05D4\u05DD \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D5\u05DC\u05D0 \u05D9\u05DB\u05D5\u05DC\u05D9\u05DD \u05DC\u05D3\u05E2\u05EA","\u05D4\u05D2\u05D1\u05D5\u05DC \u05D4\u05D9\u05D7\u05D9\u05D3 \u05E9\u05DC\u05D4\u05DD \u05D4\u05D5\u05D0 \u05DE\u05D4\u05D9\u05E8\u05D5\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4"],why:"\u05D4\u05D5\u05D0 \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D4 \u05E7\u05E8\u05D4 \u05D0\u05EA\u05DE\u05D5\u05DC \u05D1\u05DB\u05D9\u05EA\u05D4, \u05DE\u05D4 \u05D9\u05D4\u05D9\u05D4 \u05DE\u05D7\u05E8 \u05D1\u05DE\u05D6\u05D2 \u05D4\u05D0\u05D5\u05D5\u05D9\u05E8, \u05D5\u05DC\u05D0 \u05DE\u05D4 \u05D7\u05E9\u05D1\u05E0\u05D5 \u05D5\u05DC\u05D0 \u05DB\u05EA\u05D1\u05E0\u05D5. \u05D0\u05DC\u05D4 \u05DC\u05D0 \u05D1\u05D0\u05D2\u05D9\u05DD \u2014 \u05D6\u05D4 \u05E4\u05E9\u05D5\u05D8 \u05DE\u05D7\u05D5\u05E5 \u05DC\u05EA\u05D7\u05D5\u05DD."},en:{q:"What is true about the limits of these models?",a:["They have no limits \u2014 you just have to ask correctly","There are always things they do not and cannot know","Their only limit is how fast they answer"],why:"It does not know what happened in class yesterday, what tomorrow's weather will be, or what you thought and never typed. Not bugs \u2014 just out of range."}},{id:"prompt-few-shot",tier:3,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D5\u05EA \u05E9\u05EA\u05D9\u05D9\u05DD\u05BE\u05E9\u05DC\u05D5\u05E9 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05D1\u05D0\u05D5\u05EA\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05DE\u05D1\u05D6\u05D1\u05D6\u05D5\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05E1\u05D9\u05D1\u05D4","\u05DE\u05DB\u05E8\u05D9\u05D7\u05D5\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05D5\u05EA\u05DF \u05DE\u05D9\u05DC\u05D4 \u05D1\u05DE\u05D9\u05DC\u05D4","\u05DE\u05DB\u05D5\u05D5\u05E0\u05D5\u05EA \u05D0\u05D5\u05EA\u05D5 \u05DC\u05D3\u05E4\u05D5\u05E1 \u05E9\u05E8\u05D5\u05E6\u05D9\u05DD, \u05D1\u05DC\u05D9 \u05DC\u05D0\u05DE\u05DF \u05D0\u05D5\u05EA\u05D5 \u05DE\u05D7\u05D3\u05E9"],why:"\u05DE\u05D3\u05D5\u05D2\u05DE\u05D4 \u05D0\u05D7\u05EA \u05E7\u05E9\u05D4 \u05DC\u05D4\u05E1\u05D9\u05E7 \u05DE\u05D4 \u05D4\u05DB\u05DC\u05DC; \u05DE\u05E9\u05DC\u05D5\u05E9 \u05D4\u05D3\u05E4\u05D5\u05E1 \u05DB\u05D1\u05E8 \u05D1\u05E8\u05D5\u05E8. \u05D4\u05DF \u05DE\u05DC\u05DE\u05D3\u05D5\u05EA \u05E4\u05D5\u05E8\u05DE\u05D8 \u05D5\u05E1\u05D2\u05E0\u05D5\u05DF \u05D1\u05DC\u05D9 \u05D4\u05E1\u05D1\u05E8 \u05D0\u05E8\u05D5\u05DA."},en:{q:"What do two or three examples in one prompt do?",a:["Waste tokens for no reason","Force the model to copy them word for word","Steer it toward the pattern you want, without retraining it"],why:"From one example the rule is hard to infer; from three the pattern is clear. They teach format and style without a long explanation."}},{id:"prompt-order",tier:3,topic:"prompt",correct:0,he:{q:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA, \u05D0\u05D9\u05E4\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E9\u05D9\u05DD \u05D0\u05EA \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05D4\u05D7\u05E9\u05D5\u05D1\u05D4?",a:["\u05D1\u05D4\u05EA\u05D7\u05DC\u05D4 \u05D0\u05D5 \u05D1\u05E1\u05D5\u05E3, \u05D1\u05DE\u05E7\u05D5\u05DD \u05D1\u05D5\u05DC\u05D8","\u05D1\u05D0\u05DE\u05E6\u05E2, \u05D1\u05D9\u05DF \u05E9\u05D0\u05E8 \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD","\u05DC\u05D0 \u05DE\u05E9\u05E0\u05D4, \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05D4\u05DB\u05D5\u05DC \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8"],why:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D4 \u05E9\u05D9\u05D5\u05E9\u05D1 \u05D1\u05E7\u05E6\u05D5\u05D5\u05EA \u05D1\u05D5\u05DC\u05D8 \u05D9\u05D5\u05EA\u05E8. \u05D4\u05D5\u05E8\u05D0\u05D4 \u05E7\u05E8\u05D9\u05D8\u05D9\u05EA \u05E9\u05E7\u05D1\u05D5\u05E8\u05D4 \u05D1\u05D0\u05DE\u05E6\u05E2 \u05E4\u05E1\u05E7\u05D4 \u05E0\u05D5\u05D8\u05D4 \u05DC\u05D4\u05D9\u05D1\u05DC\u05E2."},en:{q:"In a long prompt, where should the most important instruction go?",a:["At the start or the end, somewhere prominent","In the middle, among the other details","It makes no difference, the model reads it all the same"],why:"In a long prompt, what sits at the edges stands out. A critical instruction buried mid-paragraph tends to get swallowed."}},{id:"prompt-success-test",tier:3,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05DE\u05D3\u05D3 \u05D4\u05E6\u05DC\u05D7\u05D4" \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?',a:["\u05E6\u05D9\u05D5\u05DF \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05E0\u05D5\u05EA\u05DF \u05DC\u05E2\u05E6\u05DE\u05D5 \u05D1\u05E1\u05D5\u05E3","\u05DE\u05E9\u05E4\u05D8 \u05E9\u05DE\u05D2\u05D3\u05D9\u05E8 \u05DE\u05E8\u05D0\u05E9 \u05DE\u05EA\u05D9 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D8\u05D5\u05D1\u05D4","\u05DE\u05E1\u05E4\u05E8 \u05D4\u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05E9\u05DE\u05D5\u05EA\u05E8 \u05DC\u05E2\u05E9\u05D5\u05EA"],why:'\u05DB\u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD "\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D8\u05D5\u05D1\u05D4 \u05D0\u05DD \u05D4\u05D9\u05D0 \u05DE\u05E1\u05D1\u05D9\u05E8\u05D4 \u05D1\u05DC\u05D9 \u05DE\u05D5\u05E0\u05D7\u05D9\u05DD \u05D8\u05DB\u05E0\u05D9\u05D9\u05DD", \u05D9\u05E9 \u05D1\u05DE\u05D4 \u05DC\u05DE\u05D3\u05D5\u05D3. \u05D1\u05DC\u05D9 \u05DE\u05D3\u05D3 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E8\u05D0\u05D9\u05EA \u05E1\u05D1\u05D9\u05E8\u05D4.'},en:{q:'What is a "success test" in a prompt?',a:["A grade the model gives itself at the end","A sentence defining up front when the answer is good","The number of attempts allowed"],why:'Writing "the answer is good if it explains with no technical terms" gives you something to measure against. Without a measure, any answer looks fine.'}},{id:"prompt-delimiters",tier:3,topic:"prompt",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05E4\u05E8\u05D9\u05D3\u05D9\u05DD \u05D1\u05D9\u05DF \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DC\u05D1\u05D9\u05DF \u05D8\u05E7\u05E1\u05D8 \u05D0\u05E8\u05D5\u05DA \u05E9\u05DE\u05E6\u05E8\u05E4\u05D9\u05DD?",a:["\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC \u05D1\u05E8\u05E6\u05E3 \u05D0\u05D7\u05D3","\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D0\u05EA \u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DB\u05D3\u05D9 \u05DC\u05D0 \u05DC\u05D1\u05DC\u05D1\u05DC","\u05DE\u05E1\u05DE\u05E0\u05D9\u05DD \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D1\u05D2\u05D1\u05D5\u05DC\u05D5\u05EA \u05D1\u05E8\u05D5\u05E8\u05D9\u05DD, \u05DC\u05DE\u05E9\u05DC \u05D1\u05DB\u05D5\u05DB\u05D1\u05D9\u05D5\u05EA"],why:'\u05D1\u05DC\u05D9 \u05D4\u05E4\u05E8\u05D3\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05DC\u05D5\u05DC \u05DC\u05E7\u05E8\u05D5\u05D0 \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05D4\u05DE\u05E6\u05D5\u05E8\u05E3 \u05DB\u05D0\u05D9\u05DC\u05D5 \u05D4\u05D5\u05D0 \u05D4\u05D4\u05D5\u05E8\u05D0\u05D5\u05EA. \u05E1\u05D9\u05DE\u05D5\u05DF \u05E4\u05E9\u05D5\u05D8 \u05D0\u05D5\u05DE\u05E8 "\u05D6\u05D4 \u05D4\u05D7\u05D5\u05DE\u05E8, \u05D5\u05D6\u05D5 \u05D4\u05D1\u05E7\u05E9\u05D4".'},en:{q:"How do you separate the instruction from long attached text?",a:["Write it all as one run of text","Delete the instruction so nothing gets confused","Mark the text with clear boundaries, asterisks for instance"],why:'With no separation the model may read the attached text as instructions. A simple marker says "this is the material, this is the request".'}},{id:"prompt-template",tier:3,topic:"prompt",correct:0,he:{q:"\u05DE\u05D4 \u05D4\u05D5\u05E4\u05DA \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05EA\u05D1\u05E0\u05D9\u05EA \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05D4 \u05E9\u05D5\u05D1?",a:["\u05DE\u05D1\u05E0\u05D4 \u05E7\u05D1\u05D5\u05E2 \u05E2\u05DD \u05DE\u05E7\u05D5\u05DD \u05E9\u05DE\u05D7\u05DC\u05D9\u05E4\u05D9\u05DD \u05D1\u05D5 \u05D0\u05EA \u05D4\u05E0\u05D5\u05E9\u05D0","\u05D6\u05D4 \u05E9\u05D4\u05D5\u05D0 \u05D0\u05E8\u05D5\u05DA \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3","\u05D6\u05D4 \u05E9\u05D4\u05D5\u05D0 \u05E9\u05DE\u05D5\u05E8 \u05D1\u05E9\u05D9\u05D7\u05D4 \u05D9\u05E9\u05E0\u05D4"],why:"\u05EA\u05D1\u05E0\u05D9\u05EA \u05E9\u05D5\u05DE\u05E8\u05EA \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E2\u05D1\u05D3 \u2014 \u05D4\u05EA\u05E4\u05E7\u05D9\u05D3, \u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05D5\u05D4\u05D4\u05D2\u05D1\u05DC\u05D5\u05EA \u2014 \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D4 \u05D7\u05D5\u05E8 \u05D0\u05D7\u05D3 \u05DC\u05E0\u05D5\u05E9\u05D0. \u05DB\u05DB\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05D5\u05E6\u05DC\u05D7 \u05E0\u05E2\u05E9\u05D4 \u05DB\u05DC\u05D9 \u05E7\u05D1\u05D5\u05E2."},en:{q:"What turns a prompt into a reusable template?",a:["A fixed structure with one slot where the topic gets swapped","Being especially long","Being saved in an old conversation"],why:"A template keeps what worked \u2014 the role, the format, the limits \u2014 and leaves one hole for the topic. That is how a good prompt becomes a permanent tool."}},{id:"tokens-how-much-context",tier:3,topic:"tokens",correct:1,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05D7\u05DC\u05D9\u05D8\u05D9\u05DD \u05DB\u05DE\u05D4 \u05D4\u05E7\u05E9\u05E8 \u05DC\u05D4\u05DB\u05E0\u05D9\u05E1 \u05DC\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05D0\u05EA \u05D4\u05DE\u05E7\u05E1\u05D9\u05DE\u05D5\u05DD \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05DB\u05E0\u05D9\u05E1, \u05DC\u05D9\u05EA\u05E8 \u05D1\u05D9\u05D8\u05D7\u05D5\u05DF","\u05DE\u05DB\u05E0\u05D9\u05E1\u05D9\u05DD \u05D0\u05EA \u05DE\u05D4 \u05E9\u05DE\u05E9\u05E0\u05D4, \u05D5\u05DC\u05D0 \u05D9\u05D5\u05EA\u05E8","\u05D0\u05EA \u05D4\u05DE\u05D9\u05E0\u05D9\u05DE\u05D5\u05DD \u05D4\u05D4\u05DB\u05E8\u05D7\u05D9, \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05E9\u05EA\u05D9\u05D9\u05DD"],why:'\u05D4\u05E7\u05E9\u05E8 \u05D4\u05D5\u05D0 \u05DC\u05D0 "\u05DB\u05DE\u05D4 \u05E9\u05D9\u05D5\u05EA\u05E8" \u05D5\u05DC\u05D0 "\u05DB\u05DE\u05D4 \u05E9\u05E4\u05D7\u05D5\u05EA". \u05D4\u05E9\u05D0\u05DC\u05D4 \u05D4\u05D9\u05D7\u05D9\u05D3\u05D4 \u05D4\u05D9\u05D0 \u05D0\u05DD \u05D4\u05E4\u05E8\u05D8 \u05D4\u05D6\u05D4 \u05D4\u05D9\u05D4 \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E4\u05D5\u05E2\u05DC.'},en:{q:"How do you decide how much context to put in a prompt?",a:["The maximum you can fit, just to be safe","Include what changes the answer","The bare minimum \u2014 a word or two"],why:'Context is neither "as much as possible" nor "as little as possible". The only question is whether that detail would actually change the answer.'}},{id:"tokens-summarize-chat",tier:3,topic:"tokens",correct:2,he:{q:"\u05E9\u05D9\u05D7\u05D4 \u05E0\u05E2\u05E9\u05EA\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D3\u05D9. \u05D0\u05D9\u05DA \u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05D0\u05D1\u05D3 \u05DE\u05D9\u05D3\u05E2?",a:["\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D4\u05D5\u05D3\u05E2\u05D5\u05EA \u05D9\u05E9\u05E0\u05D5\u05EA \u05D0\u05D7\u05EA \u05D0\u05D7\u05EA","\u05DE\u05EA\u05D7\u05D9\u05DC\u05D9\u05DD \u05DE\u05D7\u05D3\u05E9 \u05D1\u05DC\u05D9 \u05DB\u05DC\u05D5\u05DD \u05DE\u05D4\u05E9\u05D9\u05D7\u05D4","\u05DE\u05E1\u05DB\u05DE\u05D9\u05DD \u05D5\u05E4\u05D5\u05EA\u05D7\u05D9\u05DD \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4"],why:"\u05E1\u05D9\u05DB\u05D5\u05DD \u05E7\u05E6\u05E8 \u05E9\u05D5\u05DE\u05E8 \u05D0\u05EA \u05D4\u05D4\u05D7\u05DC\u05D8\u05D5\u05EA \u05D5\u05DE\u05D5\u05D5\u05EA\u05E8 \u05E2\u05DC \u05DB\u05DC \u05D4\u05D3\u05E8\u05DA \u05D0\u05DC\u05D9\u05D4\u05DF. \u05D6\u05D4 \u05DE\u05E0\u05E7\u05D4 \u05D0\u05EA \u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8 \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8 \u05D1\u05D5 \u05E8\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E6\u05E8\u05D9\u05DA."},en:{q:"A chat got too long. How do you continue without losing information?",a:["Delete old messages one at a time","Start over with nothing at all","Summarise and open a new chat"],why:"A short summary keeps the decisions and drops the road to them. That clears the context window and leaves only what is needed."}},{id:"tokens-code-paste",tier:3,topic:"tokens",correct:0,he:{q:"\u05DE\u05D3\u05D1\u05D9\u05E7\u05D9\u05DD \u05E7\u05D5\u05D3 \u05D0\u05E8\u05D5\u05DA \u05DC\u05EA\u05D5\u05DA \u05D4\u05E9\u05D9\u05D7\u05D4. \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4?",a:["\u05D4\u05D5\u05D0 \u05E0\u05E1\u05E4\u05E8 \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D5\u05EA\u05D5\u05E4\u05E1 \u05DE\u05E7\u05D5\u05DD \u05D1\u05D7\u05DC\u05D5\u05DF \u05D4\u05D4\u05E7\u05E9\u05E8","\u05E7\u05D5\u05D3 \u05DC\u05D0 \u05E0\u05E1\u05E4\u05E8, \u05E8\u05E7 \u05D8\u05E7\u05E1\u05D8 \u05E8\u05D2\u05D9\u05DC \u05E0\u05E1\u05E4\u05E8","\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05EA\u05E7\u05E6\u05E8\u05EA \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA \u05D1\u05D2\u05DC\u05DC \u05D4\u05E7\u05D5\u05D3"],why:"\u05DB\u05DC \u05EA\u05D5 \u05E0\u05E1\u05E4\u05E8, \u05D2\u05DD \u05E1\u05D5\u05D2\u05E8\u05D9\u05D9\u05DD \u05D5\u05E8\u05D5\u05D5\u05D7\u05D9\u05DD. \u05DC\u05DB\u05DF \u05DE\u05D3\u05D1\u05D9\u05E7\u05D9\u05DD \u05D0\u05EA \u05D4\u05E7\u05D8\u05E2 \u05E9\u05E8\u05DC\u05D5\u05D5\u05E0\u05D8\u05D9 \u05DC\u05D1\u05E2\u05D9\u05D4, \u05D5\u05DC\u05D0 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E7\u05D5\u05D1\u05E5 \u05DE\u05D4\u05D4\u05EA\u05D7\u05DC\u05D4."},en:{q:"You paste long code into the chat. What happens?",a:["It counts as tokens and takes room in the context window","Code is not counted, only ordinary text is","The answer shortens automatically because of the code"],why:"Every character counts, brackets and spaces included. So paste the part relevant to the problem, not the whole file."}},{id:"tokens-example-tradeoff",tier:3,topic:"tokens",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DC\u05D0 \u05E9\u05D5\u05D5\u05D4 \u05D0\u05EA \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05DC\u05D4?",a:["\u05DB\u05DE\u05E2\u05D8 \u05D1\u05DB\u05DC \u05DE\u05E7\u05E8\u05D4, \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05E8\u05E7 \u05DE\u05D0\u05E8\u05D9\u05DB\u05D5\u05EA \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8","\u05DB\u05E9\u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05DB\u05D1\u05E8 \u05D1\u05E8\u05D5\u05E8 \u05DC\u05D2\u05DE\u05E8\u05D9 \u05DE\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4","\u05DB\u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05E4\u05D5\u05E8\u05DE\u05D8 \u05D7\u05D3\u05E9 \u05D5\u05DC\u05D0 \u05DE\u05D5\u05DB\u05E8"],why:"\u05D3\u05D5\u05D2\u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05E9\u05E7\u05E9\u05D4 \u05DC\u05EA\u05D0\u05E8 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD. \u05DB\u05E9\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05DB\u05D1\u05E8 \u05D7\u05D3\u05BE\u05DE\u05E9\u05DE\u05E2\u05D9\u05EA, \u05D4\u05D3\u05D5\u05D2\u05DE\u05D4 \u05E8\u05E7 \u05DE\u05D0\u05E8\u05D9\u05DB\u05D4 \u05D1\u05DC\u05D9 \u05DC\u05D4\u05D5\u05E1\u05D9\u05E3."},en:{q:"When is an example in a prompt not worth its tokens?",a:["In nearly every case, examples just make the prompt longer","When the format is already completely clear from the instruction","When asking for a new, unfamiliar format"],why:"An example earns its place when words struggle. If the instruction is already unambiguous, the example only adds length."}},{id:"iterate-diagnose",tier:3,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05D7\u05D8\u05D9\u05D0\u05D4 \u05E9\u05D5\u05D1 \u05D5\u05E9\u05D5\u05D1. \u05DE\u05D4 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E7\u05D5\u05D3\u05DD?",a:["\u05D0\u05DD \u05D4\u05DE\u05D5\u05D3\u05DC \u05E2\u05DE\u05D5\u05E1 \u05D1\u05D1\u05E7\u05E9\u05D5\u05EA \u05D1\u05D0\u05D5\u05EA\u05D5 \u05E8\u05D2\u05E2","\u05D0\u05DD \u05E6\u05E8\u05D9\u05DA \u05DC\u05E2\u05D1\u05D5\u05E8 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA","\u05D0\u05DD \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D0\u05D5\u05DE\u05E8 \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D1\u05E0\u05D5"],why:"\u05DC\u05E8\u05D5\u05D1 \u05D4\u05D1\u05E2\u05D9\u05D4 \u05D4\u05D9\u05D0 \u05E9\u05D4\u05D1\u05E7\u05E9\u05D4 \u05E2\u05E6\u05DE\u05D4 \u05DE\u05E2\u05D5\u05E8\u05E4\u05DC\u05EA. \u05E7\u05E8\u05D9\u05D0\u05D4 \u05E9\u05DC \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DB\u05D0\u05D9\u05DC\u05D5 \u05DE\u05D9\u05E9\u05D4\u05D5 \u05D0\u05D7\u05E8 \u05DB\u05EA\u05D1 \u05D0\u05D5\u05EA\u05D5 \u05DE\u05D2\u05DC\u05D4 \u05D0\u05EA \u05D6\u05D4 \u05DE\u05D4\u05E8 \u05DE\u05D0\u05D5\u05D3."},en:{q:"The answer keeps missing. What do you check first?",a:["Whether the model is overloaded with requests","Whether you should switch to writing in English","Whether the prompt says what you thought"],why:"Usually the request itself is the vague part. Reading the prompt as though someone else wrote it exposes that very fast."}},{id:"iterate-keep-old",tier:2,topic:"iterate",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E9\u05DE\u05D5\u05E8 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05D9\u05E9\u05DF \u05DB\u05E9\u05DE\u05E9\u05E4\u05E8\u05D9\u05DD?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D4\u05E9\u05D5\u05D5\u05EA, \u05D5\u05DC\u05D7\u05D6\u05D5\u05E8 \u05D0\u05D7\u05D5\u05E8\u05D4 \u05D0\u05DD \u05D4\u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05E8\u05E2","\u05DB\u05D3\u05D9 \u05DC\u05D4\u05D0\u05E8\u05D9\u05DA \u05D0\u05EA \u05D4\u05E9\u05D9\u05D7\u05D4","\u05DB\u05D3\u05D9 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05D9\u05D4\u05D9\u05D4 \u05DC\u05D4\u05E8\u05D0\u05D5\u05EA \u05D0\u05D5\u05EA\u05D5 \u05DC\u05DE\u05D9\u05E9\u05D4\u05D5 \u05D0\u05D7\u05E8"],why:"\u05DC\u05D0 \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D4\u05D5\u05D0 \u05E9\u05D9\u05E4\u05D5\u05E8. \u05DB\u05E9\u05E9\u05EA\u05D9 \u05D4\u05D2\u05E8\u05E1\u05D0\u05D5\u05EA \u05E9\u05DE\u05D5\u05E8\u05D5\u05EA \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E9\u05D5\u05D5\u05EA \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D5\u05DC\u05D1\u05D7\u05D5\u05E8, \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05E9\u05D7\u05D6\u05E8 \u05DE\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF."},en:{q:"Why keep the old prompt when improving it?",a:["To compare, and to go back if the change made things worse","To make the conversation longer","So it can be shown to somebody else later"],why:"Not every change is an improvement. With both versions saved you can compare answers and choose, instead of reconstructing from memory."}},{id:"iterate-stop-point",tier:1,topic:"iterate",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05DE\u05E4\u05E1\u05D9\u05E7\u05D9\u05DD \u05DC\u05E9\u05E4\u05E8 \u05D5\u05DE\u05D2\u05D9\u05E9\u05D9\u05DD?",a:["\u05D0\u05D7\u05E8\u05D9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E2\u05E9\u05E8\u05D4 \u05E1\u05D9\u05D1\u05D5\u05D1\u05D9\u05DD","\u05DB\u05E9\u05D4\u05D9\u05D0 \u05E2\u05D5\u05E0\u05D4 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05D4\u05D2\u05D3\u05E8\u05E0\u05D5","\u05DB\u05E9\u05DB\u05D1\u05E8 \u05E0\u05D2\u05DE\u05E8 \u05D4\u05DB\u05D5\u05D7 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05E0\u05E1\u05D5\u05EA"],why:"\u05D1\u05DC\u05D9 \u05D4\u05D2\u05D3\u05E8\u05D4 \u05DE\u05E8\u05D0\u05E9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E9\u05E4\u05E8 \u05E2\u05D3 \u05D0\u05D9\u05E0\u05E1\u05D5\u05E3. \u05DE\u05D3\u05D3 \u05E4\u05E9\u05D5\u05D8 \u05E9\u05E0\u05E7\u05D1\u05E2 \u05DC\u05E4\u05E0\u05D9 \u05D4\u05D4\u05EA\u05D7\u05DC\u05D4 \u05D0\u05D5\u05DE\u05E8 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05EA\u05D9 \u05D4\u05D2\u05E2\u05E0\u05D5."},en:{q:"When do you stop improving and hand it in?",a:["After exactly ten rounds of improvement","When it meets the bar set up front","When you run out of energy to keep trying"],why:"With no definition up front you can polish forever. A simple measure set before you start says exactly when you have arrived."}},{id:"mistakes-quote",tier:1,topic:"mistakes",correct:1,he:{q:"\u05D4\u05BEAI \u05E6\u05D9\u05D8\u05D8 \u05DE\u05E9\u05E4\u05D8 \u05D1\u05E9\u05DD \u05D0\u05D3\u05DD \u05DE\u05E4\u05D5\u05E8\u05E1\u05DD. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D5, \u05E6\u05D9\u05D8\u05D5\u05D8\u05D9\u05DD \u05DB\u05D0\u05DC\u05D4 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC \u05DE\u05D3\u05D5\u05D9\u05E7\u05D9\u05DD","\u05DE\u05D7\u05E4\u05E9\u05D9\u05DD \u05D0\u05EA \u05D4\u05E6\u05D9\u05D8\u05D5\u05D8 \u05D4\u05DE\u05E7\u05D5\u05E8\u05D9","\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05DE\u05E8\u05DB\u05D0\u05D5\u05EA, \u05D5\u05D6\u05D4 \u05DE\u05E1\u05E4\u05D9\u05E7 \u05DC\u05D2\u05DE\u05E8\u05D9"],why:"\u05E6\u05D9\u05D8\u05D5\u05D8\u05D9\u05DD \u05D5\u05E9\u05DE\u05D5\u05EA \u05D4\u05DD \u05DE\u05D4\u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05DE\u05D5\u05D3\u05DC \u05DE\u05DE\u05E6\u05D9\u05D0 \u05D1\u05E7\u05DC\u05D5\u05EA, \u05DB\u05D9 \u05D4\u05DD \u05E0\u05E9\u05DE\u05E2\u05D9\u05DD \u05E0\u05DB\u05D5\u05DF. \u05D7\u05D9\u05E4\u05D5\u05E9 \u05E7\u05E6\u05E8 \u05DE\u05D5\u05D5\u05D3\u05D0 \u05E9\u05D4\u05DE\u05E9\u05E4\u05D8 \u05D1\u05D0\u05DE\u05EA \u05E0\u05D0\u05DE\u05E8."},en:{q:"The AI quoted a line by a famous person. What do you do?",a:["Use it, quotes like that are usually accurate","Look up the original quote","Add quotation marks and that is enough"],why:"Quotes and names are among the easiest things for a model to invent, because they sound right. A quick search confirms it was really said."}},{id:"mistakes-agrees-fast",tier:3,topic:"mistakes",correct:2,he:{q:"\u05D0\u05DE\u05E8\u05D5 \u05DC\u05BEAI \u05E9\u05D4\u05D5\u05D0 \u05D8\u05D5\u05E2\u05D4 \u05D5\u05D4\u05D5\u05D0 \u05DE\u05D9\u05D3 \u05D4\u05E1\u05DB\u05D9\u05DD. \u05DE\u05D4 \u05D6\u05D4 \u05D0\u05D5\u05DE\u05E8?",a:["\u05E9\u05D4\u05D5\u05D0 \u05D1\u05D0\u05DE\u05EA \u05D8\u05E2\u05D4 \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05E0\u05EA\u05DF","\u05E9\u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3 \u05EA\u05D5\u05DA \u05DB\u05D3\u05D9 \u05D4\u05E9\u05D9\u05D7\u05D4","\u05E9\u05D4\u05D5\u05D0 \u05E0\u05D5\u05D8\u05D4 \u05DC\u05D4\u05E1\u05DB\u05D9\u05DD"],why:"\u05DE\u05D5\u05D3\u05DC \u05DE\u05DB\u05D5\u05D5\u05DF \u05DC\u05D4\u05D9\u05D5\u05EA \u05E0\u05E2\u05D9\u05DD \u05D5\u05DE\u05D5\u05E2\u05D9\u05DC, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D5\u05D0 \u05DE\u05EA\u05D9\u05D9\u05E9\u05E8 \u05DC\u05E4\u05D9 \u05DE\u05D4 \u05E9\u05E0\u05D0\u05DE\u05E8 \u05DC\u05D5. \u05D4\u05E1\u05DB\u05DE\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4 \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05E8\u05D0\u05D9\u05D4 \u2014 \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05D1\u05DE\u05E7\u05D5\u05E8."},en:{q:"You told the AI it was wrong and it agreed at once. What does that mean?",a:["It really was wrong about that","It is learning during the conversation","It just tends to agree"],why:"A model is tuned to be pleasant and helpful, so it falls in line with what it is told. Quick agreement is not evidence \u2014 check the source."}},{id:"mistakes-responsibility",tier:1,topic:"mistakes",correct:0,he:{q:"\u05DE\u05D9 \u05D0\u05D7\u05E8\u05D0\u05D9 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05DE\u05E4\u05E8\u05E1\u05DE\u05D9\u05DD \u05D1\u05E2\u05D6\u05E8\u05EA AI?",a:["\u05DE\u05D9 \u05E9\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05DB\u05DC\u05D9 \u05D5\u05D1\u05D7\u05E8 \u05DC\u05E4\u05E8\u05E1\u05DD","\u05D7\u05D1\u05E8\u05EA \u05D4\u05BEAI \u05D1\u05DC\u05D1\u05D3","\u05D0\u05E3 \u05D0\u05D7\u05D3, \u05D6\u05D4 \u05E0\u05DB\u05EA\u05D1 \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA"],why:"\u05D4\u05DB\u05DC\u05D9 \u05DE\u05E6\u05D9\u05E2, \u05D5\u05D0\u05E0\u05D7\u05E0\u05D5 \u05DC\u05D5\u05D7\u05E6\u05D9\u05DD \u05E2\u05DC \u05E9\u05DC\u05D7. \u05D0\u05DD \u05D9\u05E9 \u05D1\u05E4\u05E0\u05D9\u05DD \u05D8\u05E2\u05D5\u05EA, \u05D4\u05D9\u05D0 \u05DB\u05D1\u05E8 \u05E9\u05DC\u05E0\u05D5 \u2014 \u05D0\u05D6 \u05E7\u05D5\u05E8\u05D0\u05D9\u05DD \u05D5\u05DE\u05EA\u05E7\u05E0\u05D9\u05DD \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D6\u05D4 \u05D9\u05D5\u05E6\u05D0."},en:{q:"Who is responsible for what gets published with AI's help?",a:["Whoever used the tool and chose to publish","The AI company alone","Nobody \u2014 it was written automatically"],why:"The tool suggests; you press send. If there is a mistake inside, it is yours now \u2014 so read it and fix it before it goes out."}},{id:"vibe-learn-from-code",tier:3,topic:"vibe",correct:1,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D0\u05DE\u05EA \u05DC\u05D5\u05DE\u05D3\u05D9\u05DD \u05DE\u05D4\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1?",a:["\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05DB\u05DE\u05D4 \u05E4\u05E2\u05DE\u05D9\u05DD \u05D1\u05E8\u05E6\u05E3","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D4\u05E1\u05D1\u05E8 \u05D5\u05DE\u05E0\u05E1\u05D9\u05DD \u05DC\u05E9\u05E0\u05D5\u05EA","\u05E9\u05D5\u05DE\u05E8\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05D1\u05E6\u05D3 \u05D1\u05DC\u05D9 \u05DC\u05E4\u05EA\u05D5\u05D7"],why:"\u05E9\u05D9\u05E0\u05D5\u05D9 \u05E7\u05D8\u05DF \u05E9\u05E2\u05D5\u05E9\u05D9\u05DD \u05DC\u05D1\u05D3 \u05DE\u05DC\u05DE\u05D3 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05DB\u05DC \u05D4\u05E1\u05D1\u05E8. \u05D0\u05DD \u05DE\u05E9\u05D4\u05D5 \u05E0\u05E9\u05D1\u05E8 \u2014 \u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05E8\u05D2\u05E2 \u05E9\u05D1\u05D5 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05D0\u05D9\u05DA \u05D6\u05D4 \u05E2\u05D5\u05D1\u05D3."},en:{q:"How do you actually learn from the code the AI wrote?",a:["Run it several times in a row and watch","Ask, then change something yourself","File it away somewhere without opening it"],why:"One small change you make yourself teaches more than any explanation. If something breaks, that is the moment you understand how it works."}},{id:"vibe-say-what-happens",tier:1,topic:"vibe",correct:2,he:{q:"\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05BEAI \u05DC\u05D1\u05E0\u05D5\u05EA \u05DE\u05E9\u05D7\u05E7. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D7\u05E9\u05D5\u05D1 \u05DC\u05D4\u05D2\u05D9\u05D3 \u05DC\u05D5?",a:["\u05E9\u05D4\u05DE\u05E9\u05D7\u05E7 \u05E6\u05E8\u05D9\u05DA \u05DC\u05E6\u05D0\u05EA \u05D4\u05DB\u05D9 \u05D8\u05D5\u05D1 \u05E9\u05D9\u05E9","\u05D1\u05E2\u05E8\u05DA \u05DB\u05DE\u05D4 \u05E9\u05D5\u05E8\u05D5\u05EA \u05E7\u05D5\u05D3 \u05DC\u05DB\u05EA\u05D5\u05D1, \u05D5\u05DB\u05DE\u05D4 \u05E7\u05D1\u05E6\u05D9\u05DD \u05E9\u05D9\u05D4\u05D9\u05D5","\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05D1\u05DE\u05E9\u05D7\u05E7: \u05DE\u05D9 \u05D6\u05D6, \u05DE\u05D9 \u05DE\u05E0\u05E6\u05D7, \u05D5\u05DE\u05D4 \u05E8\u05D5\u05D0\u05D9\u05DD \u05E2\u05DC \u05D4\u05DE\u05E1\u05DA"],why:'\u05EA\u05D5\u05DB\u05E0\u05D4 \u05D4\u05D9\u05D0 \u05D1\u05E1\u05DA \u05D4\u05DB\u05D5\u05DC \u05E8\u05E6\u05E3 \u05E9\u05DC "\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05E9\u2026". \u05DE\u05D9 \u05E9\u05DE\u05EA\u05D0\u05E8 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05E4\u05E9\u05D5\u05D8\u05D5\u05EA \u05DB\u05D1\u05E8 \u05E2\u05E9\u05D4 \u05D0\u05EA \u05D4\u05D7\u05DC\u05E7 \u05D4\u05E7\u05E9\u05D4.'},en:{q:"You ask an AI to build a game. What matters most to tell it?",a:["That the game must be as good as real games","Roughly how many lines of code to write","What happens in the game: who moves, who wins, what you see"],why:'Software is really just a stack of "what happens when\u2026". Describing that in plain words is already the hard part done.'}},{id:"vibe-run-it",tier:1,topic:"vibe",correct:0,he:{q:"\u05D4\u05BEAI \u05DB\u05EA\u05D1 \u05E7\u05D5\u05D3. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD \u05D0\u05D9\u05EA\u05D5 \u05E8\u05D0\u05E9\u05D5\u05DF?",a:["\u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05D5\u05E8\u05D5\u05D0\u05D9\u05DD \u05DE\u05D4 \u05D1\u05D0\u05DE\u05EA \u05E7\u05D5\u05E8\u05D4","\u05E7\u05D5\u05E8\u05D0\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05DC\u05D0\u05D8 \u05D5\u05DE\u05D7\u05E4\u05E9\u05D9\u05DD \u05E9\u05D5\u05E8\u05D5\u05EA \u05E9\u05E0\u05E8\u05D0\u05D5\u05EA \u05DE\u05D5\u05D6\u05E8\u05D5\u05EA","\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05D9\u05D3 \u05D0\u05EA \u05D4\u05D7\u05DC\u05E7 \u05D4\u05D1\u05D0, \u05DB\u05D3\u05D9 \u05DC\u05D0 \u05DC\u05D0\u05D1\u05D3 \u05D0\u05EA \u05D4\u05E7\u05E6\u05D1"],why:"\u05D2\u05DD \u05E7\u05D5\u05D3 \u05E9\u05E0\u05E8\u05D0\u05D4 \u05DE\u05E6\u05D5\u05D9\u05DF \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05EA\u05E4\u05D5\u05E6\u05E5 \u05D1\u05E9\u05E0\u05D9\u05D9\u05D4 \u05D4\u05E8 derstand a line in the code the AI wrote. What now?",a:["Move on, because in the end what matters is that it works","Ask for a simple explanation of that exact line","Delete the line and check whether anything actually changed"],why:"Asking for an explanation costs nothing, and it is exactly where the learning happens. Code you understand you can fix yourself next time."}},{id:"prompt-grounding",tier:2,topic:"prompt",correct:2,he:{q:"\u05E8\u05D5\u05E6\u05D9\u05DD \u05E9\u05D0\u05DC\u05D5\u05EA \u05D7\u05D6\u05E8\u05D4 \u05E2\u05DC \u05E1\u05D9\u05E4\u05D5\u05E8 \u05E9\u05E7\u05E8\u05D0\u05E0\u05D5 \u05D1\u05DB\u05D9\u05EA\u05D4. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05E2\u05D5\u05D6\u05E8?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05E9\u05DD \u05D4\u05E1\u05D9\u05E4\u05D5\u05E8 \u05D5\u05D0\u05EA \u05E9\u05DD \u05D4\u05E1\u05D5\u05E4\u05E8, \u05D5\u05DC\u05E1\u05DE\u05D5\u05DA \u05E2\u05DC \u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05E9\u05DC\u05D5","\u05DC\u05D1\u05E7\u05E9 \u05DE\u05DE\u05E0\u05D5 \u05DC\u05E0\u05D7\u05E9 \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05D1\u05E1\u05D9\u05E4\u05D5\u05E8 \u05DC\u05E4\u05D9 \u05D4\u05E9\u05DD \u05E9\u05DC\u05D5","\u05DC\u05D4\u05D3\u05D1\u05D9\u05E7 \u05D0\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05E2\u05E6\u05DE\u05D5, \u05D2\u05DD \u05D0\u05DD \u05D6\u05D4 \u05E2\u05D5\u05DC\u05D4 \u05E2\u05D5\u05D3 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05DB\u05E9\u05D4\u05D8\u05E7\u05E1\u05D8 \u05DE\u05D5\u05DC \u05D4\u05E2\u05D9\u05E0\u05D9\u05D9\u05DD \u05E9\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4 \u05E2\u05DC\u05D9\u05D5, \u05D5\u05DC\u05D0 \u05E2\u05DC \u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05DE\u05D8\u05D5\u05E9\u05D8\u05E9 \u05DE\u05DE\u05E0\u05D5. \u05D6\u05D4 \u05D4\u05D4\u05D1\u05D3\u05DC \u05D1\u05D9\u05DF \u05DC\u05E6\u05D8\u05D8 \u05DC\u05D1\u05D9\u05DF \u05DC\u05E0\u05D7\u05E9."},en:{q:"You want revision questions on a story read in class. What helps most?",a:["Give the title and the author, and rely on its memory","Ask it to guess what happens in the story from the title","Paste the text itself, even though that costs extra tokens"],why:"With the text in front of it, the model answers about the text and not about a hazy memory of it. That is the gap between quoting and guessing."}},{id:"prompt-standing-rules",tier:2,topic:"prompt",correct:0,he:{q:"\u05DE\u05D4 \u05D4\u05D4\u05D1\u05D3\u05DC \u05D1\u05D9\u05DF \u05DB\u05DC\u05DC \u05E7\u05D1\u05D5\u05E2 \u05DC\u05E9\u05D9\u05D7\u05D4 \u05DC\u05D1\u05D9\u05DF \u05D1\u05E7\u05E9\u05D4 \u05D7\u05D3\u05BE\u05E4\u05E2\u05DE\u05D9\u05EA?",a:["\u05DB\u05DC\u05DC \u05E7\u05D1\u05D5\u05E2 \u05E0\u05DB\u05EA\u05D1 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA \u05D5\u05EA\u05E7\u05E3 \u05DC\u05D4\u05DE\u05E9\u05DA \u05D4\u05E9\u05D9\u05D7\u05D4","\u05D0\u05D9\u05DF \u05D4\u05D1\u05D3\u05DC \u05D0\u05DE\u05D9\u05EA\u05D9, \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05EA\u05D9\u05D9\u05D7\u05E1 \u05DC\u05E9\u05E0\u05D9\u05D4\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8","\u05DB\u05DC\u05DC \u05E7\u05D1\u05D5\u05E2 \u05E2\u05D5\u05D1\u05D3 \u05E8\u05E7 \u05D0\u05DD \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05D1\u05D4\u05D5\u05D3\u05E2\u05D4 \u05D4\u05E8\u05D0\u05E9\u05D5\u05E0\u05D4 \u05D1\u05E9\u05D9\u05D7\u05D4"],why:'"\u05DE\u05E2\u05DB\u05E9\u05D9\u05D5 \u05DC\u05E2\u05E0\u05D5\u05EA \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05D5\u05D1\u05E7\u05E6\u05E8\u05D4" \u05D7\u05D5\u05E1\u05DA \u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05D6\u05D4 \u05DB\u05DC \u05E4\u05E2\u05DD. \u05D1\u05E9\u05D9\u05D7\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D4\u05D6\u05DB\u05D9\u05E8 \u05D0\u05EA \u05D4\u05DB\u05DC\u05DC \u05E9\u05D5\u05D1 \u05DE\u05D3\u05D9 \u05E4\u05E2\u05DD.'},en:{q:"What is the difference between a standing rule and a one-off request?",a:["Written once, it holds for the rest of the chat","No real difference, the model treats both of them the same way","A standing rule only works if it is the first message in the chat"],why:'"From now on, answer in Hebrew and keep it short" saves repeating yourself. In a long chat it is worth restating the rule now and then.'}},{id:"iterate-self-critique",tier:2,topic:"iterate",correct:1,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05D5\u05DB\u05E0\u05D4. \u05DE\u05D4 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05E7\u05E9 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD \u05D1\u05D4?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D4 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05D5\u05D1, \u05D4\u05E4\u05E2\u05DD \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05D0\u05D7\u05E8\u05D5\u05EA \u05DC\u05D2\u05DE\u05E8\u05D9","\u05DC\u05E2\u05D1\u05D5\u05E8 \u05E2\u05DC\u05D9\u05D4, \u05DC\u05E1\u05DE\u05DF \u05E9\u05EA\u05D9 \u05D7\u05D5\u05DC\u05E9\u05D5\u05EA \u05D5\u05DC\u05D4\u05E6\u05D9\u05E2 \u05E9\u05D9\u05E4\u05D5\u05E8 \u05D0\u05D7\u05D3","\u05DC\u05D4\u05D5\u05E1\u05D9\u05E3 \u05E2\u05D5\u05D3 \u05E4\u05E1\u05E7\u05D4 \u05D1\u05E1\u05D5\u05E3, \u05DB\u05D3\u05D9 \u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05EA\u05E8\u05D2\u05D9\u05E9 \u05E9\u05DC\u05DE\u05D4"],why:"\u05E7\u05DC \u05D9\u05D5\u05EA\u05E8 \u05DC\u05DE\u05E6\u05D5\u05D0 \u05D1\u05E2\u05D9\u05D5\u05EA \u05D1\u05D8\u05E7\u05E1\u05D8 \u05DE\u05D5\u05DB\u05DF \u05DE\u05D0\u05E9\u05E8 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05D5\u05EA\u05D5 \u05E0\u05DB\u05D5\u05DF \u05DE\u05D4\u05EA\u05D7\u05DC\u05D4, \u05D5\u05D6\u05D4 \u05E0\u05DB\u05D5\u05DF \u05D2\u05DD \u05DC\u05DE\u05D5\u05D3\u05DC. \u05D0\u05EA \u05D4\u05EA\u05D9\u05E7\u05D5\u05E0\u05D9\u05DD \u05E2\u05D3\u05D9\u05D9\u05DF \u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05D1\u05E2\u05E6\u05DE\u05E0\u05D5."},en:{q:"The answer is ready. What can you ask for before using it?",a:["To write the same answer again, this time in completely different words","To go over it, name two weak spots and suggest one fix","To add another paragraph at the end so it feels complete"],why:"Finding problems in finished text is easier than getting it right first time \u2014 true for the model too. You still choose which fixes to take."}},{id:"prompt-only-from-text",tier:3,topic:"prompt",correct:2,he:{q:"\u05E6\u05D9\u05E8\u05E4\u05E0\u05D5 \u05DE\u05D0\u05DE\u05E8 \u05D5\u05E8\u05D5\u05E6\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DE\u05D1\u05D5\u05E1\u05E1\u05EA \u05E8\u05E7 \u05E2\u05DC\u05D9\u05D5. \u05DE\u05D4 \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD?",a:['"\u05DC\u05E2\u05E0\u05D5\u05EA \u05D1\u05E6\u05D5\u05E8\u05D4 \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA \u05D5\u05D0\u05DE\u05D9\u05E0\u05D4, \u05D1\u05DC\u05D9 \u05DC\u05D4\u05DE\u05E6\u05D9\u05D0 \u05E9\u05D5\u05DD \u05D3\u05D1\u05E8"','"\u05DC\u05E7\u05E8\u05D5\u05D0 \u05D0\u05EA \u05D4\u05DE\u05D0\u05DE\u05E8 \u05D4\u05DE\u05E6\u05D5\u05E8\u05E3 \u05D4\u05D9\u05D8\u05D1 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05E2\u05D5\u05E0\u05D9\u05DD \u05E2\u05DC \u05D4\u05E9\u05D0\u05DC\u05D4"','"\u05DC\u05E2\u05E0\u05D5\u05EA \u05E8\u05E7 \u05DC\u05E4\u05D9 \u05D4\u05DE\u05D0\u05DE\u05E8, \u05D5\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DC\u05D0 \u05E0\u05DE\u05E6\u05D0\u05EA \u05D1\u05D5"'],why:'\u05D4\u05D4\u05D5\u05E8\u05D0\u05D4 \u05D4\u05D6\u05D0\u05EA \u05E0\u05D5\u05EA\u05E0\u05EA \u05DC\u05DE\u05D5\u05D3\u05DC \u05D3\u05E8\u05DA \u05DC\u05D5\u05DE\u05E8 "\u05D0\u05D9\u05DF \u05DC\u05D9", \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05E9\u05DC\u05D9\u05DD \u05DE\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF. \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05D6\u05D0\u05EA \u05D2\u05DD \u05E7\u05DC \u05DC\u05D1\u05D3\u05D5\u05E7 \u05DE\u05D5\u05DC \u05D4\u05D8\u05E7\u05E1\u05D8.'},en:{q:"You attached an article and want an answer based only on it. What do you write?",a:['"Answer accurately and reliably, without inventing anything"','"Read the attached article carefully before answering the question"','"Answer only from the article, and say so if the answer is not in it"'],why:'That instruction gives the model a way to say "I do not have it" instead of filling in from memory. It also makes the answer easy to check against the text.'}},{id:"prompt-too-many-details",tier:3,topic:"prompt",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D3\u05D9 \u05E4\u05E8\u05D8\u05D9\u05DD \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05D6\u05D9\u05E7\u05D9\u05DD?",a:["\u05DB\u05E9\u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E0\u05E2\u05E9\u05D4 \u05D0\u05E8\u05D5\u05DA \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DE\u05DE\u05E0\u05D5","\u05DB\u05E9\u05D4\u05DD \u05E1\u05D5\u05EA\u05E8\u05D9\u05DD \u05D6\u05D4 \u05D0\u05EA \u05D6\u05D4","\u05DB\u05E9\u05D4\u05DD \u05DB\u05EA\u05D5\u05D1\u05D9\u05DD \u05D1\u05E9\u05E4\u05D4 \u05E4\u05E9\u05D5\u05D8\u05D4 \u05DE\u05D3\u05D9 \u05D1\u05E9\u05D1\u05D9\u05DC \u05DE\u05D5\u05D3\u05DC \u05D7\u05DB\u05DD"],why:'\u05E9\u05E0\u05D9 \u05E4\u05E8\u05D8\u05D9\u05DD \u05E9\u05DC\u05D0 \u05DE\u05E1\u05EA\u05D3\u05E8\u05D9\u05DD \u05D9\u05D7\u05D3 \u2014 "\u05E7\u05E6\u05E8 \u05DE\u05D0\u05D5\u05D3" \u05D5"\u05E2\u05DD \u05E9\u05DC\u05D5\u05E9 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA" \u2014 \u05DE\u05DB\u05E8\u05D9\u05D7\u05D9\u05DD \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D5\u05D5\u05EA\u05E8 \u05E2\u05DC \u05D0\u05D7\u05D3, \u05D5\u05D4\u05D5\u05D0 \u05DC\u05D0 \u05D1\u05D4\u05DB\u05E8\u05D7 \u05D9\u05D1\u05D7\u05E8 \u05DB\u05DE\u05D5\u05E0\u05D5.'},en:{q:"When do too many details in a prompt actually hurt?",a:["When the prompt ends up longer than the answer you asked for","When they contradict each other","When they are written too simply for a clever model"],why:'Two details that cannot both hold \u2014 "very short" and "with three examples" \u2014 force the model to drop one, and it may not drop the on .quiz-root{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:clamp(8px,2vh,24px) clamp(8px,3vw,32px);opacity:0;visibility:hidden;
  transition:opacity .22s var(--ease),visibility .22s}
.quiz-root.show{opacity:1;visibility:visible}
.quiz-scrim{position:absolute;inset:0;
  background:radial-gradient(120% 92% at 50% 48%,rgba(6,8,20,.28),rgba(3,5,14,.74))}

.quiz-card{position:relative;width:min(720px,94vw);max-height:96vh;overflow:hidden;
  padding:clamp(12px,2.1vh,24px) clamp(14px,2.2vw,28px) clamp(12px,2vh,22px);
  display:flex;flex-direction:column;gap:clamp(7px,1.2vh,14px)}

.quiz-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.quiz-badge{font-size:12px;font-weight:900;letter-spacing:.06em;color:#2a1c00;
  padding:4px 12px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 60%,var(--gold-3))}

  padding:4px 11px;border-radius:var(--r-pill);

.quiz-timer.low>i{background:linear-gradient(90deg,#e07a2a,var(--warn))}

  color:var(--txt);text-shadow:0 2px 0 rgba(0,0,0,.45);margin:clamp(1px,.5vh,6px) 0}

.quiz-opts{display:flex;flex-direction:column;gap:clamp(6px,1vh,11px)}
/* A finger, not just a key. min-block-size is a logical property, so the row
   grows in the block direction in both RTL and LTR; 48px is the smallest target
   a child's fingertip lands on reliably, and the row is full-width so the whole
   strip \u2014 number chip included \u2014 is the button. touch-action:manipulation
   removes the double-tap-to-zoom wait, which is what makes a tap feel like a
   click rather than like a delay. */
.quiz-opt{display:flex;align-items:center;gap:clamp(9px,1.4vw,15px);width:100%;
  font-family:var(--font);text-align:start;cursor:pointer;
  min-block-size:clamp(48px,6.2vh,62px);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  padding:clamp(7px,1.15vh,13px) clamp(9px,1.1vw,15px);
  border-radius:var(--r-m);color:var(--txt);
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1px solid var(--stroke-hi);
  transition:transform .12s var(--ease),background .15s,border-color .15s,filter .15s}
/* Hover only where hovering exists. On a touch screen :hover sticks to the
   last thing tapped, so the option a child answered with would stay lit under
   the feedback colours. */
@media (hover:hover){
  .quiz-opt:hover{background:rgba(255,255,255,.15);transform:translateY(-1px);
    border-color:rgba(255,255,255,.38)}
  .quiz-opt:hover .quiz-key{background:rgba(255,255,255,.20)}
}
/* The press itself, for mouse AND touch \u2014 the only feedback a tap ever gets. */
.quiz-opt:active:not(:disabled){transform:translateY(1px);
  background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
.quiz-opt:focus-visible{outline:3px solid var(--info);outline-offset:3px}
.quiz-key{flex:none;display:flex;align-items:center;justify-content:center;
  inline-size:clamp(26px,3.2vh,34px);block-size:clamp(26px,3.2vh,34px);
  border-radius:10px;font-size:clamp(13px,1.9vh,17px);
  background:rgba(255,255,255,.10);border:1px solid var(--stroke-hi);color:var(--txt)}
.quiz-txt{font-size:clamp(14px,min(1.62vw,2.35vh),20px);font-weight:700;line-height:1.28}

.quiz-opt.ok{background:linear-gradient(180deg,rgba(126,224,129,.30),rgba(126,224,129,.14));
  border-color:rgba(126,224,129,.72)}
.quiz-opt.ok .quiz-key{background:rgba(126,224,129,.30);border-color:rgba(126,224,129,.6)}
.quiz-opt.no{background:linear-gradient(180deg,rgba(255,107,107,.22),rgba(255,107,107,.10));
  border-color:rgba(255,107,107,.55)}
.quiz-opt.dim{filter:saturate(.35) brightness(.72)}
.quiz-answered .quiz-opt{cursor:default;transform:none}
.quiz-answered .quiz-timer{opacity:.25}
.quiz-answered .quiz-opt:hover{transform:none}

.quiz-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-block-size:16px}
.quiz-hint{font-size:12px;font-weight:800;color:var(--txt-dim);letter-spacing:.02em}
/* "you are still holding Space" \u2014 the one line that unsticks a keyboard-only
   player who was drifting when the beacon fired. */
.quiz-hint.held{color:var(--gold-1)}
/* Only offered once the feedback is up \u2014 while the question is live there is
   nothing to continue to. Sized as a real touch target: this is the only way
   out of the panel for a player with no keyboard at all. */
.quiz-cont{display:none;padding:10px 22px;font-size:clamp(13px,1.8vh,16px);
  min-block-size:clamp(44px,5.6vh,54px);align-items:center;justify-content:center;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.quiz-answered .quiz-cont{display:inline-flex}

.quiz-result{display:none;flex-direction:column;gap:clamp(4px,.8vh,9px);
  padding:clamp(9px,1.3vh,15px) clamp(11px,1.3vw,17px);border-radius:var(--r-m);
  background:rgba(255,255,255,.055);border:1px solid var(--stroke)}
.quiz-answered .quiz-result{display:flex}
.quiz-verdict{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  font-size:clamp(16px,min(2vw,2.8vh),24px);font-weight:900;line-height:1.15}
.quiz-result.good{background:rgba(126,224,129,.10);border-color:rgba(126,224,129,.34)}
.quiz-result.good .quiz-verdict{color:var(--good)}
.quiz-result.soft .quiz-verdict{color:var(--gold-1)}
.quiz-sub{font-size:clamp(12px,min(1.35vw,1.95vh),16px);font-weight:800;color:var(--txt-dim)}
.quiz-why{font-size:clamp(13px,min(1.42vw,2.05vh),17px);font-weight:600;line-height:1.42;
  color:var(--txt)}
.quiz-warm{font-size:clamp(13px,min(1.42vw,2.05vh),17px);font-weight:800;color:var(--gold-1);
  line-height:1.35}

.quiz-good .quiz-card{box-shadow:var(--sh-pop),0 0 0 2px rgba(126,224,129,.5),
  0 0 70px rgba(126,224,129,.30)}

.quiz-flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(60% 46% at 50% 50%,rgba(255,214,107,.34),transparent 72%)}
.quiz-flash.on{animation:quizFlash .55s var(--ease) both}
@keyframes quizFlash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.quiz-flash.on{animation:none}}

/* \u2500\u2500 the one-time "what is a question box" explainer \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   Same shape as the garage's first-token popup so a child reads a familiar
   card, but in the BEACON's palette (cyan/violet with three satellites) rather
   than the token's gold, because the two must never be confused \u2014 the whole
   point of the beacon art is that it is not a coin. */
.qzint-scrim{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px;background:rgba(6,8,20,.62);backdrop-filter:blur(2px);font-family:var(--font)}
.qzint-card{width:min(540px,92%);padding:22px 26px 20px;display:flex;flex-direction:column;gap:11px;
  border-radius:var(--r-l);border:1px solid rgba(111,195,255,.36);
  background:linear-gradient(180deg,rgba(28,40,64,.96),rgba(15,18,30,.97));
  box-shadow:var(--sh-pop),0 0 60px rgba(111,195,255,.22)}
.qzint-top{display:flex;align-items:center;gap:13px}
.qzint-orb{position:relative;inline-size:46px;block-size:46px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#eaffff,#9ee6ff 42%,#2f9dff);
  box-shadow:0 0 26px rgba(95,208,255,.6),0 1px 0 rgba(255,255,255,.6) inset}
.qzint-orb i{position:absolute;inline-size:9px;block-size:9px;border-radius:50%;
  inset-block-start:50%;inset-inline-start:50%;margin:-4.5px}
.qzint-orb i:nth-child(1){background:var(--gold-1);translate:0 -26px}
.qzint-orb i:nth-child(2){background:#6fe8ff;translate:22px 13px}
.qzint-orb i:nth-child(3){background:#c9a6ff;translate:-22px 13px}
.qzint-kicker{font-size:11px;font-weight:900;letter-spacing:.04em;color:var(--info)}
.qzint-title{font-size:26px;line-height:1.05}
.qzint-p{font-size:15.5px;font-weight:700;line-height:1.5;color:#eaeef6}
.qzint-p b{color:var(--info);font-weight:900}
.qzint-actions{display:flex;justify-content:flex-end;margin-top:3px}
.qzint-actions .btn{min-block-size:clamp(44px,5.6vh,54px);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
