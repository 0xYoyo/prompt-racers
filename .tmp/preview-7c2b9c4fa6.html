:root{
  --gold:#ffc247;
  --gold-1:#ffe9a8; --gold-2:#ffc247; --gold-3:#f59310;
  --ink:#12121c; --ink-2:#1c1c2b;
  --panel:rgba(22,22,34,.82); --panel-solid:#191926;
  --stroke:rgba(255,255,255,.10); --stroke-hi:rgba(255,255,255,.22);
  --txt:#f4f1ea; --txt-dim:#a8a29a;
  --good:#7ee081; --warn:#ffb347; --bad:#ff6b6b; --info:#6fc3ff;
  --token:#ffd66b;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-panel:0 10px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  --sh-pop:0 18px 50px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
#ui{font-family:var(--font);color:var(--txt);}
#ui *{pointer-events:none}
#ui .on{pointer-events:auto}

/* ---- layout helpers that flip correctly under RTL ---- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.fill{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}

/* Logical properties everywhere so a single rule serves both directions. */
.hud-tl{position:absolute;inset-block-start:18px;inset-inline-start:18px}
.hud-tr{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.hud-bl{position:absolute;inset-block-end:18px;inset-inline-start:18px}
.hud-br{position:absolute;inset-block-end:18px;inset-inline-end:18px}
/* Centred by auto margins between two insets, NOT by translateX(-50%) \u2014 see the
   popIn note below: transform is animation territory and a persisting keyframe
   would delete the centring half of the rule. */
.hud-tc{position:absolute;inset-block-start:14px;inset-inline:0;margin-inline:auto;
  inline-size:fit-content;max-inline-size:100%}

/* ---- surfaces ---- */
.panel{
  background:linear-gradient(180deg,rgba(40,40,58,.9),rgba(18,18,28,.92));
  border:1px solid var(--stroke); border-radius:var(--r-m);
  box-shadow:var(--sh-panel); backdrop-filter:blur(8px);
}
.panel-lift{background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(24,24,36,.96));
  border:1px solid var(--stroke-hi); border-radius:var(--r-l); box-shadow:var(--sh-pop)}

/* ---- type ---- */
.display{
  font-weight:900; letter-spacing:-.02em; line-height:.92;
  background:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.5));
  paint-order:stroke fill;
}
.display-white{background:linear-gradient(180deg,#fff 20%,#e8e2d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.rtl .label{letter-spacing:.04em}     /* Hebrew has no case; wide tracking hurts it */
.num{font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate}

/* ---- buttons ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:17px;color:#2a1c00;
  padding:14px 34px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 0 #a4620a, 0 12px 26px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4620a,0 6px 14px rgba(0,0,0,.45)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--stroke-hi);box-shadow:none;font-weight:700}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:3px solid var(--info);outline-offset:3px}

/* ---- misc ---- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1));transition:width .45s var(--ease)}
.rtl .bar>i{background:linear-gradient(270deg,var(--gold-2),var(--gold-1))}

.fade-in{animation:fadeIn .35s var(--ease) both}
.pop-in{animation:popIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* popIn animates the INDIVIDUAL transform properties (scale/translate), never
   the transform shorthand.
   It used to end on to{transform:none} and is applied with both, so its final
   frame PERSISTED as transform:none and won every cascade fight for the rest of
   the element's life. Anything that also used transform on a .pop-in element
   lost silently: the podium's .mn-side (translateY(-50%)) and .mn-bottom
   (translateX(-50%)) were never pulled back, so the standings panel hung from the
   vertical centre downwards and the button row started at the horizontal centre \u2014
   in English they printed on top of each other. .btn:hover/:active lifts and
   .mn-card.sel's selected-card lift were dead for the same reason, invisibly.
   scale/translate compose with transform instead of replacing it, so the
   only remaining rule is: DO NOT centre anything with translate: on an element
   that can also pop in \u2014 centre with auto margins between two insets, as
   .hud-tc above and .mn-side/.mn-bottom in menus.js now do. */
@keyframes popIn{from{opacity:0;scale:.9;translate:0 10px}to{opacity:1;scale:1;translate:0 0}}

@media (prefers-reduced-motion:reduce){
  .fade-in,.pop-in{animation:none}
  *{transition-duration:.01ms !important}

ith a little randomness. That is what gives variety \u2014 and exactly why retrying is worth it."}},{id:"ai-context-window",tier:1,topic:"whatai",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D7\u05DC\u05D5\u05DF \u05D4\u05E7\u05E9\u05E8" \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC?',a:["\u05D4\u05D7\u05DC\u05D5\u05DF \u05E9\u05D1\u05D5 \u05DE\u05E7\u05DC\u05D9\u05D3\u05D9\u05DD \u05D0\u05EA \u05D4\u05E9\u05D0\u05DC\u05D4","\u05DB\u05DE\u05D5\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D7\u05D6\u05D9\u05E7 \u05DE\u05D5\u05DC \u05D4\u05E2\u05D9\u05E0\u05D9\u05D9\u05DD \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA","\u05DE\u05E1\u05E4\u05E8 \u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05E9\u05DE\u05D5\u05EA\u05E8 \u05DC\u05E9\u05D0\u05D5\u05DC \u05D1\u05D9\u05D5\u05DD"],why:"\u05DC\u05DE\u05D5\u05D3\u05DC \u05D9\u05E9 \u05D2\u05D1\u05D5\u05DC \u05DC\u05DB\u05DE\u05D5\u05EA \u05D4\u05D8\u05E7\u05E1\u05D8 \u05E9\u05D4\u05D5\u05D0 \u05DE\u05D7\u05D6\u05D9\u05E7 \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA. \u05DB\u05E9\u05E9\u05D9\u05D7\u05D4 \u05E0\u05E2\u05E9\u05D9\u05EA \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D0\u05D5\u05D3, \u05D4\u05D3\u05D1\u05E8\u05D9\u05DD \u05D4\u05D9\u05E9\u05E0\u05D9\u05DD \u05E0\u05D3\u05D7\u05E7\u05D9\u05DD \u05D4\u05D7\u05D5\u05E6\u05D4 \u2014 \u05D5\u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D7\u05D6\u05D5\u05E8 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D5\u05D1."},en:{q:`What is a model's "context window"?`,a:["The box where you type your question","How much text the model can hold in view at once","How many questions you are allowed per day"],why:"A model can only hold so much text at once. In a very long chat the older parts get pushed out \u2014 so it pays to restate what matters."}},{id:"prompt-what-is",tier:1,topic:"prompt",correct:2,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?",a:["\u05D4\u05E9\u05DD \u05E9\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \ logist talks animals."}},{id:"prompt-break-steps",tier:3,topic:"prompt",correct:1,he:{q:"\u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D2\u05D3\u05D5\u05DC \u05D5\u05DE\u05D5\u05E8\u05DB\u05D1, \u05DE\u05D4 \u05E2\u05D5\u05D6\u05E8 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05DB\u05D5\u05DC \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D0\u05D7\u05D3 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3","\u05DC\u05E4\u05E8\u05E7 \u05DC\u05E9\u05DC\u05D1\u05D9\u05DD \u05D5\u05DC\u05D4\u05D2\u05D9\u05D3 \u05DE\u05D4 \u05D7\u05E9\u05D5\u05D1 \u05D1\u05DB\u05DC \u05E9\u05DC\u05D1","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05DB\u05DE\u05D4 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8\u05D9\u05DD \u05E7\u05E6\u05E8\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E7\u05E9\u05E8 \u05D1\u05D9\u05E0\u05D9\u05D4\u05DD"],why:"\u05DE\u05E9\u05D9\u05DE\u05D4 \u05D2\u05D3\u05D5\u05DC\u05D4 \u05D1\u05D4\u05D5\u05D3\u05E2\u05D4 \u05D0\u05D7\u05EA \u05DE\u05D6\u05DE\u05D9\u05E0\u05D4 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DE\u05D7\u05DE\u05D9\u05E6\u05D4 \u05D7\u05DC\u05E7\u05D9\u05DD. \u05E9\u05DC\u05D1\u05D9\u05DD \u05DE\u05E1\u05D5\u05D3\u05E8\u05D9\u05DD \u05E0\u05D5\u05EA\u05E0\u05D9\u05DD \u05DC\u05DE\u05D5\u05D3\u05DC \u2014 \u05D5\u05DC\u05E0\u05D5 \u2014 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05DB\u05DC \u05D7\u05DC\u05E7 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD."},en:{q:"For one big, complicated prompt, what usually helps?",a:["Writing it all in one very long sentence","Breaking it into steps and saying what matters in each","Sending several short prompts with no connection between them"],why:"A big task in one message invites an answer that misses parts. Ordered steps let the model \u2014 and you \u2014 check each piece before moving on."}},{id:"tokens-what-is",tier:1,topic:"tokens",correct:1,he:{q:"\u05DE\u05D4 \u05D6\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05DE\u05D8\u05D1\u05E2\u05D5\u05EA \u05E9\u05D0\u05D5 5D5\u05E8\u05E9 \u05E2\u05D1\u05D5\u05D3\u05D4"],why:"\u05DC\u05DB\u05DC \u05D8\u05D5\u05E7\u05DF \u05D9\u05E9 \u05DE\u05D7\u05D9\u05E8 \u05E7\u05D8\u05DF \u05D1\u05D7\u05D9\u05E9\u05D5\u05D1. \u05D4\u05E8\u05D1\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u2014 \u05D4\u05E8\u05D1\u05D4 \u05D7\u05D9\u05E9\u05D5\u05D1, \u05D5\u05DC\u05DB\u05DF \u05D9\u05D5\u05EA\u05E8 \u05D6\u05DE\u05DF \u05D5\u05D9\u05D5\u05EA\u05E8 \u05E2\u05DC\u05D5\u05EA. \u05D6\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E9\u05D0\u05D5\u05E1\u05E4\u05D9\u05DD \u05D1\u05DE\u05E1\u05DC\u05D5\u05DC."},en:{q:'Why does a very long prompt "cost" more?',a:["Because it is sent somewhere further away","Because the model struggles to focus on long text","Because it holds more tokens, and each token takes work"],why:"Every token costs a little computation. Many tokens means much computation \u2014 more time and more cost. Just like the tokens you collect on track."}},{id:"tokens-both-ways",tier:2,topic:"tokens",correct:0,he:{q:"\u05DE\u05D4 \u05E0\u05E1\u05E4\u05E8 \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05D2\u05DD \u05DE\u05D4 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD \u05D5\u05D2\u05DD \u05DE\u05D4 \u05E9\u05D7\u05D5\u05D6\u05E8 \u05D1\u05EA\u05E9\u05D5\u05D1\u05D4","\u05E8\u05E7 \u05DE\u05D4 \u05E9\u05E9\u05D5\u05DC\u05D7\u05D9\u05DD, \u05DB\u05D9 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05D1\u05E8 \u05E0\u05DB\u05EA\u05D1\u05EA \u05D1\u05D7\u05D9\u05E0\u05DD","\u05E8\u05E7 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05D7\u05D5\u05D6\u05E8\u05EA"],why:"\u05E9\u05E0\u05D9 \u05D4\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05E0\u05E1\u05E4\u05E8\u05D9\u05DD. \u05DC\u05DB\u05DF \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05DE\u05D1\u05E7\u05E9 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E2\u05E0\u05E7\u05D9\u05EA \u05D9\u05DB\u05D5\u05DC \u05DC\u05E2\u05DC\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E2\u05E6\u05DE\u05D5 \u2014 \u05D5\u05DC\u05DB\u05DF \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D4\u05D0\u05D5\u05E8\u05DA \u05E9\u05E6\u05E8\u05D9\u05DA."},en:{q:"What gets counted as tokens?",a:["Both what you send and what comes back","Only what you send, since the answer is written for free","Only the answer that comes back"],why:"Both directions count. Asking for a giant answer can cost more than the question did \u2014 another reason to ask for the length you actually need."}},{id:"tokens-save-well",tier:2,topic:"tokens",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D7\u05D5\u05E1\u05DB\u05D9\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E4\u05D2\u05D5\u05E2 \u05D1\u05EA\u05D5\u05E6\u05D0\u05D4?",a:["\u05DE\u05D5\u05D7\u05E7\u05D9\u05DD \u05D0\u05EA \u05DB\u05DC \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05D5\u05DE\u05E9\u05D0\u05D9\u05E8\u05D9\u05DD \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D7\u05EA \u05D1\u05DC\u05D1\u05D3","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D1\u05E7\u05D9\u05E6\u05D5\u05E8\u05D9\u05DD \u05E9\u05E7\u05E9\u05D4 \u05DC\u05D4\u05D1\u05D9\u05DF","\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05DE\u05DE\u05D5\u05E7\u05D3, \u05D1\u05DC\u05D9 \u05D7\u05D6\u05E8\u05D5\u05EA \u05D5\u05D1\u05DC\u05D9 \u05DE\u05D9\u05DC\u05D5\u05D9"],why:'\u05D7\u05D9\u05E1\u05DB\u05D5\u05DF \u05D7\u05DB\u05DD \u05DE\u05D5\u05D7\u05E7 \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E3 \u2014 \u05E0\u05D9\u05DE\u05D5\u05E1\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D9\u05DD, \u05D7\u05D6\u05E8\u05D5\u05EA, "\u05DB\u05DE\u05D5 \u05E9\u05D0\u05DE\u05E8\u05EA\u05D9 \u05E7\u05D5\u05D3\u05DD". \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05E9\u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD \u05E0\u05E9\u05D0\u05E8\u05D9\u05DD \u05EA\u05DE\u05D9\u05D3.'},en:{q:"How do you save tokens without hurting the result?",a:["Delete every detail and leave just one single word","Write in abbreviations that are hard to follow","Write a focused prompt, no repeats and no filler"],why:'Smart saving cuts what adds nothing \u2014 long pleasantries, repeats, "as I said before". The details that explain what you want always stay.'}},{id:"tokens-worth-spending",tier:3,topic:"tokens",correct:1,he:{q:'\u05DE\u05EA\u05D9 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05E9\u05D5\u05D5\u05D4 "\u05DC\u05D1\u05D6\u05D1\u05D6" \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?',a:["\u05D0\u05E3 \u05E4\u05E2\u05DD \u2014 \u05E7\u05E6\u05E8 \u05EA\u05DE\u05D9\u05D3 \u05E2\u05D3\u05D9\u05E3","\u05DB\u05E9\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05D4\u05E7\u05E9\u05E8 \u05D0\u05D5 \u05D3\u05D5\u05D2\u05DE\u05D4 \u05E9\u05D1\u05D0\u05DE\u05EA \u05DE\u05E9\u05E4\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05E9\u05E8\u05D5\u05E6\u05D9\u05DD \u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05EA\u05D9\u05E8\u05D0\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D5\u05DE\u05E8\u05E9\u05D9\u05DE\u05D4 \u05D9\u05D5\u05EA\u05E8"],why:"\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D4\u05DD \u05EA\u05E7\u05E6\u05D9\u05D1, \u05DC\u05D0 \u05E6\u05D9\u05D5\u05DF. \u05DE\u05E9\u05E4\u05D8 \u05D4\u05E7\u05E9\u05E8 \u05E9\u05D7\u05D5\u05E1\u05DA \u05E9\u05DC\u05D5\u05E9\u05D4 \u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05DB\u05D5\u05E9\u05DC\u05D9\u05DD \u05D4\u05D5\u05D0 \u05D4\u05E2\u05E1\u05E7\u05D4 \u05D4\u05DB\u05D9 \u05DE\u05E9\u05EA\u05DC\u05DE\u05EA \u05E9\u05D9\u05E9."},en:{q:'When is it actually worth "spending" tokens?',a:["Never \u2014 shorter is always better","When context or an example genuinely improves the answer","When you want the answer to look longer and more impressive"],why:"Tokens are a budget, not a score. One sentence of context that saves three failed attempts is the best deal on the table."}},{id:"tokens-languages",tier:3,topic:"tokens",correct:0,he:{q:"\u05DE\u05E9\u05E4\u05D8 \u05E7\u05E6\u05E8 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05D5\u05DE\u05E9\u05E4\u05D8 \u05E7\u05E6\u05E8 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA \u2014 \u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF?",a:["\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D5\u05E0\u05D4 \u05D1\u05D9\u05DF \u05D4\u05E9\u05E4\u05D5\u05EA","\u05DE\u05E1\u05E4\u05E8 \u05D4\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05E7\u05D1\u05E2 \u05DC\u05E4\u05D9 \u05DE\u05E1\u05E4\u05E8 \u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05DE\u05E9\u05E4\u05D8","\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05E1\u05E4\u05E8\u05D9\u05DD \u05DC\u05E4\u05D9 \u05DE\u05E1\u05E4\u05E8 \u05D4\u05D0\u05D5\u05EA\u05D9\u05D5\u05EA \u05D1\u05DC\u05D1\u05D3"],why:"\u05D4\u05D7\u05DC\u05D5\u05E7\u05D4 \u05DC\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05E0\u05DC\u05DE\u05D3\u05D4 \u05D1\u05E2\u05D9\u05E7\u05E8 \u05DE\u05D8\u05E7\u05E1\u05D8\u05D9\u05DD \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA, \u05D5\u05DC\u05DB\u05DF \u05E2\u05D1\u05E8\u05D9\u05EA \u05DE\u05EA\u05E4\u05E8\u05E7\u05EA \u05DC\u05E8\u05D5\u05D1 \u05DC\u05D7\u05EA\u05D9\u05DB\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA \u05D9\u05D5\u05EA\u05E8. \u05D0\u05D5\u05EA\u05D5 \u05E8\u05E2\u05D9\u05D5\u05DF, \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD."},en:{q:"A short Hebrew sentence and a short English one \u2014 what is true?",a:["The token count can differ between languages","The token count is set by how many words the sentence has","Tokens are counted purely by number of letters"],why:"Token splitting was learned mostly from English text, so Hebrew usually breaks into smaller pieces. Same idea, more tokens."}},{id:"iterate-try-again",tier:1,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D9\u05E6\u05D0\u05D4 \u05DC\u05D2\u05DE\u05E8\u05D9 \u05DC\u05D0 \u05DE\u05D4 \u05E9\u05E8\u05E6\u05D5. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E2\u05E9\u05D5\u05EA?",a:["\u05DC\u05D5\u05D5\u05EA\u05E8 \u05D5\u05DC\u05E2\u05E9\u05D5\u05EA \u05D0\u05EA \u05DB\u05DC \u05D4\u05DE\u05E9\u05D9\u05DE\u05D4 \u05DC\u05D1\u05D3","\u05DC\u05E9\u05DC\u05D5\u05D7 \u05E9\u05D5\u05D1 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D0\u05D5\u05EA\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8","\u05DC\u05E9\u05E4\u05E8 \u05D0\u05EA \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D5\u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1"],why:"\u05E0\u05D9\u05E1\u05D9\u05D5\u05DF \u05E8\u05D0\u05E9\u05D5\u05DF \u05D4\u05D5\u05D0 \u05D8\u05D9\u05D5\u05D8\u05D4, \u05DC\u05D0 \u05D2\u05D6\u05E8 \u05D3\u05D9\u05DF. \u05DE\u05D9 \u05E9\u05DE\u05E9\u05E4\u05E8 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D5\u05DE\u05E0\u05E1\u05D4 \u05E9\u05D5\u05D1 \u05DE\u05E7\u05D1\u05DC \u05EA\u05D5\u05E6\u05D0\u05D5\u05EA \u05D8\u05D5\u05D1\u05D5\u05EA \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DE\u05DE\u05D9 \u05E9\u05DE\u05E0\u05E1\u05D4 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA."},en:{q:"The answer came out nothing like what you wanted. What is best?",a:["Give up and do the whole thing yourself","Send the exact same prompt again and hope for better","Improve the prompt and try again"],why:"A first try is a draft, not a verdict. People who sharpen the prompt and retry get far better results than people who ask once."}},{id:"iterate-keep-change",tier:2,topic:"iterate",correct:1,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05DE\u05E2\u05D8 \u05D8\u05D5\u05D1\u05D4. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D9\u05DC \u05DC\u05DB\u05EA\u05D5\u05D1 \u05E2\u05DB\u05E9\u05D9\u05D5?",a:['\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05DC\u05D0 \u05D8\u05D5\u05D1" \u05D5\u05DC\u05D7\u05DB\u05D5\u05EA \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4',"\u05DC\u05D4\u05D2\u05D9\u05D3 \u05DE\u05D4 \u05DC\u05E9\u05DE\u05D5\u05E8 \u05D5\u05DE\u05D4 \u05DC\u05E9\u05E0\u05D5\u05EA","\u05DC\u05E4\u05EA\u05D5\u05D7 \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D5\u05DC\u05D4\u05EA\u05D7\u05D9\u05DC \u05DE\u05D4\u05D4\u05EA\u05D7\u05DC\u05D4"],why:'"\u05DC\u05D0 \u05D8\u05D5\u05D1" \u05DE\u05E9\u05D0\u05D9\u05E8 \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05D7\u05E9. "\u05D4\u05E4\u05EA\u05D9\u05D7\u05D4 \u05DE\u05E6\u05D5\u05D9\u05E0\u05EA, \u05D4\u05E1\u05D5\u05E3 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D3\u05D9" \u05E0\u05D5\u05EA\u05DF \u05DC\u05D5 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05E6\u05E8\u05D9\u05DA \u05DB\u05D3\u05D9 \u05DC\u05EA\u05E7\u05DF \u05E8\u05E7 \u05D0\u05EA \u05D4\u05D7\u05DC\u05E7 \u05D4\u05E9\u05D1\u05D5\u05E8.'},en:{q:"The answer is almost right. What is most effective to write now?",a:['Write "not good" and wait for more',"Say what to keep, what to change","Open a brand new chat and start over from scratch"],why:'"Not good" leaves the model guessing. "The opening is great, the ending is too long" gives it exactly what it needs to fix only the broken part.'}},{id:"iterate-one-change",tier:2,topic:"iterate",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05E9\u05E0\u05D5\u05EA \u05D3\u05D1\u05E8 \u05D0\u05D7\u05D3 \u05D1\u05DB\u05DC \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF?",a:["\u05DB\u05D9 \u05DB\u05DB\u05D4 \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E2\u05D6\u05E8","\u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05DE\u05E1\u05D5\u05D2\u05DC \u05DC\u05E7\u05DC\u05D5\u05D8 \u05E9\u05E0\u05D9 \u05E9\u05D9\u05E0\u05D5\u05D9\u05D9\u05DD \u05D1\u05D1\u05EA \u05D0\u05D7\u05EA","\u05DB\u05D9 \u05E0\u05D9\u05E1\u05D9\u05D5\u05DF \u05E2\u05DD \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05D3 \u05E8\u05E5 \u05DE\u05D4\u05E8 \u05D9\u05D5\u05EA\u05E8"],why:"\u05DB\u05E9\u05E9\u05E0\u05D9 \u05D3\u05D1\u05E8\u05D9\u05DD \u05DE\u05E9\u05EA\u05E0\u05D9\u05DD \u05D9\u05D7\u05D3 \u05D5\u05DE\u05E9\u05D4\u05D5 \u05DE\u05E9\u05EA\u05E4\u05E8 \u2014 \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA \u05DE\u05D9 \u05D0\u05D7\u05E8\u05D0\u05D9. \u05E9\u05D9\u05E0\u05D5\u05D9 \u05D0\u05D7\u05D3 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u05D4\u05D5\u05E4\u05DA \u05E0\u05D9\u05D7\u05D5\u05E9 \u05DC\u05E0\u05D9\u05E1\u05D5\u05D9 \u05D0\u05DE\u05D9\u05EA\u05D9."},en:{q:"Why change one thing per attempt?",a:["So you know which change helped","Because the model cannot handle two changes at once","Because a one-change attempt runs faster"],why:"When two things change together and something improves, you cannot tell which did it. One change at a time turns guessing into a real experiment."}},{id:"iterate-fresh-chat",tier:3,topic:"iterate",correct:1,he:{q:"\u05DE\u05EA\u05D9 \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05EA\u05D7\u05D9\u05DC \u05E9\u05D9\u05D7\u05D4 \u05D7\u05D3\u05E9\u05D4 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DC\u05EA\u05E7\u05DF?",a:["\u05D0\u05D7\u05E8\u05D9 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D7\u05DE\u05E9 \u05D4\u05D5\u05D3\u05E2\u05D5\u05EA \u05D1\u05E9\u05D9\u05D7\u05D4, \u05DC\u05E4\u05D9 \u05D4\u05DB\u05DC\u05DC \u05D4\u05DE\u05E7\u05D5\u05D1\u05DC","\u05DB\u05E9\u05D4\u05E9\u05D9\u05D7\u05D4 \u05DE\u05DC\u05D0\u05D4 \u05D1\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05D9\u05E9\u05E0\u05D9\u05DD \u05E9\u05DE\u05DE\u05E9\u05D9\u05DB\u05D9\u05DD \u05DC\u05D7\u05D6\u05D5\u05E8","\u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05D1\u05D0\u05D5\u05EA\u05D4 \u05E9\u05D9\u05D7\u05D4, \u05DB\u05D9 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DB\u05D1\u05E8 \u05DE\u05DB\u05D9\u05E8 \u05D0\u05EA \u05D4\u05D4\u05E7\u05E9\u05E8"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05E8\u05D5\u05D0\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E9\u05D9\u05D7\u05D4, \u05DB\u05D5\u05DC\u05DC \u05D4\u05E0\u05D9\u05E1\u05D9\u05D5\u05E0\u05D5\u05EA \u05E9\u05E0\u05DB\u05E9\u05DC\u05D5, \u05D5\u05DE\u05DE\u05E9\u05D9\u05DA \u05DC\u05D4\u05D9\u05D2\u05E8\u05E8 \u05D0\u05DC\u05D9\u05D4\u05DD. \u05E4\u05EA\u05D9\u05D7\u05D4 \u05E0\u05E7\u05D9\u05D9\u05D4 \u05E2\u05DD \u05D4\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D4\u05DE\u05E9\u05D5\u05E4\u05E8 \u05E2\u05D5\u05E7\u05E4\u05EA \u05D0\u05EA \u05DB\u05DC \u05D4\u05E8\u05E2\u05E9 \u05D4\u05D6\u05D4."},en:{q:"When is a fresh chat better than more fixing?",a:["After exactly five messages, as the usual rule goes","When the chat is full of old directions that keep coming back","Better to continue the same chat, since it already knows the context"],why:"The model sees the whole chat, failed attempts included, and keeps drifting back to them. A clean start with the improved prompt skips all that noise."}},{id:"mistakes-confident",tier:1,topic:"mistakes",correct:0,he:{q:"\u05D4\u05BEAI \u05E2\u05E0\u05D4 \u05D1\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05DE\u05DC\u05D0. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E1\u05DE\u05D5\u05DA \u05E2\u05DC \u05D6\u05D4?",a:["\u05DC\u05D0 \u05D1\u05D4\u05DB\u05E8\u05D7 \u2014 \u05D2\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D5\u05D7\u05D4 \u05DE\u05D0\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC\u05D4 \u05DC\u05D4\u05D9\u05D5\u05EA \u05E9\u05D2\u05D5\u05D9\u05D4","\u05DB\u05DF, \u05DB\u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E9\u05DE\u05E2\u05EA \u05D1\u05D8\u05D5\u05D7\u05D4 \u05D4\u05D9\u05D0 \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC \u05E0\u05DB\u05D5\u05E0\u05D4","\u05DB\u05DF, \u05D0\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05D5\u05DE\u05E4\u05D5\u05E8\u05D8\u05EA"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05DB\u05D5\u05EA\u05D1 \u05D4\u05DB\u05D5\u05DC \u05D1\u05D0\u05D5\u05EA\u05D5 \u05D8\u05D5\u05DF \u05D1\u05D8\u05D5\u05D7, \u05D2\u05DD \u05DB\u05E9\u05D4\u05D5\u05D0 \u05D8\u05D5\u05E2\u05D4. \u05D4\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF \u05D1\u05D8\u05E7\u05E1\u05D8 \u05D4\u05D5\u05D0 \u05E1\u05D2\u05E0\u05D5\u05DF \u05DB\u05EA\u05D9\u05D1\u05D4 \u2014 \u05DC\u05D0 \u05D4\u05D5\u05DB\u05D7\u05D4."},en:{q:"The AI answered with total confidence. Can you rely on it?",a:["Not necessarily \u2014 a very confident answer can still be wrong","Yes, a confident answer is usually a correct one","Yes, if the answer is long and detailed"],why:"The model writes everything in the same confident tone, including its mistakes. Confidence in the text is a writing style, not proof."}},{id:"mistakes-check-fact",tier:1,topic:"mistakes",correct:2,he:{q:"\u05D0\u05D9\u05DA \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E2\u05D5\u05D1\u05D3\u05D4 \u05E9\u05D4\u05BEAI \u05E0\u05EA\u05DF?",a:["\u05E9\u05D5\u05D0\u05DC\u05D9\u05DD \u05D0\u05EA \u05D0\u05D5\u05EA\u05D5 AI \u05D0\u05DD \u05D4\u05D5\u05D0 \u05D1\u05D8\u05D5\u05D7","\u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05DB\u05DE\u05D4 \u05E4\u05E2\u05DE\u05D9\u05DD \u05D4\u05D5\u05D0 \u05D7\u05D6\u05E8 \u05E2\u05DC \u05D6\u05D4","\u05DE\u05E9\u05D5\u05D5\u05D9\u05DD \u05DC\u05DE\u05E7\u05D5\u05E8 \u05D0\u05DE\u05D9\u05DF \u05E0\u05D5\u05E1\u05E3, \u05DE\u05D7\u05D5\u05E5 \u05DC\u05E9\u05D9\u05D7\u05D4"],why:'\u05DC\u05E9\u05D0\u05D5\u05DC \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC "\u05D0\u05EA\u05D4 \u05D1\u05D8\u05D5\u05D7?" \u05D1\u05D3\u05E8\u05DA \u05DB\u05DC\u05DC \u05E8\u05E7 \u05DE\u05D5\u05DC\u05D9\u05D3 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D5\u05D7\u05D4 \u05E2\u05D5\u05D3 \u05D9\u05D5\u05EA\u05E8. \u05D1\u05D3\u05D9\u05E7\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u05DE\u05D2\u05D9\u05E2\u05D4 \u05DE\u05DE\u05E7\u05D5\u05E8 \u05D0\u05D7\u05E8: \u05D0\u05EA\u05E8, \u05E1\u05E4\u05E8, \u05DE\u05D1\u05D5\u05D2\u05E8 \u05E9\u05D9\u05D5\u05D3\u05E2.'},en:{q:"How do you check a fact the AI gave you?",a:["Ask the same AI if it is sure","Count how many times it repeated it","Compare it with a trustworthy source outside the chat"],why:'Asking a model "are you sure?" usually just produces an even surer answer. A real check comes from elsewhere: a site, a book, an adult who knows.'}},{id:"mistakes-hallucination",tier:2,topic:"mistakes",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D4\u05D6\u05D9\u05D4" \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC?',a:["\u05DB\u05E9\u05D4\u05D5\u05D0 \u05DE\u05E1\u05E8\u05D1 \u05DC\u05E2\u05E0\u05D5\u05EA \u05E2\u05DC \u05E9\u05D0\u05DC\u05D4 \u05E9\u05E0\u05E8\u05D0\u05D9\u05EA \u05DC\u05D5 \u05D1\u05E2\u05D9\u05D9\u05EA\u05D9\u05EA \u05D0\u05D5 \u05DE\u05D5\u05D6\u05E8\u05D4","\u05DB\u05E9\u05D4\u05D5\u05D0 \u05DE\u05DE\u05E6\u05D9\u05D0 \u05E4\u05E8\u05D8 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05E0\u05DB\u05D5\u05DF \u05DC\u05D2\u05DE\u05E8\u05D9 \u05D0\u05D1\u05DC \u05D0\u05D9\u05E0\u05D5 \u05E0\u05DB\u05D5\u05DF","\u05DB\u05E9\u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4 \u05DC\u05D0\u05D8 \u05DE\u05D4\u05E8\u05D2\u05D9\u05DC"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05EA\u05DE\u05D9\u05D3 \u05DE\u05E0\u05E1\u05D4 \u05DC\u05D4\u05E9\u05DC\u05D9\u05DD \u05DE\u05E9\u05D4\u05D5 \u05E9\u05DE\u05EA\u05D0\u05D9\u05DD, \u05D2\u05DD \u05DB\u05E9\u05D0\u05D9\u05DF \u05DC\u05D5 \u05D0\u05EA \u05D4\u05DE\u05D9\u05D3\u05E2. \u05D0\u05D6 \u05E0\u05D5\u05DC\u05D3 \u05E4\u05E8\u05D8 \u05E9\u05E0\u05E9\u05DE\u05E2 \u05DE\u05D5\u05E9\u05DC\u05DD \u05D5\u05E4\u05E9\u05D5\u05D8 \u05DC\u05D0 \u05E7\u05D9\u05D9\u05DD \u2014 \u05D5\u05DC\u05DB\u05DF \u05D1\u05D5\u05D3\u05E7\u05D9\u05DD."},en:{q:'What is a model "hallucination"?',a:["When it refuses to answer a question that it finds odd or risky","When it invents a detail that sounds completely right but is not","When it answers slower than usual"],why:"The model always tries to complete something that fits, even with no information. Out comes a detail that sounds perfect and simply does not exist \u2014 hence checking."}},{id:"mistakes-sources",tier:2,topic:"mistakes",correct:0,he:{q:"\u05D4\u05BEAI \u05E6\u05D9\u05E8\u05E3 \u05E7\u05D9\u05E9\u05D5\u05E8 \u05D0\u05D5 \u05E9\u05DD \u05E9\u05DC \u05E1\u05E4\u05E8. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05E4\u05D5\u05EA\u05D7\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05E9\u05D4\u05DE\u05E7\u05D5\u05E8 \u05E7\u05D9\u05D9\u05DD","\u05DE\u05E2\u05EA\u05D9\u05E7\u05D9\u05DD \u05D9\u05E9\u05E8 \u05DC\u05E2\u05D1\u05D5\u05D3\u05D4, \u05DB\u05D9 \u05D6\u05D4 \u05E0\u05E8\u05D0\u05D4 \u05DE\u05E1\u05D5\u05D3\u05E8 \u05D5\u05DE\u05E7\u05E6\u05D5\u05E2\u05D9","\u05DE\u05E0\u05D9\u05D7\u05D9\u05DD \u05E9\u05D6\u05D4 \u05EA\u05E7\u05D9\u05DF \u05DB\u05D9 \u05D9\u05E9 \u05E9\u05DD \u05D5\u05EA\u05D0\u05E8\u05D9\u05DA"],why:"\u05E9\u05DE\u05D5\u05EA \u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05D4\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05D1\u05D5 \u05DE\u05D5\u05D3\u05DC \u05DE\u05DE\u05E6\u05D9\u05D0 \u05D1\u05D1\u05D9\u05D8\u05D7\u05D5\u05DF. \u05DE\u05E7\u05D5\u05E8 \u05D0\u05DE\u05D9\u05EA\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E4\u05EA\u05D5\u05D7 \u2014 \u05D5\u05D6\u05D5 \u05D1\u05D3\u05D9\u05E7\u05D4 \u05E9\u05DC \u05D7\u05DE\u05E9 \u05E9\u05E0\u05D9\u05D5\u05EA."},en:{q:"The AI gave a link or a book title. What now?",a:["Open it and check the source exists","Copy it straight into the work, since it looks tidy and professional","Assume it is fine because it has a name and a date"],why:"Source names are exactly where a model invents confidently. A real source can be opened \u2014 that is a five-second check."}},{id:"mistakes-math",tier:3,topic:"mistakes",correct:2,he:{q:"\u05D1\u05D7\u05E9\u05D1\u05D5\u05DF \u05D0\u05D5 \u05D1\u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD, \u05DC\u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05E9\u05D5\u05D1 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05BEAI?",a:["\u05DB\u05D9 \u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05E2\u05D5\u05DC\u05D9\u05DD \u05D9\u05D5\u05EA\u05E8 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD","\u05DB\u05D9 \u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DE\u05D7\u05E9\u05D1 \u05DC\u05D0\u05D8, \u05D5\u05EA\u05D0\u05E8\u05D9\u05DB\u05D9\u05DD \u05DE\u05D1\u05DC\u05D1\u05DC\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05D1\u05DE\u05D9\u05D5\u05D7\u05D3","\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05DE\u05E0\u05D7\u05E9 \u05D8\u05E7\u05E1\u05D8, \u05D5\u05D3\u05D9\u05D5\u05E7 \u05D1\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05D4\u05D5\u05D0 \u05DC\u05D0 \u05D4\u05D7\u05D5\u05D6\u05E7 \u05E9\u05DC\u05D5"],why:"\u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05DE\u05E0\u05D7\u05E9 \u05DE\u05D4 \u05DE\u05EA\u05D0\u05D9\u05DD \u05DC\u05D1\u05D5\u05D0 \u05D0\u05D7\u05E8 \u05DB\u05DA \u2014 \u05D5\u05D6\u05D4 \u05DC\u05D0 \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8 \u05DB\u05DE\u05D5 \u05DC\u05D7\u05E9\u05D1. \u05D1\u05D7\u05D9\u05E9\u05D5\u05D1 \u05D0\u05E8\u05D5\u05DA \u05E9\u05D5\u05D5\u05D4 \u05EA\u05DE\u05D9\u05D3 \u05DC\u05D5\u05D5\u05D3\u05D0, \u05D0\u05D5 \u05DC\u05D1\u05E7\u05E9 \u05DE\u05DE\u05E0\u05D5 \u05DC\u05E4\u05E8\u05D8 \u05D0\u05EA \u05D4\u05E9\u05DC\u05D1\u05D9\u05DD."},en:{q:"With arithmetic or dates, why double-check the AI?",a:["Because numbers cost more tokens","Because a language model calculates slowly, and dates confuse it badly","Because it guesses text, and exact numbers are not its strength"],why:"A language model guesses what comes next \u2014 which is not the same as calculating. On a long computation, verify, or ask it to show the steps."}},{id:"vibe-what-is",tier:2,topic:"vibe",correct:1,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D5\u05D9\u05D9\u05D1\u05BE\u05E7\u05D5\u05D3\u05D9\u05E0\u05D2"?',a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05E7\u05D5\u05D3 \u05DE\u05D5\u05DB\u05DF \u05DE\u05D4\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8 \u05D1\u05DC\u05D9 \u05DC\u05E9\u05E0\u05D5\u05EA","\u05DC\u05EA\u05D0\u05E8 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05DE\u05D4 \u05D4\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E6\u05E8\u05D9\u05DB\u05D4 \u05DC\u05E2\u05E9\u05D5\u05EA, \u05D5\u05DC\u05EA\u05EA \u05DC\u05BEAI \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05E8\u05D5\u05D1 \u05D4\u05E7\u05D5\u05D3 \u05DC\u05D1\u05D3 \u05D5\u05DC\u05D1\u05E7\u05E9 \u05DE\u05BEAI \u05E8\u05E7 \u05DC\u05D7\u05E4\u05E9 \u05D1\u05D5 \u05E9\u05D2\u05D9\u05D0\u05D5\u05EA \u05E7\u05D8\u05E0\u05D5\u05EA"],why:"\u05D1\u05D5\u05D9\u05D9\u05D1\u05BE\u05E7\u05D5\u05D3\u05D9\u05E0\u05D2 \u05DE\u05EA\u05D0\u05E8\u05D9\u05DD \u05D0\u05EA \u05D4\u05E8\u05E2\u05D9\u05D5\u05DF \u05D1\u05E9\u05E4\u05D4 \u05E8\u05D2\u05D9\u05DC\u05D4, \u05D5\u05D4\u05BEAI \u05DB\u05D5\u05EA\u05D1 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3. \u05D4\u05EA\u05D9\u05D0\u05D5\u05E8 \u05D4\u05D5\u05D0 \u05D4\u05E2\u05D1\u05D5\u05D3\u05D4 \u05D4\u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u2014 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D8\u05D5\u05D1."},en:{q:'What is "vibe coding"?',a:["Copying ready-made code off the internet unchanged","Describing what the software should do, and letting AI write the code","Writing most of the code yourself and asking AI only to hunt for small bugs"],why:"In vibe coding you describe the idea in ordinary language and the AI writes the code. The description is the real work \u2014 exactly like a good prompt."}},{id:"vibe-start-project",tier:1,topic:"vibe",correct:2,he:{q:"\u05D1\u05D5\u05E0\u05D9\u05DD \u05DE\u05E9\u05D7\u05E7 \u05E2\u05DD AI. \u05D0\u05D9\u05DA \u05D4\u05DB\u05D9 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05D4\u05EA\u05D7\u05D9\u05DC?",a:['\u05DC\u05D1\u05E7\u05E9 "\u05DC\u05D1\u05E0\u05D5\u05EA \u05DE\u05E9\u05D7\u05E7 \u05DE\u05D2\u05E0\u05D9\u05D1" \u05D5\u05DC\u05D7\u05DB\u05D5\u05EA',"\u05DC\u05D1\u05E7\u05E9 \u05D0\u05EA \u05DB\u05DC \u05D4\u05E7\u05D5\u05D3 \u05E9\u05DC \u05D4\u05DE\u05E9\u05D7\u05E7 \u05D1\u05D4\u05D5\u05D3\u05E2\u05D4 \u05E2\u05E0\u05E7\u05D9\u05EA \u05D0\u05D7\u05EA","\u05DC\u05EA\u05D0\u05E8 \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05D1\u05DE\u05E9\u05D7\u05E7, \u05D5\u05D0\u05D6 \u05DC\u05D1\u05E7\u05E9 \u05E9\u05DC\u05D1 \u05D0\u05D7\u05E8 \u05E9\u05DC\u05D1"],why:"\u05E7\u05D5\u05D3\u05DD \u05DE\u05E1\u05D1\u05D9\u05E8\u05D9\u05DD \u05DE\u05D4 \u05D4\u05DE\u05E9\u05D7\u05E7 \u05E2\u05D5\u05E9\u05D4 \u2014 \u05DE\u05D9 \u05D6\u05D6, \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05E9\u05DE\u05E0\u05E6\u05D7\u05D9\u05DD. \u05D0\u05D7\u05E8 \u05DB\u05DA \u05D1\u05D5\u05E0\u05D9\u05DD \u05D7\u05DC\u05E7\u05BE\u05D7\u05DC\u05E7 \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05DB\u05DC \u05D7\u05DC\u05E7. \u05DB\u05DB\u05D4 \u05D9\u05D5\u05E6\u05D0 \u05DE\u05E9\u05D7\u05E7 \u05D5\u05DC\u05D0 \u05E2\u05E8\u05D9\u05DE\u05EA \u05E7\u05D5\u05D3."},en:{q:"Building a game with AI. What is the best way to start?",a:['Ask for "a cool game" and wait',"Ask for all of the code for the whole game in one giant message","Describe what happens in the game, then build step by step"],why:"First explain what the game does \u2014 who moves, what happens when you win. Then build piece by piece and test each one. That gets a game, not a pile of code."}},{id:"vibe-error",tier:3,topic:"vibe",correct:0,he:{q:"\u05D4\u05E7\u05D5\u05D3 \u05E9\u05D4\u05BEAI \u05DB\u05EA\u05D1 \u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D9\u05E2\u05D6\u05D5\u05E8?",a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05EA \u05D4\u05D5\u05D3\u05E2\u05EA \u05D4\u05E9\u05D2\u05D9\u05D0\u05D4 \u05D5\u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05DE\u05D4 \u05E7\u05E8\u05D4 \u05D1\u05E4\u05D5\u05E2\u05DC",'\u05DC\u05DB\u05EA\u05D5\u05D1 "\u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3, \u05DC\u05EA\u05E7\u05DF"',"\u05DC\u05DE\u05D7\u05D5\u05E7 \u05D4\u05DB\u05D5\u05DC \u05D5\u05DC\u05D1\u05E7\u05E9 \u05DE\u05D4\u05BEAI \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D6\u05D4 \u05DE\u05D7\u05D3\u05E9 \u05DE\u05D0\u05E4\u05E1"],why:'\u05D4\u05D5\u05D3\u05E2\u05EA \u05D4\u05E9\u05D2\u05D9\u05D0\u05D4 \u05D4\u05D9\u05D0 \u05D4\u05E8\u05DE\u05D6 \u05D4\u05DB\u05D9 \u05E9\u05D5\u05D5\u05D4 \u05E9\u05D9\u05E9, \u05D5\u05D4\u05D9\u05D0 \u05E2\u05D5\u05DC\u05D4 \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05D5\u05D3\u05D3\u05D9\u05DD. "\u05DC\u05D0 \u05E2\u05D5\u05D1\u05D3" \u05DE\u05D1\u05E7\u05E9 \u05DE\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E0\u05D7\u05E9 \u05D0\u05D9\u05E4\u05D4 \u05D4\u05D1\u05E2\u05D9\u05D4.'},en:{q:"The code the AI wrote does not work. What helps most?",a:["Paste the error message and describe what actually happened",'Write "broken, fix it"',"Delete everything and ask the AI to write it again from scratch"],why:'The error message is the most valuable clue there is, and it costs a handful of tokens. "Broken" asks the model to guess where the problem is.'}},{id:"vibe-test-each",tier:3,topic:"vibe",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05DE\u05E8\u05D9\u05E6\u05D9\u05DD \u05D5\u05D1\u05D5\u05D3\u05E7\u05D9\u05DD \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E9\u05D4\u05BEAI \u05E2\u05E9\u05D4?",a:["\u05DB\u05D9 \u05D4\u05BEAI \u05DC\u05D0 \u05D1\u05D0\u05DE\u05EA \u05D6\u05D5\u05DB\u05E8 \u05DE\u05D4 \u05D4\u05D5\u05D0 \u05DB\u05EA\u05D1 \u05DC\u05E4\u05E0\u05D9 \u05E8\u05D2\u05E2","\u05DB\u05D9 \u05E8\u05E7 \u05D4\u05E8\u05E6\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA \u05DE\u05E8\u05D0\u05D4 \u05D0\u05DD \u05D6\u05D4 \u05D1\u05D0\u05DE\u05EA \u05E2\u05D5\u05D1\u05D3","\u05DB\u05D9 \u05D1\u05D3\u05D9\u05E7\u05D4 \u05EA\u05DB\u05D5\u05E4\u05D4 \u05D7\u05D5\u05E1\u05DB\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD"],why:"\u05E7\u05D5\u05D3 \u05D9\u05DB\u05D5\u05DC \u05DC\u05D4\u05D9\u05E8\u05D0\u05D5\u05EA \u05DE\u05D5\u05E9\u05DC\u05DD \u05D5\u05DC\u05D4\u05EA\u05E4\u05D5\u05E6\u05E5 \u05D1\u05D4\u05E8\u05E6\u05D4 \u05D4\u05E8\u05D0\u05E9\u05D5\u05E0\u05D4. \u05D1\u05D3\u05D9\u05E7\u05D4 \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DC \u05E9\u05D9\u05E0\u05D5\u05D9 \u05E7\u05D8\u05DF \u05DE\u05D0\u05EA\u05E8\u05EA \u05D0\u05EA \u05D4\u05EA\u05E7\u05DC\u05D4 \u05DB\u05E9\u05E2\u05D5\u05D3 \u05D1\u05E8\u05D5\u05E8 \u05DE\u05D4 \u05D2\u05E8\u05DD \u05DC\u05D4."},en:{q:"Why run and test every change the AI made?",a:["Because the AI does not really remember what it just wrote","Because only actually running it shows whether it works","Because frequent testing saves tokens"],why:"Code can look perfect and blow up on the first run. Testing after each small change catches the break while it is still obvious what caused it."}},{id:"vibe-good-spec",tier:3,topic:"vibe",correct:2,he:{q:"\u05DE\u05D4 \u05DE\u05E1\u05DE\u05DF \u05EA\u05D9\u05D0\u05D5\u05E8 \u05D8\u05D5\u05D1 \u05E9\u05DC \u05E4\u05D9\u05E6\u05F3\u05E8 \u05DC\u05BEAI?",a:["\u05D4\u05D5\u05D0 \u05D0\u05E8\u05D5\u05DA \u05DE\u05D0\u05D5\u05D3 \u05D5\u05DE\u05DB\u05E1\u05D4 \u05D4\u05DB\u05D5\u05DC","\u05D4\u05D5\u05D0 \u05DE\u05DC\u05D0 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05D8\u05DB\u05E0\u05D9\u05D5\u05EA \u05DE\u05E8\u05E9\u05D9\u05DE\u05D5\u05EA \u05E9\u05E0\u05E9\u05DE\u05E2\u05D5\u05EA \u05DE\u05E7\u05E6\u05D5\u05E2\u05D9\u05D5\u05EA \u05DE\u05D0\u05D5\u05D3","\u05DB\u05EA\u05D5\u05D1 \u05D1\u05D5 \u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4, \u05DE\u05EA\u05D9 \u05D6\u05D4 \u05E7\u05D5\u05E8\u05D4, \u05D5\u05DE\u05D4 \u05E8\u05D5\u05D0\u05D9\u05DD \u05E2\u05DC \u05D4\u05DE\u05E1\u05DA"],why:'\u05EA\u05D9\u05D0\u05D5\u05E8 \u05D8\u05D5\u05D1 \u05D4\u05D5\u05D0 \u05DB\u05D6\u05D4 \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D0\u05D7\u05E8\u05D9\u05D5. "\u05DB\u05E9\u05DC\u05D5\u05D7\u05E6\u05D9\u05DD \u05E8\u05D5\u05D5\u05D7 \u05D4\u05DB\u05D3\u05D5\u05E8 \u05E7\u05D5\u05E4\u05E5 \u05D5\u05E0\u05E9\u05DE\u05E2 \u05E6\u05DC\u05D9\u05DC" \u2014 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E8\u05D9\u05E5 \u05D5\u05DC\u05E8\u05D0\u05D5\u05EA \u05D0\u05DD \u05D6\u05D4 \u05E7\u05E8\u05D4.'},en:{q:"What marks a good feature description for an AI?",a:["It is very long and covers everything","It is packed with impressive technical words that sound professional","It says what happens, when it happens, and what appears on screen"],why:'A good description is one you can check afterwards. "Press space, the ball jumps and a sound plays" \u2014 you can run it and see whether that happened.'}},{id:"ai-everyday",tier:1,topic:"whatai",correct:1,he:{q:"\u05D0\u05D9\u05E4\u05D4 \u05E4\u05D5\u05D2\u05E9\u05D9\u05DD AI \u05D1\u05D9\u05D5\u05DD \u05E8\u05D2\u05D9\u05DC?",a:["\u05E8\u05E7 \u05D1\u05DE\u05E2\u05D1\u05D3\u05D5\u05EA \u05E9\u05DC \u05DE\u05D3\u05E2\u05E0\u05D9\u05DD","\u05D1\u05EA\u05E8\u05D2\u05D5\u05DD, \u05D1\u05D4\u05DE\u05DC\u05E6\u05D5\u05EA \u05E1\u05E8\u05D8\u05D9\u05DD \u05D5\u05D1\u05E1\u05D9\u05E0\u05D5\u05DF \u05D3\u05D5\u05D0\u05E8 \u05D6\u05D1\u05DC","\u05E8\u05E7 \u05D1\u05DE\u05E9\u05D7\u05E7\u05D9 \u05DE\u05D7\u05E9\u05D1 \u05D7\u05D3\u05E9\u05D9\u05DD"],why:"AI \u05DB\u05D1\u05E8 \u05D9\u05D5\u05E9\u05D1 \u05D1\u05D4\u05DE\u05D5\u05DF \u05DE\u05E7\u05D5\u05DE\u05D5\u05EA \u05E9\u05D2\u05E8\u05EA\u05D9\u05D9\u05DD: \u05EA\u05E8\u05D2\u05D5\u05DD, \u05E0\u05D9\u05D5\u05D5\u05D8, \u05D4\u05DE\u05DC\u05E6\u05D5\u05EA \u05D5\u05E1\u05D9\u05E0\u05D5\u05DF \u05E1\u05E4\u05D0\u05DD. \u05E8\u05D5\u05D1 \u05D4\u05E4\u05E2\u05DE\u05D9\u05DD \u05D1\u05DB\u05DC\u05DC \u05DC\u05D0 \u05E9\u05DE\u05D9\u05DD \u05DC\u05D1 \u05E9\u05D4\u05D5\u05D0 \u05E9\u05DD."},en:{q:"Where do you meet AI on an ordinary day?",a:["Only in scientists' laboratories","In translation, film recommendations and spam filtering","Only in brand new video games"],why:"AI already sits in plenty of everyday places: translation, navigation, recommendations, spam filters. Most of the time nobody notices it is there."}},{id:"ai-not-magic",tier:1,topic:"whatai",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05D4\u05DB\u05D9 \u05E0\u05DB\u05D5\u05DF \u05DC\u05EA\u05D0\u05E8 AI \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D0\u05D7\u05D3?",a:["\u05EA\u05D5\u05DB\u05E0\u05D4 \u05E9\u05DE\u05D6\u05D4\u05D4 \u05D3\u05E4\u05D5\u05E1\u05D9\u05DD \u05D1\u05D4\u05DE\u05D5\u05DF \u05DE\u05D9\u05D3\u05E2 \u05D5\u05DE\u05E0\u05D7\u05E9\u05EA \u05DC\u05E4\u05D9\u05D4\u05DD","\u05DE\u05D5\u05D7 \u05D0\u05DC\u05E7\u05D8\u05E8\u05D5\u05E0\u05D9 \u05E7\u05D8\u05DF \u05E9\u05D7\u05D5\u05E9\u05D1 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DB\u05DE\u05D5 \u05D1\u05DF \u05D0\u05D3\u05DD \u05D7\u05DB\u05DD","\u05E7\u05E1\u05DD \u05DE\u05D5\u05D3\u05E8\u05E0\u05D9 \u05E9\u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05E1\u05D1\u05D9\u05E8 \u05D0\u05D5\u05EA\u05D5 \u05D1\u05DE\u05D9\u05DC\u05D9\u05DD \u05E4\u05E9\u05D5\u05D8\u05D5\u05EA"],why:"\u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D9\u05DA \u05D1\u05E0\u05D5 \u05D0\u05D5\u05EA\u05D5 \u05D5\u05D0\u05D9\u05DA \u05D0\u05D9\u05DE\u05E0\u05D5 \u05D0\u05D5\u05EA\u05D5, \u05D2\u05DD \u05DB\u05E9\u05DC\u05D0 \u05D1\u05E8\u05D5\u05E8 \u05DC\u05DE\u05D4 \u05D9\u05E6\u05D0\u05D4 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D4\u05D6\u05D0\u05EA. \u05D6\u05D5 \u05D4\u05E0\u05D3\u05E1\u05D4 \u2014 \u05D5\u05D0\u05E4\u05E9\u05E8 \u05DC\u05DC\u05DE\u05D5\u05D3 \u05D0\u05D5\u05EA\u05D4."},en:{q:"What is the best one-sentence description of AI?",a:["Software that spots patterns in lots of data and guesses from them","A small electronic brain that thinks exactly like a clever person does","Modern magic that cannot really be explained in plain words"],why:"We know exactly how it was built and trained, even when it is unclear why this particular answer came out. It is engineering \u2014 and engineering can be learned."}},{id:"ai-needs-examples",tier:2,topic:"whatai",correct:0,he:{q:"\u05DC\u05DE\u05D4 AI \u05E6\u05E8\u05D9\u05DA \u05D4\u05DE\u05D5\u05DF \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05DB\u05D3\u05D9 \u05DC\u05DC\u05DE\u05D5\u05D3?",a:["\u05DB\u05D9 \u05D3\u05E4\u05D5\u05E1 \u05DE\u05EA\u05D2\u05DC\u05D4 \u05E8\u05E7 \u05DB\u05E9\u05E8\u05D5\u05D0\u05D9\u05DD \u05D0\u05D5\u05EA\u05D5 \u05E9\u05D5\u05D1 \u05D5\u05E9\u05D5\u05D1","\u05DB\u05D9 \u05DB\u05DB\u05D4 \u05DE\u05EA\u05DE\u05DC\u05D0 \u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05E9\u05DC\u05D5","\u05DB\u05D9 \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05D7\u05D3\u05E9\u05D5\u05EA \u05DE\u05D7\u05DC\u05D9\u05E4\u05D5\u05EA \u05D0\u05E6\u05DC\u05D5 \u05D0\u05EA \u05D4\u05D9\u05E9\u05E0\u05D5\u05EA"],why:"\u05DE\u05D3\u05D5\u05D2\u05DE\u05D4 \u05D0\u05D7\u05EA \u05D0\u05D9 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05D3\u05E2\u05EA \u05DE\u05D4 \u05DB\u05DC\u05DC \u05D5\u05DE\u05D4 \u05D9\u05D5\u05E6\u05D0 \u05D3\u05D5\u05E4\u05DF. \u05E8\u05E7 \u05D0\u05D7\u05E8\u05D9 \u05D4\u05DE\u05D5\u05DF \u05D3\u05D5\u05D2\u05DE\u05D0\u05D5\u05EA \u05DE\u05EA\u05D1\u05E8\u05E8 \u05DE\u05D4 \u05D7\u05D5\u05D6\u05E8 \u05EA\u05DE\u05D9\u05D3 \u2014 \u05D5\u05D6\u05D4 \u05DE\u05D4 \u05E9\u05E0\u05DC\u05DE\u05D3."},en:{q:"Why does AI need so many examples to learn?",a:["Because a pattern only shows up when you see it again and again","Because that is how its memory gets filled","Because newer examples simply replace the older ones it saw"],why:"One example cannot tell you what is a rule and what is an exception. Only after a great many does what always repeats become clear \u2014 and that is what gets learned."}},{id:"ai-knows-me",tier:2,topic:"whatai",correct:0,he:{q:"\u05D4\u05D0\u05DD \u05D4\u05BEAI \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D9 \u05DB\u05D5\u05EA\u05D1 \u05DC\u05D5?",a:["\u05DB\u05DF, \u05D4\u05D5\u05D0 \u05DE\u05E0\u05D7\u05E9 \u05D2\u05D9\u05DC \u05D5\u05E1\u05D2\u05E0\u05D5\u05DF \u05DE\u05D4\u05DB\u05EA\u05D9\u05D1\u05D4, \u05D0\u05D1\u05DC \u05DC\u05D0 \u05D9\u05D5\u05D3\u05E2 \u05DE\u05D9 \u05D6\u05D4","\u05DC\u05D0, \u05D4\u05D5\u05D0 \u05E8\u05D5\u05D0\u05D4 \u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05DC\u05D1\u05D3 \u05D5\u05DC\u05D0 \u05DE\u05E1\u05D9\u05E7 \u05DE\u05D4\u05DF \u05E9\u05D5\u05DD \u05D3\u05D1\u05E8 \u05E0\u05D5\u05E1\u05E3","\u05DB\u05DF, \u05D4\u05E9\u05DD \u05D5\u05D4\u05DB\u05D9\u05EA\u05D4 \u05E0\u05E9\u05DC\u05D7\u05D9\u05DD \u05D0\u05DC\u05D9\u05D5 \u05D0\u05D5\u05D8\u05D5\u05DE\u05D8\u05D9\u05EA \u05E2\u05DD \u05DB\u05DC \u05D4\u05D5\u05D3\u05E2\u05D4"],why:"\u05DE\u05D4\u05E0\u05D9\u05E1\u05D5\u05D7 \u05D0\u05E4\u05E9\u05E8 \u05DC\u05E0\u05D7\u05E9 \u05D3\u05D9 \u05D4\u05E8\u05D1\u05D4, \u05D5\u05DE\u05D5\u05D3\u05DC \u05D1\u05D0\u05DE\u05EA \u05DE\u05E0\u05D7\u05E9. \u05D0\u05EA \u05DE\u05D4 \u05E9\u05D7\u05E9\u05D5\u05D1 \u05E9\u05D9\u05D9\u05D3\u0 e description written"],why:"An image model learned how words relate to pictures and makes a fresh image every time. Here too, a detailed description gets you closer to what you wanted."}},{id:"prompt-say-goal",tier:1,topic:"prompt",correct:0,he:{q:"\u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05E9\u05D1\u05D9\u05DC \u05DE\u05D4 \u05E6\u05E8\u05D9\u05DA \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4?",a:["\u05DB\u05D9 \u05DE\u05D8\u05E8\u05D4 \u05D1\u05E8\u05D5\u05E8\u05D4 \u05DE\u05E9\u05E0\u05D4 \u05D0\u05EA \u05DE\u05D4 \u05E9\u05D9\u05D9\u05DB\u05E0\u05E1 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4","\u05DB\u05D9 \u05D6\u05D4 \u05DE\u05E7\u05E6\u05E8 \u05D0\u05EA \u05D6\u05DE\u05DF \u05D4\u05D4\u05DE\u05EA\u05E0\u05D4","\u05DB\u05D9 \u05D1\u05DC\u05D9 \u05DE\u05D8\u05E8\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05D1\u05E7\u05E9 \u05D4\u05D1\u05D4\u05E8\u05D4"],why:"\u05D4\u05E1\u05D1\u05E8 \u05DC\u05E9\u05D9\u05E2\u05D5\u05E8\u05D9 \u05D1\u05D9\u05EA \u05D5\u05D4\u05E1\u05D1\u05E8 \u05DC\u05D4\u05E6\u05D2\u05D4 \u05D1\u05DB\u05D9\u05EA\u05D4 \u05E0\u05E8\u05D0\u05D9\u05DD \u05D0\u05D7\u05E8\u05EA \u05DC\u05D2\u05DE\u05E8\u05D9. \u05DB\u05E9\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05DC\u05DE\u05D4 \u05E6\u05E8\u05D9\u05DA \u05D0\u05EA \u05D6\u05D4, \u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05DB\u05D5\u05D5\u05DF \u05DC\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D4\u05E0\u05DB\u05D5\u05DF."},en:{q:"Why say what the answer is needed for?",a:["Because a clear purpose changes what goes into the answer","Because it shortens the waiting time","Because with no purpose it asks for clarification"],why:"An explanation for homework and one for a class presentation look completely different. Saying why you need it aims the model at the right use."}},{id:"prompt-vague-word",tier:1,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05D4\u05D1\u05E2\u05D9\u05D4 \u05D1\u05D1\u05E7\u05E9\u05D4 "\u05DC\u05DB\u05EA\u05D5\u05D1 \u05DE\u05E9\u05D4\u05D5 \u05D9\u05E4\u05D4"?',a:["\u05D4\u05D9\u05D0 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D3\u05D9",'"\u05D9\u05E4\u05D4" \u05D0\u05D5\u05DE\u05E8 \u05D3\u05D1\u05E8 \u05D0\u05D7\u05E8 \u05DC\u05DB\u05DC \u05D0\u05D7\u05D3','\u05D4\u05DE\u05D9\u05DC\u05D4 "\u05DE\u05E9\u05D4\u05D5" \u05DE\u05D1\u05DC\u05D1\u05DC\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D5\u05EA\u05E8 \u05DE\u05DB\u05DC \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D7\u05E8\u05EA'],why:'\u05DE\u05D9\u05DC\u05D5\u05EA \u05E9\u05D1\u05D7 \u05DC\u05D0 \u05DE\u05EA\u05D0\u05E8\u05D5\u05EA \u05DB\u05DC\u05D5\u05DD. \u05D1\u05DE\u05E7\u05D5\u05DD "\u05D9\u05E4\u05D4" \u05E2\u05D3\u05D9\u05E3 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05DE\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E8\u05D5\u05E6\u05D9\u05DD: \u05E9\u05D9\u05E8 \u05E7\u05E6\u05E8, \u05DE\u05D7\u05D5\u05E8\u05D6, \u05E2\u05DC \u05D4\u05D9\u05DD \u05D1\u05DC\u05D9\u05DC\u05D4.'},en:{q:'What is wrong with "write something nice"?',a:["It is too long",'"Nice" means something different to everyone','The word "something" confuses the model more than any other'],why:'Praise words describe nothing. Instead of "nice", say exactly what you want: a short rhyming poem about the sea at night.'}},{id:"prompt-format-ask",tier:1,topic:"prompt",correct:2,he:{q:"\u05E8\u05D5\u05E6\u05D9\u05DD \u05DC\u05E7\u05D1\u05DC \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05D8\u05D1\u05DC\u05D4. \u05DE\u05D4 \u05E2\u05D5\u05E9\u05D9\u05DD?",a:["\u05DE\u05E7\u05D5\u05D5\u05D9\u05DD \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D1\u05D7\u05E8 \u05D1\u05D8\u05D1\u05DC\u05D4 \u05D1\u05E2\u05E6\u05DE\u05D5",'\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD "\u05DE\u05E1\u05D5\u05D3\u05E8 \u05D1\u05D1\u05E7\u05E9\u05D4"',"\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05D8\u05D1\u05DC\u05D4 \u05D1\u05DE\u05E4\u05D5\u05E8\u05E9, \u05D5\u05D0\u05D9\u05DC\u05D5 \u05E2\u05DE\u05D5\u05D3\u05D5\u05EA \u05E9\u05D9\u05D4\u05D9\u05D5 \u05D1\u05D4"],why:"\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05DE\u05E0\u05D7\u05E9 \u05E4\u05D5\u05E8\u05DE\u05D8. \u05D1\u05E7\u05E9\u05D4 \u05DC\u05D8\u05D1\u05DC\u05D4 \u05E2\u05DD \u05E8\u05E9\u05D9\u05DE\u05EA \u05D4\u05E2\u05DE\u05D5\u05D3\u05D5\u05EA \u05DE\u05D7\u05D6\u05D9\u05E8\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05EA \u05D6\u05D4, \u05D1\u05DC\u05D9 \u05E1\u05D1\u05D1 \u05EA\u05D9\u05E7\u05D5\u05E0\u05D9\u05DD."},en:{q:"You want the answer as a table. What do you do?",a:["Hope the model picks a table by itself",'Write "make it tidy please"',"Ask for a table outright, and which columns it should have"],why:"The model does not guess format. Asking for a table and listing the columns returns exactly that, with no round of fixes."}},{id:"prompt-language-ask",tier:1,topic:"prompt",correct:0,he:{q:"\u05E8\u05D5\u05E6\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05D2\u05DD \u05D1\u05E9\u05D0\u05DC\u05D4 \u05D8\u05DB\u05E0\u05D9\u05EA. \u05DE\u05D4 \u05D4\u05DB\u05D9 \u05D1\u05D8\u05D5\u05D7?",a:["\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05E9\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05EA\u05D4\u05D9\u05D4 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA","\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05D5\u05DC\u05D4\u05E0\u05D9\u05D7 \u05E9\u05D2\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05EA\u05D4\u05D9\u05D4 \u05DB\u05D6\u05D0\u05EA","\u05DC\u05D1\u05E7\u05E9 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E7\u05E6\u05E8\u05D4, \u05DB\u05D9 \u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05E7\u05E6\u05E8\u05D5\u05EA \u05D9\u05D5\u05E6\u05D0\u05D5\u05EA \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA"],why:"\u05DC\u05E8\u05D5\u05D1 \u05E4\u05E8\u05D5\u05DE\u05E4\u05D8 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u05DE\u05D7\u05D6\u05D9\u05E8 \u05E2\u05D1\u05E8\u05D9\u05EA, \u05D0\u05D1\u05DC \u05DC\u05D0 \u05EA\u05DE\u05D9\u05D3 \u2014 \u05D1\u05D9\u05D9\u05D7\u05D5\u05D3 \u05D1\u05E0\u05D5\u05E9\u05D0\u05D9\u05DD \u05D8\u05DB\u05E0\u05D9\u05D9\u05DD. \u05E9\u05D5\u05E8\u05D4 \u05D0\u05D7\u05EA \u05DE\u05E4\u05D5\u05E8\u05E9\u05EA \u05E1\u05D5\u05D2\u05E8\u05EA \u05D0\u05EA \u05D4\u05E2\u05E0\u05D9\u05D9\u05DF."},en:{q:"You want a Hebrew answer even on a technical question. What is safest?",a:["Write in the prompt that the answer should be in Hebrew","Write the request in Hebrew and assume the answer follows","Ask for a short answer, since short answers come back in Hebrew"],why:"A Hebrew prompt usually returns Hebrew \u2014 but not always, especially on technical topics. One explicit line settles it."}},{id:"prompt-one-thing",tier:1,topic:"prompt",correct:1,he:{q:"\u05D9\u05E9 \u05E9\u05DC\u05D5\u05E9 \u05E9\u05D0\u05DC\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA. \u05DE\u05D4 \u05E2\u05D3\u05D9\u05E3 \u05DC\u05E2\u05E9\u05D5\u05EA?",a:["\u05DC\u05D3\u05D7\u05D5\u05E1 \u05D0\u05EA \u05E9\u05DC\u05D5\u05E9\u05EA\u05DF \u05DC\u05DE\u05E9\u05E4\u05D8 \u05D0\u05D7\u05D3","\u05DC\u05E9\u05D0\u05D5\u05DC \u05D0\u05D7\u05EA \u05D0\u05D7\u05E8\u05D9 \u05D4\u05E9\u05E0\u05D9\u05D9\u05D4","\u05DC\u05E9\u05D0\u05D5\u05DC \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E7\u05DC\u05D4 \u05DE\u05D1\u05D9\u05E0\u05D9\u05D4\u05DF \u05D5\u05DC\u05D5\u05D5\u05EA\u05E8 \u05E2\u05DC \u05D4\u05E9\u05D0\u05E8"],why:"\u05D1\u05D4\u05D5\u05D3\u05E2\u05D4 \u05E2\u05DE\u05D5\u05E1\u05D4 \u05D9\u05E9 \u05E1\u05D9\u05DB\u05D5\u05D9 \u05D8\u05D5\u05D1 \u05E9\u05D7\u05DC\u05E7 \u05DE\u05D4\u05E9\u05D0\u05DC\u05D5\u05EA \u05D9\u05D9\u05D1\u05DC\u05E2\u05D5. \u05E9\u05D0\u05DC\u05D4 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD \u05DE\u05E7\u05D1\u05DC\u05EA \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DE\u05DC\u05D0\u05D4, \u05D5\u05D0\u05E4\u05E9\u05E8 \u05DC\u05D4\u05DE\u05E9\u05D9\u05DA \u05DE\u05E9\u05DD."},en:{q:"You have three different questions. What is better?",a:["Cram all three into one sentence","Ask them one after another","Ask only the easy one and give up on the rest"],why:"In a crowded message some questions get swallowed. One question at a time gets a full answer, and you can build from there."}},{id:"prompt-context-what",tier:2,topic:"prompt",correct:2,he:{q:'\u05DE\u05D4 \u05D6\u05D4 "\u05D4\u05E7\u05E9\u05E8" \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8?',a:["\u05D4\u05DE\u05D9\u05DC\u05D9\u05DD \u05D4\u05DE\u05E0\u05D5\u05DE\u05E1\u05D5\u05EA \u05D1\u05D4\u05EA\u05D7\u05DC\u05D4","\u05D4\u05D0\u05D5\u05E8\u05DA \u05D5\u05D4\u05E4\u05D5\u05E8\u05DE\u05D8 \u05E9\u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05E9\u05D9\u05D4\u05D9\u05D5 \u05DC\u05EA\u05E9\u05D5\u05D1\u05D4","\u05D4\u05DE\u05D9\u05D3\u05E2 \u05D4\u05E0\u05D5\u05E1\u05E3 \u05E9\u05E2\u05D5\u05D6\u05E8 \u05DC\u05D4\u05D1\u05D9\u05DF \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4"],why:"\u05D4\u05E7\u05E9\u05E8 \u05D4\u05D5\u05D0 \u05DB\u05DC \u05DE\u05D4 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D0 \u05D9\u05DB\u05D5\u05DC \u05DC\u05D3\u05E2\u05EA \u05DC\u05D1\u05D3: \u05DC\u05D0\u05D9\u05D6\u05D5 \u05DB\u05D9\u05EA\u05D4, \u05DC\u05D0\u05D9\u05D6\u05D5 \u05DE\u05D8\u05E8\u05D4, \u05DE\u05D4 \u05DB\u05D1\u05E8 \u05E0\u05D9\u05E1\u05D5. \u05D4\u05D5\u05D0 \u05E9\u05D4\u05D5\u05E4\u05DA \u05EA\u05E9\u05D5\u05D1\u05D4 \u05DB\u05DC\u05DC\u05D9\u05EA \u05DC\u05DE\u05EA\u05D0\u05D9\u05DE\u05D4."},en:{q:'What is "context" in a prompt?',a:["The polite words at the start","The length and the format you are asking the answer to come in","The extra information that helps make sense of the request"],why:"Context is everything the model cannot know by itself: which class, what for, what was already tried. It turns a generic answer into a fitting one."}},{id:"tokens-not-words",tier:1,topic:"tokens",correct:1,he:{q:"\u05D4\u05D0\u05DD \u05D8\u05D5\u05E7\u05DF \u05D6\u05D4 \u05EA\u05DE\u05D9\u05D3 \u05DE\u05D9\u05DC\u05D4 \u05E9\u05DC\u05DE\u05D4?",a:["\u05DB\u05DF, \u05DB\u05DC \u05DE\u05D9\u05DC\u05D4 \u05D1\u05DE\u05E9\u05E4\u05D8 \u05D4\u05D9\u05D0 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D8\u05D5\u05E7\u05DF \u05D0\u05D7\u05D3","\u05DC\u05D0 \u2014 \u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05D7\u05E6\u05D9 \u05DE\u05D9\u05DC\u05D4 \u05D0\u05D5 \u05E1\u05D9\u05DE\u05DF \u05E4\u05D9\u05E1\u05D5\u05E7","\u05DB\u05DF, \u05D0\u05D1\u05DC \u05E8\u05E7 \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA"],why:"\u05DE\u05D9\u05DC\u05D9\u05DD \u05D0\u05E8\u05D5\u05DB\u05D5\u05EA \u05DE\u05EA\u05E4\u05E8\u05E7\u05D5\u05EA \u05DC\u05DB\u05DE\u05D4 \u05D7\u05EA\u05D9\u05DB\u05D5\u05EA, \u05D5\u05E4\u05E1\u05D9\u05E7 \u05D4\u05D5\u05D0 \u05D7\u05EA\u05D9\u05DB\u05D4 \u05D1\u05E4\u05E0\u05D9 \u05E2\u05E6\u05DE\u05D5. \u05DC\u05DB\u05DF \u05E1\u05E4\u05D9\u05E8\u05EA \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05DB\u05DE\u05E2\u05D8 \u05D0\u05E3 \u05E4\u05E2\u05DD \u05DC\u05D0 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E1\u05E4\u05D9\u05E8\u05EA \u05DE\u05D9\u05DC\u05D9\u05DD."},en:{q:"Is a token always a whole word?",a:["Yes, every word in a sentence is exactly one token","No \u2014 sometimes half a word or a punctuation mark","Yes, but only in English"],why:"Long words split into several chunks, and a comma is a chunk of its own. That is why a token count almost never equals a word count."}},{id:"tokens-why-count",tier:1,topic:"tokens",correct:2,he:{q:"\u05DC\u05DE\u05D4 \u05D1\u05DB\u05DC\u05DC \u05E1\u05D5\u05E4\u05E8\u05D9\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD?",a:["\u05DB\u05D3\u05D9 \u05DC\u05D3\u05E2\u05EA \u05DB\u05DE\u05D4 \u05E9\u05D0\u05DC\u05D5\u05EA \u05E0\u05E9\u05D0\u05DC\u05D5 \u05D4\u05D9\u05D5\u05DD","\u05DB\u05D3\u05D9 \u05DC\u05EA\u05EA \u05E6\u05D9\u05D5\u05DF \u05DC\u05D0\u05D9\u05DB\u05D5\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05D4\u05EA\u05E7\u05D1\u05DC\u05D4","\u05DB\u05D9 \u05D4\u05DD \u05DE\u05D5\u05D3\u05D3\u05D9\u05DD \u05DB\u05DE\u05D4 \u05E2\u05D1\u05D5\u05D3\u05D4 \u05E0\u05E2\u05E9\u05EA\u05D4"],why:"\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D4\u05DD \u05D9\u05D7\u05D9\u05D3\u05EA \u05D4\u05DE\u05D9\u05D3\u05D4 \u05E9\u05DC \u05D4\u05D8\u05E7\u05E1\u05D8: \u05DB\u05DE\u05D4 \u05E0\u05E7\u05E8\u05D0 \u05D5\u05DB\u05DE\u05D4 \u05E0\u05DB\u05EA\u05D1. \u05DC\u05E4\u05D9 \u05D6\u05D4 \u05E0\u05DE\u05D3\u05D3\u05D9\u05DD \u05D4\u05D6\u05DE\u05DF, \u05D4\u05E2\u05DC\u05D5\u05EA \u05D5\u05D4\u05DE\u05E7\u05D5\u05DD \u05E9\u05E0\u05E9\u05D0\u05E8 \u05D1\u05E9\u05D9\u05D7\u05D4."},en:{q:"Why count tokens at all?",a:["To know how many questions were asked","To grade the quality of the answer that came back","Because they measure the work done"],why:"Tokens are the unit of text: how much was read and how much was written. Time, cost and remaining room in the chat are all measured by them."}},{id:"tokens-filler-words",tier:1,topic:"tokens",correct:0,he:{q:"\u05DE\u05D4 \u05E7\u05D5\u05E8\u05D4 \u05DB\u05E9\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05DE\u05D9\u05DC\u05D9\u05DD \u05E9\u05DC\u05D0 \u05DE\u05D5\u05E1\u05D9\u05E4\u05D5\u05EA \u05DE\u05D9\u05D3\u05E2?",a:["\u05DE\u05E9\u05DC\u05DE\u05D9\u05DD \u05E2\u05DC\u05D9\u05D4\u05DF \u05D1\u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05DC\u05D9 \u05DC\u05E7\u05D1\u05DC \u05EA\u05DE\u05D5\u05E8\u05D4","\u05D4\u05DE\u05D5\u05D3\u05DC \u05DE\u05D5\u05D7\u05E7 \u05D0\u05D5\u05EA\u05DF \u05DC\u05D1\u05D3, \u05D0\u05D6 \u05D0\u05D9\u05DF \u05DC\u05D6\u05D4 \u05E9\u05D5\u05DD \u05D4\u05E9\u05E4\u05E2\u05D4","\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05E0\u05E2\u05E9\u05D9\u05EA \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA \u05D9\u05D5\u05EA\u05E8"],why:'\u05DB\u05DC \u05DE\u05D9\u05DC\u05D4 \u05E0\u05E1\u05E4\u05E8\u05EA, \u05D2\u05DD "\u05D1\u05D1\u05E7\u05E9\u05D4 \u05D1\u05D1\u05E7\u05E9\u05D4 \u05DE\u05D0\u05D5\u05D3". \u05E2\u05D3\u05D9\u05E3 \u05DC\u05D4\u05E9\u05E7\u05D9\u05E2 \u05D0\u05EA \u05D0\u05D5\u05EA\u05DD \u05D8\u05D5\u05E7\u05E0\u05D9\u05DD \u05D1\u05E4\u05E8\u05D8 \u05E9\u05D1\u05D0\u05DE\u05EA \u05DE\u05DB\u05D5\u05D5\u05DF \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4.'},en:{q:"What happens when you add words that add no information?",a:["You pay for them in tokens and get nothing back","The model deletes them by itself, so nothing changes","The answer becomes more accurate"],why:'Every word counts, including "please oh please". Better to spend those same tokens on a detail that actually steers the answer.'}},{id:"iterate-say-what-wrong",tier:1,topic:"iterate",correct:2,he:{q:"\u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05E8\u05D5\u05DB\u05D4 \u05DE\u05D3\u05D9. \u05DE\u05D4 \u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05E2\u05DB\u05E9\u05D9\u05D5?",a:['"\u05DC\u05D0 \u05D0\u05D4\u05D1\u05EA\u05D9"','"\u05DC\u05E0\u05E1\u05D5\u05EA \u05E9\u05D5\u05D1, \u05D0\u05D5\u05DC\u05D9 \u05D4\u05E4\u05E2\u05DD \u05D6\u05D4 \u05D9\u05D9\u05E6\u05D0 \u05D8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8"','"\u05DC\u05E7\u05E6\u05E8 \u05DC\u05E9\u05DC\u05D5\u05E9 \u05E9\u05D5\u05E8\u05D5\u05EA \u05D5\u05DC\u05D4\u05E9\u05D0\u05D9\u05E8 \u05E8\u05E7 \u05D0\u05EA \u05D4\u05E2\u05D9\u05E7\u05E8"'],why:"\u05D1\u05D9\u05E7\u05D5\u05E8\u05EA \u05DE\u05D3\u05D5\u05D9\u05E7\u05EA \u05D4\u05D9\u05D0 \u05DB\u05D1\u05E8 \u05D4\u05D5\u05E8\u05D0\u05EA \u05EA\u05D9\u05E7\u05D5\u05DF. \u05DB\u05E9\u05D0\u05D5\u05DE\u05E8\u05D9\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DE\u05D4 \u05DC\u05D4\u05D7\u05DC\u05D9\u05E3, \u05D4\u05E1\u05D9\u05D1\u05D5\u05D1 \u05D4\u05D1\u05D0 \u05DB\u05DE\u05E2\u05D8 \u05EA\u05DE\u05D9\u05D3 \u05E7\u05D5\u05DC\u05E2."},en:{q:"The answer is too long. What do you write now?",a:['"I did not like it"','"Try again \u2014 maybe this time it comes out better"','"Cut it to three lines and keep only the main point"'],why:"Precise criticism is already a repair instruction. Say exactly what to swap and the next round almost always lands."}},{id:"iterate-ask-options",tier:1,topic:"iterate",correct:0,he:{q:"\u05DC\u05D0 \u05D1\u05D8\u05D5\u05D7\u05D9\u05DD \u05D0\u05D9\u05D6\u05D4 \u05DB\u05D9\u05D5\u05D5\u05DF \u05DE\u05EA\u05D0\u05D9\u05DD. \u05DE\u05D4 \u05E9\u05D5\u05D5\u05D4 \u05DC\u05D1\u05E7\u05E9?",a:["\u05E9\u05DC\u05D5\u05E9 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D9\u05D5\u05EA \u05E9\u05D5\u05E0\u05D5\u05EA \u05D6\u05D5 \u05DE\u05D6\u05D5, \u05D5\u05D0\u05D6 \u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05D0\u05D7\u05EA","\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D0\u05D7\u05EA \u05DE\u05E4\u05D5\u05E8\u05D8\u05EA \u05DE\u05D0\u05D5\u05D3 \u05E9\u05DE\u05DB\u05E1\u05D4 \u05D0\u05EA \u05DB\u05DC \u05D4\u05DB\u05D9\u05D5\u05D5\u05E0\u05D9\u05DD \u05D1\u05D9\u05D7\u05D3","\u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D9\u05D1\u05D7\u05E8 \u05D0\u05EA \u05D4\u05DB\u05D9\u05D5\u05D5\u05DF \u05D4\u05DB\u05D9 \u05E4\u05D5\u05E4\u05D5\u05DC\u05E8\u05D9 \u05D1\u05D9\u05DF \u05DB\u05DC \u05D4\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD"],why:"\u05E7\u05DC \u05D1\u05D4\u05E8\u05D1\u05D4 \u05DC\u05D1\u05D7\u05D5\u05E8 \u05DE\u05EA\u05D5\u05DA \u05E9\u05DC\u05D5\u05E9 \u05D0\u05E4\u05E9\u05E8\u05D5\u05D9\u05D5\u05EA \u05DE\u05D0\u05E9\u05E8 \u05DC\u05EA\u05D0\u05E8 \u05DE\u05E8\u05D0\u05E9 \u05DE\u05D4 \u05E8\u05D5\u05E6\u05D9\u05DD. \u05D0\u05D7\u05E8\u05D9 \u05D4\u05D1\u05D7\u05D9\u05E8\u05D4 \u05DE\u05E2\u05DE\u05D9\u05E7\u05D9\u05DD \u05E8\u05E7 \u05D1\u05DB\u05D9\u05D5\u05D5\u05DF \u05D0\u05D7\u05D3."},en:{q:"Not sure which direction fits. What is worth asking for?",a:["Three options that differ from each other, then pick one","One very detailed answer covering all the directions at once","For the model to pick whichever direction most users prefer"],why:"Choosing between three options is far easier than describing what you want up front. After choosing, go deep on one direction only."}},{id:"mistakes-old-info",tier:2,topic:"mistakes",correct:1,he:{q:"\u05E9\u05D0\u05DC\u05D5 AI \u05E2\u05DC \u05DE\u05E9\u05D4\u05D5 \u05E9\u05E7\u05E8\u05D4 \u05D4\u05E9\u05D1\u05D5\u05E2. \u05DC\u05DE\u05D4 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05D1\u05D3\u05D5\u05E7?",a:["\u05DB\u05D9 \u05D4\u05D5\u05D0 \u05E9\u05D5\u05DB\u05D7 \u05DE\u05D9\u05D3\u05E2 \u05D9\u05E9\u05DF \u05D0\u05D7\u05E8\u05D9 \u05DB\u05DE\u05D4 \u05D7\u05D5\u05D3\u05E9\u05D9\u05DD \u05D1\u05DC\u05D9 \u05E9\u05D9\u05DE\u05D5\u05E9","\u05DB\u05D9 \u05D4\u05D9\u05D3\u05E2 \u05E9\u05DC\u05D5 \u05E0\u05E2\u05E6\u05E8 \u05D1\u05EA\u05D0\u05E8\u05D9\u05DA, \u05D0\u05DC\u05D0 \u05D0\u05DD \u05D7\u05D9\u05E4\u05E9 \u05DE\u05DE\u05E9 \u05E2\u05DB\u05E9\u05D9\u05D5","\u05DB\u05D9 \u05D7\u05D3\u05E9\u05D5\u05EA \u05DE\u05D2\u05D9\u05E2\u05D5\u05EA \u05D0\u05DC\u05D9\u05D5 \u05EA\u05DE\u05D9\u05D3 \u05D1\u05D0\u05D9\u05D7\u05D5\u05E8 \u05E9\u05DC \u05D9\u05D5\u05DD \u05D1\u05D3\u05D9\u05D5\u05E7"],why:"\u05D4\u05D0\u05D9\u05DE\u05D5\u05DF \u05E0\u05E2\u05E6\u05E8 \u05D1\u05E0\u05E7\u05D5\u05D3\u05EA \u05D6\u05DE\u05DF \u05DB\u05DC\u05E9\u05D4\u05D9. \u05D7\u05DC\u05E7 \u05DE\u05D4\u05DB\u05DC\u05D9\u05DD \u05D9\u05D5\u05D3\u05E2\u05D9\u05DD \u05D2\u05DD \u05DC\u05D7\u05E4\u05E9 \u05D1\u05E8\u05E9\u05EA \u05EA\u05D5\u05DA \u05DB\u05D3\u05D9 \u2014 \u05D5\u05D0\u05D6 \u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05DC\u05E8\u05D0\u05D5\u05EA \u05D0\u05EA \u05D4\u05E7\u05D9\u05E9\u05D5\u05E8 \u05E2\u05E6\u05DE\u05D5."},en:{q:"You asked an AI about something from this week. Why check it?",a:["Because it forgets older information after a few unused months","Because its knowledge stops at a date, unless it just searched","Because news always reaches it exactly one day late"],why:"Training stopped at some point in time. Some tools can also search the web as they go \u2014 in which case, ask to see the link itself."}},{id:"mistakes-homework",tier:1,topic:"mistakes",correct:2,he:{q:"\u05DE\u05D4 \u05E0\u05DB\u05D5\u05DF \u05DC\u05E2\u05E9\u05D5\u05EA \u05E2\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05E9\u05DC AI \u05D1\u05E9\u05D9\u05E2\u05D5\u05E8\u05D9 \u05D1\u05D9\u05EA?",a:["\u05DC\u05D4\u05E2\u05EA\u05D9\u05E7 \u05D0\u05D5\u05EA\u05D4 \u05D5\u05DC\u05E9\u05E0\u05D5\u05EA \u05E7\u05E6\u05EA \u05DE\u05D9\u05DC\u05D9\u05DD \u05DB\u05D3\u05D9 \u05E9\u05EA\u05D9\u05E9\u05DE\u05E2 \u05D0\u05D7\u05E8\u05EA","\u05DC\u05D4\u05E9\u05EA\u05DE\u05E9 \u05D1\u05D4 \u05DB\u05DE\u05D5 \u05E9\u05D4\u05D9\u05D0 \u05D5\u05DC\u05E6\u05D9\u05D9\u05DF \u05D1\u05E1\u05D5\u05E3 \u05E9\u05D4\u05D9\u05D0 \u05E0\u05DB\u05EA\u05D1\u05D4 \u05D1\u05BEAI","\u05DC\u05E7\u05E8\u05D5\u05D0, \u05DC\u05D4\u05D1\u05D9\u05DF, \u05DC\u05D1\u05D3\u05D5\u05E7 \u05D5\u05DC\u05DB\u05EA\u05D5\u05D1 \u05D0\u05EA \u05D6\u05D4 \u05D1\u05E1\u05D2\u05E0\u05D5\u05DF \u05E9\u05DC\u05E0\u05D5"],why:"\u05D4\u05D7\u05DC\u05E4\u05EA \u05DE\u05D9\u05DC\u05D9\u05DD \u05DC\u05D0 \u05D4\u05D5\u05E4\u05DB\u05EA \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05DC\u05E9\u05DC\u05E0\u05D5, \u05D5\u05D2\u05DD \u05DC\u05D0 \u05DE\u05DC\u05DE\u05D3\u05EA \u05DB\u05DC\u05D5\u05DD. \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05D1\u05D9\u05E0\u05D9\u05DD \u05DE\u05EA\u05D2\u05DC\u05D4 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D1\u05E9\u05D9\u05E2\u05D5\u05E8 \u05D4\u05D1\u05D0."},en:{q:"What is the right thing to do with an AI answer in homework?",a:["Copy it and swap a few words so it sounds different","Use it as is and note at the end that AI wrote it","Read it, understand it, check it and write it in your own voice"],why:"Swapping words does not make the answer yours, and teaches nothing. Whatever you did not understand surfaces in the very next lesson."}},{id:"mistakes-private-info",tier:1,topic:"mistakes",correct:0,he:{q:"\u05D0\u05D9\u05D6\u05D4 \u05DE\u05D9\u05D3\u05E2 \u05DC\u05D0 \u05DB\u05D3\u05D0\u05D9 \u05DC\u05DB\u05EA\u05D5\u05D1 \u05DC\u05E6\u05F3\u05D0\u05D8 \u05E9\u05DC AI?",a:["\u05DB\u05EA\u05D5\u05D1\u05EA, \u05DE\u05E1\u05E4\u05E8 \u05D8\u05DC\u05E4\u05D5\u05DF \u05D5\u05E1\u05D9\u05E1\u05DE\u05D0\u05D5\u05EA","\u05E9\u05DD \u05E9\u05DC \u05D7\u05D9\u05D9\u05EA \u05DE\u05D7\u05DE\u05D3 \u05D1\u05EA\u05D5\u05DA \u05E1\u05D9\u05E4\u05D5\u05E8","\u05E9\u05D0\u05DC\u05D5\u05EA \u05E2\u05DC \u05E9\u05D9\u05E2\u05D5\u05E8\u05D9 \u05D1\u05D9\u05EA"],why:"\u05E4\u05E8\u05D8\u05D9\u05DD \u05D0\u05D9\u05E9\u05D9\u05D9\u05DD \u05DC\u05D0 \u05E6\u05E8\u05D9\u05DB\u05D9\u05DD \u05DC\u05D4\u05D9\u05DB\u05E0\u05E1 \u05DC\u05E9\u05D9\u05D7\u05D4 \u05D1\u05DB\u05DC\u05DC. \u05D0\u05E4\u05E9\u05E8 \u05DC\u05EA\u05D0\u05E8 \u05D0\u05EA \u05D4\u05D1\u05E2\u05D9\u05D4 \u05D1\u05DC\u05D9 \u05D4\u05E4\u05E8\u05D8\u05D9\u05DD \u05D4\u05DE\u05D6\u05D4\u05D9\u05DD \u05D5\u05DC\u05E7\u05D1\u05DC \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D0\u05D5\u05EA\u05D4 \u05E2\u05D6\u05E8\u05D4."},en:{q:"What information should not go into an AI chat?",a:["An address, a phone number and passwords","A pet's name inside a story","Questions about homework"],why:"Personal details do not belong in the conversation at all. Describe the problem without the identifying bits and get exactly the same help."}},{id:"ai-training-vs-use",tier:2,topic:"whatai",correct:2,he:{q:"\u05DE\u05D4 \u05D4\u05D4\u05D1\u05D3\u05DC \u05D1\u05D9\u05DF \u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05D1\u05D9\u05DF \u05E9\u05D9\u05DE\u05D5\u05E9 \u05D1\u05D5?",a:["\u05D0\u05D9\u05DF \u05E9\u05D5\u05DD \u05D4\u05D1\u05D3\u05DC \u05D0\u05DE\u05D9\u05EA\u05D9, \u05DE\u05D3\u05D5\u05D1\u05E8 \u05D1\u05D3\u05D9\u05D5\u05E7 \u05D1\u05D0\u05D5\u05EA\u05D5 \u05EA\u05D4\u05DC\u05D9\u05DA","\u05D1\u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4, \u05D5\u05D1\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3","\u05D1\u05D0\u05D9\u05DE\u05D5\u05DF \u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3, \u05D1\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4"],why:"\u05D4\u05D0\u05D9\u05DE\u05D5\u05DF \u05E7\u05E8\u05D4 \u05E4\u05E2\u05DD \u05D0\u05D7\u05EA, \u05D4\u05E8\u05D1\u05D4 \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05D2\u05D9\u05E2 \u05D0\u05DC\u05D9\u05E0\u05D5. \u05E9\u05D9\u05D7\u05D4 \u05D0\u05D9\u05EA\u05D5 \u05DC\u05D0 \u05DE\u05DC\u05DE\u05D3\u05EA \u05D0\u05D5\u05EA\u05D5 \u2014 \u05D4\u05D9\u05D0 \u05E8\u05E7 \u05DE\u05E9\u05EA\u05DE\u05E9\u05EA \u05D1\u05DE\u05D4 \u05E9\u05DB\u05D1\u05E8 \u05E0\u05DC\u05DE\u05D3."},en:{q:"What is the difference between training a model and using it?",a:["No real difference \u2014 training and using are the same process","In training it answers, in use it learns","It learns in training, answers in use"],why:"Training happened once, long before the model reached you. Chatting does not teach it \u2014 it only uses what was already learned."}},{id:"ai-bias",tier:2,topic:"whatai",correct:1,he:{q:"\u05DC\u05DE\u05D4 \u05D7\u05E9\u05D5\u05D1 \u05D0\u05D9\u05D6\u05D4 \u05DE\u05D9\u05D3\u05E2 \u05E0\u05DB\u05E0\u05E1 \u05DC\u05D0\u05D9\u05DE\u05D5\u05DF \u05E9\u05DC AI?",a:["\u05DB\u05D9 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05D3\u05D9 \u05DE\u05D9\u05D3\u05E2 \u05DE\u05D0\u05D8 \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC","\u05DB\u05D9 \u05D0\u05DD \u05D4\u05DE\u05D9\u05D3\u05E2 \u05DE\u05D5\u05D8\u05D4, \u05D2\u05DD \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D9\u05D9\u05E6\u05D0\u05D5 \u05DE\u05D5\u05D8\u05D5\u05EA","\u05DB\u05D9 \u05DE\u05D9\u05D3\u05E2 \u05D9\u05E9\u05DF \u05DE\u05EA\u05E2\u05E8\u05D1\u05D1 \u05D0\u05E6\u05DC\u05D5 \u05E2\u05DD \u05DE\u05D9\u05D3\u05E2 \u05D7\u05D3\u05E9 \u05D9\u05D5\u05EA\u05E8"],why:"\u05DE\u05D5\u05D3\u05DC \u05DC\u05D5\u05DE\u05D3 \u05DE\u05DE\u05D4 \u05E9\u05D4\u05E8\u05D0\u05D5 \u05DC\u05D5. \u05D0\u05DD \u05D1\u05DB\u05DC \u05D4\u05E1\u05D9\u05E4\u05D5\u05E8\u05D9\u05DD \u05E9\u05E7\u05E8\u05D0 \u05E8\u05E7 \u05D1\u05E0\u05D9\u05DD \u05DE\u05E9\u05D7\u05E7\u05D9\u05DD \u05DB\u05D3\u05D5\u05E8\u05D2\u05DC, \u05D6\u05D4 \u05DE\u05D4 \u05E9\u05D9\u05D9\u05E6\u05D0 \u05DC\u05D5 \u2014 \u05D5\u05D6\u05D0\u05EA \u05DC\u05D0 \u05D4\u05D0\u05DE\u05EA \u05E2\u05DC \u05D4\u05E2\u05D5\u05DC\u05DD."},en:{q:"Why does it matter which data goes into training an AI?",a:["Because too much data slows the model down","Because if the data is skewed, the answers come out skewed too","Because older data gets muddled together with the newer data"],why:"A model learns from what it was shown. If every story it read had only boys playing football, that is what comes out \u2014 and that is not the truth about the world."}},{id:"ai-not-search",tier:2,topic:"whatai",correct:0,he:{q:"\u05D1\u05DE\u05D4 \u05DE\u05D5\u05D3\u05DC \u05E9\u05E4\u05D4 \u05E9\u05D5\u05E0\u05D4 \u05DE\u05DE\u05E0\u05D5\u05E2 \u05D7\u05D9\u05E4\u05D5\u05E9?",a:["\u05D4\u05D5\u05D0 \u05DE\u05E0\u05E1\u05D7 \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E2\u05E6\u05DE\u05D5 \u05D1\u05DE\u05E7\u05D5\u05DD \u05DC\u05D4\u05E8\u05D0\u05D5\u05EA \u05E8\u05E9\u05D9\u05DE\u05EA \u05D3\u05E4\u05D9\u05DD","\u05D4\u05D5\u05D0 \u05DE\u05D7\u05D6\u05D9\u05E7 \u05D1\u05EA\u05D5\u05DB\u05D5 \u05E2\u05D5\u05EA\u05E7 \u05DE\u05DC\u05D0 \u05D5\u05DE\u05E2\u05D5\u05D3\u05DB\u05DF \u05E9\u05DC \u05DB\u05DC \u05D4\u05D0\u05D9\u05E0\u05D8\u05E8\u05E0\u05D8","\u05D4\u05D5\u05D0 \u05D1\u05D5\u05D3\u05E7 \u05DB\u05DC \u05E2\u05D5\u05D1\u05D3\u05D4 \u05D1\u05E9\u05DC\u05D5\u05E9\u05D4 \u05D0\u05EA\u05E8\u05D9\u05DD \u05DC\u05E4\u05E0\u05D9 \u05E9\u05D4\u05D5\u05D0 \u05E2\u05D5\u05E0\u05D4"],why:"\u05D7\u05D9\u05E4\u05D5\u05E9 \u05DE\u05D7\u05D6\u05D9\u05E8 \u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05E9\u05D0\u05E4\u05E9\u05E8 \u05DC\u05E4\u05EA\u05D5\u05D7; \u05DE\u05D5\u05D3\u05DC \u05DE\u05E0\u05E1\u05D7 \u05EA\u05E9\u05D5\u05D1\u05D4. \u05D2\u05DD \u05DB\u05E9\u05D4\u05D5\u05D0 \u05DB\u05DF \u05DE\u05D7\u05E4\u05E9 \u05D1\u05E8\u05E9\u05EA, \u05D0\u05EA \u05D4\u05E0\u05D9\u05E1\u05D5\u05D7 \u05D4\u05D5\u05D0 \u05E2\u05D3\u05D9\u05D9\u05DF \u05DB\u05D5\u05EA\u05D1 \u05D1\u05E2\u05E6\u05DE\u05D5."},en:{q:"How is a language model different from a search engine?",a:["It writes the answer itself instead of listing pages","It holds a full, up-to-date copy of the whole internet inside it","It checks every fact on three websites before it answers"],why:"Search hands back sources you can open; a model writes an answer. Even when it does search the web, the wording is still its own."}},{id:"ai-memory-chat",tier:2,topic:"whatai",correct:2,he:{q:"\u05DE\u05D4 \u05D4\u05DE\u05D5\u05D3\u05DC \u05E7\u05D5\u05E8\u05D0 \u05DC\u05E4\u05E0\u05D9 \u05DB\u05DC \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E9\u05D9\u05D7\u05D4?",a:["\u05D0\u05EA \u05DB\u05DC \u05DE\u05D4 \u05E9\u05E0\u05DB\u05EA\u05D1 \u05DC\u05D5 \u05D0\u05D9 \u05E4\u05E2\u05DD, \u05D1\u05DB\u05DC \u05D4\u05E9\u05D9\u05D7\u05D5\u05EA \u05E9\u05DC \u05DB\u05DC \u05D4\u05DE\u05E9\u05EA\u05DE\u05E9\u05D9\u05DD","\u05E8\u05E7 \u05D0\u05EA \u05D4\u05D4\u05D5\u05D3\u05E2\u05D4 \u05D4\u05D0\u05D7\u05E8\u05D5\u05E0\u05D4 \u05E9\u05E0\u05E9\u05DC\u05D7\u05D4 \u05D0\u05DC\u05D9\u05D5 \u05D1\u05E8\u05D2\u05E2 \u05D6\u05D4","\u05D0\u05EA \u05D4\u05E9\u05D9\u05D7\u05D4, \u05D5\u05E2\u05D5\u05D3 \u05D3\u05D1\u05E8\u05D9\u05DD \u05E9\u05E0\u05E9\u05DE\u05E8\u05D5 \u05DC\u05D5"],why:"\u05D4\u05D6\u05D9\u05DB\u05E8\u05D5\u05DF \u05E9\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \u05D4\u05D5\u05D0 \u05D4\u05D8\u05E7\u05E1\u05D8 \u05E9\u05DE\u05D2\u05D9\u05E9\u05D9\u05DD \u05DC\u05D5 \u05D1\u05DB\u05DC \u05E4\u05E2\u05DD: \u05D4\u05E9\u05D9\u05D7\u05D4 \u05E2\u05D3 \u05DB\u05D4, \u05D5\u05DC\u05E4\u05E2\u05DE\u05D9\u05DD \u05E1\u05D9\u05DB\u05D5\u05DE\u05D9\u05DD \u05E9\u05E0\u05E9\u05DE\u05E8\u05D5 \u05D1\u05E9\u05D1\u05D9\u05DC\u05D5. \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05E9\u05DD, \u05DC\u05D0 \u05E7\u05D9\u05D9\u05DD \u05D1\u05E9\u05D1\u05D9\u05DC\u05D5."},en:{q:"What does the model read before every answer in a chat?",a:["Everything ever written to it, in the chats of every single user","Only the single message that was just sent to it","The current chat, plus anything saved for it"],why:"The model's memory is the text handed to it each time: the chat so far, and sometimes summaries saved for it. What is not in there does not exist for it."}},{id:"prompt-constraints",tier:2,topic:"prompt",correct:1,he:{q:'\u05DE\u05D4 \u05E2\u05D5\u05E9\u05D4 \u05D4\u05D2\u05D1\u05DC\u05D4 \u05D1\u05E4\u05E8\u05D5\u05DE\u05E4\u05D8, \u05DB\u05DE\u05D5 "\u05D1\u05DC\u05D9 \u05DE\u05D9\u05DC\u05D9\u05DD \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA"?',a:["\u05DE\u05D1\u05DC\u05D1\u05DC\u05EA \u05D0\u05EA \u05D4\u05DE\u05D5\u05D3\u05DC","\u05DE\u05E6\u05DE\u05E6\u05DE\u05EA \u05D0\u05EA \u05D4\u05EA\u05E9\u05D5\u05D1\u05D5\u05EA \u05D4\u05D0\u05E4\u05E9\u05E8\u05D9\u05D5\u05EA \u05DC\u05DB\u05D9\u05D5\u05D5\u05DF \u05E9\u05E8\u05D5\u05E6\u05D9\u05DD","\u05DE\u05D0\u05E8\u05D9\u05DB\u05D4 \u05D0\u05EA \u05D6\u05DE\u05DF \u05D4\u05EA\u05E9\u05D5\u05D1\u05D4 \u05D5\u05DE\u05E7\u05E9\u05D4 \u05E2\u05DC \u05D4\u05DE\u05D5\u05D3\u05DC \u05DC\u05E2\u05E0\u05D5\u05EA"],why:"\u05D4\u05D2\u05D1\u05DC\u05D4 \u05E2\u05D5\u05D1\u05D3\u05EA \u05DB\u05DE\u05D5 \u05D2\u05D3\u05E8 \u05D1\u05DE\u05D2\u05E8\u05E9: \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05D0\u05D5\u05DE\u05E8\u05EA \u05DC\u05D0\u05DF \u05DC\u05E8\u05D5\u05E5, \u05D0\u05D1\u05DC \u05D4\u05D9\u05D0 \u05DE\u05D5\u05E6\u05D9\u05D0\u05D4 \u05DE\u05D4\u05DE\u05E9\u05D7\u05E7 \u05D0\u05EA \u05DB\u05DC \u05DE\u05D4 \u05E9\u05DC\u05D0 \u05DE\u05EA\u05D0\u05D9\u05DD."},en:{q:'What does a limit like "no slang" do in a prompt?',a:["Confuses the model","Narrows the possible answers toward the one you want","Makes the answer take longer and the model work harder"],why:"A limit works like a fence on a pitch: it does not say where to run, but it takes everything that does not fit out of the game."}},{id:"prompt-tone",tier:2,topic:"prompt",correct:0,he:{q:"\u05D0\u05D9\u05DA \u05DE\u05D1\u05E7\u05E9\u05D9\u05DD \u05EA\u05E9\u05D5\u05D1\u05D4 \u05D1\u05E1\u05D2\u05E0\u05D5\u05DF \u05DE\u05E1\u05D5\u05D9\u05DD?",a:["\u05DB\u05D5\u05EA\u05D1\u05D9\u05DD \u05D0\u05EA \u05D4\u05E1\u05D2\u05E0\u05D5\u05DF: \u05DE\u05E6\u05D7\u05D9\u05E7 \u05D0\u05D5 \u05E8\u05E9\u05DE\u05D9","\u05DE\u05D5\u05E1\u05D9\u05E4\u05D9\u05DD \u05D4\u05DE\u05D5\u05DF \u05D0\u05D9\u05DE\u05D5\u05D2\u05F3\u05D9\u05DD \u05E9\u05DE\u05EA\u05D0\u05D9\u05DE\u05D9\u05DD \u05DC\u05E1\u05D2\u05E0\u05D5\u05DF","\u05D1\u05D5\u05D7\u05E8\u05D9\u05DD \u05DE\u05D5\u05D3\u05DC \u05D0\u05D7\u05E8, \u05DB\u05D9 \u05DC\u05DB\u05DC \u05DE\u05D5\u05D3\u05DC \
