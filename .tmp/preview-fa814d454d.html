:root{
  --gold:#ffc247;
  --gold-1:#ffe9a8; --gold-2:#ffc247; --gold-3:#f59310;
  --ink:#12121c; --ink-2:#1c1c2b;
  --panel:rgba(22,22,34,.82); --panel-solid:#191926;
  --stroke:rgba(255,255,255,.10); --stroke-hi:rgba(255,255,255,.22);
  --txt:#f4f1ea; --txt-dim:#a8a29a;
  --good:#7ee081; --warn:#ffb347; --bad:#ff6b6b; --info:#6fc3ff;
  --token:#ffd66b;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-panel:0 10px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  --sh-pop:0 18px 50px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
#ui{font-family:var(--font);color:var(--txt);}
#ui *{pointer-events:none}
#ui .on{pointer-events:auto}

/* ---- layout helpers that flip correctly under RTL ---- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.fill{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}

/* Logical properties everywhere so a single rule serves both directions. */
.hud-tl{position:absolute;inset-block-start:18px;inset-inline-start:18px}
.hud-tr{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.hud-bl{position:absolute;inset-block-end:18px;inset-inline-start:18px}
.hud-br{position:absolute;inset-block-end:18px;inset-inline-end:18px}
/* Centred by auto margins between two insets, NOT by translateX(-50%) \u2014 see the
   popIn note below: transform is animation territory and a persisting keyframe
   would delete the centring half of the rule. */
.hud-tc{position:absolute;inset-block-start:14px;inset-inline:0;margin-inline:auto;
  inline-size:fit-content;max-inline-size:100%}

/* ---- surfaces ---- */
.panel{
  background:linear-gradient(180deg,rgba(40,40,58,.9),rgba(18,18,28,.92));
  border:1px solid var(--stroke); border-radius:var(--r-m);
  box-shadow:var(--sh-panel); backdrop-filter:blur(8px);
}
.panel-lift{background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(24,24,36,.96));
  border:1px solid var(--stroke-hi); border-radius:var(--r-l); box-shadow:var(--sh-pop)}

/* ---- type ---- */
.display{
  font-weight:900; letter-spacing:-.02em; line-height:.92;
  background:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.5));
  paint-order:stroke fill;
}
.display-white{background:linear-gradient(180deg,#fff 20%,#e8e2d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.rtl .label{letter-spacing:.04em}     /* Hebrew has no case; wide tracking hurts it */
.num{font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate}

/* ---- buttons ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:17px;color:#2a1c00;
  padding:14px 34px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 0 #a4620a, 0 12px 26px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4620a,0 6px 14px rgba(0,0,0,.45)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--stroke-hi);box-shadow:none;font-weight:700}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:3px solid var(--info);outline-offset:3px}

/* ---- misc ---- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1));transition:width .45s var(--ease)}
.rtl .bar>i{background:linear-gradient(270deg,var(--gold-2),var(--gold-1))}

.fade-in{animation:fadeIn .35s var(--ease) both}
.pop-in{animation:popIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* popIn animates the INDIVIDUAL transform properties (scale/translate), never
   the transform shorthand.
   It used to end on to{transform:none} and is applied with both, so its final
   frame PERSISTED as transform:none and won every cascade fight for the rest of
   the element's life. Anything that also used transform on a .pop-in element
   lost silently: the podium's .mn-side (translateY(-50%)) and .mn-bottom
   (translateX(-50%)) were never pulled back, so the standings panel hung from the
   vertical centre downwards and the button row started at the horizontal centre \u2014
   in English they printed on top of each other. .btn:hover/:active lifts and
   .mn-card.sel's selected-card lift were dead for the same reason, invisibly.
   scale/translate compose with transform instead of replacing it, so the
   only remaining rule is: DO NOT centre anything with translate: on an element
   that can also pop in \u2014 centre with auto margins between two insets, as
   .hud-tc above and .mn-side/.mn-bottom in menus.js now do. */
@keyframes popIn{from{opacity:0;scale:.9;translate:0 10px}to{opacity:1;scale:1;translate:0 0}}

@media (prefers-reduced-motion:reduce){
  .fade-in,.pop-in{animation:none}
  *{transition-duration:.01ms !important}
}

#ui .mn-root, #ui .mn-root *{pointer-events:auto}
.mn-root{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  overflow:hidden;font-family:var(--font);color:var(--txt);--pad:clamp(10px,min(3vw,3.2vh),40px)}
.mn-scrim{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(115% 80% at 50% 34%,rgba(0,0,0,0) 40%,rgba(7,5,12,.55) 100%),
    linear-gradient(180deg,rgba(9,7,16,.52) 0%,rgba(9,7,16,.02) 38%,rgba(6,4,11,.70) 100%);}
.mn-stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;padding:var(--pad);gap:clamp(6px,1.6vh,20px);overflow-y:auto;overflow-x:hidden}

/* warm focus ring \u2014 the token blue fights the gold on these screens */
.mn-root .btn:focus-visible,.mn-root .mn-card:focus-visible,
.mn-ov .btn:focus-visible,.mn-ov .mn-seg button:focus-visible,.mn-ov .mn-danger:focus-visible{
  outline:3px solid rgba(255,255,255,.92);outline-offset:3px}

.mn-center{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(6px,1.6vh,18px);width:100%}
.mn-hero{position:relative;display:flex;flex-direction:column;align-items:center}
.mn-burst{position:absolute;inset:-14% -22%;pointer-events:none;opacity:.5;
  background:

      transparent 51deg 70deg,rgba(255,205,110,.12) 70deg 75deg,transparent 75deg 96deg);
  filter:blur(3px)}
.mn-swoosh{position:absolute;inset-block-end:2%;inset-inline:2%;height:26%;pointer-events:none;
  background:radial-gradient(60% 100% at 50% 50%,rgba(255,196,80,.85),rgba(255,150,40,.22) 45%,transparent 74%);
  filter:blur(14px);opacity:.7;transform:rotate(-2deg)}
/* Flat chequer at mid-grey reads as a Photoshop transparency grid. Perspective
   tapers the squares and near-black/near-white restores the flag contrast. */
.mn-ribbon{position:absolute;inset-block-end:1%;inset-inline:13%;height:clamp(28px,4.6vh,50px);
  pointer-events:none;transform-origin:50% 100%;
  transform:rotate(-2.6deg) perspective(320px) rotateX(56deg);
  background:repeating-conic-gradient(#ffffff 0% 25%,#0d0b14 0% 50%) 0 0/26px 26px;
  -webkit-mask-image:radial-gradient(72% 120% at 50% 40%,#000 30%,transparent 78%);
  mask-image:radial-gradient(72% 120% at 50% 40%,#000 30%,transparent 78%);

  height:clamp(18px,3vh,32px);transform:rotate(6deg) perspective(280px) rotateX(62deg);
  background-size:18px 18px;opacity:.85}
.mn-logo{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;
  line-height:.86}
/* Hebrew system faces stop at Bold, so 900 buys nothing: the extra weight has to
   come from a same-hue stroke that fattens the stems without shifting colour. */
.mn-logo .l1,.mn-logo .l2{transform-origin:50% 60%}
.mn-logo .l1{font-size:clamp(38px,min(8vw,10.5vh),112px);letter-spacing:.24em;
  transform:rotate(1.2deg) scaleY(1.06);-webkit-text-stroke:.055em #14111d;
  padding-inline-start:.24em;padding-inline-end:.06em;margin-block-end:.06em}
.mn-logo .l2{font-size:clamp(50px,min(12.2vw,17vh),172px);margin-block-start:-.06em;
  transform:rotate(-1.8deg) scaleY(1.07);-webkit-text-stroke:.048em #16121f;padding:0 .06em}
.rtl .mn-logo .l1,.rtl .mn-logo .l2,.rtl .mn-root .display{letter-spacing:.015em}
.rtl .mn-logo .l1{letter-spacing:.16em}
.mn-tagline{margin-block-start:clamp(6px,1.4vh,18px);font-size:clamp(12px,min(1.6vw,2.2vh),20px);
  font-weight:800;letter-spacing:.2em;color:#ffd99a;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.rtl .mn-tagline{letter-spacing:.03em}
.mn-menu{display:flex;flex-direction:column;align-items:center;gap:12px;margin-block-start:clamp(8px,2.4vh,28px)}
.mn-btn-xl{font-size:clamp(16px,min(1.7vw,2.4vh),23px);padding:clamp(12px,1.9vh,18px) clamp(32px,4.4vw,56px);
  box-shadow:0 6px 0 #a4620a,0 0 46px -8px rgba(255,194,71,.85),0 12px 26px rgba(0,0,0,.5),
    0 1px 0 rgba(255,255,255,.6) inset}
.mn-btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mn-press{font-size:12px;font-weight:800;letter-spacing:.2em;color:rgba(244,241,234,.72);
  margin-block-start:6px;animation:mnPulse 2.4s var(--ease) infinite}
.rtl .mn-press{letter-spacing:.04em}
@keyframes mnPulse{0%,100%{opacity:.45}50%{opacity:1}}
.mn-spacer{flex:1 1 auto}
.mn-keys{display:flex;gap:clamp(8px,1.4vw,18px);flex-wrap:wrap;justify-content:center;
  align-items:center;padding-block-end:6px}
.mn-key{display:flex;align-items:center;gap:7px}
.mn-key b{font-size:11px;font-weight:800;letter-spacing:.12em;color:rgba(244,241,234,.62);text-transform:uppercase}
.rtl .mn-key b{letter-spacing:.02em}
.mn-kbd{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;
  padding:0 8px;border-radius:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);
  box-shadow:0 2px 0 rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.15) inset;
  font-size:12px;font-weight:800;color:#f4f1ea;direction:ltr;unicode-bidi:isolate}
/* THE KEYCAPS ARE A PICTURE OF A KEYBOARD, AND A KEYBOARD DOES NOT MIRROR.
   Each cap already isolated itself, but the CAPS GROUP is a flex row that
   inherited the document direction \u2014 so under RTL the row laid out right-to-left
   and "\u2190  \u2192" printed as "\u2192  \u2190": two arrows pointing AT each other, which is not
   a thing any keyboard has ever looked like. A child reading it learns the wrong
   key for the wrong direction. The group is pinned to LTR (and isolated, so it
   cannot leak into the Hebrew label beside it); the label stays in the document
   direction, where it belongs. */
.mn-caps{display:inline-flex;align-items:center;gap:6px;direction:ltr;unicode-bidi:isolate}
/* "Shift / Space" \u2014 a slash, because these are two keys that each do the same
   thing, and two caps side by side read as a chord to press together. */
.mn-caps .or{font-size:13px;font-weight:800;color:rgba(244,241,234,.5);line-height:1}

/* ---------- corner icon buttons (settings / how-it-was-built) ---------- */
/* The home screen had six buttons stacked under the logo and read as a form.
   The two that are not "play the game" \u2014 Settings and "how was this built" \u2014
   moved into the corners as round icons, so the centre column is only the four
   things a child came here to do.
   Every corner icon carries its label as a real text node INSIDE the button:
   that is the accessible name, it is what hover and keyboard focus reveal, and
   it means the button still answers to its own words for anything that searches
   the DOM by text. The icon art is inline SVG \u2014 no asset files (contest rule)
   and no emoji, whose glyphs differ per platform and would land as tofu on the
   machines this ships to (the same reason pause draws '\u275A\u275A' rather than '\u23F8'). */
.mn-corner{position:absolute;z-index:6;inset-block-start:clamp(10px,2vh,18px);display:flex;gap:8px}
.mn-corner.tl{inset-inline-start:clamp(10px,2vw,18px)}
.mn-corner.tr{inset-inline-end:clamp(10px,2vw,18px)}
/* Defensive: attachHomeControl() parks its pill in exactly this corner at 18px
   on any screen that mounts one. The title screen mounts none, but a future
   screen carrying both must not stack them \u2014 the icon drops into its own lane,
   the same way the race's copy of the pill does. */
#ui:has(.mn-home) .mn-corner.tl{inset-block-start:calc(18px + 4.7em)}
.mn-icon{position:relative;width:46px;height:46px;flex:none;padding:0;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--txt);border:1px solid var(--stroke-hi);
  background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(20,20,31,.96));
  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.5);
  transition:transform .14s var(--ease),background .14s,color .14s}
.mn-icon svg{width:24px;height:24px;display:block}
.mn-icon:hover{transform:translateY(-2px);color:var(--gold-1);
  background:linear-gradient(180deg,rgba(70,70,96,.96),rgba(30,30,44,.97))}
.mn-icon:focus-visible{outline:3px solid rgba(255,255,255,.92);outline-offset:3px;color:var(--gold-1)}
/* The label. HOVER AND FOCUS both reveal it \u2014 a child driving the menu from the
   keyboard has to be able to see what the icon is, and a tooltip that only
   answers the mouse is invisible to exactly the children who need it most.
   No transition on the reveal: it must be readable in a still frame, and a
   property mid-transition reads as its old value under the screenshot harness. */
.mn-iconlab{position:absolute;inset-block-start:calc(100% + 7px);
  white-space:nowrap;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--txt);
  background:rgba(10,9,18,.94);border:1px solid var(--stroke-hi);border-radius:var(--r-pill);
  padding:5px 12px;box-shadow:0 6px 18px rgba(0,0,0,.55);
  visibility:hidden;opacity:0;pointer-events:none}
.mn-corner.tl .mn-iconlab{inset-inline-start:0}
.mn-corner.tr .mn-iconlab{inset-inline-end:0}
.mn-icon:hover .mn-iconlab,.mn-icon:focus-visible .mn-iconlab,
.mn-icon:focus .mn-iconlab{visibility:visible;opacity:1}

/* ---------- shared screen head ---------- */
.mn-head{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.mn-h1{font-size:clamp(26px,min(5.2vw,7.4vh),70px);padding:0 .08em;
  text-shadow:
    0 -1px 0 rgba(255,255,255,.5),
    .038em 0 0 #16121f,-.038em 0 0 #16121f,0 .038em 0 #16121f,0 -.038em 0 #16121f,
    .027em .027em 0 #16121f,-.027em .027em 0 #16121f,
    .027em -.027em 0 #16121f,-.027em -.027em 0 #16121f,
    .034em .015em 0 #16121f,-.034em .015em 0 #16121f,
    .015em .034em 0 #16121f,-.015em .034em 0 #16121f,
    .034em -.015em 0 #16121f,-.034em -.015em 0 #16121f,
    0 .055em 0 rgba(0,0,0,.45)}
.mn-sub{font-size:clamp(12px,1.2vw,15px);font-weight:700;letter-spacing:.13em;color:rgba(244,241,234,.66)}
.rtl .mn-sub{letter-spacing:.02em}

/* ---------- shared back button ---------- */
/* The head keeps its centred title; the back button floats at the inline start so
   it never steals width from it, and falls back into the flow when there is none. */
.mn-headrow{position:relative;width:100%;display:flex;justify-content:center;align-items:center;
  gap:10px;flex-wrap:wrap}
.mn-headrow .mn-head{flex:1 1 auto}
.mn-back{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:9px 18px;flex:none}
.mn-back span{font-size:15px;line-height:1;opacity:.8;direction:ltr;unicode-bidi:isolate}
@media (min-width:900px){
  /* z-index, because the centred .mn-head next to it spans the FULL row width
     and therefore overlaps this button's rectangle. Paint order alone kept the
     button on top only while .mn-head's opacity was exactly 1 \u2014 during its
     .35s fade-in the animated opacity gives it a stacking context of its own
     and it swallows every click aimed at "back". A child who reaches for the
     back button the moment the screen appears hits nothing. Caught by the
     hit-test in tools/selecttest.mjs section 7. */
  .mn-back{position:absolute;inset-inline-start:0;inset-block-start:0;z-index:2}
}

/* ---------- the global route home (attachHomeControl) ---------- */
/* Screens that are not built by baseScreen() \u2014 the race and the garage \u2014 used to
   have no visible way out at all: the race only answered the Escape key and the
   garage answered nothing, so a child who opened the garage from the home menu
   was stuck inside it until they finished a four-step prompt. This is the one
   affordance they all now share: same pill, same inline-start corner, same word
   as the racer-select back button, mounted into engine.ui (NOT into the scene's
   own DOM, which those two modules rebuild from scratch on every interaction). */
/* Solid, not ghost: this one floats over bright gameplay (a desert sky at noon),
   where the translucent-white ghost fill is invisible. Same card treatment the
   HUD uses, so it still reads as part of the same product. */
#ui .mn-home{position:absolute;z-index:20;inset-block-start:18px;inset-inline-start:18px;
  pointer-events:auto;color:var(--txt);border:1px solid var(--stroke-hi);
  background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(20,20,31,.96));
  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 8px 20px rgba(0,0,0,.5)}
#ui .mn-home:hover{background:linear-gradient(180deg,rgba(70,70,96,.96),rgba(30,30,44,.97))}
#ui .mn-home span{opacity:1}
/* The race's own lap card owns the top corner, so the race copy drops below it. */
#ui .mn-home.below{inset-block-start:calc(18px + 4.7em)}
/* The garage top bar starts in that corner; give the button its own lane rather
   than floating on top of the title. Widened 104 \u2192 156px when the label became
   "\u05DC\u05DE\u05E1\u05DA \u05D4\u05D1\u05D9\u05EA" / "Main Menu": the pill is a word longer than "\u05D7\u05D6\u05E8\u05D4" / "Back" and
   at 104px it printed straight through "\u05D4\u05DE\u05D5\u05E1\u05DA". */
#ui .grg-root .grg-top{padding-inline-start:156px}
/* Anything that owns the screen hides it: a dialog, a garage scrim (Boreg's
   introduction, the token explainer, the reveal) all have their own way out, and
   a button floating over a modal is exactly the "covered control" this audit was
   called to kill. The QUIZ is deliberately absent \u2014 D20 keeps the pause menu
   reachable from a frozen quiz, so the race's button must stay live over it. */
#ui:has(.mn-ov) .mn-home,
#ui:has(.grg-scrim) .mn-home,
#ui:has(.grgtok-scrim) .mn-home{display:none}

/* ---------- racer select ---------- */
/* The card is deliberately a TRANSPARENT frame with an opaque lower body: the
   upper .mn-view is a window punched through the overlay so the real 3D kart,
   drawn on the GL canvas underneath, is seen through it. Anything opaque or
   backdrop-filtered over that rectangle (the old card background did both) puts
   frosted glass in front of the kart. See makeKartStage() in racerSelectScene. */
/* The column count is CSS's job, not JavaScript's.
   It used to be an inline grid-template-columns written from the width handed
   to resize(), which meant the roster's ROW COUNT \u2014 and therefore the height of
   the whole screen \u2014 was a piece of JS state that could go stale. When the
   resize signal did not arrive (headless Chrome does not always deliver a
   window resize event for a viewport change, and engine.width stayed at the boot
   800), the grid kept the 3 columns it was built with while the viewport was
   1600 or 1920 wide: 8 cards became 3 rows instead of 2, ~290px taller, and the
   "\u05DC\u05D6\u05D9\u05E0\u05D5\u05E7!" CTA \u2014 the only door off this screen \u2014 was pushed under the bottom
   edge. That is why the failure looked width-dependent and skipped 1440x900 at
   the same height as a failing 1600x900: it was not the height maths, it was
   which resize events happened to land.
   Media queries cannot go stale, so the row count can no longer drift from the
   viewport. The breakpoints mirror colsFor() exactly; JS now READS the column
   count back off the layout for keyboard navigation instead of dictating it. */
.mn-grid{display:grid;gap:clamp(8px,min(1.1vw,1.6vh),16px);width:min(1360px,100%);margin:0 auto;
  grid-template-columns:repeat(1,minmax(0,1fr))}
@media (min-width:520px){ .mn-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:740px){ .mn-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1000px){ .mn-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
.mn-card{position:relative;border-radius:var(--r-m);cursor:pointer;background:none;border:0;padding:0;
  display:flex;flex-direction:column;
  transition:transform .16s var(--ease)}
.mn-card::after{content:"";position:absolute;inset:-3px;border-radius:calc(var(--r-m) + 3px);
  border:3px solid var(--sel);box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 42px 2px var(--sel);
  opacity:0;transition:opacity .16s var(--ease);pointer-events:none}
.mn-card:hover{transform:translateY(-3px)}
.mn-card.sel{transform:translateY(-6px) scale(1.035);z-index:2}
.mn-card.sel::after{opacity:1}
.mn-card.dim .mn-cname{color:rgba(244,241,234,.86)}
.mn-card.dim .mn-fill{filter:saturate(.85) brightness(.92);box-shadow:none}
.mn-card:focus-visible{outline:3px solid var(--info);outline-offset:4px}
/* the window onto the 3D kart \u2014 no background, no blur, nothing in front of it */
.mn-view{position:relative;height:clamp(74px,min(9.6vw,13vh),150px);
  border-radius:var(--r-m) var(--r-m) 0 0;border:1px solid var(--stroke);border-block-end:0}
.mn-card.sel .mn-view{border-color:var(--sel)}
/* Unselected karts are scrimmed rather than desaturated: a CSS filter cannot
   reach pixels drawn on the canvas below, and a dark veil is the clearest
   "these are the ones you did NOT pick" a 8-year-old can read at a glance. */
/* .40, not the .52 this started at: the whole point of the screen is that a
   child can tell eight racers apart at a glance, and a veil heavy enough to
   settle the "which one is picked" question was also heavy enough to turn the
   other seven into silhouettes. The selected card carries a gold ring, a lift,
   a tick and the "\u05D6\u05D4 \u05D0\u05E0\u05D9" badge \u2014 the veil only has to be the quietest of the
   four cues, not the loudest. Measured by tools/selecttest.mjs, which fails if
   any two card windows stop being visually distinguishable. */
.mn-view::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:rgba(7,6,13,.40);opacity:0;transition:opacity .18s var(--ease)}
.mn-card.dim .mn-view::after{opacity:1}
.mn-card.dim:hover .mn-view::after{opacity:.30}
.mn-body{position:relative;padding:8px 10px 11px;border-radius:0 0 var(--r-m) var(--r-m);
  background:linear-gradient(180deg,rgba(38,36,54,.86),rgba(14,13,22,.94));
  backdrop-filter:blur(7px);
  border:1px solid var(--stroke);border-block-start:0;
  box-shadow:0 12px 26px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07) inset}
.mn-card.sel .mn-body{border-color:var(--sel)}
.mn-you{position:absolute;z-index:3;inset-block-start:8px;inset-inline-end:8px;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));color:#2a1c00;
  font-size:12px;font-weight:900;letter-spacing:.06em;padding:3px 10px;border-radius:var(--r-pill);
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
.mn-tick{position:absolute;z-index:3;inset-block-start:6px;inset-inline-start:6px;display:none;
  width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#8fe38a,#2a9b46);color:#08210f;font-size:16px;font-weight:900;
  box-shadow:0 2px 10px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.35) inset}
.mn-card.sel .mn-tick{display:flex}
.mn-cname{font-size:clamp(14px,min(1.5vw,2.3vh),21px);font-weight:900;letter-spacing:-.01em}
/* the picked-racer readout above the start button \u2014 the screen must say out
   loud who is about to drive, because the button no longer names it by itself */
.mn-picked{display:flex;align-items:center;justify-content:center;gap:10px;
  margin-block-start:clamp(4px,1vh,10px);font-size:clamp(13px,1.5vh,16px);font-weight:800;
  color:var(--txt-dim)}
.mn-picked b{font-size:clamp(16px,2.2vh,23px);font-weight:900;color:var(--gold-1)}
.mn-picked i{width:14px;height:14px;border-radius:5px;font-style:normal;
  box-shadow:0 0 10px -2px currentColor}
.mn-ctag{font-size:11px;font-weight:600;color:var(--txt-dim);min-height:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-stats{margin-block-start:8px;display:flex;flex-direction:column;gap:5px}
.mn-stat{display:grid;grid-template-columns:minmax(46px,auto) 1fr;align-items:center;gap:8px}
.mn-stat span{font-size:11px;font-weight:800;letter-spacing:.06em;color:rgba(244,241,234,.72);
  text-transform:uppercase}
.rtl .mn-stat span{letter-spacing:0;font-size:11.5px}
.mn-track{height:7px;border-radius:var(--r-pill);background:rgba(255,255,255,.09);overflow:hidden}
.mn-fill{display:block;height:100%;border-radius:var(--r-pill);width:0;
  transition:width .5s var(--ease);box-shadow:0 0 10px -2px currentColor}
.mn-go{margin-block-start:clamp(6px,1.6vh,16px)}
.mn-go .btn{box-shadow:0 6px 0 #a4620a,0 0 40px -6px rgba(255,194,71,.75),0 12px 26px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
/* Racer select is the tallest screen in the game \u2014 eight cards, a CTA and a key
   legend \u2014 and it was overflowing the stage by 6px at 1366x768, 23px at
   1280x720 and 46px at 1024x640, which pushed the legend clean off the bottom.
   The layout gate did not see it because it only fails on clipped INTERACTIVE
   elements and a key hint is a span.
   Everything given back below is chrome: stage gaps, card padding, stat spacing.
   The kart windows are deliberately untouched \u2014 a child telling eight racers
   apart at 1024x640 is the entire purpose of the screen, and shrinking the one
   thing it exists for to save a legend would be the wrong trade. */
@media (max-height:790px){
  .mn-select .mn-stage{gap:clamp(4px,1vh,12px);padding:clamp(8px,2vh,20px)}
  .mn-select .mn-body{padding:6px 9px 8px}
  .mn-select .mn-stats{margin-block-start:5px;gap:3px}
  .mn-select .mn-ctag{min-height:0}
  .mn-select .mn-picked{margin-block-start:2px}
  .mn-select .mn-go{margin-block-start:clamp(4px,1vh,10px)}
}

/* ---------- results ---------- */
.mn-rows{min-height:0;overflow-y:auto;overflow-x:hidden}
.mn-sheet{display:flex;flex-direction:column;min-height:0;width:min(820px,100%);padding:clamp(10px,min(1.6vw,2vh),20px);border-radius:var(--r-l)}
.mn-tablehead,.mn-row{display:grid;grid-template-columns:46px 1fr 96px 84px;gap:10px;align-items:center}
.mn-tablehead{padding:0 12px 6px;font-size:10px;font-weight:800;letter-spacing:.12em;
  color:var(--txt-dim);text-transform:uppercase}
.mn-tablehead>:nth-child(3),.mn-tablehead>:nth-child(4){text-align:start}
.rtl .mn-tablehead{letter-spacing:.02em;font-size:11px}
.mn-row{padding:clamp(2px,.7vh,6px) 12px;border-radius:11px;background:rgba(255,255,255,.035);
  margin-block-end:clamp(3px,.6vh,5px);
  border:1px solid transparent}
.mn-row.me{background:linear-gradient(90deg,rgba(255,194,71,.20),rgba(255,194,71,.07));
  border-color:rgba(255,194,71,.55);box-shadow:0 0 22px -6px rgba(255,194,71,.6)}
.mn-pos{width:clamp(26px,4.4vh,34px);height:clamp(26px,4.4vh,34px);border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-weight:900;font-size:clamp(13px,2.2vh,16px);
  background:rgba(255,255,255,.07);color:#f4f1ea}
.mn-pos.p1{background:linear-gradient(180deg,#ffe9a8,#f59310);color:#2a1c00}
.mn-pos.p2{background:linear-gradient(180deg,#e9edf4,#9aa3b0);color:#22222e}
.mn-pos.p3{background:linear-gradient(180deg,#f0bf8e,#b9713a);color:#2a1c00}
.mn-who{display:flex;align-items:center;gap:9px;min-width:0}
.mn-chip{width:14px;height:14px;border-radius:5px;flex:none;box-shadow:0 0 10px -2px currentColor}
.mn-who b{font-size:clamp(13px,2.2vh,16px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn-time{font-size:clamp(12px,2.1vh,15px)}
.mn-gap{font-size:13px;color:var(--txt-dim);text-align:start}
.mn-reveal{animation:mnRow .34s var(--ease) both}
/* Individual properties, not the transform shorthand \u2014 a both-filled keyframe
   ending on transform:none outranks every hover/positioning transform on the
   element forever. Same rule as popIn in ui/style.js. */
@keyframes mnRow{from{opacity:0;translate:0 10px;scale:.98}to{opacity:1;translate:0 0;scale:1}}
.mn-awards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-block-start:clamp(6px,1.2vh,10px)}
.mn-award{flex:1 1 220px;display:flex;align-items:center;gap:12px;padding:clamp(5px,1.2vh,9px) 16px;border-radius:var(--r-m);
  background:linear-gradient(180deg,rgba(255,214,107,.16),rgba(255,214,107,.04));

05E4\u05DB\u05D9\u05DD \u05DE\u05D9\u05DC\u05D9\u05DD \u05DC\u05DE\u05E1\u05E4\u05E8\u05D9\u05DD. \u05D1\u05DE\u05E8\u05D7\u05D1 \u05D4\u05D6\u05D4 "\u05DE\u05DC\u05DA" \u05D5"\u05DE\u05DC\u05DB\u05D4" \u05D9\u05D5\u05E9\u05D1\u05D5\u05EA \u05DE\u05DE\u05E9 \u05E7\u05E8\u05D5\u05D1 \u05D6\u05D5 \u05DC\u05D6\u05D5.',"learn.fact.12":"\u05D0\u05D9\u05DE\u05D5\u05DF \u05E9\u05DC \u05DE\u05D5\u05D3\u05DC \u05D2\u05D3\u05D5\u05DC \u05DC\u05D0 \u05E8\u05E5 \u05E2\u05DC \u05DE\u05D7\u05E9\u05D1 \u05D0\u05D7\u05D3 \u05D0\u05DC\u05D0 \u05E2\u05DC \u05D0\u05DC\u05E4\u05D9 \u05DE\u05E2\u05D1\u05D3\u05D9\u05DD \u05E9\u05E2\u05D5\u05D1\u05D3\u05D9\u05DD \u05D9\u05D7\u05D3 \u05D7\u05D5\u05D3\u05E9\u05D9\u05DD.","learn.fact.13":"\u05EA\u05E8\u05D2\u05D5\u05DD \u05DE\u05DB\u05D5\u05E0\u05D4 \u05E2\u05D1\u05D3 \u05E4\u05E2\u05DD \u05DC\u05E4\u05D9 \u05DE\u05D9\u05DC\u05D5\u05DF \u05D5\u05DB\u05DC\u05DC\u05D9\u05DD. \u05D4\u05D9\u05D5\u05DD \u05D4\u05D5\u05D0 \u05DC\u05D5\u05DE\u05D3 \u05DE\u05DE\u05D9\u05DC\u05D9\u05D5\u05E0\u05D9 \u05D6\u05D5\u05D2\u05D5\u05EA \u05DE\u05E9\u05E4\u05D8\u05D9\u05DD.","learn.fact.14":"\u05E7\u05D5\u05DC \u05DE\u05DC\u05D0\u05DB\u05D5\u05EA\u05D9 \u05E0\u05D1\u05E0\u05D4 \u05DE\u05D0\u05E4\u05E1: \u05D4\u05DE\u05D7\u05E9\u05D1 \u05DE\u05D9\u05D9\u05E6\u05E8 \u05D0\u05EA \u05D2\u05DC \u05D4\u05E7\u05D5\u05DC \u05E2\u05E6\u05DE\u05D5, \u05E2\u05E9\u05E8\u05D5\u05EA \u05D0\u05DC\u05E4\u05D9 \u05DE\u05E1\u05E4\u05E8\u05D9\u05DD \u05DC\u05DB\u05DC \u05E9\u05E0\u05D9\u05D9\u05D4.","learn.fact.15":"\u05DE\u05D5\u05D3\u05DC \u05E9\u05DC\u05D5\u05DE\u05D3 \u05E8\u05E7 \u05DE\u05D8\u05E7\u05E1\u05D8\u05D9\u05DD \u05D1\u05D0\u05E0\u05D2\u05DC\u05D9\u05EA \u05D9\u05D4\u05D9\u05D4 \u05D7\u05DC\u05E9 \u05D1\u05E2\u05D1\u05E8\u05D9\u05EA \u2014 \u05D4\u05D5\u05D0 \u05D8\u05D5\u05D1 \u05D1\u05DE\u05D4 \u05E9\u05E8\u05D0\u05D4 \u05D4\u05E8\u05D1\u05D4 \u05DE\u05DE\u05E0\u05D5."},en:{"learn.built.title":"How was this game built?","learn.built.lede":"Nobody typed this game out line by line. A person wrote prompts \u2014 asks, in plain words \u2014 and an AI wrote the code. Exactly like Boreg's garage: a vague prompt returns something strange, a precise prompt returns something that works.","learn.built.b1.t":"The rivals drove in zig-zags","learn.built.b1.b":`The first prompt was "make the rivals drive nicely around the track". They zig-zagged, and a lap took them ${ht(100)} seconds. The next prompt said exactly where to cut each corner \u2014 and they have driven one clean line ever since.`,"learn.built.b2.t":"There is not one picture here","learn.built.b2.b":"Everything you see is drawn by code while you play: the sky, the grit in the asphalt, the tyres, the coins. Zero image files, zero sound files. All of it is formulas, running right now.","learn.built.b3.t":"And once they drove backwards","learn.built.b3.b":"In one version the right arrow turned left, because the simulation inside has a direction of its own. The fix was one number \u2014 a minus \u2014 on exactly one line. That is what building looks like, and it is completely fine.","learn.built.cta.t":"You can build this way too","learn.built.cta.b":"You do not need to know how to code to start. Pick a small idea, describe it in precise words, look at what came out, and fix it in rounds until it works. That is the whole secret \u2014 and it is exactly what every garage visit here practises.","learn.built.close":"Cool, let's go","learn.cert.badge":"Certificate","learn.cert.title":"Prompter Certificate","learn.cert.awarded":"Awarded to the crew of","learn.cert.champ":"Championship No. {n}","learn.cert.meta":"{races} races \xB7 {points} points \xB7 {place} place","learn.cert.learned":"What was learned along the way","learn.cert.l1.t":"Precision","learn.cert.l1.b":"Say what exactly, where and when","learn.cert.l2.t":"Constraints","learn.cert.l2.b":"Say what must not break, too","learn.cert.l3.t":"Style & context","learn.cert.l3.b":"Explain who it is for and why","learn.cert.l4.t":"Iteration","learn.cert.l4.b":"Check it, fix it, ask again","learn.cert.best":"The strongest prompt written here","learn.cert.score":"Prompt quality","learn.cert.noBest":"Next garage visit, the strongest prompt written will show up right here.","learn.cert.seal":"Prompt Racers","learn.cert.foot":"This certificate is stored on this computer only \u2014 no name, no account.","learn.cert.close":"Close","learn.cert.menu":"Main Menu","learn.cert.racer":"The racer chosen","learn.cert.titlePick":"A title for the certificate \u2014 pick one, or stay without","learn.cert.titleNone":"No title","learn.cert.t.champ":"Prompt Champion","learn.cert.t.wordsmith":"Word Engineer","learn.cert.t.drifter":"Drift Ace","learn.cert.t.curious":"Curious Mind","learn.cert.t.fixer":"Round-by-Round Fixer","learn.cert.t.robotfriend":"Friend of Robots","learn.cert.badges":"Badges collected","learn.cert.badges.none":"No badges yet. Every badge earned will show up here on the next certificate.","learn.cert.badges.more":"and {n} more","learn.cert.download":"Download","learn.cert.downloading":"Drawing\u2026","learn.cert.downloaded":"Saved to this computer","learn.cert.downloadFail":"This browser will not save the file. A screenshot works too.","learn.fact.title":"Did you know?","learn.fact.1":'A language model does not "know" facts \u2014 it guesses which word fits best next.',"learn.fact.2":"The exact same question can get a different answer each time, because picking a word has some randomness in it.","learn.fact.3":"A token is not always a whole word \u2014 sometimes it is half a word, sometimes just a comma.","learn.fact.4":"Software that spots cats in photos has never seen a cat. It has seen millions of numbers.","learn.fact.5":`Computers have beaten chess champions since ${ht(1997)} \u2014 but Go took them almost ${ht(20)} more years.`,"learn.fact.6":'Ask a model to solve something "step by step" and it genuinely makes fewer mistakes.',"learn.fact.7":'Opening a prompt with "your role: tour guide" changes the whole style of the answer.',"learn.fact.8":"A model does not remember yesterday's chat. Someone has to save it and hand it back.","learn.fact.9":"Sometimes a model invents an answer with total confidence. That is called a hallucination \u2014 always check.","learn.fact.10":"An AI that draws pictures starts from random noise and cleans it, over and over, until a picture appears.","learn.fact.11":'Models turn words into numbers. In that space, "king" and "queen" sit remarkably close together.',"learn.fact.12":"Training a big model does not run on one computer but on thousands of processors, together, for months.","learn.fact.13":"Machine translation once ran on a dictionary and rules. Today it learns from millions of sentence pairs.","learn.fact.14":"A synthetic voice is built from scratch: the computer generates the sound wave itself, tens of thousands of numbers every second.","learn.fact.15":"A model trained only on English text will be weak in Hebrew \u2014 it is good at whatever it saw a lot of."}});tn({he:{...Ho.he},en:{...Ho.en}});var W0=`
/* ---------- how it was built ---------- */
.mn-dialog.built{width:min(880px,100%);max-height:calc(100vh - 40px);
  display:flex;flex-direction:column;gap:10px;padding:clamp(14px,2.2vh,24px) clamp(14px,2.2vw,28px)}
.lr-scroll{min-height:0;overflow-y:auto;overflow-x:hidden;padding-inline-end:2px}
.lr-lede{margin:0;font-size:clamp(13px,1.5vh,15px);line-height:1.55;color:rgba(244,241,234,.86);max-width:70ch}
.lr-beats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-block-start:12px}
.lr-beat{position:relative;padding:12px 14px 12px 14px;border-radius:var(--r-m);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid var(--stroke);display:flex;flex-direction:column;gap:5px}
.lr-beat::before{content:"";position:absolute;inset-block:12px;inset-inline-start:0;width:3px;
  border-radius:var(--r-pill);background:linear-gradient(180deg,var(--gold-1),var(--gold-3))}
.lr-beat b{font-size:15px;font-weight:900;color:var(--gold-1)}
.lr-beat p{margin:0;font-size:13px;line-height:1.5;color:rgba(244,241,234,.82)}
.lr-beat .lr-n{font-weight:900;color:rgba(255,194,71,.55);margin-inline-end:2px}
.lr-cta{margin-block-start:12px;padding:13px 16px;border-radius:var(--r-m);
  background:linear-gradient(180deg,rgba(255,194,71,.17),rgba(255,194,71,.05));
  border:1px solid rgba(255,194,71,.42);display:flex;gap:12px;align-items:flex-start}
.lr-cta .lr-spark{flex:none;width:38px;height:38px}
.lr-cta b{display:block;font-size:15px;font-weight:900;color:var(--gold-1);margin-block-end:3px}
.lr-cta p{margin:0;font-size:13px;line-height:1.5;color:rgba(244,241,234,.88)}

/* ---------- certificate ---------- */
/* Deliberately NOT a .panel: a certificate should not look like the rest of the
   UI chrome. Warm parchment-dark, double gold rule, printed-looking type. */
.mn-ov.cert-ov{background:rgba(4,3,9,.80)}
.mn-dialog.cert{width:min(700px,100%);max-height:calc(100vh - 40px);
  display:flex;flex-direction:column;padding:0;overflow:hidden;
  /* Warm parchment-dark with a procedural guilloche weave \u2014 the faint engine-
     turned pattern real certificates use, drawn here in gradients. */
  background:
    repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,194,71,.012) 0 4deg,transparent 4deg 9deg),
    repeating-linear-gradient(38deg,rgba(255,255,255,.014) 0 1px,transparent 1px 8px),
    repeating-linear-gradient(-38deg,rgba(255,255,255,.010) 0 1px,transparent 1px 8px),
    radial-gradient(120% 78% at 50% 0%,rgba(255,194,71,.13),transparent 62%),
    linear-gradient(180deg,#2b2334,#191320 58%,#221a29);
  border:1px solid rgba(255,194,71,.60);border-radius:var(--r-l);
  box-shadow:0 0 0 5px rgba(255,194,71,.10),0 0 0 6px rgba(255,194,71,.38),
    0 0 60px -10px rgba(255,194,71,.30),0 26px 70px rgba(0,0,0,.7)}
.lr-cert-in{position:relative;display:flex;flex-direction:column;min-height:0;
  margin:7px;border:1px dashed rgba(255,194,71,.34);border-radius:calc(var(--r-l) - 6px);
  padding:clamp(12px,2vh,20px) clamp(14px,2.4vw,28px) clamp(8px,1.4vh,14px)}
/* Four gold corner brackets, inside the dashed rule. */
.lr-corner{position:absolute;width:18px;height:18px;pointer-events:none;
  border:2px solid rgba(255,194,71,.62)}
.lr-corner.c1{inset-block-start:7px;inset-inline-start:7px;border-width:2px 0 0 0;
  border-inline-start-width:2px;border-start-start-radius:6px}
.lr-corner.c2{inset-block-start:7px;inset-inline-end:7px;border-width:2px 0 0 0;
  border-inline-end-width:2px;border-start-end-radius:6px}
.lr-corner.c3{inset-block-end:7px;inset-inline-start:7px;border-width:0 0 2px 0;
  border-inline-start-width:2px;border-end-start-radius:6px}
.lr-corner.c4{inset-block-end:7px;inset-inline-end:7px;border-width:0 0 2px 0;
  border-inline-end-width:2px;border-end-end-radius:6px}
/* A thin chequered ribbon under the title: this award comes from a racing game. */
.lr-flag{flex:none;height:10px;width:min(240px,62%);margin:8px auto 0;border-radius:2px;
  background:repeating-conic-gradient(#efe9dc 0% 25%,#1a1523 0% 50%) 0 0/10px 10px;
  opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 0 1px rgba(255,194,71,.25)}
.lr-cert-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.lr-cert-badge{font-size:11px;font-weight:900;letter-spacing:.34em;color:rgba(255,194,71,.72)}
.rtl .lr-cert-badge{letter-spacing:.12em}
.lr-cert-title{font-size:clamp(24px,min(3.4vw,4.6vh),40px);font-weight:900;line-height:1.02;padding:0 .06em}
.lr-rule{width:min(320px,80%);height:1px;margin:7px auto;flex:none;
  background:linear-gradient(90deg,transparent,rgba(255,194,71,.75),transparent);position:relative}
.lr-rule::after{content:"";position:absolute;inset-block-start:-2.5px;left:50%;margin-inline-start:-3px;
  width:6px;height:6px;transform:rotate(45deg);background:var(--gold-2)}
.lr-cert-body{min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;
  gap:clamp(6px,1.2vh,12px);padding-block-start:clamp(8px,1.6vh,14px)}
.lr-awarded{text-align:center}
.lr-awarded .k{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--txt-dim)}
.rtl .lr-awarded .k{letter-spacing:.04em}
.lr-awarded .v{font-size:clamp(20px,min(2.6vw,3.6vh),30px);font-weight:900;line-height:1.15}
.lr-meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12px;font-weight:800;
  color:rgba(244,241,234,.72)}
.lr-meta span{padding:3px 11px;border-radius:var(--r-pill);background:rgba(255,255,255,.06);
  border:1px solid var(--stroke)}
.lr-sect{display:flex;align-items:center;gap:10px;margin-block-end:2px}
.lr-sect b{flex:none;font-size:11px;font-weight:900;letter-spacing:.16em;color:#f6d79a}
.rtl .lr-sect b{letter-spacing:.04em;font-size:12px}
.lr-sect i{flex:1 1 auto;height:1px;background:linear-gradient(90deg,rgba(255,194,71,.5),transparent)}
.rtl .lr-sect i{background:linear-gradient(270deg,rgba(255,194,71,.5),transparent)}
.lr-learned{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px}
.lr-l{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:var(--r-s);
  background:rgba(255,255,255,.045);border:1px solid var(--stroke)}
.lr-l svg{flex:none;width:17px;height:17px;margin-block-start:1px}
.lr-l b{display:block;font-size:13px;font-weight:900;color:var(--gold-1);line-height:1.25}
.lr-l i{font-style:normal;font-size:11.5px;line-height:1.35;color:rgba(244,241,234,.74)}
.lr-quote{position:relative;padding:11px 15px;border-radius:var(--r-m);
  background:linear-gradient(180deg,rgba(255,214,107,.15),rgba(255,214,107,.035));
  border:1px solid rgba(255,214,107,.38);
  box-shadow:0 0 26px -10px rgba(255,194,71,.55) inset}
.lr-quote::before{content:"\u201D";position:absolute;inset-block-start:-2px;inset-inline-end:12px;
  font-size:46px;line-height:1;font-weight:900;color:rgba(255,194,71,.22);pointer-events:none}
.lr-quote .k{font-size:11px;font-weight:900;letter-spacing:.14em;color:#f6d79a;margin-block-end:5px}
.rtl .lr-quote .k{letter-spacing:.03em}
.lr-quote q{display:block;font-size:clamp(14px,1.9vh,17px);line-height:1.5;font-weight:800;color:#fff3d8;
  position:relative}
.lr-qfoot{display:flex;align-items:center;gap:8px;margin-block-start:8px}
.lr-chip{font-size:11px;font-weight:900;color:#2a1c00;padding:2px 10px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3))}
.lr-none{font-size:13px;line-height:1.45;color:rgba(244,241,234,.7);margin:0}
.lr-cert-foot{flex:none;display:flex;align-items:center;gap:12px;justify-content:space-between;
  margin-block-start:clamp(8px,1.6vh,14px);padding-block-start:clamp(6px,1.2vh,12px);
  border-block-start:1px solid rgba(255,194,71,.20);flex-wrap:wrap}
.lr-seal{display:flex;align-items:center;gap:11px;flex:none}
.lr-seal svg{width:clamp(46px,8vh,66px);height:auto;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.6))}
.lr-seal .s1{font-size:13px;font-weight:900;color:var(--gold-1);line-height:1.2}
.lr-seal .s2{font-size:11px;font-weight:800;color:#e0b978;letter-spacing:.1em}
.rtl .lr-seal .s2{letter-spacing:.02em}
.lr-cert-acts{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 auto}
/* GAPS.md: these were 36px tall against 46\u201352px on every other screen \u2014 above
   the layout gate's 24px floor, so it passed, but small for an 8-year-old on the
   one screen that is meant to feel like an award, and visibly lighter than the
   podium buttons it sits over. 17px type over 15px block padding measures ~48px,
   mid-range for the game. Pinned in tests/certificate.test.mjs. */
.lr-cert-acts .btn{font-size:17px;padding:13px 26px;min-height:48px;
  display:inline-flex;align-items:center;gap:8px}
.lr-cert-acts .btn svg{width:17px;height:17px;flex:none}

/* ---------- certificate: racer portrait, title picker, badge strip ---------- */
.lr-hero{display:flex;align-items:center;gap:clamp(10px,2vw,18px);justify-content:center}
.lr-face{flex:none;width:clamp(74px,11vh,104px);height:clamp(74px,11vh,104px);
  border-radius:var(--r-m);background:radial-gradient(75% 75% at 50% 42%,rgba(255,194,71,.16),rgba(0,0,0,.28));
  border:1px solid rgba(255,194,71,.34);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.lr-hero .lr-awarded{text-align:start}
.lr-fun{margin-block-start:3px;display:inline-block;font-size:clamp(12px,1.6vh,14px);font-weight:900;
  color:#2a1c00;padding:3px 12px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));box-shadow:0 3px 10px rgba(0,0,0,.35)}
.lr-titles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
/* Chips, not a text field: the ONLY way to put a title on this certificate is to
   pick one of these. See the header comment \u2014 free text is a personal-data entry
   point and the contest forbids it. */
.lr-tchip{font-family:var(--font);font-size:12.5px;font-weight:800;color:var(--txt);cursor:pointer;
  padding:9px 13px;min-height:36px;border-radius:var(--r-pill);background:rgba(255,255,255,.06);
  border:1px solid var(--stroke-hi);transition:transform .12s var(--ease),background .12s}
.lr-tchip:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.lr-tchip[aria-pressed="true"]{color:#2a1c00;border-color:transparent;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3))}
.lr-badges{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.lr-bg{display:flex;align-items:center;gap:7px;padding:5px 11px 5px 7px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.055);border:1px solid rgba(255,194,71,.28)}
.rtl .lr-bg{padding:5px 7px 5px 11px}
.lr-bg svg{flex:none;width:22px;height:22px}
.lr-bg span{font-size:12px;font-weight:800;color:#f6d79a;white-space:nowrap}
.lr-more{align-self:center;font-size:12px;font-weight:800;color:var(--txt-dim)}
.lr-dl-msg{font-size:12px;font-weight:800;color:#f6d79a;align-self:center;margin-inline-end:auto}
.lr-note{flex:none;text-align:center;font-size:11px;line-height:1.35;color:var(--txt-dim);
  margin-block-start:6px}

/* ---------- did-you-know strip ---------- */
.lr-fact{display:flex;align-items:center;gap:11px;padding:11px 16px;border-radius:var(--r-pill);
  background:rgba(18,18,28,.78);border:1px solid rgba(255,194,71,.30);
  box-shadow:0 10px 28px rgba(0,0,0,.5);backdrop-filter:blur(8px);max-width:min(760px,92vw)}
.lr-fact .k{flex:none;font-size:11px;font-weight:900;letter-spacing:.1em;color:#2a1c00;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));padding:3px 11px;border-radius:var(--r-pill)}
.rtl .lr-fact .k{letter-spacing:.02em}
.lr-fact .v{font-size:14px;font-weight:700;line-height:1.4;color:var(--txt)}
