:root{
  --gold:#ffc247;
  --gold-1:#ffe9a8; --gold-2:#ffc247; --gold-3:#f59310;
  --ink:#12121c; --ink-2:#1c1c2b;
  --panel:rgba(22,22,34,.82); --panel-solid:#191926;
  --stroke:rgba(255,255,255,.10); --stroke-hi:rgba(255,255,255,.22);
  --txt:#f4f1ea; --txt-dim:#a8a29a;
  --good:#7ee081; --warn:#ffb347; --bad:#ff6b6b; --info:#6fc3ff;
  --token:#ffd66b;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-panel:0 10px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  --sh-pop:0 18px 50px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
#ui{font-family:var(--font);color:var(--txt);}
#ui *{pointer-events:none}
#ui .on{pointer-events:auto}

/* ---- layout helpers that flip correctly under RTL ---- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.fill{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}

/* Logical properties everywhere so a single rule serves both directions. */
.hud-tl{position:absolute;inset-block-start:18px;inset-inline-start:18px}
.hud-tr{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.hud-bl{position:absolute;inset-block-end:18px;inset-inline-start:18px}
.hud-br{position:absolute;inset-block-end:18px;inset-inline-end:18px}
.hud-tc{position:absolute;inset-block-start:14px;left:50%;transform:translateX(-50%)}

/* ---- surfaces ---- */
.panel{
  background:linear-gradient(180deg,rgba(40,40,58,.9),rgba(18,18,28,.92));
  border:1px solid var(--stroke); border-radius:var(--r-m);
  box-shadow:var(--sh-panel); backdrop-filter:blur(8px);
}
.panel-lift{background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(24,24,36,.96));
  border:1px solid var(--stroke-hi); border-radius:var(--r-l); box-shadow:var(--sh-pop)}

/* ---- type ---- */
.display{
  font-weight:900; letter-spacing:-.02em; line-height:.92;
  background:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.5));
  paint-order:stroke fill;
}
.display-white{background:linear-gradient(180deg,#fff 20%,#e8e2d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.rtl .label{letter-spacing:.04em}     /* Hebrew has no case; wide tracking hurts it */
.num{font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate}

/* ---- buttons ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:17px;color:#2a1c00;
  padding:14px 34px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 0 #a4620a, 0 12px 26px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4620a,0 6px 14px rgba(0,0,0,.45)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--stroke-hi);box-shadow:none;font-weight:700}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:3px solid var(--info);outline-offset:3px}

/* ---- misc ---- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1));transition:width .45s var(--ease)}
.rtl .bar>i{background:linear-gradient(270deg,var(--gold-2),var(--gold-1))}

.fade-in{animation:fadeIn .35s var(--ease) both}
.pop-in{animation:popIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .fade-in,.pop-in{animation:none}
  *{transition-duration:.01ms !important}
}

.grg-root{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;
  padding:16px 22px 18px;font-family:var(--font)}
.grg-top{display:flex;align-items:center;gap:16px}
.grg-title{font-size:38px;line-height:1}
.grg-kicker{font-size:12px;font-weight:800;color:var(--txt-dim);letter-spacing:.02em}
.grg-visit{font-size:12px;font-weight:800;color:var(--gold-1);
  background:rgba(255,194,71,.12);border:1px solid rgba(255,194,71,.3);
  border-radius:var(--r-pill);padding:5px 12px}
.grg-spacer{flex:1}
.grg-budget{display:flex;align-items:center;gap:14px;padding:9px 16px;border-radius:var(--r-pill)}
.grg-coin{width:22px;height:22px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff3cf,var(--token) 45%,#c98a12);
  box-shadow:0 0 12px rgba(255,214,107,.55),0 1px 0 rgba(255,255,255,.6) inset}
.grg-bignum{font-size:26px;line-height:1}
.grg-sub{font-size:11px;font-weight:800;color:var(--txt-dim)}

.grg-body{flex:1;display:flex;gap:16px;min-height:0}
.grg-main{flex:1.62;display:flex;flex-direction:column;gap:11px;min-width:0}
.grg-side{flex:1;max-width:360px;display:flex;flex-direction:column;gap:11px;min-width:0}

/* Boreg's line */
.grg-boreg{display:flex;align-items:center;gap:12px;padding:9px 14px}
.grg-face{width:42px;height:42px;flex:none;border-radius:13px;position:relative;
  background:linear-gradient(180deg,#8fa4c8,#5c6b8f);
  box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 6px 14px rgba(0,0,0,.45)}
.grg-face::before,.grg-face::after{content:"";position:absolute;top:14px;width:8px;height:9px;
  border-radius:4px;background:var(--gold-1);box-shadow:0 0 8px var(--gold-2)}
.grg-face::before{left:8px}.grg-face::after{right:8px}
.grg-antenna{position:absolute;top:-9px;left:50%;width:3px;height:9px;margin-left:-1.5px;
  background:#8fa4c8;border-radius:2px}
.grg-antenna::after{content:"";position:absolute;top:-6px;left:-3px;width:9px;height:9px;
  border-radius:50%;background:var(--gold-2);box-shadow:0 0 10px var(--gold-2)}
.grg-boreg-line{font-size:14.5px;font-weight:700;line-height:1.35}

/* The sentence \u2014 the centrepiece. */
.grg-sentence{padding:13px 18px 15px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(58,48,26,.92),rgba(26,22,14,.95));
  border:1px solid rgba(255,194,71,.34);border-radius:var(--r-l);
  box-shadow:var(--sh-pop),0 0 0 1px rgba(255,194,71,.10) inset}
.grg-sentence-txt{font-size:26px;font-weight:800;line-height:1.55;letter-spacing:-.01em}
.ltr .grg-sentence-txt{font-size:24px}
.grg-w{color:#fff6e2}
.grg-w.lead{color:var(--gold-1)}
.grg-blank{display:inline-block;padding:0 10px;border-radius:9px;font-size:.78em;
  color:#ffdb92;background:rgba(255,194,71,.10);
  border:2px dashed rgba(255,194,71,.45);vertical-align:2px}
.grg-fill{border-radius:7px;padding:0 3px;background:rgba(255,194,71,.13)}

/* Slots */
.grg-slots{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.grg-slot{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.grg-slot .grg-opts{flex:1;min-height:0}
.grg-slot.fixed{flex:none}
.grg-slot.fixed .grg-opts{flex:none}
.grg-slot-head{display:flex;align-items:baseline;gap:9px}
.grg-slot-n{width:20px;height:20px;flex:none;border-radius:50%;font-size:12px;font-weight:900;
  color:#2a1c00;background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
  display:flex;align-items:center;justify-content:center}
.grg-slot-title{font-size:14px;font-weight:900;color:var(--txt)}
.grg-slot-teach{font-size:11.5px;font-weight:700;color:var(--txt-dim)}
.grg-opts{display:flex;gap:8px}
.grg-opt{flex:1 1 0;min-width:0;text-align:start;cursor:pointer;font-family:var(--font);
  color:var(--txt);padding:8px 10px 7px;border-radius:var(--r-s);
  background:linear-gradient(180deg,rgba(46,46,64,.86),rgba(20,20,30,.9));
  border:2px solid var(--stroke);box-shadow:0 3px 0 rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:3px;
  transition:transform .12s var(--ease),border-color .12s,background .12s}
.grg-opt:hover{transform:translateY(-2px);border-color:var(--stroke-hi)}
.grg-opt:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.grg-opt[aria-pressed="true"]{border-color:var(--gold-2);
  background:linear-gradient(180deg,rgba(92,72,30,.95),rgba(44,34,14,.95));
  box-shadow:0 0 0 3px rgba(255,194,71,.16),0 5px 0 rgba(0,0,0,.4)}
.grg-opt.locked{opacity:.34;cursor:not-allowed}
.grg-opt-he{font-size:13.5px;font-weight:900;line-height:1.18}
.grg-opt-sub{font-size:10.5px;font-weight:700;color:var(--txt-dim);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grg-opt-foot{display:flex;align-items:center;gap:6px;margin-top:1px}
.grg-dots{display:flex;gap:3px}
.grg-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16)}
.grg-dot.on{background:var(--gold-2);box-shadow:0 0 6px rgba(255,194,71,.7)}
.grg-cost{margin-inline-start:auto;font-size:11px;font-weight:900;color:var(--token);
  display:flex;align-items:center;gap:4px}
.grg-cost i{width:9px;height:9px;border-radius:50%;display:block;
  background:radial-gradient(circle at 35% 30%,#fff3cf,var(--token) 50%,#c98a12)}
.grg-cost.free{color:var(--txt-dim)}

/* Side column */
.grg-kart{flex:1;min-height:180px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(30,30,44,.42),rgba(14,14,22,.30))}
.grg-kart-tag{position:absolute;inset-block-end:8px;inset-inline-start:10px;
  font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--txt-dim)}
.grg-panel-pad{padding:11px 14px}
.grg-statrow{display:flex;align-items:center;gap:9px}
.grg-statname{width:62px;flex:none;font-size:11px;font-weight:800;color:var(--txt-dim)}
.ltr .grg-statname{width:72px}
.grg-track{flex:1;height:11px;border-radius:var(--r-pill);background:rgba(255,255,255,.09);
  display:flex;overflow:hidden}
.grg-track>span{display:block;height:100%;transition:width .4s var(--ease)}
.grg-cur{background:linear-gradient(90deg,#6f7ba0,#9fb0d8)}
.grg-up{background:linear-gradient(90deg,#5fc96a,#a6f0a8);box-shadow:0 0 10px rgba(126,224,129,.5)}
.grg-dn{background:linear-gradient(90deg,#ff6b6b,#ffa3a3)}
.grg-statval{width:46px;flex:none;text-align:end;font-size:12px}
.grg-delta{font-size:11px;font-weight:900}
.grg-delta.good{color:var(--good)}.grg-delta.bad{color:var(--bad)}
.grg-delta.zero{color:var(--txt-dim)}

.grg-quality{display:flex;align-items:center;gap:10px;margin-top:4px}
.grg-qbar{flex:1;height:9px;border-radius:var(--r-pill);background:rgba(255,255,255,.1);overflow:hidden}
.grg-qbar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-3),var(--gold-1));transition:width .4s var(--ease)}

/* Tip card */
.grg-tip{padding:11px 14px;border-inline-start:4px solid var(--gold-2)}
.grg-tip-label{font-size:10px;font-weight:900;letter-spacing:.05em;color:var(--gold-1)}
.grg-tip-title{font-size:15px;font-weight:900;margin-top:2px}
.grg-tip-body{font-size:12.5px;font-weight:600;line-height:1.42;color:#e6e0d3;margin-top:3px}

/* Expert */
.grg-expertbar{display:flex;align-items:center;gap:10px}
.grg-toggle{display:flex;align-items:center;gap:9px;cursor:pointer;font-family:var(--font);
  padding:7px 13px;border-radius:var(--r-pill);font-size:12.5px;font-weight:800;color:var(--txt);
  background:rgba(255,255,255,.06);border:1px solid var(--stroke-hi)}
.grg-toggle:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.grg-sw{width:32px;height:17px;border-radius:999px;background:rgba(255,255,255,.16);
  position:relative;flex:none;transition:background .15s}
.grg-sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:13px;height:13px;
  border-radius:50%;background:#cfd4e0;transition:transform .15s var(--ease)}
.grg-toggle[aria-pressed="true"] .grg-sw{background:var(--gold-3)}
.grg-toggle[aria-pressed="true"] .grg-sw::after{background:#fff;transform:translateX(15px)}
.ltr .grg-toggle[aria-pressed="true"] .grg-sw::after{transform:translateX(15px)}
.rtl .grg-toggle[aria-pressed="true"] .grg-sw::after{transform:translateX(-15px)}
.grg-badge{font-size:10.5px;font-weight:800;color:var(--txt-dim)}
.grg-bonus{font-size:10.5px;font-weight:900;color:var(--token);
  background:rgba(255,214,107,.12);border-radius:var(--r-pill);padding:3px 9px}
.grg-expertbox{padding:11px 13px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.grg-ta{width:100%;flex:1;min-height:74px;resize:none;font-family:var(--font);font-size:15px;
  font-weight:700;line-height:1.4;color:var(--txt);padding:10px 12px;border-radius:var(--r-s);
  background:rgba(10,10,16,.6);border:2px solid var(--stroke-hi)}
.grg-ta:focus{outline:none;border-color:var(--gold-2)}
.grg-ta::placeholder{color:#7d7a72}
.grg-checks{display:flex;flex-wrap:wrap;gap:6px}
.grg-chk{font-size:11px;font-weight:800;padding:4px 10px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.06);color:var(--txt-dim);border:1px solid var(--stroke)}
.grg-chk.ok{background:rgba(126,224,129,.14);color:#bff0c1;border-color:rgba(126,224,129,.4)}

/* Reveal */
.grg-scrim{position:absolute;inset:0;background:rgba(6,6,12,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:24px}
.grg-reveal{width:min(760px,92%);padding:22px 26px 24px;display:flex;flex-direction:column;gap:12px}
.grg-tierbadge{align-self:flex-start;font-size:12px;font-weight:900;padding:5px 14px;
  border-radius:var(--r-pill);color:#2a1c00;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3))}
.grg-partname{font-size:34px;line-height:1.1}
.grg-flavour{font-size:15px;font-weight:700;line-height:1.45;color:#f0ebdf}
.grg-deltagrid{display:flex;gap:9px}
.grg-deltacard{flex:1;padding:9px 11px;border-radius:var(--r-s);background:rgba(255,255,255,.055);
  border:1px solid var(--stroke);display:flex;flex-direction:column;gap:3px}
.grg-revactions{display:flex;gap:10px;align-items:center;margin-top:2px}
.grg-tokgain{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;color:var(--token);
  margin-inline-start:auto}
