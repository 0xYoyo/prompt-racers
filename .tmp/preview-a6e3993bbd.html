  --gold-1:#ffe9a8; --gold-2:#ffc247; --gold-3:#f59310;
  --ink:#12121c; --ink-2:#1c1c2b;
  --panel:rgba(22,22,34,.82); --panel-solid:#191926;
  --stroke:rgba(255,255,255,.10); --stroke-hi:rgba(255,255,255,.22);
  --txt:#f4f1ea; --txt-dim:#a8a29a;
  --good:#7ee081; --warn:#ffb347; --bad:#ff6b6b; --info:#6fc3ff;
  --token:#ffd66b;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-panel:0 10px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  --sh-pop:0 18px 50px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
#ui{font-family:var(--font);color:var(--txt);}
#ui *{pointer-events:none}
#ui .on{pointer-events:auto}

/* ---- layout helpers that flip correctly under RTL ---- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.fill{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}

/* Logical properties everywhere so a single rule serves both directions. */
.hud-tl{position:absolute;inset-block-start:18px;inset-inline-start:18px}
.hud-tr{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.hud-bl{position:absolute;inset-block-end:18px;inset-inline-start:18px}
.hud-br{position:absolute;inset-block-end:18px;inset-inline-end:18px}
.hud-tc{position:absolute;inset-block-start:14px;left:50%;transform:translateX(-50%)}

/* ---- surfaces ---- */
.panel{
  background:linear-gradient(180deg,rgba(40,40,58,.9),rgba(18,18,28,.92));
  border:1px solid var(--stroke); border-radius:var(--r-m);
  box-shadow:var(--sh-panel); backdrop-filter:blur(8px);
}
.panel-lift{background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(24,24,36,.96));
  border:1px solid var(--stroke-hi); border-radius:var(--r-l); box-shadow:var(--sh-pop)}

/* ---- type ---- */
.display{
  font-weight:900; letter-spacing:-.02em; line-height:.92;
  background:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.5));
  paint-order:stroke fill;
}
.display-white{background:linear-gradient(180deg,#fff 20%,#e8e2d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.rtl .label{letter-spacing:.04em}     /* Hebrew has no case; wide tracking hurts it */
.num{font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate}

/* ---- buttons ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:17px;color:#2a1c00;
  padding:14px 34px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 0 #a4620a, 0 12px 26px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4620a,0 6px 14px rgba(0,0,0,.45)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--stroke-hi);box-shadow:none;font-weight:700}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:3px solid var(--info);outline-offset:3px}

/* ---- misc ---- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1));transition:width .45s var(--ease)}
.rtl .bar>i{background:linear-gradient(270deg,var(--gold-2),var(--gold-1))}

.fade-in{animation:fadeIn .35s var(--ease) both}
.pop-in{animation:popIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .fade-in,.pop-in{animation:none}
  *{transition-duration:.01ms !important}
}

5E9\u05D5\u05E8\u05D4 \u05E9\u05DC "\u05DE\u05D4 \u05D0\u05E1\u05D5\u05E8 \u05DC\u05D4\u05E8\u05D5\u05E1", \u05D1\u05D5\u05E8\u05D2 \u05D1\u05D7\u05E8 \u05DC\u05D1\u05D3: \u05D4\u05D5\u05D0 \u05D4\u05D5\u05E1\u05D9\u05E3 {gain} {tradeoff}',bodyEn:'With no "what must not break" line, Boreg chose on his own: he added {gain} {tradeoff}'},{id:"constraint.first",visit:2,trigger:"player picked a real constraint (specificity >= 2)",titleHe:"\u05D4\u05D2\u05D1\u05DC\u05D4 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05E2\u05D5\u05D6\u05E8\u05EA",titleEn:"A limit actually helps",bodyHe:'\u05D4\u05D4\u05D2\u05D1\u05DC\u05D4 \u05E9\u05E0\u05D5\u05E1\u05E4\u05D4 \u05DC\u05D1\u05E7\u05E9\u05D4 \u2014 "{limit}" \u2014 \u05D0\u05D9\u05DC\u05E6\u05D4 \u05D0\u05EA \u05D1\u05D5\u05E8\u05D2 \u05DC\u05DE\u05E6\u05D5\u05D0 \u05E4\u05EA\u05E8\u05D5\u05DF \u05D7\u05DB\u05DD \u05D9\u05D5\u05EA\u05E8. \u05D4\u05D2\u05D1\u05DC\u05D4 \u05DC\u05D0 \u05DE\u05E7\u05D8\u05D9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4, \u05D4\u05D9\u05D0 \u05DE\u05D7\u05D3\u05D3\u05EA \u05D0\u05D5\u05EA\u05D4.',bodyEn:'The limit added to the ask \u2014 "{limit}" \u2014 forced Boreg into a cleverer answer. A limit does not shrink the ask, it sharpens it.'},{id:"constraint.coherent",visit:2,trigger:"goal and constraint pull on the same thing (coherence bonus earned)",titleHe:"\u05D4\u05DE\u05D8\u05E8\u05D4 \u05D5\u05D4\u05D4\u05D2\u05D1\u05DC\u05D4 \u05DE\u05E1\u05EA\u05D3\u05E8\u05D5\u05EA \u05D1\u05D9\u05E0\u05D9\u05D4\u05DF",titleEn:"The goal and the limit get along",bodyHe:'\u05D4\u05DE\u05D8\u05E8\u05D4 "{goal}" \u05D5\u05D4\u05D4\u05D2\u05D1\u05DC\u05D4 "{limit}" \u05DE\u05D5\u05E9\u05DB\u05D5\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DC\u05D0\u05D5\u05EA\u05D5 \u05DB\u05D9\u05D5\u05D5\u05DF, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D7\u05DC\u05E7 \u05D9\u05E6\u05D0 \u05D8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05E1\u05DB\u05D5\u05DD \u05E9\u05EA\u05D9 \u05D4\u05D1\u05E7\u05E9\u05D5\u05EA. \u05DB\u05E9\u05E9\u05E0\u05D9 \u05D4\u05D7\u05E6\u05D0\u05D9\u05DD \u05DE\u05D3\u05D1\u05E8\u05D9\u05DD \u05D0\u05D5\u05EA\u05D4 \u05E9\u05E4\u05D4, \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4 \u05E7\u05D5\u05E4\u05E6\u05EA.',bodyEn:'The goal "{goal}" and the limit "{limit}" pull in exactly the same direction, so the part beat the sum of its two halves. When both halves speak the same language, the result jumps.'},{id:"constraint.mismatch",visit:2,trigger:"a real constraint was chosen but it is not one this goal depends on",titleHe:"\u05D4\u05D4\u05D2\u05D1\u05DC\u05D4 \u05DC\u05D0 \u05E2\u05DC \u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8",titleEn:"The limit is about something else",bodyHe:'\u05D4\u05DE\u05D8\u05E8\u05D4 \u05D4\u05D9\u05D9\u05EA\u05D4 "{goal}", \u05D5\u05D4\u05D4\u05D2\u05D1\u05DC\u05D4 \u05D4\u05D9\u05D9\u05EA\u05D4 "{limit}" \u2014 \u05D4\u05D2\u05D1\u05DC\u05D4 \u05D8\u05D5\u05D1\u05D4, \u05D0\u05D1\u05DC \u05D4\u05D9\u05D0 \u05DC\u05D0 \u05E0\u05D5\u05D2\u05E2\u05EA \u05D1\u05D0\u05D5\u05EA\u05D5 \u05D3\u05D1\u05E8. \u05E9\u05D5\u05D5\u05D4 \u05DC\u05E0\u05E1\u05D5\u05EA \u05D4\u05D2\u05D1\u05DC\u05D4 \u05E9\u05DE\u05D3\u05D1\u05E8\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05E2\u05DC \u05DE\u05D4 \u05E9\u05D4\u05DE\u05D8\u05E8\u05D4 \u05E8\u05D5\u05E6\u05D4.',bodyEn:'The goal was "{goal}", and the limit was "{limit}" \u2014 a fine limit, but not about the same thing. Worth trying a limit that talks about exactly what the goal wants.'},{id:"style.matters",visit:3,trigger:"player picked a style with specificity >= 2",titleHe:"\u05E1\u05D2\u05E0\u05D5\u05DF \u05D6\u05D4 \u05D2\u05DD \u05DE\u05D9\u05D3\u05E2",titleEn:"Style is information too",bodyHe:'"{style}" \u05E0\u05EA\u05DF \u05DC\u05D1\u05D5\u05E8\u05D2 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05D1\u05E8\u05D0\u05E9, \u05D0\u05D6 \u05D4\u05D7\u05DC\u05E7 \u05D9\u05E6\u05D0 \u05D0\u05D9\u05E9\u05D9 \u05D5\u05DC\u05D0 \u05E1\u05EA\u05DD \u05D0\u05E4\u05D5\u05E8. \u05D2\u05DD "\u05D0\u05D9\u05DA \u05D6\u05D4 \u05E0\u05E8\u05D0\u05D4   border-radius:50%;background:#cfd4e0;transition:transform .15s var(--ease)}
.grg-toggle[aria-pressed="true"] .grg-sw{background:var(--gold-3)}
.ltr .grg-toggle[aria-pressed="true"] .grg-sw::after{background:#fff;transform:translateX(15px)}
.rtl .grg-toggle[aria-pressed="true"] .grg-sw::after{background:#fff;transform:translateX(-15px)}
.grg-badge{font-size:11px;font-weight:800;color:var(--txt-dim)}
.grg-bonus{font-size:11px;font-weight:900;color:var(--token);
  background:rgba(255,214,107,.12);border-radius:var(--r-pill);padding:4px 10px}
.grg-expertbox{padding:13px 15px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.grg-recipe{padding:13px 15px;display:flex;flex-direction:column;gap:9px;flex:none}
.grg-recipe-row{display:flex;gap:8px;flex-wrap:wrap}
.grg-recipe-chip{font-size:13px;font-weight:800;padding:8px 14px;border-radius:var(--r-pill);
  color:#ffe3ab;background:rgba(255,194,71,.10);border:1px solid rgba(255,194,71,.28)}
.grg-ta{width:100%;flex:1;min-height:150px;resize:none;font-family:var(--font);font-size:15.5px;
  font-weight:700;line-height:1.4;color:var(--txt);padding:11px 13px;border-radius:var(--r-s);
  background:rgba(10,10,16,.6);border:2px solid var(--stroke-hi)}
.grg-ta:focus{outline:none;border-color:var(--gold-2)}
.grg-ta::placeholder{color:#7d7a72}
.grg-checks{display:flex;flex-wrap:wrap;gap:7px}
.grg-chk{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.06);color:var(--txt-dim);border:1px solid var(--stroke)}
.grg-chk.ok{background:rgba(126,224,129,.16);color:#bff0c1;border-color:rgba(126,224,129,.45)}

/* Reveal */
.grg-scrim{position:absolute;inset:0;background:rgba(6,6,12,.66);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:22px}
.grg-reveal{width:min(780px,94%);max-height:96%;overflow:auto;padding:20px 26px 22px;
  display:flex;flex-direction:column;gap:11px}
.grg-tierbadge{align-self:flex-start;font-size:12.5px;font-weight:900;padding:6px 15px;
  border-radius:var(--r-pill);color:#2a1c00;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
  box-shadow:0 0 26px rgba(255,194,71,.45)}
/* The ask that caused all this, reprinted at the top of the reveal \u2014 the modal
   must never be the moment the cause disappears. */
.grg-recap{padding:12px 16px;border-radius:var(--r-m);line-height:1.55;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,194,71,.24);
  font-size:17px;font-weight:800;color:#ded7c7}
.ltr .grg-recap{font-size:16px}
.grg-recap .hi{color:#fff6e2;background:rgba(255,194,71,.20);border-radius:7px;padding:1px 5px;
  box-shadow:0 0 0 1px rgba(255,194,71,.32)}
.grg-specrow{display:flex;gap:8px;flex-wrap:wrap}
.grg-specchip{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;
  color:var(--txt-dim);padding:6px 12px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.grg-dots{display:flex;gap:4px}
.grg-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}
.grg-dot.on{background:var(--gold-2);box-shadow:0 0 8px rgba(255,194,71,.75)}
.grg-partname{font-size:34px;line-height:1.1}
.grg-flavour{font-size:15px;font-weight:700;line-height:1.45;color:#f0ebdf}
.grg-deltagrid{display:flex;gap:9px}
.grg-deltacard{flex:1;padding:9px 12px;border-radius:var(--r-s);background:rgba(255,255,255,.055);
  border:1px solid var(--stroke);display:flex;flex-direction:column;gap:3px}
.grg-revactions{display:flex;gap:10px;align-items:center;margin-top:2px}
.grg-tokgain{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900;
  color:var(--token);margin-inline-start:auto}

@media (max-height:790px){
  .grg-title{font-size:32px}
  .grg-sentence-txt{font-size:22px}
  .ltr .grg-sentence-txt{font-size:20px}
  .grg-opt-head{min-height:66px}
  .grg-opt-he{font-size:16px}
  .grg-root{gap:11px;padding:14px 20px 15px}
  .grg-body{gap:14px}
}
