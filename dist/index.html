:root{
  --gold:#ffc247;
  --gold-1:#ffe9a8; --gold-2:#ffc247; --gold-3:#f59310;
  --ink:#12121c; --ink-2:#1c1c2b;
  --panel:rgba(22,22,34,.82); --panel-solid:#191926;
  --stroke:rgba(255,255,255,.10); --stroke-hi:rgba(255,255,255,.22);
  --txt:#f4f1ea; --txt-dim:#a8a29a;
  --good:#7ee081; --warn:#ffb347; --bad:#ff6b6b; --info:#6fc3ff;
  --token:#ffd66b;
  --r-s:10px; --r-m:16px; --r-l:24px; --r-pill:999px;
  --sh-panel:0 10px 28px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.06) inset;
  --sh-pop:0 18px 50px rgba(0,0,0,.6);
  --ease:cubic-bezier(.22,.9,.3,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
#ui{font-family:var(--font);color:var(--txt);}
#ui *{pointer-events:none}
#ui .on{pointer-events:auto}

/* ---- layout helpers that flip correctly under RTL ---- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.fill{position:absolute;inset:0}
.center{display:flex;align-items:center;justify-content:center}

/* Logical properties everywhere so a single rule serves both directions. */
.hud-tl{position:absolute;inset-block-start:18px;inset-inline-start:18px}
.hud-tr{position:absolute;inset-block-start:18px;inset-inline-end:18px}
.hud-bl{position:absolute;inset-block-end:18px;inset-inline-start:18px}
.hud-br{position:absolute;inset-block-end:18px;inset-inline-end:18px}
.hud-tc{position:absolute;inset-block-start:14px;left:50%;transform:translateX(-50%)}

/* ---- surfaces ---- */
.panel{
  background:linear-gradient(180deg,rgba(40,40,58,.9),rgba(18,18,28,.92));
  border:1px solid var(--stroke); border-radius:var(--r-m);
  box-shadow:var(--sh-panel); backdrop-filter:blur(8px);
}
.panel-lift{background:linear-gradient(180deg,rgba(52,52,72,.94),rgba(24,24,36,.96));
  border:1px solid var(--stroke-hi); border-radius:var(--r-l); box-shadow:var(--sh-pop)}

/* ---- type ---- */
.display{
  font-weight:900; letter-spacing:-.02em; line-height:.92;
  background:linear-gradient(180deg,var(--gold-1) 8%,var(--gold-2) 52%,var(--gold-3) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 12px 24px rgba(0,0,0,.5));
  paint-order:stroke fill;
}
.display-white{background:linear-gradient(180deg,#fff 20%,#e8e2d4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)}
.rtl .label{letter-spacing:.04em}     /* Hebrew has no case; wide tracking hurts it */
.num{font-variant-numeric:tabular-nums;font-weight:900;direction:ltr;unicode-bidi:isolate}

/* ---- buttons ---- */
.btn{
  font-family:var(--font);font-weight:800;font-size:17px;color:#2a1c00;
  padding:14px 34px;border:0;border-radius:var(--r-pill);cursor:pointer;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 6px 0 #a4620a, 0 12px 26px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a4620a,0 6px 14px rgba(0,0,0,.45)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--txt);
  border:1px solid var(--stroke-hi);box-shadow:none;font-weight:700}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.btn:focus-visible{outline:3px solid var(--info);outline-offset:3px}

/* ---- misc ---- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(255,255,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-2),var(--gold-1));transition:width .45s var(--ease)}
.rtl .bar>i{background:linear-gradient(270deg,var(--gold-2),var(--gold-1))}

.fade-in{animation:fadeIn .35s var(--ease) both}
.pop-in{animation:popIn .4s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .fade-in,.pop-in{animation:none}
  *{transition-duration:.01ms !important}
}

.hud-root{
  position:absolute; inset:0; pointer-events:none; overflow:hidden;
  font-family:var(--font); color:var(--txt);
  font-size:16px;                       /* every HUD size is em-relative to this */
  /* Same panel treatment as .panel/.panel-lift in ui/style.js \u2014 the HUD used to
     carry its own warm-brown card, which read as a different product the moment
     you went race \u2192 results \u2192 garage in one sitting. Only the shadow is heavier
     here, because this panel sits over moving gameplay rather than a scrim. */
  --hud-card:linear-gradient(180deg,rgba(52,52,72,.93),rgba(20,20,31,.95));
  --hud-edge:1px solid var(--stroke);
  --hud-sh:0 0 0 1px rgba(0,0,0,.45), 0 .5em 1.4em rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.16), inset 0 -.5em 1em rgba(0,0,0,.28);
  contain:layout style;
}
/* School-laptop / short viewports: shrink the whole HUD from one number. */
@media (max-width:1400px){ .hud-root{font-size:14px} }
@media (max-height:780px){ .hud-root{font-size:13.5px} }
@media (max-width:1100px){ .hud-root{font-size:12.5px} }

.hud-root .hud-card{
  background:var(--hud-card); border:var(--hud-edge);
  border-radius:var(--r-m); box-shadow:var(--hud-sh);
}
/* Micro-labels have a hard 11px floor. Hebrew has no capitals and far less
   x-height contrast than Latin, so it degrades much faster at small sizes \u2014
   and the audience is eight-year-olds. The em-relative size still shrinks the
   rest of the HUD on a small laptop; the labels simply stop following it down. */
.hud-root .label{font-size:max(11px,.6em);letter-spacing:.16em;color:var(--txt-dim);font-weight:800}
.rtl .hud-root .label{letter-spacing:.02em;font-size:max(11.5px,.66em)}
.hud-root .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* \u2500\u2500 lap counter \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-lap{padding:.42em .85em .5em; min-width:4.2em; text-align:start}
.hud-lap .lap-nums{direction:ltr;display:flex;align-items:baseline;gap:.08em;margin-top:.05em}
.rtl .hud-lap .lap-nums{justify-content:flex-end}
.hud-lap .lap-cur{font-size:2.35em;font-weight:900;line-height:.95;color:#fff;
  text-shadow:0 .06em 0 rgba(0,0,0,.55), 0 .18em .35em rgba(0,0,0,.5)}
.hud-lap .lap-tot{font-size:1.15em;font-weight:900;color:#9c9184;letter-spacing:-.02em}
.hud-lap.final .lap-cur{color:#ffd98a}
.hud-lap.final{box-shadow:var(--hud-sh),0 0 0 2px rgba(255,194,71,.55)}

/* \u2500\u2500 race timer \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-timer{padding:.42em .95em .5em; text-align:end; min-width:6.1em}
.rtl .hud-timer{text-align:start}
.hud-timer .t-row{direction:ltr;display:flex;align-items:baseline;justify-content:flex-end;gap:.02em}
.rtl .hud-timer .t-row{justify-content:flex-start}
.hud-timer .t-main{font-size:2.05em;font-weight:900;color:#fff;line-height:.98;
  text-shadow:0 .06em 0 rgba(0,0,0,.55), 0 .18em .35em rgba(0,0,0,.5)}
.hud-timer .t-cs{font-size:1.2em;font-weight:900;color:#cdc3b4}
.hud-timer .t-best{display:flex;gap:.4em;align-items:baseline;justify-content:flex-end;
  margin-top:.18em;font-size:max(11px,.66em);font-weight:800;color:var(--txt-dim);direction:ltr}
.rtl .hud-timer .t-best{justify-content:flex-start}
.hud-timer .t-best.hide{visibility:hidden}
.hud-timer .t-best b{color:#ffc247}

/* \u2500\u2500 minimap \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-map{padding:.42em; line-height:0}
.hud-map .mm-canvas{display:block;border-radius:.7em}

/* \u2500\u2500 position card \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-pos{
  position:absolute; inset-inline-start:1.1em; inset-block-start:46%;
  padding:.34em 1em .48em; min-width:9.2em; max-width:16em;
}
.hud-pos .p-main{display:flex;align-items:baseline;gap:.3em}
.ltr .hud-pos .p-main{gap:.1em}
.hud-pos .p-n{font-size:3.15em;font-weight:900;line-height:.9;color:#fff;
  text-shadow:0 .05em 0 rgba(0,0,0,.5),0 .16em .3em rgba(0,0,0,.5)}
.hud-pos .p-sfx{font-size:1.02em;font-weight:900;color:#ffc247;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:7.2em}
.rtl .hud-pos .p-sfx{font-size:.95em}
.hud-pos .p-rule{height:1px;background:rgba(255,255,255,.13);margin:.18em 0 .3em}
.hud-pos .p-rival{display:flex;align-items:center;gap:.42em;font-size:.78em;font-weight:800}
.hud-pos .p-dot{width:.62em;height:.62em;border-radius:50%;background:#7fd2ff;flex:0 0 auto;
  box-shadow:0 0 .5em currentColor}
.hud-pos .p-name{color:#e6ded1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:7.6em}
.hud-pos .p-gap{margin-inline-start:auto;font-weight:900;color:#cfc6b8}
.hud-pos .p-gap.ahead{color:var(--good)} .hud-pos .p-gap.behind{color:var(--bad)}
.hud-pos.p-hide-rival .p-rule,.hud-pos.p-hide-rival .p-rival{display:none}
.hud-pos.lead .p-n{color:#ffe6ab}

/* \u2500\u2500 token counter \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-tokens{padding:.34em .8em .34em .5em;display:flex;align-items:center;gap:.5em}
.rtl .hud-tokens{padding:.34em .5em .34em .8em}
.hud-tokens .tk-glyph{width:2.1em;height:2.1em;flex:0 0 auto;filter:drop-shadow(0 0 .45em rgba(255,200,90,.6))}
.hud-tokens .tk-n{font-size:1.75em;font-weight:900;color:#ffe7b4;
  text-shadow:0 .06em 0 rgba(0,0,0,.5)}
.hud-tokens .tk-lbl{font-size:max(11px,.58em);letter-spacing:.12em;color:var(--txt-dim);font-weight:800}
.rtl .hud-tokens .tk-lbl{letter-spacing:.02em;font-size:max(11.5px,.64em)}
.hud-tokens .tk-combo{
  font-size:.82em;font-weight:900;color:#2a1c00;padding:.1em .5em;border-radius:999px;
  background:linear-gradient(180deg,#ffe9a8,#ffc247 60%,#f59310);
  box-shadow:0 .12em 0 #a4620a; direction:ltr; opacity:0; transform:scale(.6);
  transition:opacity .18s var(--ease),transform .18s var(--ease);
}
.hud-tokens .tk-combo.on{opacity:1;transform:none}

/* \u2500\u2500 drift meter \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-drift{
  position:absolute; inset-block-end:1.7em; left:50%; transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center; gap:.4em;
  opacity:0; transition:opacity .18s var(--ease);
}
.hud-drift.on{opacity:1}
.hud-drift .d-lbl{font-size:max(11px,.72em);letter-spacing:.18em;font-weight:900;color:#e8dcc6;
  text-shadow:0 .1em .3em rgba(0,0,0,.8)}
.rtl .hud-drift .d-lbl{letter-spacing:.08em;font-size:max(11.5px,.8em)}
.hud-drift .d-track{display:flex;gap:.34em}
.hud-drift .d-seg{
  position:relative;width:4.2em;height:.92em;border-radius:999px;overflow:hidden;
  background:rgba(12,12,20,.8);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 .2em .6em rgba(0,0,0,.7);
}
.hud-drift .d-seg>b{
  position:absolute;inset:0;border-radius:999px;display:block;
  transform:scaleX(0);transform-origin:left center;
  transition:transform .06s linear;
}
.rtl .hud-drift .d-seg>b{transform-origin:right center}
.hud-drift .d-seg.t1>b{background:linear-gradient(90deg,#4fb9ff,#9fe0ff)}
.hud-drift .d-seg.t2>b{background:linear-gradient(90deg,#ff9d3c,#ffd07a)}
.hud-drift .d-seg.t3>b{background:linear-gradient(90deg,#c07cff,#ecc4ff)}
.hud-drift .d-seg.lit{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 0 .8em currentColor,0 .2em .5em rgba(0,0,0,.5)}
.hud-drift .d-seg.t1.lit{color:#4fb9ff} .hud-drift .d-seg.t2.lit{color:#ff9d3c}
.hud-drift .d-seg.t3.lit{color:#c07cff}

/* \u2500\u2500 speedometer \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-speedo{padding:.32em .45em .1em; width:8.1em}
.hud-speedo .sp-wrap{position:relative;width:100%;aspect-ratio:1/.94;direction:ltr}
.hud-speedo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hud-speedo .sp-read{
  position:absolute;inset-inline:0;bottom:.35em;display:flex;align-items:baseline;
  justify-content:center;gap:.22em;direction:ltr;
}
.hud-speedo .sp-n{font-size:1.9em;font-weight:900;color:#fff;line-height:1;
  text-shadow:0 .06em 0 rgba(0,0,0,.6)}
.hud-speedo .sp-u{font-size:max(11px,.56em);font-weight:800;letter-spacing:.02em;color:var(--txt-dim)}
.hud-speedo.boost .sp-n{color:#bff0ff}

/* \u2500\u2500 countdown \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-count{
  position:absolute; inset-inline:0; inset-block-start:21%;
  display:flex; flex-direction:column; align-items:center; gap:.7em;
  opacity:0; transition:opacity .2s var(--ease);
}
.hud-count.on{opacity:1}
.hud-count .gantry{
  display:flex;gap:.95em;padding:.6em .95em;border-radius:999px;direction:ltr;
  background:linear-gradient(180deg,#3d4a3f,#1b2320);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 .6em 1.6em rgba(0,0,0,.6), inset 0 .12em 0 rgba(255,255,255,.14);
}
.hud-count .gantry i{
  width:1.95em;height:1.95em;border-radius:50%;display:block;
  background:radial-gradient(circle at 34% 30%,#3a3f3c,#14171a 70%);
  box-shadow:inset 0 .1em .3em rgba(0,0,0,.8);
  transition:background .12s linear, box-shadow .12s linear;
}
.hud-count .gantry i.red{
  background:radial-gradient(circle at 34% 30%,#ffb0a0,#e0362a 55%,#7d1710 100%);
  box-shadow:0 0 1.1em rgba(255,80,60,.85), inset 0 .1em .25em rgba(255,255,255,.35);
}
.hud-count .gantry i.green{
  background:radial-gradient(circle at 34% 30%,#d6ffbe,#5fd44a 52%,#227d1c 100%);
  box-shadow:0 0 1.3em rgba(120,240,90,.9), inset 0 .1em .25em rgba(255,255,255,.4);
}
.hud-count .c-big{
  font-size:11.5em;font-weight:900;line-height:.84;letter-spacing:-.035em;
  -webkit-text-stroke:.028em rgba(24,14,4,.5); paint-order:stroke fill;
  background:linear-gradient(180deg,#fff 6%,#ffe08e 45%,#f5a218 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .04em 0 rgba(0,0,0,.7)) drop-shadow(0 .09em .16em rgba(0,0,0,.6));
}
.hud-count .c-big.go{
  font-size:9em;
  background:linear-gradient(180deg,#e8ffd6 6%,#8ce86a 48%,#35a52c 100%);
  -webkit-background-clip:text;background-clip:text;
}

/* \u2500\u2500 banners & notes \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-banner{
  position:absolute; inset-inline:0; inset-block-start:30%;
  display:flex;flex-direction:column;align-items:center;gap:.25em;
  opacity:0; visibility:hidden;
}
.hud-banner.on{opacity:1;visibility:visible}
.hud-banner .b-txt{
  font-size:3.6em;font-weight:900;letter-spacing:-.02em;line-height:1;text-align:center;
  background:linear-gradient(180deg,#fff 6%,#ffdd8c 46%,#f2960f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .045em 0 rgba(0,0,0,.6)) drop-shadow(0 .09em .16em rgba(0,0,0,.6));
  padding-inline:.3em;
}
.hud-banner .b-sub{font-size:.95em;font-weight:800;color:#f0e6d4;
  text-shadow:0 .1em .4em rgba(0,0,0,.85)}
.hud-banner.good .b-txt{background:linear-gradient(180deg,#eaffdd 6%,#95ea75 48%,#33a12b 100%);
  -webkit-background-clip:text;background-clip:text}
.hud-banner .b-rule{width:7em;height:.16em;border-radius:999px;
  background:linear-gradient(90deg,transparent,#ffc247,transparent)}

.hud-notes{
  position:absolute; inset-inline:0; inset-block-start:8.6em;
  display:flex;flex-direction:column;align-items:center;gap:.35em;
}
.hud-note{
  display:flex;align-items:center;gap:.45em;padding:.32em .95em;border-radius:999px;
  background:linear-gradient(180deg,rgba(58,50,48,.94),rgba(20,18,24,.95));
  border:1px solid rgba(255,255,255,.13); box-shadow:0 .4em 1em rgba(0,0,0,.5);
  font-size:.86em;font-weight:800;color:#f0e6d4; white-space:nowrap;
  opacity:0; visibility:hidden;
}
.hud-note.on{opacity:1;visibility:visible}
.hud-note .n-ico{font-size:1.05em}
.hud-note.up{color:#c8f6b7} .hud-note.down{color:#ffc2b6}
.hud-note.gold{color:#ffe0a0}

.hud-wrong{
  position:absolute; inset-inline:0; inset-block-start:41%;
  display:flex;flex-direction:column;align-items:center;gap:.3em;
  opacity:0; visibility:hidden; transition:opacity .15s linear;
}
.hud-wrong.on{opacity:1;visibility:visible;animation:hudWrong 1s steps(1,end) infinite}
.hud-wrong .w-ico{font-size:2.6em;line-height:1;filter:drop-shadow(0 .08em .2em rgba(0,0,0,.7))}
.hud-wrong .w-txt{font-size:1.5em;font-weight:900;color:#ff8f7a;
  text-shadow:0 .06em 0 rgba(0,0,0,.6),0 .1em .5em rgba(0,0,0,.8)}
@keyframes hudWrong{0%,60%{opacity:1}61%,100%{opacity:.25}}

/* \u2500\u2500 full-screen feedback (never covers the road, only the edges) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.hud-fx{position:absolute;inset:0;pointer-events:none}
.hud-fx>div{position:absolute;inset:0;opacity:0;transition:opacity .18s linear}
.fx-boost{background:
  radial-gradient(ellipse 66% 62% at 50% 52%,rgba(255,200,110,0) 62%,rgba(255,176,64,.34) 100%),
  radial-gradient(ellipse 120% 55% at 50% 110%,rgba(255,150,40,.28),rgba(255,150,40,0) 70%)}
.fx-off{background:
  radial-gradient(ellipse 66% 60% at 50% 52%,rgba(0,0,0,0) 52%,rgba(96,60,26,.6) 100%)}
.fx-final{background:
  radial-gradient(ellipse 70% 66% at 50% 52%,rgba(0,0,0,0) 66%,rgba(255,180,60,.26) 100%)}
.hud-fx .fx-final.on{animation:hudFinalPulse 1.6s ease-in-out infinite}
@keyframes hudFinalPulse{0%,100%{opacity:.28}50%{opacity:.7}}

@media (prefers-reduced-motion:reduce){
  .hud-root *,.hud-root *::before,.hud-root *::after{
    animation:none !important; transition-duration:.01ms !important;
  }
}

5D9 \u05D4\u05E8\u05D1\u05D4 \u2014 \u05D5\u05D0\u05EA \u05D6\u05D4 \u05E8\u05D5\u05D0\u05D9\u05DD \u05D1\u05E4\u05E1\u05D9\u05DD \u05E9\u05DC \u05D4\u05E7\u05D0\u05E8\u05D8.",bodyEn:"There are never enough tokens for the most precise option in all four rows, and that is on purpose. The real question is which row the precision is worth the most in \u2014 and the kart bars answer it."},{id:"spec.compare",visit:1,trigger:"player built a second part in the same visit (comparison moment)",titleHe:"\u05E9\u05D5\u05D5\u05D4 \u05DC\u05D4\u05E9\u05D5\u05D5\u05EA",titleEn:"Worth comparing",bodyHe:"\u05D0\u05D5\u05EA\u05D5 \u05D7\u05DC\u05E7, \u05D1\u05E7\u05E9\u05D4 \u05D0\u05D7\u05E8\u05EA \u2014 \u05D5\u05EA\u05D5\u05E6\u05D0\u05D4 \u05D0\u05D7\u05E8\u05EA \u05DC\u05D2\u05DE\u05E8\u05D9. \u05D1\u05D5\u05E8\u05D2 \u05DC\u05D0 \u05D4\u05E9\u05EA\u05E0\u05D4 \u05D1\u05D9\u05DF \u05D4\u05D1\u05E0\u05D9\u05D9\u05D4 \u05D4\u05E7\u05D5\u05D3\u05DE\u05EA \u05DC\u05D6\u05D0\u05EA. \u05D4\u05D1\u05E7\u05E9\u05D4 \u05DB\u05DF.",bodyEn:"Same part, different ask, completely different result. Boreg did not change between those two builds. The ask did."},{id:"constraint.none",visit:2,trigger:'player left the constraint slot at "\u05D1\u05DC\u05D9 \u05D4\u05D2\u05D1\u05DC\u05D5\u05EA"',titleHe:"\u05D1\u05DC\u05D9 \u05D4\u05D2\u05D1\u05DC\u05D5\u05EA = \u05D1\u05DC\u05D9 \u05D1\u05DC\u05DE\u05D9\u05DD",titleEn:"No limits = no brakes",bodyHe:'\u05D1\u05DC\u05D9 \u05E9\u05D5\u05E8\u05D4 \u05E9\u05DC "\u05DE\u05D4 \u05D0\u05E1\u05D5\u05E8 \u05DC\u05D4\u05E8\u05D5\u05E1", \u05D1\u05D5\u05E8\u05D2 \u05D1\u05D7\u05E8 \u05DC\u05D1\u05D3: \u05D4\u05D5\u05D0 \u05D4\u05D5\u05E1\u05D9\u05E3 {gain} {tradeoff}',bodyEn:'With no "what must not break" line, Boreg chose on his own: he added {gain} {tradeoff}'},{id:"constraint.first",visit:2,trigger:"player picked a real constraint (specificity >= 2)",titleHe:"\u05D4\u05D2\u05D1\u05DC\u05D4 \u05D3\u05D5\u05D5\u05E7\u05D0 \u05E2\u05D5\u05D6\u05E8\u05EA",titleEn:"A limit actually helps",bodyHe:'\u05D4\u05D4\u05D2\u05D1\u05DC\u05D4 \u05E9\u05E0\u05D5\u05E1\u05E4\u05D4 \u05DC\u05D1\u05E7\u05E9\u05D4 \u2014 "{limit}" \u2014 \u05D0\u05D9\u05DC\u05E6\u05D4 \u05D0\u05EA \u05D1\u05D5\u05E8\u05D2 \u05DC\u05DE\u05E6\u05D5\u05D0 \u05E4\u05EA\u05E8\u05D5\u05DF \u05D7\u05DB\u05DD \u05D9\u05D5\u05EA\u05E8. \u05D4\u05D2\u05D1\u05DC\u05D4 \u05DC\u05D0 \u05DE\u05E7\u05D8\u05D9\u05E0\u05D4 \u05D0\u05EA \u05D4\u05D1\u05E7\u05E9\u05D4, \u05D4\u05D9\u05D0 \u05DE\u05D7\u05D3\u05D3\u05EA \u05D0\u05D5\u05EA\u05D4.',bodyEn:'The limit added to the ask \u2014 "{limit}" \u2014 forced Boreg into a cleverer answer. A limit does not shrink the ask, it sharpens it.'},{id:"constraint.coherent",visit:2,trigger:"goal and constraint pull on the same thing (coherence bonus earned)",titleHe:"\u05D4\u05DE\u05D8\u05E8\u05D4 \u05D5\u05D4\u05D4\u05D2\u05D1\u05DC\u05D4 \u05DE\u05E1\u05EA\u05D3\u05E8\u05D5\u05EA \u05D1\u05D9\u05E0\u05D9\u05D4\u05DF",titleEn:"The goal and the limit get along",bodyHe:'\u05D4\u05DE\u05D8\u05E8\u05D4 "{goal}" \u05D5\u05D4\u05D4\u05D2\u05D1\u05DC\u05D4 "{limit}" \u05DE\u05D5\u05E9\u05DB\u05D5\u05EA \u05D1\u05D3\u05D9\u05D5\u05E7 \u05DC\u05D0\u05D5\u05EA\u05D5 \u05DB\u05D9\u05D5\u05D5\u05DF, \u05D5\u05DC\u05DB\u05DF \u05D4\u05D7\u05DC\u05E7 \u05D9\u05E6\u05D0 \u05D8\u05D5\u05D1 \u05D9\u05D5\u05EA\u05E8 \u05DE\u05E1\u05DB\u05D5\u05DD \u05E9\u05EA\u05D9 \u05D4\u05D1\u05E7\u05E9\u05D5\u05EA. \u05DB\u05E9\u05E9\u05E0\u05D9 \u05D4\u05D7\u05E6\u05D0\u05D9\u05DD \u05DE\u05D3\u05D1\u05E8\u05D9\u05DD \u05D0\u05D5\u05EA\u05D4 \u05E9\u05E4\u05D4, \u05D4\u05EA\u05D5\u05E6\u05D0\u05D4 \u05E7\u05D5\u05E4\u05E6\u05EA.',bodyEn:'The goal "{goal}" and the limit "{limit}" pull in exactly the same direction, so the part beat the sum of its two halves. When both halves speak the same language, the result jumps.'},{id:"constraint.mismatch",visit:2,trigger:"a real constraint was chosen but it is not one this goal depends on",titleHe:"\u05D4\u05D4\u05D2\u05D .grg-root{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
  padding:18px 26px 20px;font-family:var(--font)}
.grg-top{display:flex;align-items:center;gap:16px}
.grg-title{font-size:40px;line-height:1}
.grg-kicker{font-size:12px;font-weight:800;color:var(--txt-dim);letter-spacing:.02em}
.grg-visit{font-size:12px;font-weight:800;color:var(--gold-1);
  background:rgba(255,194,71,.12);border:1px solid rgba(255,194,71,.3);
  border-radius:var(--r-pill);padding:5px 12px}
.grg-spacer{flex:1}
.grg-budget{display:flex;align-items:center;gap:14px;padding:9px 18px;border-radius:var(--r-pill);
  box-shadow:var(--sh-panel),0 0 26px rgba(255,214,107,.18)}
.grg-coin{width:22px;height:22px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff3cf,var(--token) 45%,#c98a12);
  box-shadow:0 0 12px rgba(255,214,107,.55),0 1px 0 rgba(255,255,255,.6) inset}
.grg-bignum{font-size:28px;line-height:1}
.grg-sub{font-size:11.5px;font-weight:800;color:var(--txt-dim)}
.grg-budgetnote{font-size:11.5px;font-weight:800;color:var(--token);opacity:.85;max-width:190px;
  line-height:1.25}

.grg-body{flex:1;display:flex;gap:18px;min-height:0}
.grg-main{flex:1.66;display:flex;flex-direction:column;gap:13px;min-width:0}
.grg-side{flex:1;max-width:372px;display:flex;flex-direction:column;gap:13px;min-width:0}

/* Boreg's line */
.grg-boreg{display:flex;align-items:center;gap:13px;padding:10px 16px}
.grg-face{width:44px;height:44px;flex:none;border-radius:14px;position:relative;
  background:linear-gradient(180deg,#8fa4c8,#5c6b8f);
  box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 6px 14px rgba(0,0,0,.45)}
.grg-face::before,.grg-face::after{content:"";position:absolute;top:15px;width:8px;height:10px;
  border-radius:4px;background:var(--gold-1);box-shadow:0 0 8px var(--gold-2)}
.grg-face::before{left:9px}.grg-face::after{right:9px}
.grg-antenna{position:absolute;top:-9px;left:50%;width:3px;height:9px;margin-left:-1.5px;
  background:#8fa4c8;border-radius:2px}
.grg-antenna::after{content:"";position:absolute;top:-6px;left:-3px;width:9px;height:9px;
  border-radius:50%;background:var(--gold-2);box-shadow:0 0 10px var(--gold-2)}
.grg-boreg-line{font-size:15px;font-weight:700;line-height:1.35}

/* The sentence \u2014 the centrepiece. */
.grg-sentence{padding:14px 20px 16px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(60,50,27,.94),rgba(26,22,14,.96));
  border:1px solid rgba(255,194,71,.34);border-radius:var(--r-l);
  box-shadow:var(--sh-pop),0 0 0 1px rgba(255,194,71,.10) inset,0 0 44px rgba(255,194,71,.08)}
.grg-sentence-txt{font-size:26px;font-weight:800;line-height:1.55;letter-spacing:-.01em}
.ltr .grg-sentence-txt{font-size:23px}
.grg-w{color:#fff6e2}
.grg-w.lead{color:var(--gold-1)}
.grg-blank{display:inline-block;padding:0 10px;border-radius:9px;font-size:.78em;
  color:#ffdb92;background:rgba(255,194,71,.10);
  border:2px dashed rgba(255,194,71,.45);vertical-align:2px}
.grg-blank.now{background:rgba(255,194,71,.22);border-style:solid;color:#fff2d4;
  box-shadow:0 0 20px rgba(255,194,71,.4)}
.grg-fill{border-radius:7px;padding:0 3px;background:rgba(255,194,71,.13)}

/* Steps \u2014 each row owns a colour identity (header gradient, number chip,
   selection bloom), so "which question is this" reads from across the room. */
.grg-hue-part{--rc1:#63a6e6;--rc2:#2f5f9e;--rcg:rgba(99,166,230,.5);--rci:#bcdcff}
.grg-hue-goal{--rc1:#f79055;--rc2:#b8442a;--rcg:rgba(247,144,85,.5);--rci:#ffd2b4}
.grg-hue-limit{--rc1:#5fc884;--rc2:#2c7a4e;--rcg:rgba(95,200,132,.46);--rci:#bdf0cf}
.grg-hue-style{--rc1:#ac7ce6;--rc2:#5d3ba0;--rcg:rgba(172,124,230,.5);--rci:#dcc8ff}
.grg-steps{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;justify-content:flex-start}
.grg-step{border-radius:var(--r-m)}
.grg-step-head{display:flex;align-items:center;gap:10px}
.grg-n{width:26px;height:26px;flex:none;border-radius:9px;font-size:13px;font-weight:900;
  color:#0f1018;background:linear-gradient(180deg,var(--rc1),var(--rc2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 14px var(--rcg),0 1px 0 rgba(255,255,255,.35) inset}
.grg-slot-title{font-size:16px;font-weight:900;color:var(--txt)}
.grg-slot-teach{font-size:12.5px;font-weight:700;color:var(--txt-dim)}

/* active step */
.grg-step.active{flex:0 1 auto;min-height:0;margin-block:auto;display:flex;flex-direction:column;gap:11px}
.grg-opts{display:flex;gap:13px;flex:1;min-height:186px;max-height:268px}
/* expert mode only needs the "which part" row, so it gets a compact variant */
.grg-opts.compact{flex:none;min-height:0;max-height:none}
.grg-opts.compact .grg-opt-head{min-height:54px}
.grg-opt{position:relative;flex:1 1 0;min-width:0;cursor:pointer;font-family:var(--font);
  color:var(--txt);padding:0;border-radius:16px;overflow:hidden;text-align:start;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(32,32,46,.94),rgba(12,12,19,.96));
  border:2px solid rgba(255,255,255,.09);box-shadow:0 10px 22px rgba(0,0,0,.5);
  transition:transform .14s var(--ease),border-color .14s,box-shadow .14s}
.grg-opt-head{position:relative;min-height:92px;display:flex;align-items:center;
  padding:11px 15px;background:linear-gradient(155deg,var(--rc1),var(--rc2));
  box-shadow:0 2px 0 rgba(255,255,255,.22) inset}
.grg-opt-head::after{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.7) 0 9px,transparent 9px 21px)}
.grg-opt-he{position:relative;font-size:16.5px;font-weight:900;line-height:1.22;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.45)}
.grg-opt-body{padding:12px 15px 13px;display:flex;flex-direction:column;gap:10px;flex:1}
.grg-opt-sub{font-size:12.5px;font-weight:700;color:#b6b0a7;line-height:1.38}
/* The exact words this card will drop into the sentence. Reading it is the
   point: the child sees their own Hebrew sentence being assembled, word by word. */
.grg-opt-frag{margin-block-start:auto;font-size:12.5px;font-weight:800;line-height:1.35;
  color:var(--rci);background:rgba(255,255,255,.05);border-radius:11px;padding:8px 11px;
  border:1px dashed rgba(255,255,255,.15)}
/* 11px is the floor for every Hebrew micro-label in the game \u2014 see the same
   note in race/hud.js. Below that Hebrew loses its stem contrast fast, and this
   audience starts at eight years old. */
.grg-opt-fragl{display:block;font-size:11px;font-weight:900;letter-spacing:.02em;
  color:var(--txt-dim);margin-block-end:3px}
.grg-opt:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3);
  box-shadow:0 16px 30px rgba(0,0,0,.55),0 0 26px var(--rcg)}
.grg-opt:focus-visible{outline:3px solid var(--info);outline-offset:3px}
.grg-opt[aria-pressed="true"]{border-color:var(--gold-2);
  box-shadow:0 0 0 3px rgba(255,194,71,.30),0 0 40px 6px var(--rcg),0 12px 26px rgba(0,0,0,.5)}
.grg-opt[aria-pressed="true"] .grg-opt-head::after{opacity:.3}
.grg-opt.locked{opacity:.3;cursor:not-allowed;filter:saturate(.35)}
.grg-cost{font-size:13px;font-weight:900;color:var(--token);
  display:flex;align-items:center;gap:6px}
.grg-cost i{width:12px;height:12px;border-radius:50%;display:block;
  background:radial-gradient(circle at 35% 30%,#fff3cf,var(--token) 50%,#c98a12);
  box-shadow:0 0 8px rgba(255,214,107,.5)}
.grg-cost.free{color:var(--txt-dim)}

/* done step \u2014 one compact line with a Change button */
.grg-step.done{display:flex;align-items:center;gap:11px;padding:8px 13px;flex:none;
  background:linear-gradient(180deg,rgba(34,34,48,.72),rgba(16,16,24,.78));
  border:1px solid var(--stroke);border-inline-start:4px solid var(--rc1)}
.grg-done-title{font-size:12.5px;font-weight:800;color:var(--txt-dim);flex:none}
.grg-done-pick{font-size:14.5px;font-weight:900;color:var(--rci);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grg-change{margin-inline-start:auto;flex:none;font-family:var(--font);cursor:pointer;
  font-size:12px;font-weight:800;color:var(--txt);padding:6px 14px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.07);border:1px solid var(--stroke-hi)}
.grg-change:hover{background:rgba(255,255,255,.15)}
.grg-change:focus-visible{outline:3px solid var(--info);outline-offset:2px}

/* upcoming step \u2014 a quiet placeholder so the child sees the shape of the task */
.grg-step.todo{display:flex;align-items:center;gap:11px;padding:8px 13px;flex:none;opacity:.42;
  border:1px dashed var(--stroke-hi)}
.grg-step.todo .grg-n{background:rgba(255,255,255,.12);color:var(--txt-dim);box-shadow:none}
.grg-todo-tag{margin-inline-start:auto;font-size:11px;font-weight:800;color:var(--txt-dim)}

/* Side column */
.grg-kart{flex:1;min-height:168px;max-height:270px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 30%,rgba(80,70,110,.34),rgba(12,12,20,.42) 70%)}
.grg-panel-pad{padding:12px 15px}
.grg-statrow{display:flex;align-items:center;gap:9px}
.grg-statname{width:64px;flex:none;font-size:11.5px;font-weight:800;color:var(--txt-dim)}
.ltr .grg-statname{width:74px}
.grg-track{flex:1;height:12px;border-radius:var(--r-pill);background:rgba(255,255,255,.09);
  display:flex;overflow:hidden}
.grg-track>span{display:block;height:100%;transition:width .4s var(--ease)}
.grg-cur{background:linear-gradient(90deg,#6f7ba0,#9fb0d8)}
.grg-up{background:linear-gradient(90deg,#5fc96a,#a6f0a8);box-shadow:0 0 12px rgba(126,224,129,.6)}
.grg-dn{background:linear-gradient(90deg,#ff6b6b,#ffa3a3)}
.grg-statval{width:44px;flex:none;text-align:end;font-size:12.5px}
.grg-delta{font-size:12px;font-weight:900;width:34px;text-align:end}
.grg-delta.good{color:var(--good)}.grg-delta.bad{color:var(--bad)}
.grg-delta.zero{color:var(--txt-dim)}

.grg-quality{display:flex;align-items:center;gap:10px;margin-top:5px}
.grg-qbar{flex:1;height:10px;border-radius:var(--r-pill);background:rgba(255,255,255,.1);overflow:hidden}
.grg-qbar>i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--gold-3),var(--gold-1));transition:width .4s var(--ease);
  box-shadow:0 0 14px rgba(255,194,71,.55)}

/* Tip card */
.grg-tip{padding:12px 15px;border-inline-start:4px solid var(--gold-2)}
.grg-side>.grg-tip{flex:1;min-height:124px}
.grg-tip-label{font-size:11px;font-weight:900;letter-spacing:.02em;color:var(--gold-1)}
.grg-tip-title{font-size:15.5px;font-weight:900;margin-top:2px}
.grg-tip-body{font-size:13px;font-weight:600;line-height:1.45;color:#e6e0d3;margin-top:4px}

/* Build button \u2014 real bloom, like the reference's primary CTA */
.grg-build{width:100%;padding:16px 20px;font-size:19px}
.grg-build:not(:disabled){box-shadow:0 6px 0 #a4620a,0 12px 26px rgba(0,0,0,.45),
  0 0 42px rgba(255,194,71,.5),0 1px 0 rgba(255,255,255,.6) inset}
.grg-build:not(:disabled):hover{box-shadow:0 8px 0 #a4620a,0 16px 32px rgba(0,0,0,.5),
  0 0 56px rgba(255,194,71,.62),0 1px 0 rgba(255,255,255,.6) inset}

/* Expert */
.grg-expertbar{display:flex;align-items:center;gap:10px;margin-block-start:auto}
.grg-toggle{display:flex;align-items:center;gap:9px;cursor:pointer;font-family:var(--font);
  padding:8px 14px;border-radius:var(--r-pill);font-size:13px;font-weight:800;color:var(--txt);
  background:rgba(255,255,255,.06);border:1px solid var(--stroke-hi)}
.grg-toggle:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.grg-sw{width:32px;height:17px;border-radius:999px;background:rgba(255,255,255,.16);
  position:relative;flex:none;transition:background .15s}
.grg-sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:13px;height:13px;
  border-radius:50%;background:#cfd4e0;transition:transform .15s var(--ease)}
.grg-toggle[aria-pressed="true"] .grg-sw{background:var(--gold-3)}
.ltr .grg-toggle[aria-pressed="true"] .grg-sw::after{background:#fff;transform:translateX(15px)}
.rtl .grg-toggle[aria-pressed="true"] .grg-sw::after{background:#fff;transform:translateX(-15px)}
.grg-badge{font-size:11px;font-weight:800;color:var(--txt-dim)}
.grg-bonus{font-size:11px;font-weight:900;color:var(--token);
  background:rgba(255,214,107,.12);border-radius:var(--r-pill);padding:4px 10px}
.grg-expertbox{padding:13px 15px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.grg-recipe{padding:13px 15px;display:flex;flex-direction:column;gap:9px;flex:none}
.grg-recipe-row{display:flex;gap:8px;flex-wrap:wrap}
.grg-recipe-chip{font-size:13px;font-weight:800;padding:8px 14px;border-radius:var(--r-pill);
  color:#ffe3ab;background:rgba(255,194,71,.10);border:1px solid rgba(255,194,71,.28)}
.grg-ta{width:100%;flex:1;min-height:150px;resize:none;font-family:var(--font);font-size:15.5px;
  font-weight:700;line-height:1.4;color:var(--txt);padding:11px 13px;border-radius:var(--r-s);
  background:rgba(10,10,16,.6);border:2px solid var(--stroke-hi)}
.grg-ta:focus{outline:none;border-color:var(--gold-2)}
.grg-ta::placeholder{color:#7d7a72}
.grg-checks{display:flex;flex-wrap:wrap;gap:7px}
.grg-chk{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.06);color:var(--txt-dim);border:1px solid var(--stroke)}
.grg-chk.ok{background:rgba(126,224,129,.16);color:#bff0c1;border-color:rgba(126,224,129,.45)}

/* Reveal */
.grg-scrim{position:absolute;inset:0;background:rgba(6,6,12,.66);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:22px}
.grg-reveal{width:min(780px,94%);max-height:96%;overflow:auto;padding:20px 26px 22px;
  display:flex;flex-direction:column;gap:11px}
.grg-tierbadge{align-self:flex-start;font-size:12.5px;font-weight:900;padding:6px 15px;
  border-radius:var(--r-pill);color:#2a1c00;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
  box-shadow:0 0 26px rgba(255,194,71,.45)}
/* The ask that caused all this, reprinted at the top of the reveal \u2014 the modal
   must never be the moment the cause disappears. */
.grg-recap{padding:12px 16px;border-radius:var(--r-m);line-height:1.55;
  background:rgba(0,0,0,.34);border:1px solid rgba(255,194,71,.24);
  font-size:17px;font-weight:800;color:#ded7c7}
.ltr .grg-recap{font-size:16px}
.grg-recap .hi{color:#fff6e2;background:rgba(255,194,71,.20);border-radius:7px;padding:1px 5px;
  box-shadow:0 0 0 1px rgba(255,194,71,.32)}
.grg-specrow{display:flex;gap:8px;flex-wrap:wrap}
.grg-specchip{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;
  color:var(--txt-dim);padding:6px 12px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.grg-dots{display:flex;gap:4px}
.grg-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}
.grg-dot.on{background:var(--gold-2);box-shadow:0 0 8px rgba(255,194,71,.75)}
.grg-partname{font-size:34px;line-height:1.1}
.grg-flavour{font-size:15px;font-weight:700;line-height:1.45;color:#f0ebdf}
.grg-deltagrid{display:flex;gap:9px}
.grg-deltacard{flex:1;padding:9px 12px;border-radius:var(--r-s);background:rgba(255,255,255,.055);
  border:1px solid var(--stroke);display:flex;flex-direction:column;gap:3px}
.grg-revactions{display:flex;gap:10px;align-items:center;margin-top:2px}
.grg-tokgain{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900;
  color:var(--token);margin-inline-start:auto}

@media (max-height:790px){
  .grg-title{font-size:32px}
  .grg-sentence-txt{font-size:22px}
  .ltr .grg-sentence-txt{font-size:20px}
  .grg-opt-head{min-height:66px}
  .grg-opt-he{font-size:16px}
  .grg-root{gap:11px;padding:14px 20px 15px}
  .grg-body{gap:14px}
}

#ui .mn-root, #ui .mn-root *{pointer-events:auto}
.mn-root{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  overflow:hidden;font-family:var(--font);color:var(--txt);--pad:clamp(10px,min(3vw,3.2vh),40px)}
.mn-scrim{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(115% 80% at 50% 34%,rgba(0,0,0,0) 40%,rgba(7,5,12,.55) 100%),
    linear-gradient(180deg,rgba(9,7,16,.52) 0%,rgba(9,7,16,.02) 38%,rgba(6,4,11,.70) 100%);}
.mn-stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;padding:var(--pad);gap:clamp(6px,1.6vh,20px);overflow-y:auto;overflow-x:hidden}

/* warm focus ring \u2014 the token blue fights the gold on these screens */
.mn-root .btn:focus-visible,.mn-root .mn-card:focus-visible,
.mn-ov .btn:focus-visible,.mn-ov .mn-seg button:focus-visible,.mn-ov .mn-danger:focus-visible{
  outline:3px solid rgba(255,255,255,.92);outline-offset:3px}

/* ---------- title ---------- */
.mn-center{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(6px,1.6vh,18px);width:100%}
.mn-hero{position:relative;display:flex;flex-direction:column;align-items:center}
.mn-burst{position:absolute;inset:-14% -22%;pointer-events:none;opacity:.5;
  background:
    radial-gradient(52% 52% at 50% 52%,rgba(255,194,71,.30),rgba(255,140,40,.08) 55%,transparent 72%),
    conic-gradient(from -14deg at 50% 52%,rgba(255,205,110,.16) 0 5deg,transparent 5deg 22deg,
      rgba(255,205,110,.13) 22deg 27deg,transparent 27deg 46deg,rgba(255,205,110,.16) 46deg 51deg,
      transparent 51deg 70deg,rgba(255,205,110,.12) 70deg 75deg,transparent 75deg 96deg);
  filter:blur(3px)}
.mn-swoosh{position:absolute;inset-block-end:2%;inset-inline:2%;height:26%;pointer-events:none;
  background:radial-gradient(60% 100% at 50% 50%,rgba(255,196,80,.85),rgba(255,150,40,.22) 45%,transparent 74%);
  filter:blur(14px);opacity:.7;transform:rotate(-2deg)}
/* Flat chequer at mid-grey reads as a Photoshop transparency grid. Perspective
   tapers the squares and near-black/near-white restores the flag contrast. */
.mn-ribbon{position:absolute;inset-block-end:1%;inset-inline:13%;height:clamp(28px,4.6vh,50px);
  pointer-events:none;transform-origin:50% 100%;
  transform:rotate(-2.6deg) perspective(320px) rotateX(56deg);
  background:repeating-conic-gradient(#ffffff 0% 25%,#0d0b14 0% 50%) 0 0/26px 26px;
  -webkit-mask-image:radial-gradient(72% 120% at 50% 40%,#000 30%,transparent 78%);
  mask-image:radial-gradient(72% 120% at 50% 40%,#000 30%,transparent 78%);
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.65))}
.mn-ribbon.two{inset-block-end:9%;inset-inline-start:auto;inset-inline-end:6%;width:26%;
  height:clamp(18px,3vh,32px);transform:rotate(6deg) perspective(280px) rotateX(62deg);
  background-size:18px 18px;opacity:.85}
.mn-logo{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;
  line-height:.86}
/* Hebrew system faces stop at Bold, so 900 buys nothing: the extra weight has to
   come from a same-hue stroke that fattens the stems without shifting colour. */
.mn-logo .l1,.mn-logo .l2{transform-origin:50% 60%}
.mn-logo .l1{font-size:clamp(38px,min(8vw,10.5vh),112px);letter-spacing:.24em;
  transform:rotate(1.2deg) scaleY(1.06);-webkit-text-stroke:.055em #14111d;
  padding-inline-start:.24em;padding-inline-end:.06em;margin-block-end:.06em}
.mn-logo .l2{font-size:clamp(50px,min(12.2vw,17vh),172px);margin-block-start:-.06em;
  transform:rotate(-1.8deg) scaleY(1.07);-webkit-text-stroke:.048em #16121f;padding:0 .06em}
.rtl .mn-logo .l1,.rtl .mn-logo .l2,.rtl .mn-root .display{letter-spacing:.015em}
.rtl .mn-logo .l1{letter-spacing:.16em}
.mn-tagline{margin-block-start:clamp(6px,1.4vh,18px);font-size:clamp(12px,min(1.6vw,2.2vh),20px);
  font-weight:800;letter-spacing:.2em;color:#ffd99a;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.rtl .mn-tagline{letter-spacing:.03em}
.mn-menu{display:flex;flex-direction:column;align-items:center;gap:12px;margin-block-start:clamp(8px,2.4vh,28px)}
.mn-btn-xl{font-size:clamp(16px,min(1.7vw,2.4vh),23px);padding:clamp(12px,1.9vh,18px) clamp(32px,4.4vw,56px);

.mn-btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mn-press{font-size:12px;font-weight:800;letter-spacing:.2em;color:rgba(244,241,234,.72);
  margin-block-start:6px;animation:mnPulse 2.4s var(--ease) infinite}
.rtl .mn-press{letter-spacing:.04em}
@keyframes mnPulse{0%,100%{opacity:.45}50%{opacity:1}}
.mn-spacer{flex:1 1 auto}
